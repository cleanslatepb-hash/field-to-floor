    rationale: "Reflecting her feeling shows the nurse heard her and invites her to say more. Telling her that others keep working is false reassurance that dismisses her fear. Changing the subject shuts down the talk, and a why question can make her feel she must defend herself." },
  m7s1: { area: "PPT", type: "single", cj: "Generate solutions",
    stem: "A 72-year-old client with Parkinson's disease takes carbidopa-levodopa at 0800, 1200, and 1600. The client says tremor and stiffness get much worse about an hour after lunch, which is usually a large serving of chicken or fish. Which plan does the nurse discuss with the client and the dietitian?",
    options: ["Take each dose with the meal and add a high-protein snack at bedtime.", "Skip the noon dose on days when lunch is high in protein.", "Take doses 30 minutes before meals and save most protein for supper.", "Take the noon dose right after lunch with a full glass of milk."],
    answer: 2,
    rationale: "Amino acids from dietary protein compete with levodopa for absorption and for transport into the brain, so a heavy protein meal blunts the dose. Taking doses before meals and shifting most protein to the evening keeps daytime doses working. Taking the drug with or after a protein load, or skipping a dose, makes the 'off' periods worse." },
  m7s2: { area: "SIPC", type: "single", cj: "Take action",
    stem: "A client with Parkinson's disease is walking to the bathroom with the nurse when the client's feet suddenly 'freeze' in the doorway. The client is upright and steady but cannot step forward. What does the nurse tell the client?",
    options: ["Stand tall, shift your weight, and step over that tile line.", "Lean forward and keep pushing until your feet start to move.", "Hold my arm and I will pull you through the doorway now.", "Take quick, short steps to build up your forward momentum."],
    answer: 0,
    rationale: "Freezing often breaks with a weight shift and a visual target to step over, which uses a different motor pathway. Leaning forward, quick short steps, and being pulled all move the center of gravity ahead of the feet and raise the risk of a fall.",
    lens: { medic: "In the field you might simply lift or guide the client past the doorway to get moving.", nurse: "On the unit the goal is safe walking the client can repeat alone, so the RN cues a weight shift and a target to step over." } },
  m7s3: { area: "PHYS", type: "single", cj: "Prioritize hypotheses",
    stem: "A client with myasthenia gravis had the pyridostigmine dose increased yesterday. Today the client has worsening arm weakness, abdominal cramps, diarrhea, heavy sweating, drooling, and a heart rate of 52. The pupils are small. Which problem does the nurse suspect?",
    options: ["Myasthenic crisis from too little medication", "Cholinergic crisis from too much medication", "An expected response while the dose adjusts", "Sepsis from a new abdominal infection"],
    answer: 1,
    rationale: "Both crises cause weakness and can lead to respiratory failure, but cramps, diarrhea, sweating, drooling, slow heart rate, and small pupils are signs of excess acetylcholine. Coming right after a dose increase, this points to cholinergic crisis. Myasthenic crisis lacks these muscarinic signs, and these findings are not an expected effect or a typical sepsis picture.",
    lens: { medic: "In the field this SLUDGE picture makes you think of an organophosphate exposure.", nurse: "On the unit the same cluster after a pyridostigmine increase points to the client's own drug, so the RN holds the next dose, watches the airway, and calls the provider." } },
  m7s4: { area: "PHYS", type: "multi", cj: "Recognize cues",
    stem: "A client is admitted with a flare of myasthenia gravis. Which findings does the nurse report to the provider right away? Select all that apply.",
    options: ["Negative inspiratory force has fallen from -40 to -18 cm H2O", "Ptosis of both eyelids that gets worse late in the day", "Cannot count past 10 out loud on a single breath", "Weak cough with saliva pooling in the back of the mouth", "Double vision that eases after the client rests the eyes"],
    answer: [0, 2, 3],
    rationale: "A negative inspiratory force weaker than -20 cm H2O, a short single-breath count, and a weak cough with pooled secretions show failing breathing and airway muscles. These can signal a myasthenic crisis that needs airway support. Ptosis that worsens with the day and double vision that improves with rest are typical, expected MG findings." },
  m7s5: { area: "PHYS", type: "single", cj: "Take action",
    stem: "A 75-kg client with Guillain-Barre syndrome has weakness that has spread from the legs to the hips and hands since admission. Vital capacity was 3.4 L at 0800, 2.2 L at 1200, and is 1.1 L now. SpO2 is 96% on room air. What does the nurse do?",
    options: ["Recheck vital capacity in 4 hours and keep the head of bed up", "Encourage incentive spirometer use 10 times every hour", "Notify the provider now about the falling vital capacity", "Apply 2 L of oxygen by nasal cannula and keep monitoring"],
    answer: 2,
    rationale: "A vital capacity of about 15 mL/kg (1.1 L for a 75-kg client) that is falling fast means the breathing muscles are failing, and the client likely needs intubation soon. The provider must be notified now. Waiting 4 hours, spirometer coaching, or low-flow oxygen do not address muscle failure.",
    lens: { medic: "In the field a normal SpO2 can make a weak client look stable.", nurse: "In GBS the RN trends vital capacity, because SpO2 often stays normal until the client is close to respiratory failure." } },
  m7s6: { area: "RRP", type: "multi", cj: "Generate solutions",
    stem: "Over the past day, a client with Guillain-Barre syndrome has had blood pressure swinging between 84/50 and 178/98 and heart rate between 48 and 124. Which actions does the nurse include in the plan of care? Select all that apply.",
    options: ["Keep the client on continuous cardiac monitoring", "Raise the head of the bed slowly and recheck BP", "Assess for bladder distension and track output", "Walk the client in the hall three times a day", "Limit fluids to 1 L a day to keep BP stable", "Suction briefly and watch for a drop in heart rate"],
    answer: [0, 1, 2, 5],
    rationale: "Autonomic instability in GBS causes dysrhythmias, BP swings with position change, urinary retention, and bradycardia with vagal stimulation such as suctioning. Monitoring, slow position changes, bladder checks, and brief suctioning address these risks. A client this weak is not ready to walk the halls, and fluid restriction can worsen low BP." },
  m7s7: { area: "HPM", type: "single", cj: "Evaluate outcomes",
    stem: "A 34-year-old client with relapsing-remitting multiple sclerosis is going home in July after a relapse. The nurse taught about heat and fatigue. Which statement shows the client understood?",
    options: ["I'll soak in a hot bath at night to ease my leg stiffness.", "I'll do my errands in the afternoon so I can sleep in each morning.", "I'll stop my injections once I've gone a month without symptoms.", "I'll exercise early in the day and take a cool shower first."],
    answer: 3,
    rationale: "Heat slows nerve conduction in demyelinated nerves and can briefly worsen symptoms, so cooling before exercise and exercising early, when energy is highest, are sound choices. Hot baths add heat, and MS fatigue usually gets worse as the day goes on. Disease-modifying drugs are taken long term, even when symptoms are quiet." },
  m7s8: { area: "BCC", type: "single", cj: "Generate solutions",
    stem: "A client with multiple sclerosis has trouble emptying the bladder. A bladder scan after voiding shows 350 mL of urine left. The provider plans a bladder program. Which approach does the nurse expect to teach?",
    options: ["Clean intermittent self-catheterization on a set schedule", "Cutting fluids to 1,000 mL a day to make less urine", "A long-term indwelling catheter changed each month", "Waiting to void until the urge to go becomes strong"],
    answer: 0,
    rationale: "Scheduled clean intermittent self-catheterization empties the bladder fully and lowers the risk of infection and kidney damage from retained urine. Restricting fluids concentrates urine and raises infection risk. An indwelling catheter carries a higher infection risk, and waiting for a strong urge lets more urine build up." },
  m7s9: { area: "BCC", type: "multi", cj: "Take action",
    stem: "A client who had a left-hemisphere stroke has right-sided weakness and dysphagia. The speech-language pathologist ordered a soft diet with mildly thick liquids. Which actions does the nurse take at lunch? Select all that apply.",
    options: ["Sit the client fully upright in a chair or bed", "Place small bites on the left side of the mouth", "Offer the thickened liquid through a straw", "Cue the client to tuck the chin when swallowing", "Give sips of thin water to help wash food down", "Check the right cheek for pocketed food after"],
    answer: [0, 1, 3, 5],
    rationale: "Sitting upright, placing food on the stronger side, a chin tuck, and checking the weak side for pocketed food all lower aspiration risk. A straw delivers liquid too fast and too far back for safe control. Thin water defeats the prescribed liquid consistency and is the texture most likely to be aspirated." },
  m7s10: { area: "SIPC", type: "multi", cj: "Generate solutions",
    stem: "A client who had a right-hemisphere stroke has left-sided weakness, left homonymous hemianopsia, and neglect of the left side. Which actions help keep the client safe? Select all that apply.",
    options: ["Teach the client to turn the head to scan to the left", "Support the left arm on a pillow when sitting up", "Lift the client up in bed by pulling under the left arm", "Remind the client to check where the left arm is", "Leave the bed in high position to ease transfers"],
    answer: [0, 1, 3],
    rationale: "Scanning toward the blind side makes up for the lost visual field. Supporting the weak arm and having the client check its position prevent shoulder subluxation and injury the client may not notice. Pulling on the weak arm can dislocate the shoulder, and a high bed raises the fall risk for a client who ignores one side." },
  m7s11: { area: "PSY", type: "single", cj: "Generate solutions",
    stem: "A 58-year-old client with ALS can still speak clearly but has new trouble swallowing. He tells the nurse, \"I don't want to live on a breathing machine, but my wife says we'll do whatever it takes.\" What is the nurse's best response?",
    options: ["Your wife knows you well, so she can decide for you later.", "You have years before you need to think about breathing.", "Tell me more about what matters most to you as this goes on.", "Most people change their minds once they are on a ventilator."],
    answer: 2,
    rationale: "An open prompt lets the client explore his goals while he can still speak, which is the first step toward an advance directive and a family meeting. Deferring to the wife takes away his voice. False reassurance about time and claims about what most people do shut the talk down." },
  m7s12: { area: "PSY", type: "single", cj: "Recognize cues",
    stem: "At a clinic visit for her father, who has moderate Alzheimer's disease, a daughter says she has not slept a full night in weeks because he wanders at night. She has started yelling at him and says she feels guilty. What does the nurse do first?",
    options: ["Ask how she is coping and what help she has at home.", "Tell her that yelling at him is a form of elder abuse.", "Suggest she give him an over-the-counter sleep aid at night.", "Advise her to place him in a memory care unit this week."],
    answer: 0,
    rationale: "These are signs of caregiver strain, so the nurse first assesses her coping, supports, and the father's safety before planning respite or other help. Labeling her as abusive makes her defensive. Over-the-counter sleep aids such as diphenhydramine can worsen confusion and falls in older adults, and placement is a family decision made after assessment." },
  m7s13: { area: "PPT", type: "multi", cj: "Evaluate outcomes",
    stem: "A 27-year-old client is going home on oral phenytoin after a first seizure workup. Which statements show the client understood the teaching? Select all that apply.",
    options: ["I'll brush, floss, and see my dentist every 6 months.", "I'll keep my appointments to have my drug level checked.", "I can stop the pills on my own after a year with no seizures.", "I'll add condoms, since this drug can weaken the pill.", "I'll take an extra capsule on days I feel a seizure coming."],
    answer: [0, 1, 3],
    rationale: "Phenytoin causes gum overgrowth, has a narrow therapeutic range, and speeds the breakdown of hormonal contraceptives, so dental care, level checks, and a backup method are correct. Stopping the drug abruptly can trigger seizures or status epilepticus, so any taper is directed by the provider. Extra doses can push the level into the toxic range." },
  m7s14: { area: "RRP", type: "single", cj: "Take action",
    stem: "A client taking phenytoin 100 mg three times a day has new nystagmus, an unsteady gait, and slurred speech. This morning's phenytoin level is 28 mcg/mL. The 0900 dose is due. What does the nurse do?",
    options: ["Give the dose with food and recheck the level tomorrow", "Hold the dose and notify the provider of the level", "Give the dose and keep the client on bed rest today", "Hold the dose and give it at noon with lunch instead"],
    answer: 1,
    rationale: "A level of 28 mcg/mL is above the usual range of 10 to 20 mcg/mL, and nystagmus, ataxia, and slurred speech are signs of toxicity. The nurse holds the dose and notifies the provider. Giving the dose, even later or with food, adds more drug to a toxic level." },
  m7s15: { area: "RRP", type: "single", cj: "Recognize cues",
    stem: "A client has taken valproic acid for 2 months. Today the client reports tiredness, poor appetite, and nausea, and the nurse notes yellow sclera and dark urine. Which lab results does the nurse check first?",
    options: ["Serum sodium and potassium", "Hemoglobin and hematocrit", "BUN and serum creatinine", "ALT, AST, and bilirubin"],
    answer: 3,
    rationale: "Valproic acid can cause serious liver injury, most often in the first months of therapy. Fatigue, anorexia, nausea, jaundice, and dark urine point to the liver, so liver enzymes and bilirubin come first. Electrolytes, blood counts, and kidney tests do not explain jaundice." },
  m7s16: { area: "PPT", type: "single", cj: "Analyze cues",
    stem: "A client in the emergency department has a migraine with nausea and light sensitivity. The provider prescribed sumatriptan. Which finding in the client's history causes the nurse to hold the drug and contact the provider?",
    options: ["Took acetaminophen 2 hours ago with no relief", "Has chest pressure when climbing stairs", "Has had migraines with aura since age 15", "Uses a daily nasal steroid spray for allergies"],
    answer: 1,
    rationale: "Triptans constrict blood vessels, including coronary arteries, so chest pressure with exertion suggests coronary disease and must be reported before the dose. Earlier acetaminophen, a long history of typical migraine with aura, and a nasal steroid do not prevent triptan use." },
  m7s17: { area: "PHYS", type: "single", cj: "Take action",
    stem: "A client had a transsphenoidal resection of a pituitary tumor yesterday. The client keeps swallowing often and has clear, watery fluid dripping from the nose when leaning forward. What does the nurse do?",
    options: ["Have the client gently blow the nose to clear it", "Pack the nostril with gauze to stop the dripping", "Keep the head of bed raised and notify the surgeon", "Suction both nares and lay the client flat in bed"],
    answer: 2,
    rationale: "Clear nasal drainage and frequent swallowing after transsphenoidal surgery suggest a CSF leak, which raises the risk of meningitis. The nurse keeps the head up and notifies the surgeon. Nose blowing, nasal suctioning, and packing can worsen the leak or bring in bacteria, and lying flat increases the flow.",
    lens: { medic: "In the field, clear fluid from the nose after head trauma is a finding you note and leave alone.", nurse: "After transsphenoidal surgery the RN treats it as a possible CSF leak: head up, nothing in or out of the nose, and a call to the surgeon." } },
  m7s18: { area: "RRP", type: "single", cj: "Analyze cues",
    stem: "A client is 12 hours out from surgery to remove a pituitary tumor. Urine output was 350 mL and then 420 mL over the past 2 hours, urine specific gravity is 1.002, the client asks for water often, and serum sodium is 149 mEq/L. Which complication does the nurse suspect?",
    options: ["Diabetes insipidus from low ADH", "SIADH from excess ADH release", "Fluid overload from IV fluids", "Acute kidney injury from surgery"],
    answer: 0,
    rationale: "Large amounts of very dilute urine, thirst, and a rising sodium after pituitary surgery point to diabetes insipidus from loss of ADH. SIADH causes the opposite: low urine output, concentrated urine, and low sodium. Fluid overload would lower sodium, and acute kidney injury does not produce this dilute output with high sodium.",
    lens: { medic: "In the field, urine output is rarely measured on a short transport.", nurse: "After pituitary or brain surgery the RN tracks hourly output, specific gravity, and sodium so DI is caught within hours." } },
  m7s19: { area: "PHYS", type: "single", cj: "Generate solutions",
    stem: "A client with expressive (Broca's) aphasia after a stroke understands speech but struggles to get words out. The client becomes upset while trying to ask for something. Which nursing approach is best?",
    options: ["Finish the client's sentences to save effort", "Speak louder and slower so the client can follow", "Rely on gestures, since spoken words aren't understood", "Allow extra time and offer yes-or-no questions"],
    answer: 3,
    rationale: "A client with expressive aphasia understands others, so giving time and using yes-or-no questions or a picture board lets the client respond without pressure. Finishing sentences takes away practice and may guess wrong. Speaking louder does not help a client who hears and understands, and relying on gestures fits receptive aphasia instead." },
  m7s20: { area: "PHYS", type: "single", cj: "Take action",
    stem: "A client with ALS and worsening bulbar weakness has a wet, gurgly voice after sips of water, a temperature of 38.2°C (100.8°F), and new crackles in the right lower lobe. Which action is most important?",
    options: ["Give acetaminophen and recheck the temperature in 1 hour", "Keep the client NPO and notify the provider of the findings", "Offer thin liquids through a straw to ease swallowing", "Encourage extra oral fluids to loosen the secretions"],
    answer: 1,
    rationale: "A wet voice after drinking, fever, and new right lower lobe crackles suggest aspiration pneumonia. Stopping oral intake and notifying the provider prevents further aspiration and starts workup and treatment. Treating only the fever misses the cause, and thin liquids by straw or extra oral fluids raise aspiration risk." }

    options: ["Weight up 1.6 kg since yesterday", "Neck veins distended at 45 degrees", "New crackles in both lung bases", "Urine specific gravity of 1.034", "Hematocrit up from 36% to 44%"],
    answer: [0, 1, 2],
    rationale: "A 1.6 kg overnight gain is about 1.6 L of retained fluid, and distended neck veins and new crackles show the extra volume backing up. A high specific gravity and a rising hematocrit point to a concentrated, dry client, which fits a deficit instead." },
  m8b2: { area: "SIPC", type: "multi", cj: "Generate solutions",
    stem: "A 68-year-old client with small cell lung cancer has SIADH. This morning the sodium is 119 mEq/L, and the client is newly confused and reports a headache. Which actions does the nurse include in the plan of care? Select all that apply.",
    options: ["Tape a padded tongue blade to the bed", "Keep the bed low with padded rails up", "Offer free water often for the headache", "Set up working suction and oxygen", "Apply soft wrist restraints for safety", "Check neuro status at least every 2 hours"],
    answer: [1, 3, 5],
    rationale: "Sodium under 120 mEq/L with new confusion puts the client at risk for seizures, so the nurse sets up seizure precautions and watches the neuro status closely. Nothing goes in the mouth during a seizure, so a tongue blade is outdated. Free water lowers sodium further in SIADH, and restraints raise the injury risk during a seizure." },
  m8b3: { area: "PHYS", type: "single", cj: "Generate solutions",
    stem: "A 54-year-old client has taken prednisone 20 mg daily for a year. She has a round face, thin skin that bruises easily, and a glucose of 210. Which teaching matters most?",
    options: ["Report mild signs of infection early", "Stop the prednisone if her face gets rounder", "Eat a high-sodium diet to keep up her BP", "Expect her bruises to heal faster than usual"],
    answer: 0,
    rationale: "Long-term steroids blunt the immune response and can hide fever and redness, so even mild signs of infection need attention. Stopping suddenly can cause adrenal crisis, sodium is limited because steroids hold fluid, and her fragile skin heals slowly." },
  m8b4: { area: "PHYS", type: "single", cj: "Recognize cues",
    stem: "The nurse reviews urine output for four clients 1 day after surgery. Which client's output meets the threshold to report for possible acute kidney injury?",
    options: ["80 kg client: 260 mL in the last 8 hours", "60 kg client: 240 mL over the last 6 hours", "70 kg client: 300 mL over the last 6 hours", "50 kg client: 180 mL over the last 4 hours"],
    answer: 0,
    rationale: "Output below 0.5 mL/kg/hr for 6 hours or more meets the urine criterion for acute kidney injury. The 80 kg client made about 0.4 mL/kg/hr for 8 hours. The other clients made between 0.67 and 0.9 mL/kg/hr, which is above the threshold." },
  m8b5: { area: "PHYS", type: "single", cj: "Analyze cues",
    stem: "A 52-year-old client with alcohol use disorder has received oral and IV potassium chloride for 2 days, yet potassium is still 3.1 mEq/L. Magnesium is 1.1 mg/dL. The client has tremors and brisk reflexes. Which explanation guides the nurse's next step?",
    options: ["The potassium dose is too low to show any effect yet", "Low magnesium makes the kidneys waste potassium", "The lab result is probably wrong and should be redrawn", "Tremors are pulling potassium into the muscle cells"],
    answer: 1,
    rationale: "Low magnesium lets potassium leak out through the kidneys, so potassium stays low until magnesium is replaced. The nurse reports the magnesium and expects a magnesium prescription. Two days of replacement is a real trial, the low value matches the clinical picture, and tremors do not explain the persistent low level." },
  m8b6: { area: "PHYS", type: "single", cj: "Take action",
    stem: "A 61-year-old client on home peritoneal dialysis comes to the clinic with a cloudy drain bag from this morning. The client has abdominal tenderness and a temperature of 100.9°F (38.3°C). What does the nurse do first?",
    options: ["Tell the client cloudy fluid is common after a large meal", "Drain the next exchange faster to clear out the debris", "Clean the exit site and apply a fresh dry dressing", "Send effluent for culture and notify the provider"],
    answer: 3,
    rationale: "Cloudy effluent with abdominal pain and fever points to peritonitis. The effluent is cultured before antibiotics start, and the provider is notified so treatment begins quickly. Cloudy fluid is not normal, changing the drain rate does not treat infection, and exit site care alone misses the problem in the peritoneum." },
  m8b7: { area: "PHYS", type: "multi", cj: "Recognize cues",
    stem: "A 66-year-old client with metastatic breast cancer has a serum calcium of 13.1 mg/dL. Which findings does the nurse expect? Select all that apply.",
    options: ["Constipation for the past 5 days", "Positive Trousseau sign with BP cuff", "New confusion and daytime drowsiness", "Increased thirst and urination", "Hyperactive deep tendon reflexes", "Shortened QT interval on the ECG"],
    answer: [0, 2, 3, 5],
    rationale: "High calcium slows nerves and muscles, which causes constipation, confusion, and drowsiness. It also makes the kidneys lose water, so the client is thirsty and voids often, and it shortens the QT interval. A positive Trousseau sign and hyperactive reflexes are signs of low calcium." },
  m8b8: { area: "RRP", type: "single", cj: "Take action",
    stem: "A 70-year-old client with acute kidney injury has a potassium of 7.1 mEq/L. The monitor shows peaked T waves and a widening QRS. The provider prescribes all of the treatments below. Which does the nurse give first?",
    options: ["Calcium gluconate 1 g IV over 10 minutes", "Regular insulin 10 units IV with dextrose", "Albuterol 10 mg by continuous nebulizer", "Sodium zirconium cyclosilicate 10 g orally"],
    answer: 0,
    rationale: "With ECG changes, calcium goes first because it stabilizes the heart muscle within minutes, though it does not lower potassium. Insulin with dextrose and albuterol come next to shift potassium into cells. The oral binder removes potassium from the body but takes hours to work.",
    lens: { medic: "In the field, calcium is often the main tool you have for a wide, peaked rhythm in a dialysis client.", nurse: "On the unit, several prescriptions arrive together, and the RN sequences them: protect the heart, shift potassium, then remove it." } },
  m8b9: { area: "RRP", type: "single", cj: "Analyze cues",
    stem: "A 38-year-old client with Graves disease had an emergency appendectomy 6 hours ago. Temperature is 104.4°F (40.2°C), heart rate is 162 in atrial fibrillation, and the client is agitated and sweating heavily. Which prescription does the nurse question?",
    options: ["Propylthiouracil 500 mg by NG tube", "Propranolol 1 mg IV over 1 minute", "Aspirin 650 mg rectally for fever", "Hydrocortisone 100 mg IV every 8 hours"],
    answer: 2,
    rationale: "This is thyroid storm. Aspirin frees thyroid hormone from its binding proteins and can make the storm worse, so acetaminophen and cooling are used for the fever. Propylthiouracil blocks hormone production, propranolol controls the heart rate, and hydrocortisone is a standard part of storm treatment.",
    lens: { medic: "For a high fever in the field, any antipyretic and cooling you carry seems reasonable.", nurse: "In thyroid storm the RN questions aspirin because it raises free thyroid hormone, and asks for acetaminophen instead." } },
  m8b10: { area: "RRP", type: "single", cj: "Generate solutions",
    stem: "A 59-year-old client who takes prednisone 20 mg daily for rheumatoid arthritis ran out of it 5 days ago. The client now has vomiting, BP 76/44, heart rate 124, sodium 127 mEq/L, potassium 5.7 mEq/L, and glucose 58 mg/dL. Which prescription does the nurse expect first?",
    options: ["Furosemide IV with a 1 L daily fluid limit", "Hydrocortisone IV with a 0.9% saline bolus", "0.45% saline at 75 mL/hr with oral prednisone", "Regular insulin IV with dextrose for potassium"],
    answer: 1,
    rationale: "Stopping long-term prednisone suddenly can cause adrenal crisis: low BP, low sodium, high potassium, and low glucose. The client needs IV hydrocortisone and rapid isotonic fluid, often with dextrose. Furosemide and fluid limits worsen shock, oral drugs will not stay down, and the potassium usually falls once the steroid is replaced.",
    lens: { medic: "You would treat this shock with fluid boluses and maybe a pressor.", nurse: "Fluid alone will not hold the pressure; the missed prednisone is the key cue, and IV hydrocortisone is the fix." } },
  m8b11: { area: "RRP", type: "single", cj: "Prioritize hypotheses",
    stem: "A 79-year-old client with untreated hypothyroidism is brought in from a cold apartment. Temperature is 94.6°F (34.8°C), heart rate is 46, respirations are 7 and shallow, and the client is hard to arouse. Which action does the nurse take first?",
    options: ["Apply a forced-air warming blanket on high", "Give the scheduled oral levothyroxine dose", "Draw blood for a TSH and free T4 level", "Assist ventilation and prepare for intubation"],
    answer: 3,
    rationale: "In myxedema coma, slow shallow breathing leads to rising carbon dioxide and is the first threat to life, so the nurse supports the airway and breathing first. Rewarming is gentle and passive because rapid warming can dilate vessels and drop the BP. Thyroid hormone is given IV, not by mouth, and labs do not come before breathing.",
    lens: { medic: "Hypothermia in the field means warming the client as fast as you can.", nurse: "In myxedema coma, breathing comes first and warming is passive, since fast rewarming can cause collapse." } },
  m8b12: { area: "RRP", type: "single", cj: "Take action",
    stem: "A 66-year-old client with type 2 diabetes is found unresponsive and sweating. Fingerstick glucose is 38 mg/dL. The IV infiltrated an hour ago and has not been restarted. What does the nurse do next?",
    options: ["Give glucagon 1 mg IM per the hypoglycemia protocol", "Place glucose gel in the cheek and recheck in 15 minutes", "Start a new IV site before giving any treatment", "Give 4 oz of juice through a straw with the head raised"],
    answer: 0,
    rationale: "An unresponsive client cannot swallow safely, so glucagon by IM injection is the fastest safe option without IV access. Gel or juice in the mouth risks aspiration, and delaying treatment to start an IV prolongs brain injury from low glucose. Once awake and able to swallow, the client gets 15 g of fast carbohydrate, with a recheck in 15 minutes.",
    lens: { medic: "In the field you reach for D10 or D50 through an IV or IO first.", nurse: "On the unit without access, IM glucagon from the protocol works fast; nothing goes by mouth until the client can swallow." } },
  m8b13: { area: "PPT", type: "multi", cj: "Take action",
    stem: "A 58-year-old client has a potassium of 2.9 mEq/L. The provider prescribes potassium chloride 20 mEq in 100 mL over 2 hours through a peripheral IV. Which actions does the nurse take? Select all that apply.",
    options: ["Run the infusion on an electronic pump", "Speed the rate up if the site looks fine", "Confirm urine output of at least 30 mL/hr", "Add a second dose to the maintenance bag", "Check the IV site often for pain or redness", "Recheck the potassium level as prescribed"],
    answer: [0, 2, 4, 5],
    rationale: "IV potassium runs on a pump at the prescribed rate, and the nurse confirms the kidneys are making urine so potassium does not build up. Potassium irritates veins, so the site is checked often, and a follow-up level shows whether more is needed. Running it faster or adding extra potassium to another bag can cause a fatal dysrhythmia." },
  m8b14: { area: "PPT", type: "single", cj: "Evaluate outcomes",
    stem: "A 47-year-old client started levothyroxine 3 weeks ago for hypothyroidism. Which statement shows the client is taking the drug correctly?",
    options: ["I take it at breakfast with milk and my calcium pill.", "I take it with water 30 to 60 minutes before breakfast.", "I take it after lunch along with a cup of coffee.", "I stop it on days when my heart feels like it is racing."],
    answer: 1,
    rationale: "Levothyroxine absorbs best on an empty stomach with water, 30 to 60 minutes before eating. Calcium, milk, coffee, and food all reduce absorption. A racing heart can mean the dose is too high, so the client reports it to the provider and does not stop the drug alone." },
  m8b15: { area: "PPT", type: "single", cj: "Evaluate outcomes",
    stem: "A 63-year-old client on hemodialysis is prescribed sevelamer for a high phosphorus level. Which statement shows the client needs more teaching?",
    options: ["I take it with each meal and with large snacks.", "I cut back on dairy, dark colas, and deli meats.", "I tell the dialysis team if I get constipated.", "I take it at bedtime so it won't upset my stomach."],
    answer: 3,
    rationale: "Phosphate binders work by grabbing phosphorus from food in the gut, so they must be taken with meals. A bedtime dose binds almost nothing. Limiting high phosphorus foods and reporting constipation, a common side effect, are correct." },
  m8b16: { area: "PPT", type: "single", cj: "Analyze cues",
    stem: "The nurse reviews four IV fluid prescriptions. Which prescription does the nurse question?",
    options: ["0.9% sodium chloride for a client with 2 days of vomiting and BP 90/58", "Lactated Ringer's for a client with burns over 30% of the body", "0.45% sodium chloride for a client with a head injury and rising ICP", "5% dextrose in water for an alert client with a sodium of 154 mEq/L"],
    answer: 2,
    rationale: "Hypotonic fluid such as 0.45% saline shifts water into cells, which can worsen brain swelling and raise ICP. Isotonic saline replaces volume after vomiting, lactated Ringer's is standard for burn resuscitation, and D5W gives free water to slowly correct high sodium." },
  m8b17: { area: "BCC", type: "multi", cj: "Generate solutions",
    stem: "A 64-year-old client with stage 4 chronic kidney disease, not yet on dialysis, has a potassium of 5.4 mEq/L and a phosphorus of 6.1 mg/dL. Which foods does the nurse teach the client to limit? Select all that apply.",
    options: ["A banana with breakfast", "Dark cola with lunch", "Orange juice at breakfast", "White rice with dinner", "Cheese on a sandwich", "Apple slices as a snack"],
    answer: [0, 1, 2, 4],
    rationale: "Bananas and orange juice are high in potassium, and dark colas and cheese are high in phosphorus. White rice and apples are lower in both and fit a kidney diet. The client still needs enough calories, so the nurse offers swaps instead of just removing foods." },
  m8b18: { area: "BCC", type: "single", cj: "Generate solutions",
    stem: "A 71-year-old client with acute kidney injury has an order for daily weights. The UAP asks how to get the most useful weight. Which instruction does the nurse give?",
    options: ["Use the same scale each morning after voiding, before breakfast.", "Use any scale on the unit as long as it was checked this week.", "Weigh the client after lunch, when the client is most awake.", "Weigh the client in the clothes worn that day, then subtract 1 kg."],
    answer: 0,
    rationale: "Daily weights are only useful when the conditions match each day: same scale, same time, after voiding, before eating, and similar clothing. A change of 1 kg is about 1 L of fluid, so small differences in scale, meals, or clothing can hide or fake a real change." },
  m8b19: { area: "HPM", type: "single", cj: "Evaluate outcomes",
    stem: "A 42-year-old client with Addison disease is going home on hydrocortisone and fludrocortisone. Which statement shows the teaching was effective?",
    options: ["I can stop the pills once my energy and appetite are back.", "I will call my provider about a higher dose if I get the flu.", "I will skip my dose on days when I am vomiting and can't eat.", "I will cut my salt way down since fludrocortisone holds water."],
    answer: 1,
    rationale: "Illness raises the body's need for cortisol, so the client follows a sick-day plan from the provider for a higher dose. Stopping the drugs can cause adrenal crisis, and vomiting means the client needs injectable steroid or urgent care, not a skipped dose. Most clients with Addison disease need normal or extra salt, not a cut." },
  m8b20: { area: "PSY", type: "single", cj: "Take action",
    stem: "A 45-year-old client started hemodialysis 2 months ago and has missed two sessions this month. Today the client says, \"I used to run my own business. Now my whole life is this chair three days a week.\" Which response by the nurse is best?",
    options: ["You have to come every time, or your potassium could stop your heart.", "Most people get used to dialysis after the first year or so.", "It sounds like you have lost a lot. What has been the hardest part?", "Have you thought about asking your provider about a transplant?"],
    answer: 2,
    rationale: "The client is grieving lost roles, and the missed sessions may be part of that. An open, empathic response invites the client to talk so the nurse can find out what is driving the missed sessions. A warning, false reassurance, or a quick change of topic shuts the conversation down." },
  m8s1: { area: "PPT", type: "single", cj: "Take action",
    stem: "A client with type 1 diabetes has insulin lispro 6 units prescribed with breakfast. At 0730 the glucose is 142 mg/dL. The kitchen calls to say breakfast trays will be about 45 minutes late. What does the nurse do?",
    options: ["Give the lispro now so it is already working when the tray comes", "Give the lispro once the tray arrives and the client can eat", "Give half the lispro now and the rest once the tray arrives", "Skip this lispro dose and recheck the glucose before lunch"],
    answer: 1,
    rationale: "Lispro starts working in about 15 minutes and peaks in 1 to 2 hours, so it is given within about 15 minutes of eating. Giving it now, or giving part of it now, risks hypoglycemia before food arrives. Skipping the dose leaves the meal uncovered and is not what was prescribed." },
  m8s2: { area: "PPT", type: "single", cj: "Evaluate outcomes",
    stem: "A client receives NPH insulin 20 units and regular insulin 6 units together in one syringe each morning. The nurse watches a new nurse prepare the dose. Which action needs correction?",
    options: ["Rolls the NPH vial between the palms until it is evenly cloudy", "Injects 20 units of air into the NPH vial without withdrawing any", "Injects 6 units of air into the regular vial, then withdraws 6 units", "Draws up the NPH into the syringe first, then the regular insulin"],
    answer: 3,
    rationale: "Clear regular insulin is drawn up before cloudy NPH so NPH cannot get into the regular vial and change how fast it works. Rolling NPH to mix it is correct. Putting air into the NPH vial first, then air into the regular vial and withdrawing regular, are the correct earlier steps." },
  m8s3: { area: "PPT", type: "single", cj: "Take action",
    stem: "A 38-year-old client on methimazole for Graves' disease calls with a sore throat and a fever of 38.6°C. What does the nurse tell her?",
    options: ["Take acetaminophen and rest for a few days", "Come in today for a white blood count", "Gargle with warm salt water until it passes", "Double the next dose to control the thyroid"],
    answer: 1,
    rationale: "Sore throat and fever on methimazole can signal agranulocytosis, a dangerous drop in white cells. She needs a blood count today, and the provider will likely hold the drug. Treating it as a cold or changing the dose on her own could be life-threatening." },
  m8s4: { area: "PPT", type: "single", cj: "Take action",
    stem: "A client with chronic kidney disease gets epoetin alfa subcutaneously three times a week at the dialysis clinic. Today the BP is 178/102, up from the client's usual 138/84. Hemoglobin is 10.2 g/dL. What does the nurse do?",
    options: ["Give the dose and recheck the BP in 1 hour", "Hold the dose and report the BP to the provider", "Give the dose and teach the client to cut back on salt", "Hold the dose until the hemoglobin rises above 12"],
    answer: 1,
    rationale: "Epoetin can raise blood pressure, and uncontrolled hypertension is a reason to hold the dose and contact the provider. Giving it anyway adds to the risk of stroke and seizure. The hemoglobin of 10.2 g/dL is in the range where the drug is given, and pushing hemoglobin above about 11 to 12 raises clot and stroke risk." },
  m8s5: { area: "RRP", type: "single", cj: "Take action",
    stem: "A client has correctional (sliding scale) insulin lispro prescribed before meals. At 1130 the glucose is 412 mg/dL. The scale ends with: \"351 to 400 mg/dL: 10 units. Over 400 mg/dL: call provider.\" The client is alert and lunch is on the way. What does the nurse do?",
    options: ["Give 10 units, the top dose on the scale, and recheck in 2 hours", "Give 12 units, adding 2 units for the amount over 400 mg/dL", "Recheck the glucose with a new sample, then call the provider", "Hold the insulin and recheck the glucose after the client eats"],
    answer: 2,
    rationale: "A reading above the scale's limit needs a confirmed value and a new prescription from the provider. Giving the top dose or adding units goes beyond what was prescribed. Holding insulin leaves severe hyperglycemia untreated while the client eats.",
    lens: { medic: "In the field, a very high glucose gets fluids and a ride to the hospital.", nurse: "On the unit, a reading off the end of the scale means confirming it and calling, not stretching the scale." } },
  m8s6: { area: "RRP", type: "single", cj: "Take action",
    stem: "A client with a left forearm arteriovenous fistula arrives for morning hemodialysis. The nurse feels no thrill over the fistula and hears no bruit with the stethoscope. The client says the arm felt normal last night. What does the nurse do?",
    options: ["Raise the arm on a pillow and reassess it in 30 minutes", "Put a warm pack on the site to improve blood flow", "Notify the provider right away about a likely clotted fistula", "Have the dialysis tech access the fistula with a smaller needle"],
    answer: 2,
    rationale: "A working fistula has a palpable thrill and an audible bruit, so losing both suggests a clot. Prompt reporting gives the best chance to save the access with a declot procedure. Waiting or applying heat delays treatment, and cannulating a clotted fistula can push the clot or damage the vessel.",
    lens: { medic: "Medics learn to keep BP cuffs and IVs off a fistula arm.", nurse: "The RN also checks the fistula for a thrill and bruit every shift and reports a loss of either right away." } },
  m8s7: { area: "RRP", type: "single", cj: "Generate solutions",
    stem: "A 72-year-old client was found on the floor after lying there about 18 hours. His CK is 24,000 and his urine is dark brown. What does the nurse expect?",
    options: ["Large IV fluid volumes, hourly urine checks", "A strict fluid restriction to protect his heart", "Oral potassium supplements for his muscle cramps", "A high-protein diet to rebuild his muscle"],
    answer: 0,
    rationale: "Muscle breakdown releases myoglobin, which can injure the kidneys, so generous IV fluids and close urine output checks are the priority. Potassium is often high from damaged muscle, so supplements are dangerous, and restricting fluids would worsen kidney injury.",
    lens: { medic: "You've found people after a long lie; it's crush physiology.", nurse: "On the floor you watch his kidneys and potassium hour by hour." } },
  m8s8: { area: "RRP", type: "single", cj: "Recognize cues",
    stem: "After a percutaneous kidney biopsy, which finding does the nurse report right away?",
    options: ["Pink-tinged urine in the first void", "Mild soreness where the needle went in", "Flank pain with HR 118 and BP 96/58", "A request to get up to the bathroom"],
    answer: 2,
    rationale: "Flank pain with a fast heart rate and falling BP suggests bleeding around the kidney. Slightly pink urine and mild soreness are common at first, and the client stays on bed rest per protocol rather than getting up." },
  m8s9: { area: "SIPC", type: "single", cj: "Evaluate outcomes",
    stem: "Before discharge, the nurse watches a client do a peritoneal dialysis exchange. Which action needs correction?",
    options: ["Puts on a mask and washes hands before touching the tubing", "Lays the uncapped catheter end on the table while opening a bag", "Checks the bag for leaks and the expiration date before use", "Closes the clamps before disconnecting the drain bag"],
    answer: 1,
    rationale: "The open end of the catheter or transfer set must stay sterile, and laying it on a surface is a direct path for bacteria into the peritoneum. A mask and hand hygiene, checking the bag, and clamping before disconnecting are all correct technique." },
  m8s10: { area: "PHYS", type: "single", cj: "Prioritize hypotheses",
    stem: "An 81-year-old client with type 2 diabetes is brought in after 3 days of increasing confusion. She had a bladder infection last week. Glucose is 890 mg/dL, serum osmolality is 362 mOsm/kg, and urine ketones are negative. Her mouth is dry, HR is 118, and BP is 92/54. Which problem does the nurse address first?",
    options: ["Metabolic acidosis from ketone buildup", "Fall risk related to new confusion", "Lack of knowledge about home glucose checks", "Severe fluid deficit from osmotic diuresis"],
    answer: 3,
    rationale: "These findings fit hyperosmolar hyperglycemic state, where very high glucose pulls water out through the kidneys and causes deep dehydration and low blood pressure. Fluid replacement comes first. Ketones are negative, so ketoacidosis is not the main problem. Fall risk and teaching matter but come after circulation is restored.",
    lens: { medic: "In the field, a glucose this high often makes you think DKA and look for Kussmaul breathing.", nurse: "In an older client with no ketones, the RN recognizes HHS, where the severe fluid loss is the main threat." } },
  m8s11: { area: "PHYS", type: "single", cj: "Recognize cues",
    stem: "A 64-year-old client with type 2 diabetes takes insulin glargine and metoprolol. At 1500 the client is sweaty, says it is hard to think, and is slow to answer. HR is 68 and BP is 132/80. What does the nurse do first?",
    options: ["Do a full neurologic exam to look for a stroke", "Review when the last metoprolol dose was given", "Check the client's capillary blood glucose", "Reassure the client that the heart rate is normal"],
    answer: 2,
    rationale: "Beta blockers can blunt the fast heart rate and shakiness of hypoglycemia, but sweating and confusion can still appear. A quick glucose check confirms or rules out a low that needs treatment right away. A neuro exam, a medication review, or reassurance would delay care for a treatable cause.",
    lens: { medic: "Medics learn a racing heart and tremor as the classic low-sugar signs.", nurse: "On a beta blocker those signs may be missing, so sweating or confusion alone calls for a glucose check." } },
  m8s12: { area: "PHYS", type: "single", cj: "Take action",
    stem: "A 38-year-old client comes to the emergency department with a suspected kidney stone. He is pacing, has vomited once, and rates his right flank pain 10 out of 10. He is afebrile and his vital signs are stable. The provider prescribes IV ketorolac, IV fluids, and straining all urine. What does the nurse do first?",
    options: ["Hand him a strainer and urinal for his first void", "Encourage him to walk the hall to help pass the stone", "Start oral fluids at 250 mL every hour to flush the stone", "Give the IV ketorolac as prescribed for the pain"],
    answer: 3,
    rationale: "Renal colic is one of the most severe types of pain, and ketorolac relieves pain and ureteral spasm, so it comes first in a stable client. Straining starts with the first void and does not need to come before pain relief. Walking can wait until pain is controlled, and oral fluids are a poor choice while he is vomiting." },
  m8s13: { area: "PHYS", type: "multi", cj: "Recognize cues",
    stem: "A client who had a kidney transplant 4 months ago comes to the clinic for a routine visit. Which findings suggest possible rejection? Select all that apply.",
    options: ["Weight up 2 kg (4.4 lb) in 3 days", "A fine tremor in both of the hands", "Tenderness over the graft site", "Creatinine up from 1.2 to 1.9 mg/dL", "Rounder face and bigger appetite", "Temperature of 38.2°C (100.8°F)"],
    answer: [0, 2, 3, 5],
    rationale: "Rapid weight gain, tenderness over the new kidney, rising creatinine, and fever are warning signs of rejection and need same-day follow-up. A fine tremor is a common side effect of tacrolimus or cyclosporine. A rounder face and increased appetite are expected effects of the steroid in the regimen." },
  m8s14: { area: "PHYS", type: "multi", cj: "Recognize cues",
    stem: "A client returns to the medical unit after a 4-hour hemodialysis session that removed 3.5 L of fluid. Which findings need prompt follow-up? Select all that apply.",
    options: ["BP 84/50 with dizziness when sitting up", "Weight down 3.4 kg from before dialysis", "Headache, nausea, and new restlessness", "Thrill and bruit present over the fistula", "New confusion about where he is", "Feels tired and wants to take a nap"],
    answer: [0, 2, 4],
    rationale: "Low BP with dizziness reflects fluid removed faster than the vascular space can refill. Headache, nausea, restlessness, and new confusion suggest dialysis disequilibrium syndrome from rapid solute shifts in the brain. Weight loss close to the fluid removed, a working fistula, and tiredness are expected after treatment.",
    lens: { medic: "In the field, new confusion makes you think of stroke, sugar, or hypoxia.", nurse: "Right after dialysis, the RN also thinks of disequilibrium from fast shifts in urea and fluid." } },
  m8s15: { area: "BCC", type: "multi", cj: "Generate solutions",
    stem: "A client is 1 day after transsphenoidal pituitary surgery and has nasal packing in place. Which instructions does the nurse give? Select all that apply.",
    options: ["Avoid blowing your nose, even if it feels stuffy", "Cough hard every hour to clear your lungs", "Rinse your mouth instead of brushing your teeth", "Lie flat in bed to ease your headache", "Tell the nurse about clear fluid dripping from your nose", "Breathe through your nose to keep the packing moist"],
    answer: [0, 2, 4],
    rationale: "Nose blowing, hard coughing, and brushing teeth can raise pressure or disturb the surgical site, so the client avoids them and uses mouth rinses for oral care. Clear nasal drainage may be cerebrospinal fluid and must be reported. The head of the bed stays raised, and with packing in place the client breathes through the mouth." },
  m8s16: { area: "BCC", type: "multi", cj: "Generate solutions",

  m9b1: { area: "RRP", type: "single", cj: "Take action",

  m9b2: { area: "RRP", type: "multi", cj: "Recognize cues",

  m9b3: { area: "PHYS", type: "single", cj: "Prioritize hypotheses",

    lens: { medic: "In the field, sudden relief of right lower quadrant pain can look like improvement.", nurse: "On the unit, relief followed by rigidity and fever is a perforation red flag that needs the surgeon now." } },
  m9b4: { area: "PPT", type: "single", cj: "Take action",
    stem: "A client's bag of total parenteral nutrition (TPN) runs out at 2200. Pharmacy says the next bag will not be ready for 2 hours. What does the nurse do?",

  m9b5: { area: "SIPC", type: "single", cj: "Take action",

  m9b6: { area: "HPM", type: "single", cj: "Evaluate outcomes",

    answer: 1,

  m9b7: { area: "RRP", type: "single", cj: "Take action",

  m9b8: { area: "PHYS", type: "single", cj: "Analyze cues",
    stem: "The nurse is caring for two clients with bowel obstruction. Client 1 has had cramping pain for 6 hours, frequent vomiting of greenish fluid, and mild distension. Client 2 has had growing distension for 3 days, no stool or gas, and vomiting just today. Which conclusion is correct?",

  m9b9: { area: "PHYS", type: "multi", cj: "Recognize cues",
    stem: "A client who takes ibuprofen daily for back pain comes to the emergency department with dizziness. Which findings suggest an upper gastrointestinal source of bleeding? Select all that apply.",

    lens: { medic: "In the field, the focus is heart rate, BP, and access for fluids.", nurse: "On the unit, the emesis, stool, and BUN pattern help decide where the GI team scopes and support early PPI therapy." } },
  m9b10: { area: "PPT", type: "single", cj: "Evaluate outcomes",

  m9b11: { area: "PHYS", type: "single", cj: "Prioritize hypotheses",

  m9b12: { area: "PHYS", type: "single", cj: "Prioritize hypotheses",

  m9b13: { area: "PHYS", type: "multi", cj: "Recognize cues",
    stem: "An 84-year-old client is 2 days out from hip fracture repair. Her daughter says, \"She is just not herself today.\" Which findings support possible sepsis in this client? Select all that apply.",

    lens: { medic: "Field sepsis screens often lean on fever and a falling BP.", nurse: "Older clients often show sepsis as new confusion, a low temperature, or fast breathing well before the BP drops." } },
  m9b14: { area: "SIPC", type: "single", cj: "Generate solutions",
    stem: "A client being treated for an intra-abdominal abscess has received IV piperacillin-tazobactam and vancomycin for 72 hours. Cultures now grow E. coli that is sensitive to ceftriaxone, and MRSA screening is negative. What does the nurse do?",

    answer: 2,

  m9b15: { area: "PPT", type: "single", cj: "Take action",

  m9b16: { area: "SIPC", type: "multi", cj: "Take action",
    stem: "Several clients and staff on a med-surg unit develop sudden vomiting and diarrhea, and norovirus is suspected. Which actions are correct? Select all that apply.",

  m9b17: { area: "RRP", type: "single", cj: "Recognize cues",

  m9b18: { area: "RRP", type: "multi", cj: "Recognize cues",
    stem: "A client has negative-pressure wound therapy (NPWT) on a stage 4 sacral pressure injury. Which findings need the nurse to take action? Select all that apply.",
    options: ["The foam dressing is soft and no longer collapsed", "Serosanguineous drainage of 40 mL over 8 hours", "The device alarms for a leak near the gluteal fold", "The foam is firm and drawn down into the wound", "Bright red blood is filling the tubing and canister", "The client reports a mild pulling feeling at the site"],
    answer: [0, 2, 4],
    rationale: "The foam should stay firm and collapsed, so a soft dressing or a leak alarm means the seal is lost and therapy is not working. Frank bleeding into the canister needs therapy stopped, pressure applied, and the provider notified. Moderate serosanguineous drainage, a firm collapsed dressing, and a mild pulling feeling are expected." },
  m9b19: { area: "BCC", type: "single", cj: "Take action",
    stem: "A client receiving a continuous gastric tube feeding at 55 mL/hr has a gastric residual volume of 250 mL. The abdomen is soft, bowel sounds are present, the client has no nausea, and the head of the bed is at 35 degrees. What does the nurse do?",

    answer: 1,
    rationale: "Current guidance does not hold feedings for a residual under 500 mL when there are no other signs of intolerance. Holding or cutting the rate without cause leads to underfeeding. Discarding the residual wastes fluid and electrolytes, and a large flush adds volume for no reason." },
  m9b20: { area: "BCC", type: "single", cj: "Evaluate outcomes",
    stem: "A client with cirrhosis and ascites who had an episode of hepatic encephalopathy last month asks about eating at home. Which client statement shows correct understanding?",
    options: ["\"I'll cut way back on meat, eggs, and beans to protect my brain.\"", "\"I'll drink extra fluids each day to help flush out the toxins.\"", "\"I'll skip breakfast so my liver gets a longer rest overnight.\"", "\"I'll limit salt and eat small amounts often, with a bedtime snack.\""],

    rationale: "Current practice avoids protein restriction in cirrhosis, even after encephalopathy, because malnutrition worsens outcomes. Sodium restriction helps control ascites, and small frequent meals with a late snack limit muscle breakdown overnight. Extra fluids can worsen ascites and low sodium, and long fasts speed muscle loss." },
  m9s1: { area: "PHYS", type: "single", cj: "Take action",
    stem: "A client had an ileostomy created 4 days ago. Over the last 24 hours the pouch has collected 1,900 mL of watery output. The client feels dizzy when standing, heart rate is 112, mucous membranes are dry, and urine output was 40 mL over the last 2 hours. What does the nurse do first?",
    options: ["Encourage 2 liters of plain water by mouth today", "Report the output and vital signs to the provider", "Empty the pouch more often to protect the barrier seal", "Offer raw vegetables to help thicken the stoma output"],
    answer: 1,
    rationale: "High ileostomy output with dizziness, tachycardia, and low urine output points to fluid volume deficit, which needs prompt provider notification for IV fluid and electrolyte replacement. Plain water is hypotonic and can increase output and sodium loss. Emptying the pouch more often does not treat the deficit, and raw high-fiber vegetables raise the risk of a food blockage at the stoma." },
  m9s2: { area: "PHYS", type: "single", cj: "Analyze cues",
    stem: "A client with type 2 diabetes cut the thigh on a fence 2 days ago. The thigh is now red and swollen, temperature is 38.9 C (102 F), and heart rate is 122. Which finding most strongly suggests a necrotizing soft tissue infection?",
    options: ["Warm, pink skin with a clear border around the cut", "Thick yellow drainage on the gauze covering the cut", "Pain much worse than the skin changes would explain", "A tender, swollen lymph node in the groin on that side"],
    answer: 2,
    rationale: "Severe pain out of proportion to visible skin changes is an early warning sign of necrotizing infection, because the damage spreads along deep tissue before the skin shows it. Other late signs include tense or dusky skin, blisters, and crepitus. Pus, a clear border, and a tender node fit a simpler cellulitis or abscess. Suspected necrotizing infection needs an urgent surgical consult, not just antibiotics.",
    lens: { medic: "In the field a hot red leg with fever reads as cellulitis, and you transport for antibiotics.", nurse: "On the unit, pain that outruns the skin findings means calling the provider now, because this infection needs surgery within hours." } },
  m9s3: { area: "PHYS", type: "single", cj: "Take action",
    stem: "A client is 18 hours after a laparoscopic Roux-en-Y gastric bypass. Heart rate has risen from 88 to 126, respiratory rate is 26, and temperature is 38.2 C (100.8 F). The client reports new left shoulder pain and says, \"I feel like something is wrong.\" What does the nurse do first?",
    options: ["Give the prescribed opioid for the shoulder pain", "Help the client walk to move gas from the shoulder", "Offer 30 mL of clear liquid to test tolerance", "Notify the surgeon of findings of a possible leak"],
    answer: 3,
    rationale: "Sustained tachycardia, rising respiratory rate, fever, left shoulder pain, and a sense of doom after bariatric surgery suggest an anastomotic leak, which needs the surgeon now. Shoulder pain from gas after laparoscopy is common, but it does not explain these vital signs. Giving an opioid or walking delays care, and oral intake could worsen a leak.",
    lens: { medic: "A fast heart rate after surgery often reads as pain or anxiety, and you treat the pain.", nurse: "After bariatric surgery, a heart rate over 120 may be the first sign of a leak, since a large abdomen can hide peritonitis." } },
  m9s4: { area: "PHYS", type: "single", cj: "Prioritize hypotheses",
    stem: "A 5-day-old infant is brought to the pediatric unit. The parent says the baby has been too sleepy to finish feedings since last night. The axillary temperature is 36.0 C (96.8 F), heart rate is 182, and the skin on the legs looks mottled. Which problem does the nurse address first?",
    options: ["Possible sepsis with temperature instability", "Normal sleepy period after the first few days", "Physiologic jaundice causing extra sleepiness", "A cool room causing a low temperature reading"],
    answer: 0,
    rationale: "Neonates with sepsis often have a low or unstable temperature rather than a fever, along with poor feeding, lethargy, tachycardia, and mottling. These signs together need urgent evaluation, cultures, and antibiotics. A normal sleepy period does not cause mottling or a heart rate of 182. Jaundice and a cool room do not explain the full picture.",
    lens: { medic: "Fever is the sepsis flag you are trained to look for in kids.", nurse: "A newborn with sepsis is more likely to run cold, so a low temperature plus poor feeding is an emergency." } },
  m9s5: { area: "PHYS", type: "multi", cj: "Recognize cues",
    stem: "A 46-year-old client is 3 months past a kidney transplant and takes tacrolimus and prednisone. Which findings suggest a serious infection? Select all that apply.",
    options: ["Temperature of 37.9°C", "BP 128/76", "New confusion this morning", "Mild tiredness after a walk", "Heart rate 108 at rest", "Weight unchanged from last week"],
    answer: [0, 2, 4],
    rationale: "Immunosuppressants blunt fever, so even a low-grade temperature counts, especially with new confusion and a fast resting heart rate. A normal BP, mild tiredness after activity, and a stable weight aren't warning signs here." },
  m9s6: { area: "RRP", type: "single", cj: "Take action",
    stem: "The nurse assesses a client 12 hours after an ileostomy was created. The stoma is dark purple to black and looks dry. Yesterday after surgery it was red and moist. What does the nurse do?",

    answer: 2,
    rationale: "A healthy stoma is red or pink and moist. A dark purple or black, dry stoma suggests poor blood supply and tissue death, which needs the surgeon right away. Swelling is expected in a new stoma, but a color change like this is not. Waiting or applying heat delays treatment." },
  m9s7: { area: "RRP", type: "single", cj: "Take action",
    stem: "A client is 8 hours after a hemorrhoidectomy. The client has not voided since surgery and reports fullness above the pubic bone. Rectal pain is 4 on a 0 to 10 scale, and the rectal dressing has a small amount of pink drainage. Which action does the nurse take first?",
    options: ["Check bladder volume with a bladder scanner", "Give the prescribed stool softener now", "Reinforce the dressing and recheck in 2 hours", "Ask the client to limit fluids until voiding"],
    answer: 0,
    rationale: "Urinary retention is a common problem after anal and rectal surgery because of pain, spasm, and anesthesia. Fullness with no void in 8 hours calls for a bladder scan. A stool softener is part of routine care but does not address the bladder. The small amount of pink drainage is expected, and limiting fluids does not help a full bladder empty." },
  m9s8: { area: "RRP", type: "single", cj: "Take action",
    stem: "A client returns to the unit after a percutaneous liver biopsy done through the right side of the chest wall. Vital signs are stable and the site is dry. How does the nurse position the client?",

  m9s9: { area: "RRP", type: "single", cj: "Take action",
    stem: "A client has normal saline infusing through a peripheral IV in the left forearm. The client says the arm feels tight. The area around the site is swollen, pale, and cool to touch. What does the nurse do first?",

    rationale: "A cool, pale, swollen, tight site shows infiltration, so the nurse stops the infusion and removes the catheter, then elevates the arm and starts a new IV in a different site. Flushing pushes more fluid into the tissue. Slowing the rate or restarting the same line keeps the problem going.",
    lens: { medic: "With poor veins in the field, you may nurse a marginal line along because access is hard to get.", nurse: "On the unit, an infiltrated site comes out right away, and you can call for help or ultrasound if a new line is hard to place." } },
  m9s10: { area: "SIPC", type: "multi", cj: "Generate solutions",
    stem: "A client in the ICU has a triple-lumen central venous catheter in the right internal jugular vein. Which actions by the nurse help prevent a central line infection? Select all that apply.",
    options: ["Perform hand hygiene before handling the line", "Scrub the needleless connector and let it dry first", "Ask the team daily whether the line is still needed", "Use chlorhexidine on the skin at dressing changes", "Change the transparent dressing every 24 hours", "Apply antibiotic ointment at the insertion site"],
    answer: [0, 1, 2, 3],
    rationale: "Central line infection prevention includes hand hygiene, scrubbing the hub before each access, chlorhexidine skin antisepsis, and daily review of whether the line is still needed. A transparent dressing is changed about every 7 days unless it is damp, loose, or soiled. Antibiotic ointment is not recommended for most central lines because it can promote resistance and fungal growth." },
  m9s11: { area: "SIPC", type: "single", cj: "Evaluate outcomes",
    stem: "The charge nurse watches a new nurse change the transparent dressing on a client's peripherally inserted central catheter (PICC). Which step needs correction?",

    rationale: "Gloves used to remove a soiled dressing are contaminated, so the nurse removes them, performs hand hygiene, and puts on sterile gloves for the new dressing. A mask and sterile gloves are correct for a central line dressing change. Peeling toward the insertion site helps keep the catheter from being pulled out, and letting the chlorhexidine dry lets it work." },
  m9s12: { area: "SIPC", type: "single", cj: "Generate solutions",
    stem: "A client who had a kidney transplant 6 weeks ago takes tacrolimus and mycophenolate and is admitted for a low-grade fever. Only semi-private rooms are open. Which client is the best roommate for this client?",

    rationale: "An immunosuppressed transplant client should room with someone who has no known or suspected infection, so the client after a clean knee replacement is the best match. Shingles can spread varicella to a client with weak immunity. A draining wound infection and a new febrile cough both carry organisms that could cause serious infection in this client." },
  m9s13: { area: "SIPC", type: "single", cj: "Take action",
    stem: "A client has an open, draining wound on the lower leg. The provider orders a wound culture before antibiotics are started. How does the nurse collect the specimen?",
    options: ["Swab the drainage left on the dressing just removed", "Rinse with saline, then press and turn the swab on clean tissue", "Clean with povidone-iodine, then swab the wound bed firmly", "Swab the wound after the first antibiotic dose runs in"],

    rationale: "The nurse rinses away loose debris with sterile saline, then presses and rotates the swab over about 1 square centimeter of clean, viable tissue to sample the organisms causing infection. Drainage on an old dressing holds surface contaminants. Antiseptics and antibiotics given first can kill organisms and cause a false negative result." },
  m9s14: { area: "PPT", type: "single", cj: "Take action",
    stem: "Fifteen minutes into an IV vancomycin infusion, a client develops red, itchy skin over the face, neck, and upper chest. BP is 120/76, compared with 124/78 before the dose. There is no wheezing, throat tightness, or lip swelling. What does the nurse do?",

    rationale: "Flushing and itching of the upper body during vancomycin is an infusion reaction caused by giving the drug too fast. The nurse stops the infusion and contacts the provider, who usually prescribes an antihistamine and a slower rate. The client has no airway signs or low BP, so epinephrine is not needed now. A faster rate makes the reaction worse.",
    lens: { medic: "Red skin and itching after an IV drug in the field means anaphylaxis until proven otherwise.", nurse: "With vancomycin, a red upper body with stable BP and airway is usually rate related, so you stop, call, and restart slower." } },
  m9s15: { area: "PPT", type: "single", cj: "Take action",
    stem: "A client is on day 6 of IV gentamicin. The client reports ringing in both ears and feeling unsteady when walking. Serum creatinine is 1.6 mg/dL, up from 0.9 mg/dL on admission. The next dose is due now. What does the nurse do?",

    rationale: "Ringing in the ears, unsteadiness, and a rising creatinine point to aminoglycoside ear and kidney toxicity. The nurse holds the dose and notifies the provider, who may check a drug level or change the antibiotic. Giving another dose can cause lasting hearing loss and more kidney injury, and extra fluids do not make the dose safe." },
  m9s16: { area: "PPT", type: "multi", cj: "Recognize cues",
    stem: "A 72-year-old client who takes prednisone daily is on day 5 of oral levofloxacin for a skin infection. Which reports from the client need follow-up by the nurse? Select all that apply.",
    options: ["Pain and swelling at the back of the right heel", "Five watery stools since early this morning", "Mild nausea when the tablet is taken without food", "Burning and tingling in both feet at night", "Taking each tablet 2 hours before an antacid"],
    answer: [0, 1, 3],

  m9s17: { area: "PPT", type: "single", cj: "Evaluate outcomes",

  m9s18: { area: "HPM", type: "multi", cj: "Generate solutions",
    stem: "A 50-year-old client is scheduled for a same-day screening colonoscopy with sedation. Which instructions does the nurse include in teaching? Select all that apply.",

  m9s19: { area: "HPM", type: "single", cj: "Evaluate outcomes",
    stem: "A client was recently diagnosed with celiac disease and has met with the dietitian. Which lunch choice shows the client understands the diet?",

  m9s20: { area: "BCC", type: "multi", cj: "Generate solutions",
