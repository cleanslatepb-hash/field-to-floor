  m14b17: { area: "SIPC", type: "single", cj: "Take action",
    stem: "At the bedside, the barcode scanner shows that the heparin bag the nurse is about to hang belongs to the client in the next room. The nurse stops before anything reaches the client. What does the nurse do about the event?",
    options: ["Nothing more, since the error was caught and no harm reached the client", "File a safety event report describing the near miss and how it happened", "Chart the near miss in the client's record and tell the client's family", "Tell the pharmacist about it in passing so they can watch for it next time"],
    answer: 1,
    rationale: "Near misses are reported because they show weak points in the system before someone is harmed. The safety event report goes to risk management or quality staff, not into the client's chart. An informal mention does not let the facility track and fix the cause." },
  m14b18: { area: "PSY", type: "single", cj: "Take action",
    stem: "A 3-year-old on a pediatric unit has burns on both feet with a sharp line at the same height on each ankle. The parent says the child climbed into the tub alone. The provider says, \"Let's wait for the burn team to see her before anyone reports this.\" What does the nurse do?",
    options: ["Wait for the burn team, since the provider is leading the child's care", "Ask the parent to explain again how the child got into the hot water", "Tell the parent a report will be made and ask for the real story now", "Report the suspected abuse to child protective services per policy"],
    answer: 3,
    rationale: "Burns with sharp lines on both feet suggest forced immersion, and the story does not fit the injury. Every nurse is a mandated reporter, and reasonable suspicion is enough, so the nurse does not need proof or the provider's approval. Questioning or confronting the parent is not the nurse's role and can put the child at risk." },
  m14b19: { area: "SIPC", type: "multi", cj: "Take action",
    stem: "A visitor slips on a wet floor in the hallway of a medical unit and lands on her knee. She says, \"I'm fine, really.\" Which actions does the nurse take? Select all that apply.",
    options: ["Check her for injury and help her to a chair", "Offer an ED evaluation per facility policy", "Complete an incident report with objective facts", "Put out a wet-floor sign and call housekeeping", "Note in the report that she was not paying attention", "Tell her the hospital is not liable for her fall"],
    answer: [0, 1, 2, 3],
    rationale: "Incident reports cover visitors and staff as well as clients. The nurse checks the visitor, offers an evaluation, removes the hazard, and reports only facts that were seen or said. Blaming opinions and statements about liability do not belong in the response or the report." },
  m14b20: { area: "SIPC", type: "multi", cj: "Generate solutions",
    stem: "A surgical unit's rate of catheter-associated urinary tract infections has risen for 3 months. Which actions fit a quality improvement approach? Select all that apply.",
    options: ["Audit how many catheter days there are and why each catheter is in", "Start a nurse-driven protocol to remove catheters that are no longer needed", "Recheck the infection rate after the change and adjust the plan as needed", "Find the nurse with the most infected clients and write her up for it", "Change each indwelling catheter on a set 3-day schedule", "Flush each catheter with saline once a day to keep the urine moving"],
    answer: [0, 1, 2],
    rationale: "Quality improvement collects data, tests a change, and measures the result, as in a plan-do-study-act cycle. Removing unneeded catheters is a proven way to lower CAUTI. Blaming one nurse works against a just culture, and routine catheter changes or flushes are not recommended and add risk." },
  m14s1: { area: "MOC", type: "single", cj: "Prioritize hypotheses",
    stem: "The nurse on a medical-surgical unit receives report on four clients at 0700. Which client does the nurse see first?",
    options: ["A 76-year-old with a hip fracture awaiting surgery who is newly restless and has an SpO2 of 89%", "A 64-year-old with type 2 diabetes whose fasting glucose is 168 mg/dL and who is asking for breakfast", "A 58-year-old with cellulitis whose IV cefazolin dose is due in 30 minutes and who is resting", "A 70-year-old 2 days after a colectomy who rates incision pain 6 of 10 and asks for medicine"],
    answer: 0,
    rationale: "New restlessness with hypoxemia after a long-bone fracture points to fat embolism or pulmonary embolism, a breathing problem that is unstable. The mildly high glucose, the antibiotic due in 30 minutes, and expected post-op pain are all stable and can wait a few minutes." },
  m14s2: { area: "MOC", type: "multi", cj: "Generate solutions",
    stem: "The RN is working with an LPN and a UAP on a medical unit. Which assignments are appropriate? Select all that apply.",
    options: ["UAP: measure and record intake and output for a client with heart failure", "LPN: give scheduled oral medications to a client with stable pneumonia", "LPN: reinforce insulin teaching the RN started with a client yesterday", "LPN: do the admission assessment on a client who just arrived from the ED", "UAP: assess a new reddened area on the heel of a client with diabetes", "LPN: give the first colostomy teaching to a client going home tomorrow"],
    answer: [0, 1, 2],
    rationale: "Measuring I&O is a routine UAP task, and an LPN can give scheduled oral medications and reinforce teaching the RN began for a stable client. Admission assessment, assessing a new skin finding, and initial teaching need RN judgment and cannot be handed off." },
  m14s3: { area: "MOC", type: "single", cj: "Take action",
    stem: "The charge nurse needs to assign a new admission with disseminated herpes zoster on airborne and contact precautions. Which RN gets this client?",
    options: ["The RN who is 20 weeks pregnant and has a negative varicella titer on file", "The RN who is also caring for a client getting chemotherapy for leukemia", "The RN with documented varicella immunity whose other clients are stable", "The newly hired RN whose varicella titer results are still pending today"],
    answer: 2,
    rationale: "Disseminated zoster spreads like chickenpox, so the caregiver should have proof of varicella immunity and no high-risk clients in the same assignment. A nonimmune pregnant nurse and a nurse with unknown immunity are at risk, and a client on chemotherapy is too vulnerable to share a nurse with this client." },
  m14s4: { area: "MOC", type: "single", cj: "Take action",
    stem: "A new graduate nurse tells the preceptor, \"The prescription says MS 4 mg IV now. My client's pain is 8 of 10, so I'm drawing up morphine.\" What does the preceptor tell the new graduate?",
    options: ["Ask the pharmacist which drug the provider most likely meant, then give it", "Call the provider to clarify, since MS can mean morphine or magnesium", "Give the morphine, because the client's pain score supports that choice", "Check the last morphine dose on the MAR, then give this dose right away"],
    answer: 1,
    rationale: "\"MS\" is on the do-not-use abbreviation list because it can mean morphine sulfate or magnesium sulfate. Only the prescriber can clarify what was meant, so the new graduate calls the provider before giving anything. A pharmacist's guess, the pain score, or the MAR history does not make an unclear prescription safe." },
  m14s5: { area: "MOC", type: "single", cj: "Take action",
    stem: "A 67-year-old client who speaks Haitian Creole and limited English is going home after a new diagnosis of heart failure. Her adult grandson offers to translate the discharge teaching. What does the nurse do?",
    options: ["Accept the grandson's offer, since family knows how she learns best", "Teach in simple English and give her the English handout to review", "Use a translation app on the nurse's phone to explain each medicine", "Get a qualified medical interpreter by phone, video, or in person"],
    answer: 3,
    rationale: "Clients with limited English have a right to a qualified medical interpreter, and family members may leave out or change details. Simple English and an English handout do not ensure understanding, and a general translation app is not accurate enough for medication teaching.",
    lens: { medic: "On scene you often let a family member translate to get a quick history.", nurse: "On the unit, teaching and consent go through a qualified medical interpreter, not family." } },
  m14s6: { area: "MOC", type: "single", cj: "Take action",
    stem: "A 74-year-old client with a GI bleed has a hemoglobin of 6.9 g/dL. She has decision-making capacity and declines a blood transfusion for religious reasons. Her daughter says, \"Just give it while she's asleep. She'll thank you later.\" What does the nurse do?",
    options: ["Tell the daughter that the client's informed refusal has to be honored", "Ask the provider for a prescription to give the blood while she sleeps", "Ask the ethics team to approve the blood based on the daughter's wishes", "Have the daughter sign the transfusion consent as the next of kin today"],
    answer: 0,
    rationale: "A client with capacity has the right to refuse treatment, and autonomy outweighs the family's wish to do good. The nurse makes sure the refusal is informed, tells the provider, and documents it. Giving blood without consent is battery, and neither an ethics team nor a family member can override a capable client." },
  m14s7: { area: "MOC", type: "single", cj: "Take action",
    stem: "A 45-year-old client in the ICU after a severe head injury has fixed pupils and a GCS of 3. The provider plans brain death testing. The family has not mentioned organ donation. What does the nurse do?",
    options: ["Wait to bring up donation until brain death is formally declared", "Ask the family now if they would consider donating any of his organs", "Call the organ procurement organization as hospital policy directs", "Check his driver's license for donor status before calling"],
    answer: 2,
    rationale: "Federal rules require a timely referral to the organ procurement organization when death is imminent, before brain death is declared. The OPO or a trained requester, not the bedside nurse, talks with the family about donation. Donor status on a license does not change the need to call.",
    lens: { medic: "In the field, a clearly fatal head injury means you document and hand off.", nurse: "In the ICU, imminent death triggers a required call to the organ procurement organization." } },
  m14s8: { area: "MOC", type: "multi", cj: "Generate solutions",
    stem: "A 79-year-old client is being transferred from the hospital to a skilled nursing facility for rehab after hip surgery. Which information does the nurse include in the handoff report to the receiving nurse? Select all that apply.",
    options: ["The time and dose of her last oxycodone and how well it worked", "Her code status and the name and phone number of her health care proxy", "That she was confused at night and how staff reoriented her", "Her current weight-bearing order and how much help she needs to stand", "Her roommate's diagnosis and why the roommate was moved", "The nurse's opinion that her daughter is demanding and difficult"],
    answer: [0, 1, 2, 3],
    rationale: "A good transfer report gives the receiving nurse what is needed to keep care safe and continuous: recent pain medicine and its effect, code status and proxy, behavior patterns that worked, and mobility orders. Another client's information breaks privacy, and personal opinions about family are not part of a professional handoff." },
  m14s9: { area: "MOC", type: "single", cj: "Take action",
    stem: "A home health nurse visits an 84-year-old client with mild dementia who lives with her nephew. Her checkbook shows large withdrawals she cannot explain, and her prescriptions have not been refilled for a month. The nephew says she \"gets confused about money.\" What does the nurse do?",
    options: ["Gather more proof over the next few home visits before filing a report", "Report suspected exploitation and neglect to adult protective services", "Ask the nephew to explain the withdrawals before deciding what to do", "Teach the client to keep her checkbook in a locked drawer at home"],
    answer: 1,
    rationale: "Nurses are mandated reporters, and reasonable suspicion of financial exploitation or neglect is enough to report. Proof is not required, and waiting leaves the client at risk. Confronting the nephew can raise the danger to the client, and a locked drawer does nothing about the missed medicines." },
  m14s10: { area: "MOC", type: "single", cj: "Analyze cues",
    stem: "A client with delirium pulled out his urinary catheter. The provider writes, \"Soft wrist restraints PRN for agitation.\" What does the nurse do?",
    options: ["Apply the restraints each time the client becomes agitated tonight", "Ask the charge nurse to cosign the order so the unit can use it", "Apply the restraints now and keep them on until the client is calm", "Contact the provider, since restraint orders have to be time-limited"],
    answer: 3,
    rationale: "Restraint orders must be time-limited and based on a current assessment; PRN or standing restraint orders are not allowed. The nurse contacts the provider, keeps trying less restrictive measures, and gets a proper order if restraint is still needed. A charge nurse's cosignature does not fix an invalid order.",
    lens: { medic: "In the field, you restrain a combative client under protocol and document it.", nurse: "In the hospital, each restraint episode needs its own time-limited order, never a PRN order." } },
  m14s11: { area: "SIPC", type: "single", cj: "Take action",
    stem: "In the emergency department, a visitor whose father has waited 3 hours starts yelling at the nurse. He is clenching his fists and stepping closer. What does the nurse do first?",
    options: ["Move to keep a clear path to the door and call security for help", "Tell him firmly that he must calm down or he will be asked to leave", "Explain the triage system so he understands why his father waited", "Put a hand on his shoulder and lead him to a quiet room to talk"],
    answer: 0,
    rationale: "Clenched fists and moving closer are signs that violence may be near, so the nurse's own safety comes first: keep an exit and get security. Then the nurse can use calm de-escalation. Threats can escalate anger, explaining triage can wait, and touching or isolating him raises the risk.",
    lens: { medic: "On a scene, you back out and stage until police make it safe.", nurse: "In the ED the same rule holds: keep an exit, call security, then de-escalate." } },
  m14s12: { area: "PHYS", type: "single", cj: "Analyze cues",
    stem: "A 72-year-old woman with diabetes calls the clinic triage line. Since this morning she has felt very tired, nauseated, and short of breath, and her jaw aches. She thinks she has the flu. What does the nurse tell her?",
    options: ["Rest, drink fluids, and call back if you are not better by tomorrow", "Come into the clinic this afternoon so the provider can examine you", "Hang up and call 911 now so an ambulance can take you to the hospital", "Have a family member drive you to the nearest urgent care center"],
    answer: 2,
    rationale: "Older women and people with diabetes often have acute coronary syndrome without classic chest pain; fatigue, nausea, dyspnea, and jaw pain fit. She needs EMS for a 12-lead ECG and fast transport. Waiting, a clinic visit, or a private car to urgent care all delay treatment.",
    lens: { medic: "On a 911 call, you would be with her running a 12-lead in minutes.", nurse: "On a triage line you cannot examine her, so possible atypical ACS goes to 911." } },
  m14s13: { area: "RRP", type: "single", cj: "Take action",
    stem: "An 81-year-old client who takes apixaban for atrial fibrillation is found sitting on the floor next to her bed. She says she slipped, did not hit her head, and asks to be helped back to bed. What does the nurse do first?",
    options: ["Help her back to bed with a UAP and a lift, then resume routine care", "Assess her for injury, including a neuro check, before she is moved", "Fill out the incident report while the details are still fresh", "Turn on a bed alarm and move her to a room close to the station"],
    answer: 1,
    rationale: "After a fall, the nurse first checks for injury, such as head injury or hip fracture, before moving the client. Because she is on an anticoagulant and the fall was not witnessed, a bleed is a real risk, so the provider is notified after the assessment. The report and fall precautions come later." },
  m14s14: { area: "BCC", type: "single", cj: "Recognize cues",
    stem: "During a skin check, the nurse finds a 3 cm area on the right heel of a client who has been on bed rest for 4 days. The skin is intact, deep purple, does not blanch, and feels boggy. How does the nurse document this finding?",
    options: ["Stage 1 pressure injury", "Unstageable pressure injury", "Stage 2 pressure injury", "Deep tissue pressure injury"],
    answer: 3,
    rationale: "Intact skin that is deep red, purple, or maroon and does not blanch is a deep tissue pressure injury, often with a boggy feel. Stage 1 is nonblanching redness without purple color, stage 2 is an open partial-thickness wound, and unstageable means the base is covered by slough or eschar. The nurse floats the heel off the bed to remove pressure." },
  m14s15: { area: "BCC", type: "multi", cj: "Generate solutions",
    stem: "A client in hospice care on a medical unit is actively dying. He is unresponsive, his breathing is noisy and gurgling, and his mouth is dry. His wife is at the bedside. Which actions does the nurse include in comfort care? Select all that apply.",
    options: ["Turn him on his side with the head of the bed raised slightly", "Give mouth care with moist swabs and put balm on his lips", "Explain to his wife that the gurgling is not thought to distress him", "Deep suction his throat every hour to clear the secretions", "Give him sips of water to keep his mouth moist and ease thirst", "Start an IV to give fluids that will help his dry mouth"],
    answer: [0, 1, 2],
    rationale: "Side-lying with the head raised helps secretions drain, mouth care treats dryness, and teaching the family eases their distress. Deep suctioning is uncomfortable and brings more secretions, oral fluids can be aspirated by an unresponsive client, and IV fluids can make secretions worse at the end of life." },
  m14s16: { area: "BCC", type: "multi", cj: "Take action",
    stem: "A client with advanced lung cancer dies on the unit, as expected, with his family present. The death does not need to be referred to the medical examiner. Which actions does the nurse take during postmortem care? Select all that apply.",
    options: ["Place him on his back with the head of the bed raised slightly", "Put his dentures in his mouth and gently close his eyes", "Remove the IV catheter and urinary catheter per policy", "Offer the family time alone with him before he is moved", "Tie his wrists together firmly so his arms stay in place", "Wait to clean the body until the funeral home staff arrive"],
    answer: [0, 1, 2, 3],
    rationale: "Raising the head keeps blood from pooling in the face, dentures and closed eyes keep a natural look, and tubes can be removed when no medical examiner review is needed. Family time is part of postmortem care. Tight ties bruise the skin, and the nurse cleans the body before the family views it or it leaves the unit." },
  m14s17: { area: "PSY", type: "single", cj: "Generate solutions",
    stem: "The husband of a client with end-stage Alzheimer disease, who is on hospice care at home, tells the nurse, \"Some days I wish it would just be over. Then I feel like a terrible person.\" What is the nurse's best response?",
    options: ["You shouldn't feel guilty, because you are doing such a good job caring for her.", "Many people feel that way when someone they love declines slowly. Tell me more.", "Have you thought about moving her to a nursing home to make things easier?", "I'm sure she would understand. Try to focus on the good days you have left."],
    answer: 1,
    rationale: "Wishing for an end, followed by guilt, is a common part of anticipatory grief. Normalizing the feeling and inviting him to talk is therapeutic. Telling him not to feel guilty, jumping to placement, or offering false reassurance all shut down the conversation." },
  m14s18: { area: "PSY", type: "single", cj: "Generate solutions",
    stem: "A Muslim client dies on the unit. His wife and brother ask that his body be cared for in keeping with their faith. What is the nurse's best action?",
    options: ["Do routine postmortem care and send the body to the morgue promptly", "Have the chaplain explain the unit's usual postmortem care routine", "Ask the family which practices matter and how staff can help", "Wash the body right away so it is ready before the family returns"],
    answer: 2,
    rationale: "The family is the best source on which practices matter, such as same-gender washing by family, turning the body toward Mecca, or quick release for burial. Asking lets staff honor these within policy. Routine care, a chaplain explaining policy, or washing the body before asking can go against their wishes." },
  m14s19: { area: "HPM", type: "multi", cj: "Generate solutions",
    stem: "A 52-year-old man comes to the clinic for a checkup. He smoked 1 pack a day for 25 years and quit 8 years ago. He has never had any screening tests. Which screenings does the nurse expect to discuss with him? Select all that apply.",
    options: ["Yearly low-dose CT of the chest for lung cancer", "Colorectal cancer screening, such as a colonoscopy", "A one-time blood test for hepatitis C infection", "Ultrasound of the abdomen for an aortic aneurysm", "A yearly resting ECG to screen for heart disease", "A bone density scan to screen for osteoporosis"],
    answer: [0, 1, 2],
    rationale: "He is 50 to 80 with 25 pack-years and quit less than 15 years ago, so yearly low-dose CT is recommended; colorectal screening starts at 45, and adults 18 to 79 need one hepatitis C test. AAA ultrasound is for men 65 to 75 who ever smoked, routine ECG is not recommended in low-risk adults, and bone density screening is not routine for men his age." },
  m14s20: { area: "HPM", type: "single", cj: "Evaluate outcomes",
    stem: "A client is going home with enoxaparin injections. After teaching, the nurse asks him to show and explain how he will give a dose. He says, \"Then I'll rub the spot hard so it doesn't bruise.\" What does the nurse do next?",
    options: ["Mark the teaching complete, since he got most of the steps right", "Hand him a printed sheet on enoxaparin to read once he is home", "Tell his wife the right step so she can remind him at home", "Reteach that step a new way and have him walk through it again"],
    answer: 3,
    rationale: "Teach-back is a loop: when the client gets a step wrong, the nurse reteaches it in a different way and checks again until he gets it right. Rubbing the site increases bruising. Signing off, giving a handout, or relying on his wife leaves the error in place." }

Object.assign(ITEMS, {
  /* Module 1: Mrs. Grant, the fall */
  f1a: { area: "SIPC", type: "single",
    stem: "You arrive and find her on the bathroom floor. Before you touch her, what comes first?",
    options: ["Check the scene for hazards and how she fell", "Start an IV so you can give pain medicine", "Lift her straight onto the stretcher to save time", "Apply a traction splint to the right leg"],
    answer: 0,
    rationale: "Scene safety and mechanism come first: a wet floor, a loose rug, or a sign she passed out all change what you do next. Moving her before you assess risks more injury, and a traction splint is not used for a suspected hip fracture.",
    lens: { medic: "Size-up is automatic for you.", nurse: "Hold on to what you learn here. The floor team will never see the bathroom." } },
  f1b: { area: "PHYS", type: "single",
    stem: "Her right leg is shortened and rotated outward, and she can't move it without pain. What does this suggest?",
    options: ["A dislocated right knee", "A fractured right hip", "Leg weakness from a stroke", "A muscle cramp from lying still"],
    answer: 1,
    rationale: "A shortened, externally rotated leg after a fall in an older adult is the classic sign of a hip fracture. A stroke causes weakness without that deformity, and a knee injury or cramp doesn't shorten the leg." },
  f1c: { area: "PHYS", type: "single",
    stem: "Which history would most change your care on scene?",
    options: ["She lives alone and her daughter visits weekly", "She had cataract surgery on both eyes last year", "She tripped over the edge of the bath mat", "She says she got dizzy and blacked out first"],
    answer: 3,
    rationale: "A fall after dizziness or a blackout may be syncope from a heart rhythm or bleeding problem, which means a 12-lead, a glucose check, and a cardiac workup, not just a hip. A simple trip is a mechanical fall." },
  f1d: { area: "MOC", type: "single",
    stem: "At the ED, which detail in your handoff matters most for the nurses who will care for her after surgery?",
    options: ["How long the transport to the hospital took", "That her neighbor was the one who called 911", "That she was alert and oriented on scene", "Which hallway you carried her out through"],
    answer: 2,
    rationale: "Her baseline mental status is the yardstick the floor nurses will use. If she's confused after surgery, knowing she was sharp at home is what tells them it's new: delirium, not dementia.",
    lens: { medic: "To you, a normal mental status is a box you check.", nurse: "To the floor, it's the baseline that makes the next change visible." } },

  /* Module 2: Mr. Reyes, pneumonia */
  f2b: { area: "PHYS", type: "single",
    stem: "Temp 38.6°C, HR 104, RR 24, BP 108/70, and his wife says he \"just isn't himself.\" What do you suspect?",
    options: ["Possible sepsis from a lung infection", "A COPD flare brought on by the cold weather", "Anxiety about being sick and home alone", "Dehydration from a stomach bug last week"],
    answer: 0,
    rationale: "Fever, fast heart rate, fast breathing, and a change in how he's acting in a client with a likely lung infection should make you think sepsis early. A COPD flare doesn't explain the fever and behavior change.",
    src: "cdcSepsis" },
  f2c: { area: "MOC", type: "single",
    stem: "Which action best fits your suspicion?",
    options: ["Delay transport for a second set of vitals", "Have his wife drive him in later today", "Give his inhaler and leave him at home", "Alert the ED that you suspect sepsis"],
    answer: 3,
    rationale: "An early sepsis alert lets the ED have cultures, labs, and antibiotics ready when you arrive. Every hour of delay matters, so don't hold up transport or leave him home." },
  f2d: { area: "MOC", type: "single",
    stem: "Which part of your report will matter most to his floor nurse tomorrow?",
    options: ["He has two dogs and a cat at home", "The stairs into the house were steep and narrow", "He was alert and oriented, just more tired", "The exact time you cleared from the call"],
    answer: 2,
    rationale: "His mental status on scene is the baseline. When he's confused at 0700 tomorrow, knowing he was oriented yesterday is what tells the nurse it's new and not \"sundowning.\"" },

  /* 5A: Mr. Hale, STEMI */
  f3b: { area: "PPT", type: "single",
    stem: "No allergies and no bleeding history. Which medication does he get right away?",
    options: ["Aspirin 324 mg, chewed", "Nitroglycerin before any other step", "Morphine before anything else", "IV metoprolol for his heart rate"],
    answer: 0,
    rationale: "Chewed aspirin is the first drug for a suspected STEMI unless he's allergic or bleeding. Nitro waits for the right-sided ECG, morphine isn't first-line, and a beta blocker is wrong with a heart rate of 52 and a soft BP." },
  f3c: { area: "PHYS", type: "single",
    stem: "V4R shows right ventricle involvement, and his BP is now 88/56 with clear lungs. What do you do?",
    options: ["Nitroglycerin to relieve his chest pain now", "Fluid bolus per protocol, then recheck lungs", "Sit him bolt upright to help his breathing", "Furosemide IV to take pressure off the heart"],
    answer: 1,
    rationale: "A right ventricular infarct depends on preload, so low BP with clear lungs calls for fluid, given per protocol while you watch the lungs. Nitro and furosemide both drop preload and can crash his pressure.",
    lens: { medic: "Fluid for an RV infarct is in your protocols.", nurse: "On the floor, the same physiology explains why standing him up to void drops his pressure." } },
  f3d: { area: "MOC", type: "single",
    stem: "Your 12-lead shows an inferior STEMI. Where do you take him?",
    options: ["The closest ED, even though it has no cath lab", "His regular doctor's office down the street", "Whichever ED has the shortest wait time", "A PCI center, with a STEMI alert sent ahead"],
    answer: 3,
    rationale: "A STEMI needs the artery opened fast, so go to a PCI-capable center when your system's transport time allows, and send the alert ahead so the cath team is ready. That's how you meet the door-to-balloon goal." },

  /* 5B: Mr. Delgado, heart failure */
  f4b: { area: "BCC", type: "single",
    stem: "He's sitting on the edge of the bed, gasping. How do you position him?",
    options: ["Flat on the stretcher so he can rest", "Upright, with his legs hanging down", "On his left side", "With his legs raised to help his BP"],
    answer: 1,
    rationale: "Sitting up with the legs down lets the lungs expand and pools blood in the legs, which lowers the load on the failing heart. Lying flat or raising the legs pushes more fluid back to the heart and lungs." },
  f4c: { area: "PPT", type: "single",
    stem: "Which finding would make you hold the nitroglycerin?",
    options: ["A blood pressure of 188/104 on scene", "Crackles halfway up both lung fields", "An SpO2 of 84 percent on room air", "He took tadalafil this morning"],
    answer: 3,
    rationale: "Nitrates with erectile dysfunction drugs can cause severe hypotension; hold nitro if he took tadalafil within 48 hours or sildenafil within 24. A high BP, crackles, and low SpO2 are reasons nitro helps here, not reasons to hold it." },

const KEY = "ftf-proto-v1";
const blank = () => ({
  profile: null,
  view: "home",
  roughWeek: false,
  module: { phase: "intro", idx: 0, startedAt: null },
  answers: {},      // first attempt per item: {choice, conf, correct, at, ms}
  log: [],          // {id, at, kind, missType, retests:[iso], done:[iso]}
  stageTimes: {},   // phaseKey -> ms
  teach: { text: "", checks: [] },
  recall: {},       // id -> {text, check}
  active: "stemi",  // which unit S.module/teach/feedback/recall belong to
  unitState: {},    // saved state of each unit
  feedback: { clarity: 0 },
  friction: []
});
let S = load();
function load() {
  try { const raw = localStorage.getItem(KEY); if (raw) return Object.assign(blank(), JSON.parse(raw)); } catch (e) {}
  return blank();
}
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }

/* ---------- Units ---------- */
const freshUnit = () => ({ module: { phase: "intro", idx: 0, startedAt: null }, teach: { text: "", checks: [] }, feedback: { clarity: 0 }, recall: {} });
const U = () => UNITS[S.active] || UNITS.stemi;
function linkActive() { S.unitState[S.active] = { module: S.module, teach: S.teach, feedback: S.feedback, recall: S.recall }; }
function unitOf(key) { return key === S.active ? { module: S.module, teach: S.teach, feedback: S.feedback, recall: S.recall } : (S.unitState[key] || freshUnit()); }
function switchUnit(key) {
  if (key === S.active) return;
  linkActive();
  const st = S.unitState[key] || freshUnit();
  S.module = st.module; S.teach = st.teach; S.feedback = st.feedback; S.recall = st.recall;
  S.active = key;
  linkActive();
}
function unitItems(key) { const u = UNITS[key]; return [...(u.scene ? u.scene.items : []), ...u.baseline, ...u.stages.map(x => x.id), ...u.standalone, ...u.teachQs]; }
function resetUnit(key) {
  const ids = new Set(unitItems(key));
  ids.forEach(id => { delete S.answers[id]; });
  S.log = S.log.filter(e => !ids.has(e.id));
  switchUnit(key);
  const f = freshUnit();
  S.module = f.module; S.teach = f.teach; S.feedback = f.feedback; S.recall = f.recall;
  linkActive();
}
linkActive();

/* ---------- Helpers ---------- */
const $ = (sel, root = document) => root.querySelector(sel);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const letters = "ABCDEFGH";
const isoDay = d => d.toISOString().slice(0, 10);
const addDays = (n, from = new Date()) => { const d = new Date(from); d.setDate(d.getDate() + n); return isoDay(d); };
const fmtDay = iso => { const [y, m, d] = iso.split("-").map(Number); return ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"][m - 1] + " " + d; };
const today = () => isoDay(new Date());
function toast(msg) { const t = $("#toast"); t.textContent = msg; t.hidden = false; clearTimeout(toast.h); toast.h = setTimeout(() => { t.hidden = true; }, 2200); }
function isCorrect(item, choice) {
  if (item.type === "multi") { const a = [...item.answer].sort().join(); const c = [...(choice || [])].sort().join(); return a === c; }
  return choice === item.answer;
}
function answerText(item) {
  return item.type === "multi" ? item.answer.map(i => letters[i]).join(", ") : letters[item.answer];
}
function dueRetests() {
  const t = today();
  return S.log.filter(e => !e.closed && e.retests.some(d => d <= t && !e.done.includes(d)));
}
function recordFirst(id, choice, conf, ms) {
  if (S.answers[id]) return S.answers[id];
  const item = ITEMS[id];
  const correct = isCorrect(item, choice);
  S.answers[id] = { choice, conf, correct, at: new Date().toISOString(), ms };
  if (!correct || conf === "G") {
    const kind = !correct ? (conf === "S" ? "confident-miss" : "miss") : "lucky";
    const days = kind === "lucky" ? [3, 7] : [1, 3, 7, 14];
    S.log.push({ id, at: today(), kind, missType: "", retests: days.map(n => addDays(n)), done: [], closed: false });
  }
  return S.answers[id];
}

/* ---------- Question widget ---------- */
// mode: "graded-later" (baseline), "instant" (case/standalone), "retest"
function questionCard(id, { mode, onDone, label }) {
  const item = ITEMS[id];
  const card = document.createElement("section");
  card.className = "card";
  let choice = item.type === "multi" ? [] : null;
  let conf = null;
  const t0 = performance.now();
  const multi = item.type === "multi";
  card.innerHTML = `
    ${label ? `<div class="eyebrow">${esc(label)}</div>` : ""}
    ${exhibitsHTML(item.exhibits)}
    <p class="stem">${esc(item.stem)}</p>
    ${multi ? `<p class="hint">Select all that apply.</p>` : ""}
    <div class="opts" role="${multi ? "group" : "radiogroup"}">
      ${item.options.map((o, i) => `<button type="button" class="opt ${multi ? "multi" : ""}" data-i="${i}" aria-pressed="false"><span class="key">${letters[i]}</span><span>${esc(o)}</span></button>`).join("")}
    </div>
    <div class="row">
      <span class="hint">How sure are you?</span>
      <div class="seg" role="group" aria-label="Confidence">
        <button type="button" data-c="S" aria-pressed="false">Sure</button>
        <button type="button" data-c="G" aria-pressed="false">Guessing</button>
      </div>
    </div>
    <div class="row"><button type="button" class="btn primary" data-submit disabled>Submit answer</button></div>
    <div data-fb></div>`;
  const submit = $("[data-submit]", card);
  const ready = () => { submit.disabled = !(conf && (multi ? choice.length : choice !== null)); };
  card.querySelectorAll(".opt").forEach(b => b.addEventListener("click", () => {
    const i = Number(b.dataset.i);
    if (multi) {
      choice = choice.includes(i) ? choice.filter(x => x !== i) : [...choice, i];
      b.setAttribute("aria-pressed", String(choice.includes(i)));
    } else {
      choice = i;
      card.querySelectorAll(".opt").forEach(x => x.setAttribute("aria-pressed", String(Number(x.dataset.i) === i)));
    }
    ready();
  }));
  card.querySelectorAll(".seg button").forEach(b => b.addEventListener("click", () => {
    conf = b.dataset.c;
    card.querySelectorAll(".seg button").forEach(x => x.setAttribute("aria-pressed", String(x === b)));
    ready();
  }));
  submit.addEventListener("click", () => {
    const ms = Math.round(performance.now() - t0);
    const correct = isCorrect(item, choice);
    if (mode !== "retest") recordFirst(id, choice, conf, ms);
    save();
    card.querySelectorAll(".opt, .seg button").forEach(x => { x.disabled = true; });
    submit.hidden = true;
    if (mode === "graded-later") { onDone && onDone(); return; }
    const ans = item.type === "multi" ? item.answer : [item.answer];
    card.querySelectorAll(".opt").forEach(x => {
      const i = Number(x.dataset.i);
      const picked = multi ? choice.includes(i) : choice === i;
      if (ans.includes(i)) x.classList.add("is-right");
      else if (picked) x.classList.add("is-wrong");
    });
    $("[data-fb]", card).replaceWith(feedbackBlock(item, correct, () => onDone && onDone(correct)));
  });
  return card;
}
function sourceLine(item) {
  const s = item.src && SOURCES[item.src];
  return s ? `<p class="src">Source: <a href="${s.url}" target="_blank" rel="noopener">${esc(s.label)}</a></p>` : `<p class="src">Source: pending educator review</p>`;
}
function feedbackBlock(item, correct, onNext, nextLabel = "Continue") {
  const wrap = document.createElement("div");
  wrap.className = "stack";
  wrap.innerHTML = `
    <div class="feedback ${correct ? "right" : "wrong"}">
      <div class="verdict">${correct ? "Correct" : "Not quite. Answer: " + answerText(item)}</div>
      <p>${esc(item.rationale)}</p>

    ${item.lens ? `<div class="lens"><div class="m"><span class="tag">Medic lens</span><span>${esc(item.lens.medic)}</span></div><div class="n"><span class="tag">Nurse lens</span><span>${esc(item.lens.nurse)}</span></div></div>` : ""}
    ${sourceLine(item)}

/* Path ordering: program order if in a program, weakest area first otherwise */
function orderedModules() {
  const p = S.profile || {};
  const conf = p.conf || {};
  const score = m => Math.min(...m.a.map(a => conf[a] ?? 3));
  const rest = MODULES.slice(4);
  const sorted = p.status === "self" ? [...rest].sort((x, y) => score(x) - score(y) || parseFloat(x.n) - parseFloat(y.n)) : rest;
  return { part1: MODULES.slice(0, 4), rest: sorted };
}

function setupSummary(p) {
  if (p.skipped) return "Setup skipped. Your path uses default settings until you finish setup.";
  const where = { program: "In a bridge program", starting: "Starting a program soon", self: "Studying on your own" }[p.status] || "";
  const conf = p.conf || {};
  const low = Object.keys(AREAS).filter(k => conf[k] <= 2).map(k => AREAS[k]);
  const bits = [where];
  if (p.course) bits.push("current course: " + p.course);
  if (p.shift) bits.push(p.shift);
  if (p.hrs) bits.push(p.hrs + " study hrs a week (" + (p.hrs2 || 0) + " on a rough week)");
  if (low.length) bits.push("lowest confidence: " + low.join(", "));
  return bits.join(" · ") + ".";
}

function phaseLabel(m = S.module, u = U()) {
  if (m.phase === "recall") return "Recall warm-up";

  if (m.phase === "baseline") return "Topic check " + (m.idx + 1) + " of " + u.baseline.length;
  if (m.phase === "baselineResults") return "Topic check done";
  if (m.phase === "case") return "Case stage " + (m.idx + 1) + " of " + u.stages.length;
  if (m.phase === "standalone") return "Practice " + (m.idx + 1) + " of " + u.standalone.length;
  if (m.phase === "teach") return "Discharge teaching " + (m.idx + 1) + " of " + u.teachQs.length;
  if (m.phase === "feedback") return "Your feedback";
  return "";
}

function flowStandalone(app) {
  const i = S.module.idx;
  header(app, U().label + " · Practice", U().practiceTitle, U().standalone.length, i);
  app.appendChild(questionCard(U().standalone[i], { mode: "instant", label: "Practice " + (i + 1) + " of " + U().standalone.length, onDone: () => {
    stamp("practice-" + (i + 1));
    if (i + 1 < U().standalone.length) advance("standalone", i + 1); else advance("teach", 0);
  } }));
}
function flowTeach(app) {
  const i = S.module.idx, ids = U().teachQs;
  header(app, U().label + " · Teaching", U().teachTitle, ids.length, i);
  app.appendChild(questionCard(ids[i], { mode: "instant", label: "Teaching " + (i + 1) + " of " + ids.length, onDone: () => {
    stamp("teaching-" + (i + 1));
    if (i + 1 < ids.length) advance("teach", i + 1); else advance("feedback", 0);
  } }));
}
const FEEDBACK_QS = [
  { key: "wouldUse", q: "Would you use this during a real course week?", opts: ["Yes, most weeks", "Yes, now and then", "Probably not", "No"] },
  { key: "length", q: "How did the length feel?", opts: ["Too short", "About right", "Too long"] },
  { key: "confusing", q: "What got in the way? Select all that apply.", multi: true, opts: ["Not sure what to do next", "Questions too long to read", "Hard to use on my phone", "Too easy for me", "Too hard for me", "Feedback didn't explain enough", "Medic vs. nurse notes didn't help", "Nothing got in the way"] },
  { key: "helped", q: "What helped most? Select all that apply.", multi: true, opts: ["One patient followed through the case", "Medic lens vs. nurse lens notes", "Rationales after each answer", "The patient chart so far", "Sure / Guessing and the error log", "The discharge teaching questions"] }
];
function feedbackText(f) {
  return FEEDBACK_QS.map(fq => { const v = f[fq.key]; const t = Array.isArray(v) ? v.join("; ") : (v || ""); return fq.key + ": " + (t || "-"); }).join("\n  ");
}
function flowFeedback(app) {
  header(app, U().label + " · Done", "Module complete. One last thing.");
  const card = document.createElement("section");
  card.className = "card";
  const f = S.feedback;
  card.innerHTML = `
    <p class="lead">This is a prototype. Your answers here decide what gets built next. Four quick taps.</p>
    <div class="stack"><p class="stem">How clear was the feedback after each question? (1 = not clear, 5 = very clear)</p>
      <div class="seg" role="group" aria-label="Clarity">${[1, 2, 3, 4, 5].map(n => `<button type="button" data-n="${n}" aria-pressed="${f.clarity === n}">${n}</button>`).join("")}</div></div>
    ${FEEDBACK_QS.map(fq => { const v = f[fq.key]; const picked = o => fq.multi ? Array.isArray(v) && v.includes(o) : v === o; return `
      <div class="stack" data-fq="${fq.key}"><p class="stem">${esc(fq.q)}</p>
        <div class="opts">${fq.opts.map((o, i) => `<button type="button" class="opt ${fq.multi ? "multi" : ""}" data-o="${i}" aria-pressed="${picked(o)}"><span class="key">${letters[i]}</span><span>${esc(o)}</span></button>`).join("")}</div></div>`; }).join("")}
    <div class="row"><button class="btn primary" type="button" id="fb-done">Finish</button></div>`;
  app.appendChild(card);
  card.querySelectorAll("[data-n]").forEach(b => b.addEventListener("click", () => {
    f.clarity = Number(b.dataset.n);
    card.querySelectorAll("[data-n]").forEach(x => x.setAttribute("aria-pressed", String(x === b)));
    save();
  }));
  card.querySelectorAll("[data-fq]").forEach(box => {
    const fq = FEEDBACK_QS.find(x => x.key === box.dataset.fq);
    box.querySelectorAll("[data-o]").forEach(b => b.addEventListener("click", () => {
      const o = fq.opts[Number(b.dataset.o)];
      if (fq.multi) {
        const cur = Array.isArray(f[fq.key]) ? f[fq.key] : [];
        f[fq.key] = cur.includes(o) ? cur.filter(x => x !== o) : [...cur, o];
        b.setAttribute("aria-pressed", String(f[fq.key].includes(o)));
      } else {
        f[fq.key] = o;
        box.querySelectorAll("[data-o]").forEach(x => x.setAttribute("aria-pressed", String(x === b)));
      }
      save();
    }));
  });
  $("#fb-done").addEventListener("click", () => { S.module.phase = "done"; S.module.finishedAt = Date.now(); S.view = "tester"; save(); render(); toast("Module complete"); });
}

/* Error log */
const MISS_TYPES = [["", "Why did you miss it?"], ["knowledge", "Didn't know it"], ["cue", "Missed a cue"], ["reasoning", "Reasoning error"]];
function viewLog(app) {
  const t = today();
  app.innerHTML = `
    <div class="stack"><div class="eyebrow">Spaced retests</div><h1>Error log</h1>
    <p class="lead">Every miss and every lucky guess lands here and comes back on a schedule. An entry closes when you get it right on a later day.</p></div>`;
  if (!S.log.length) {
    const c = document.createElement("section");
    c.className = "card";
    c.innerHTML = `<p class="lead">Empty for now. Start the cardiac module and anything you miss or guess shows up here.</p>`;
    app.appendChild(c);
    return;
  }
  const card = document.createElement("section");
  card.className = "card";
  card.innerHTML = `<div class="table-wrap"><table>
    <thead><tr><th>Question</th><th>Type</th><th>Why missed</th><th>Retests</th><th></th></tr></thead>
    <tbody>${S.log.map((e, n) => {
      const it = ITEMS[e.id];
      const kind = e.closed ? `<span class="pill good">Closed</span>` : e.kind === "confident-miss" ? `<span class="pill bad">Sure, but wrong</span>` : e.kind === "miss" ? `<span class="pill bad">Missed</span>` : `<span class="pill warn">Lucky guess</span>`;
      const dates = e.retests.map(d => `<span class="${e.done.includes(d) ? "" : d <= t ? "pill bad" : ""}">${fmtDay(d)}</span>`).join(" · ");
      const isDue = !e.closed && e.retests.some(d => d <= t && !e.done.includes(d));
      return `<tr><td style="min-width:200px">${esc(it.stem.length > 90 ? it.stem.slice(0, 90) + "…" : it.stem)}</td><td>${kind}</td>
        <td><select data-mt="${n}" aria-label="Why missed">${MISS_TYPES.map(([v, l]) => `<option value="${v}" ${e.missType === v ? "selected" : ""}>${l}</option>`).join("")}</select></td>
        <td class="mono">${dates}</td><td><button class="btn ${isDue ? "primary" : ""}" type="button" data-rt="${n}">${isDue ? "Retest" : "Practice"}</button></td></tr>`; }).join("")}</tbody></table></div>`;
  app.appendChild(card);
  card.querySelectorAll("[data-mt]").forEach(s => s.addEventListener("change", () => { S.log[Number(s.dataset.mt)].missType = s.value; save(); }));
  card.querySelectorAll("[data-rt]").forEach(b => b.addEventListener("click", () => retest(Number(b.dataset.rt))));
}
function retest(n) {
  const e = S.log[n];
  const app = $("#app");
  app.innerHTML = "";
  header(app, "Retest", "From your error log");
  app.appendChild(questionCard(e.id, { mode: "retest", label: "Retest", onDone: (correct) => {
    const t = today();
    const dueDay = e.retests.find(d => d <= t && !e.done.includes(d));
    if (dueDay) e.done.push(dueDay);
    if (correct && t > e.at) e.closed = true;
    save();
    toast(correct ? (e.closed ? "Closed. Nice work." : "Correct. It comes back on the next date.") : "Logged. It comes back on the next date.");
    go("log");
  } }));
}

/* Progress */
function viewProgress(app) {
  const by = {};
  Object.keys(AREAS).forEach(k => { by[k] = { n: 0, c: 0 }; });
  Object.entries(S.answers).forEach(([id, a]) => { const ar = ITEMS[id].area; by[ar].n++; if (a.correct) by[ar].c++; });
  const conf = S.profile.conf || {};
  app.innerHTML = `
    <div class="stack"><div class="eyebrow">NCLEX-RN 2026 test plan</div><h1>Progress</h1>
    <p class="lead">Coverage and first-try accuracy by test-plan area. This is a study record, not a prediction of your score.</p></div>
    <section class="card"><div class="bars">${Object.entries(AREAS).map(([k, l]) => {
      const { n, c } = by[k];
      const pct = n ? Math.round(c / n * 100) : 0;
      return `<div class="bar"><span>${esc(l)}<span class="hint"> · you rated ${conf[k] ?? "-"}/5</span></span><span class="num">${n ? c + "/" + n : "none yet"}</span><div class="track"><div class="fill" style="width:${pct}%"></div></div></div>`; }).join("")}</div></section>
    <p class="hint">Readiness is a steady trend over weeks of mixed questions, not one good practice test.</p>`;
}

/* Tester panel: what Jesse collects in usability sessions */
function resultsText() {
  const p = S.profile || {};
  const lines = [];
  lines.push("FIELD TO FLOOR PROTOTYPE RESULTS");
  lines.push("Tester: " + (p.name || "(no name)") + " | status: " + (p.status || "") + " | medic years: " + (p.years || "") + " | schedule: " + (p.shift || ""));
  lines.push("Confidence: " + Object.keys(AREAS).map(k => k + "=" + ((p.conf || {})[k] ?? "-")).join(" "));
  lines.push("");
  lines.push("ANSWERS (first try): item | choice | sure/guess | correct | seconds");
  Object.entries(S.answers).forEach(([id, a]) => {
    const it = ITEMS[id];
    const ch = it.type === "multi" ? (a.choice || []).map(x => letters[x]).join("") : letters[a.choice];
    lines.push(id + " | " + ch + " | " + (a.conf === "S" ? "sure" : "guess") + " | " + (a.correct ? "Y" : "N") + " | " + Math.round(a.ms / 1000));
  });
  lines.push("");
  UNIT_ORDER.forEach(k => {
    const st = unitOf(k), u = UNITS[k];
    lines.push("UNIT " + u.title + ": " + (st.module.phase === "done" ? "complete" : st.module.phase));
    lines.push("  clarity (1-5): " + (st.feedback.clarity || "-"));
    lines.push("  " + feedbackText(st.feedback));
  });
  lines.push("");
  lines.push("TIME PER STAGE (seconds)");
  Object.entries(S.stageTimes).forEach(([k, v]) => lines.push(k + ": " + Math.round(v / 1000)));
  lines.push("");
  lines.push("ERROR LOG MISS TYPES: " + S.log.map(e => e.id + "=" + (e.missType || "unset")).join(", "));
  if (S.friction.length) { lines.push(""); lines.push("FRICTION NOTES"); S.friction.forEach(f => lines.push("- " + f)); }
  return lines.join("\n");
}
let downloadsP = null;
function getDownloads() {
  if (!downloadsP) downloadsP = (window.claude && window.claude.use ? window.claude.use("downloads") : Promise.resolve(null)).catch(() => null);
  return downloadsP;
}
function viewTester(app) {
  app.innerHTML = `
    <div class="stack"><div class="eyebrow">For usability sessions</div><h1>Tester panel</h1>
    <p class="lead">Everything this tester did, ready to copy and send to Jesse. It stays on this device only.</p></div>
    <section class="card tester">
      <label for="fr">Add a friction note (something confusing, slow, or broken)<input id="fr" placeholder="e.g. Didn't know I had to pick Sure or Guessing"></label>
      <div class="row"><button class="btn" type="button" id="fr-add">Add note</button></div>
      <label for="out">Results<textarea id="out" class="copy-out" readonly>${esc(resultsText())}</textarea></label>
      <div class="row"><button class="btn primary" type="button" id="copy">Copy results</button><button class="btn" type="button" id="save-file" hidden>Save results file</button><button class="btn quiet" type="button" id="reset">Reset for next tester</button></div>
      <div id="reset-confirm" hidden class="row"><span>Erase this tester's data?</span><button class="btn" type="button" id="reset-yes">Erase</button><button class="btn quiet" type="button" id="reset-no">Cancel</button></div>
    </section>`;
  $("#fr-add").addEventListener("click", () => { const v = $("#fr").value.trim(); if (!v) return; S.friction.push(v); save(); render(); toast("Note added"); });
  $("#copy").addEventListener("click", () => {
    const text = resultsText();
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(() => toast("Copied"), () => { $("#out").select(); toast("Press Copy on your keyboard"); });
    } else { $("#out").select(); toast("Press Copy on your keyboard"); }
  });
  const saveBtn = $("#save-file");
  getDownloads().then(dl => {
    if (!dl || !saveBtn.isConnected) return;
    saveBtn.hidden = false;
    saveBtn.addEventListener("click", () => {
      const p = S.profile || {};
      const name = (p.name || "tester").replace(/[^A-Za-z0-9-]/g, "") || "tester";
      const data = JSON.stringify({ summary: resultsText(), profile: p, answers: S.answers, units: Object.fromEntries(UNIT_ORDER.map(k => [k, unitOf(k)])), stageTimes: S.stageTimes, log: S.log, friction: S.friction, exportedAt: new Date().toISOString() }, null, 2);
      dl.save({ filename: "field-to-floor-" + name + "-" + today() + ".json", data }).then(() => toast("Saved"), err => {
        if (err && err.code === "declined") return;
        toast("Couldn't save here. Use Copy results instead.");
      });
    });
  });
  $("#reset").addEventListener("click", () => { $("#reset-confirm").hidden = false; });
  $("#reset-no").addEventListener("click", () => { $("#reset-confirm").hidden = true; });
  $("#reset-yes").addEventListener("click", () => { S = blank(); linkActive(); save(); render(); toast("Ready for the next tester"); });
}

render();
})();
</script>

if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
}
