  hs18: { area: "MOC", type: "single",
    stem: "A 70-year-old client with advanced heart failure declines a palliative care referral, saying, \"I'm not ready to give up.\" What is the nurse's best response?",

  hs19: { area: "PHYS", type: "single",

  hs20: { area: "PSY", type: "single",

SOURCES.cdcSepsis = { label: "CDC: About sepsis", url: "https://www.cdc.gov/sepsis/about/index.html" };

Object.assign(ITEMS, {
  k0: { area: "PHYS", type: "single",
    stem: "He has COPD and uses home inhalers. You start oxygen. What SpO2 range do you titrate to?",
    options: ["94 to 98 percent", "88 to 92 percent", "100 percent on a nonrebreather", "80 to 85 percent"],
    answer: 1,
    rationale: "In COPD with a history of retaining CO2, a target of 88 to 92 percent gives enough oxygen without blunting the drive to breathe. 94 to 98 percent is the usual target for other adults, and 80 to 85 percent is too low.",
    lens: { medic: "Familiar ground. You titrate oxygen on COPD calls every week.", nurse: "Same target on the floor. It will be his oxygen prescription for the whole stay." } },
  k1: { area: "PHYS", type: "multi",
    stem: "Which findings show a change in Mr. Reyes's condition overnight? Select all that apply.",
    options: ["Heart rate up from 92 to 118", "Yellow sputum, the same as on admission", "Blood pressure down from 128/74 to 96/58", "Pain 2/10, the same as yesterday", "New confusion about where he is", "Urine output of 120 mL over 8 hours"],
    answer: [0, 2, 4, 5],
    rationale: "Rising heart rate, falling blood pressure, new confusion, and low urine output (15 mL an hour) are new changes. The sputum and pain haven't changed. \"Sundowning\" is a label, not an assessment: new confusion in an infected client is a cue to work up.",
    lens: { medic: "You'd call him sick from the doorway.", nurse: "On the floor the cue is the trend across the night. Don't let someone else's label anchor you." } },
  k2: { area: "PHYS", type: "single",
    stem: "Which explanation best connects his findings?",
    options: ["A COPD flare brought on by the lung infection", "Sepsis from the pneumonia, with poor perfusion", "Sundowning from being in the hospital", "Dehydration from drinking too little at night"],
    answer: 1,
    rationale: "Fever, fast heart rate, fast breathing, falling blood pressure, new confusion, low urine output, a lactate of 3.4, and a rising creatinine together point to sepsis with organs not getting enough blood. A COPD flare doesn't explain the low pressure or high lactate, and dehydration doesn't explain the fever and white count.",
    src: "cdcSepsis" },
  k3: { area: "RRP", type: "single",
    stem: "What is Mr. Reyes most at risk for over the next few hours?",
    options: ["A fall from his confusion", "Hyperglycemia from the infection", "Septic shock and organ failure", "Aspiration while eating breakfast"],
    answer: 2,
    rationale: "His blood pressure is falling and his lactate is up: sepsis can move to septic shock and organ failure within hours. Fall risk and glucose control matter too, but they don't kill as fast.",
    lens: { medic: "Shock is shock. You'd treat it on the truck.", nurse: "Here you're often the first to see it. Recognizing it early is the intervention." } },
  k4: { area: "PHYS", type: "multi",
    stem: "Which actions does the nurse expect in the first hour? Select all that apply.",
    options: ["A crystalloid fluid bolus, as prescribed", "Holding antibiotics until new cultures result", "A repeat lactate level", "Restricting IV fluids because of his COPD", "Vital signs every 4 hours", "Continuous SpO2 and frequent vital signs"],
    answer: [0, 2, 5],
    rationale: "Sepsis with low blood pressure or high lactate calls for fast IV fluids, a repeat lactate to see if perfusion improves, and close monitoring. Antibiotics shouldn't be delayed. COPD isn't a reason to withhold fluids, though you watch his lungs as they go in, and every 4 hours is far too infrequent." },
  k5: { area: "MOC", type: "single",
    stem: "You call the rapid response team. Which recommendation is the best way to end your SBAR?",
    options: ["\"Just letting you know his vitals are a little off this morning.\"", "\"Can you call his family? He seems more confused than yesterday.\"", "\"Could you order something to help him sleep better tonight?\"", "\"Please see him now. I'm worried about sepsis and he needs fluids.\""],
    answer: 3,
    rationale: "A good recommendation says what you think is happening, what you need, and how fast. The other choices downplay the problem or ask for things that won't help him and could hide the change." },
  k6: { area: "PHYS", type: "multi",
    stem: "Which findings show he is responding to treatment? Select all that apply.",
    options: ["Blood pressure 112/68, up from 96/58", "Urine output 45 mL in the last hour", "Temperature 38.2°C", "Repeat lactate 1.9 mmol/L, down from 3.4", "Oriented to person, place, and time", "He asks when he can go home"],
    answer: [0, 1, 3, 4],
    rationale: "Better blood pressure, urine output, lactate, and mental status all show his organs are getting blood again. A temperature of 38.2 means he's still febrile and doesn't show a response yet, and asking to go home isn't a clinical finding." },
  t2a: { area: "MOC", type: "single",
    stem: "Which outcome for Mr. Reyes's care plan is written correctly?",
    options: ["Client will feel less short of breath over the next few days", "Client will understand how to improve his breathing by discharge", "Client will keep SpO2 at 88% or higher walking 50 feet by day 4", "Nurse will give oxygen as needed to keep the client comfortable"],
    answer: 2,
    rationale: "A good outcome is about the client, measurable, and has a time frame. \"Feel less short of breath\" and \"understand\" can't be measured as written, and the last one is a nursing action, not a client outcome." },
  t2b: { area: "HPM", type: "multi",
    stem: "Before discharge, Mr. Reyes's wife asks what to watch for at home. Which signs should send them back for care right away? Select all that apply.",
    options: ["New confusion or trouble staying awake", "Feeling tired for the first week home", "Breathing that gets faster or harder", "A racing heart or a weak pulse", "A cough that's slowly getting better", "Shivering, fever, or feeling very cold"],
    answer: [0, 2, 3, 5],
    rationale: "Confusion, worsening shortness of breath, a fast heart rate or weak pulse, and fever or shivering are warning signs that sepsis could be coming back. Some tiredness and a slowly improving cough are expected while he recovers.",
    src: "cdcSepsis" }
});

Object.assign(ITEMS, {
  m2b1: { area: "MOC", type: "single", cj: "Prioritize hypotheses",
    stem: "The nurse on a medical unit receives report on four clients at 0700. Which client does the nurse see first?",
    options: ["A 58-year-old with COPD whose SpO2 is 89% on 2 L, the same as yesterday", "A 74-year-old admitted for cellulitis who now has slurred speech", "A 45-year-old with chronic back pain rated 7 out of 10, her usual level", "A 66-year-old with diabetes whose fasting glucose is 188 mg/dL today"],
    answer: 1,
    rationale: "Slurred speech that was not there before is an acute neurological change and may be a stroke, where minutes matter. The COPD client's SpO2 is stable at an acceptable level for COPD, and the chronic pain is at the client's baseline. A glucose of 188 mg/dL needs follow-up but is not an immediate threat." },
  m2b2: { area: "MOC", type: "multi", cj: "Take action",
    stem: "At 0300 the nurse calls the provider about a 79-year-old client who is newly confused and pulling at her IV. Using SBAR, which information belongs in the Background section? Select all that apply.",
    options: ["She was admitted 2 days ago with pneumonia.", "At home she lives alone and is fully oriented.", "Her respiratory rate is 28 and her SpO2 is 87%.", "She is allergic to penicillin and takes warfarin.", "I am concerned she is becoming hypoxic again.", "Please come and evaluate her at the bedside now."],
    answer: [0, 1, 3],
    rationale: "Background gives the context the provider needs: admitting diagnosis, baseline mental status, allergies, and relevant medicines. Current vital signs describe the situation and the nurse's assessment of it. The nurse's concern is the Assessment, and asking the provider to come is the Recommendation.",
    lens: { medic: "A medic radio report runs age, complaint, vitals, treatment, ETA.", nurse: "The RN separates what is happening now from the history behind it, then states a clear concern and a specific request." } },
  m2b3: { area: "MOC", type: "single", cj: "Prioritize hypotheses",
    stem: "A 70-year-old client is 1 day after abdominal surgery. The nurse is setting priorities in the plan of care. Which nursing problem comes first?",
    options: ["Anxiety related to going home soon", "Risk for infection at the incision site", "Ineffective airway clearance with SpO2 89%", "Acute pain rated 6 out of 10 at rest"],
    answer: 2,
    rationale: "An actual airway problem with low oxygen comes before everything else. Pain is real and needs treatment next. A risk problem and anxiety matter, but they are not threatening his life right now." },
  m2b4: { area: "MOC", type: "single", cj: "Evaluate outcomes",
    stem: "A client 2 days after a bowel resection has this goal: pain will be 3 or less on a 0 to 10 scale within 1 hour of each oral analgesic dose. Every dose has been given on time, and the client rates pain 7 an hour after each one. What does the nurse do next?",
    options: ["Reassess the pain and contact the provider to revise the plan", "Continue the current plan and reevaluate it in another 48 hours", "Change the goal to a pain rating of 7 or less after each dose", "Document that the goal is partly met and keep the current plan"],
    answer: 0,
    rationale: "The goal is not met, so the nurse reassesses to find out why, including whether a complication is causing the pain, and works with the provider to revise the plan. Continuing an ineffective plan leaves the client in pain. Lowering the goal to match the result is not evaluation, and a rating of 7 does not meet the goal at all." },
  m2b5: { area: "SIPC", type: "single", cj: "Take action",
    stem: "A 19-year-old college student is admitted from the emergency department with fever, a severe headache, a stiff neck, and a petechial rash on the legs. Lumbar puncture results are pending. Which action does the nurse take first?",
    options: ["Wait for the lumbar puncture results before isolating the client", "Use standard precautions and ask visitors to wash their hands", "Place the client on droplet precautions in a private room", "Place the client in a negative-pressure room with an N95 respirator"],
    answer: 2,
    rationale: "Fever, stiff neck, and a petechial rash suggest meningococcal meningitis, which spreads by droplets. Precautions start on suspicion, not after results. Standard precautions alone are not enough, and an airborne room with an N95 is used for diseases such as TB or measles." },
  m2b6: { area: "SIPC", type: "single", cj: "Take action",
    stem: "A 34-year-old client with a seizure disorder begins a generalized tonic-clonic seizure while lying in bed. What does the nurse do first?",
    options: ["Hold the arms and legs firmly to keep the client from getting hurt", "Turn the client to the side and move objects away from the bed", "Place a padded tongue blade between the teeth to open the airway", "Leave the room to get the PRN lorazepam from the medication room"],
    answer: 1,
    rationale: "Side-lying lets secretions drain and protects the airway, and clearing the area prevents injury. Restraining the limbs can cause fractures or soft tissue injury. Objects in the mouth can break teeth or block the airway, and the nurse stays with the client and calls for help instead of leaving." },
  m2b7: { area: "SIPC", type: "multi", cj: "Recognize cues",
    stem: "An 84-year-old client in a long-term care facility has had an indwelling urinary catheter for 10 days. Which findings does the nurse recognize as possible signs of a catheter-related urinary tract infection? Select all that apply.",
    options: ["New confusion that started this morning", "Temperature of 38.3°C (100.9°F)", "Urine output of 45 mL per hour", "Clear, pale yellow urine in the bag", "Tenderness above the pubic bone", "Catheter secured to the upper thigh"],
    answer: [0, 1, 4],
    rationale: "In older adults, new confusion is often the first sign of infection, and fever and suprapubic tenderness point to a urinary source. An output of 45 mL per hour and clear, pale urine are normal findings. Securing the catheter to the thigh is correct care that lowers infection risk." },
  m2b8: { area: "SIPC", type: "single", cj: "Recognize cues",
    stem: "During a home visit, the nurse sees a 79-year-old client who uses oxygen at 2 L/min by nasal cannula. Which finding is the priority safety concern?",
    options: ["A small throw rug at the entrance to the kitchen", "Oxygen tubing about 50 feet long running between rooms", "A weekly pill organizer filled and kept on the counter", "A scented candle burning on the table beside the chair"],
    answer: 3,
    rationale: "Oxygen makes any open flame a serious fire and burn risk, so the lit candle near the client is the priority. A throw rug and long tubing are fall hazards that the nurse also addresses, but they are less immediately dangerous. A filled pill organizer is a helpful safety practice." },
  m2b9: { area: "PHYS", type: "single", cj: "Prioritize hypotheses",
    stem: "A 67-year-old client is 3 days after a hip replacement. Temperature is 38.6°C (101.5°F), HR 114, RR 24, and BP 94/58, down from 128/76 yesterday. The client is newly confused. Which problem does the nurse address first?",
    options: ["Early sepsis with poor tissue perfusion", "Acute pain related to the surgical incision", "Anxiety about the coming discharge home", "Constipation from opioids and bed rest"],
    answer: 0,
    rationale: "Fever, tachycardia, fast breathing, falling blood pressure, and new confusion together point to sepsis with poor perfusion, which is life-threatening and time-sensitive. Pain or anxiety does not explain the fever and hypotension. Constipation is a real problem but not the priority.",
    lens: { medic: "A medic sees shock and starts fluids on the way to the hospital.", nurse: "The RN calls a rapid response or sepsis alert per protocol and gets blood cultures drawn before the first antibiotic dose." } },
  m2b10: { area: "PHYS", type: "single", cj: "Take action",
    stem: "At 1015, a 72-year-old client admitted for a COPD flare is found with new left arm drift and slurred speech. The client was talking normally at 0930. What does the nurse do first?",
    options: ["Give the scheduled morning aspirin dose by mouth", "Recheck the neurological signs again in 1 hour", "Activate the stroke alert or rapid response team", "Give sips of water to test the client's swallowing"],
    answer: 2,
    rationale: "Sudden arm drift and slurred speech are stroke signs, and the last known well time of 0930 means the client may qualify for clot-busting treatment, so the team is called at once. Giving aspirin before imaging rules out bleeding could be harmful. Waiting an hour loses treatment time, and the client stays NPO until a formal swallow screen.",
    lens: { medic: "A medic notes last known well and routes the client to a stroke center.", nurse: "Inside the hospital, the RN activates the stroke alert, records last known well, and keeps the client NPO." } },
  m2b11: { area: "PHYS", type: "single", cj: "Analyze cues",
    stem: "A 60-year-old client is 1 day after abdominal surgery. Over the last hour the client has become restless and keeps saying, \"Something is wrong.\" HR is 108 and RR is 26. A PRN prescription for lorazepam for anxiety is on file. What does the nurse do first?",
    options: ["Check the SpO2 and listen to the client's lung sounds", "Give the PRN lorazepam to help the client relax", "Dim the lights and ask the family to sit with the client", "Reorient the client and recheck vital signs in 30 minutes"],
    answer: 0,
    rationale: "Restlessness, a sense of doom, and a rising heart rate and respiratory rate are early signs of hypoxia, so the nurse checks oxygenation first. A sedative could hide the cause and depress breathing. Comfort measures and waiting delay finding a possible pulmonary embolism or atelectasis.",
    lens: { medic: "A medic reads restlessness as hypoxia and puts on oxygen right away.", nurse: "The RN thinks the same way and does not let a PRN sedative prescription cover up the cause." } },
  m2b12: { area: "PHYS", type: "multi", cj: "Recognize cues",
    stem: "The nurse reviews the vital sign trend for a 55-year-old client admitted 12 hours ago with a kidney infection. Which changes suggest early deterioration? Select all that apply.",
    options: ["Respiratory rate went from 16 to 24", "Heart rate went from 78 to 82", "Urine output fell from 50 to 20 mL/hr", "Temperature stayed at 37.2°C (99°F)", "Systolic BP fell from 134 to 102", "Pain went from 4 to 3 out of 10"],
    answer: [0, 2, 4],
    rationale: "A rising respiratory rate is often the earliest sign of deterioration, and falling urine output and systolic pressure suggest poor perfusion. Together they point to possible developing sepsis. A heart rate change of 4 beats, a stable temperature, and less pain are not concerning." },
  m2b13: { area: "RRP", type: "single", cj: "Recognize cues",
    stem: "A 6-year-old is 4 hours after a tonsillectomy. Which finding does the nurse report to the provider right away?",
    options: ["A sore throat rated 4 on a faces scale", "Swallowing again and again while asleep", "Refusing to eat solid food at dinner", "Breath with a mild, unpleasant odor"],
    answer: 1,
    rationale: "Frequent swallowing is an early sign of bleeding from the surgical site, because the child is swallowing blood. A sore throat and not wanting solid food are expected after this surgery. Mild breath odor is common during healing and is not an emergency." },
  m2b14: { area: "RRP", type: "single", cj: "Take action",
    stem: "A 48-year-old client with type 1 diabetes has been NPO since midnight for a procedure. At 0800 the client is shaky, sweaty, and says, \"I feel strange.\" HR is 110. A glucose meter is at the bedside. What does the nurse do first?",
    options: ["Give the scheduled dose of morning insulin", "Call the procedure area to move up the time", "Recheck the vital signs again in 15 minutes", "Check the client's capillary blood glucose"],
    answer: 3,
    rationale: "Shakiness, sweating, and a fast heart rate in a fasting client on insulin suggest hypoglycemia, and a quick fingerstick confirms it so treatment can start. Giving insulin now could make a low glucose worse. Moving the procedure or waiting 15 minutes does not address the likely cause." },
  m2b15: { area: "RRP", type: "multi", cj: "Recognize cues",
    stem: "A 24-year-old client had a closed reduction of a forearm fracture and a cast applied 6 hours ago. Which findings does the nurse report to the provider right away? Select all that apply.",
    options: ["Fingers that are warm and pink", "Pain not relieved by the prescribed opioid", "Capillary refill of 2 seconds in the fingers", "Severe pain when the fingers are stretched", "Mild itching under the edge of the cast", "New numbness and tingling in the fingers"],
    answer: [1, 3, 5],
    rationale: "Pain out of proportion to the injury, pain with passive stretch, and new numbness are early signs of compartment syndrome, which can cause permanent damage within hours. Warm, pink fingers and a 2-second capillary refill show good circulation. Mild itching under a cast is common." },
  m2b16: { area: "PSY", type: "single", cj: "Recognize cues",
    stem: "A 38-year-old client comes to a mental health clinic for a depression follow-up visit. Which finding does the nurse record as subjective data?",
    options: ["Avoids eye contact and speaks in a slow, quiet voice", "Has lost 4 kg (8.8 lb) since the visit 1 month ago", "Has a flat affect and sits slumped in the chair", "Reports sleeping about 3 hours a night for 2 weeks"],
    answer: 3,
    rationale: "Subjective data are what the client tells the nurse, such as how much they sleep. Eye contact, speech, weight, affect, and posture are things the nurse can observe or measure, so they are objective data." },
  m2b17: { area: "PSY", type: "single", cj: "Analyze cues",
    stem: "A 52-year-old client on an inpatient unit has had severe depression for weeks. Today the client seems calm and cheerful and has given a favorite watch to a roommate. What does the nurse do first?",
    options: ["Praise the client for the better mood seen today", "Ask the client directly about thoughts of suicide", "Tell the roommate to give the watch back to the client", "Note the change in the chart as a sign of recovery"],
    answer: 1,
    rationale: "A sudden calm after deep depression, along with giving away valued items, can mean the client has made a suicide plan. Asking directly is safe and does not plant the idea. Praising the mood or charting it as recovery misses the danger, and returning the watch does not assess the risk." },
  m2b18: { area: "HPM", type: "single", cj: "Analyze cues",
    stem: "The nurse is planning assessments at an outpatient clinic. Which client situation calls for a comprehensive assessment rather than a focused one?",

    rationale: "A ventilator-dependent client may stop getting breaths if the device loses power, so the nurse checks it and is ready to bag the client by hand. Feeding pumps and PCA pumps have batteries, and a short pause in feeding or mattress inflation is not life-threatening." },
  m3b11: { area: "PHYS", type: "single", cj: "Prioritize hypotheses",
    stem: "The nurse on an orthopedic unit receives report on four clients. Which client does the nurse see first?",
    options: ["A client with a hip fracture who rates pain 6 out of 10 and asks for the PRN dose that is due", "A client 2 days after knee replacement whose dressing has a small amount of serous drainage", "A client in a new long-leg cast with pain 9 out of 10 after IV morphine and cool toes", "A client in skeletal traction for a femur fracture who has clear drainage at the pin sites"],
    answer: 2,
    rationale: "Pain out of proportion to the injury that does not respond to opioids, with cool toes, points to compartment syndrome, which can cost the limb within hours. The due PRN dose, small serous drainage, and clear pin site drainage are expected findings." },
  m3b12: { area: "PHYS", type: "single", cj: "Recognize cues",
    stem: "The nurse on a surgical unit receives report. Which client does the nurse see first?",
    options: ["A client 4 hours after a thyroidectomy who is hoarse and has new noisy breathing", "A client 6 hours after an appendectomy who rates incision pain 7 out of 10 when coughing", "A client after a prostate resection with light pink urine running through bladder irrigation", "A client after laparoscopic gallbladder removal who reports pain in the right shoulder"],
    answer: 0,
    rationale: "Hoarseness with new noisy breathing after thyroidectomy suggests airway swelling, a hematoma, or nerve injury and is an airway emergency. Incision pain, light pink irrigation return, and shoulder pain from gas after laparoscopy are expected and can wait." },
  m3b13: { area: "PHYS", type: "multi", cj: "Analyze cues",
    stem: "A UAP on a surgical unit reports these findings during the 1200 vital signs. Which clients does the RN go see right away? Select all that apply.",
    options: ["A client 1 day after colectomy with HR 124, up from 88 at the start of the shift", "A client after lumbar laminectomy with new numbness in both legs and unable to void", "A client after a mastectomy with a temperature of 37.4°C (99.3°F) this afternoon", "A client after a nephrectomy with SpO2 86% on 2 L/min oxygen by nasal cannula", "A client after knee replacement with pain 5 out of 10 an hour after oral oxycodone"],
    answer: [0, 1, 3],
    rationale: "New tachycardia after bowel surgery can mean bleeding, a leak, or sepsis. New bilateral numbness and retention after spine surgery suggests an epidural hematoma or cauda equina compression. SpO2 86% on oxygen is hypoxia. A low-grade temperature and moderate pain after an oral opioid can wait for routine follow-up." },
  m3b14: { area: "RRP", type: "single", cj: "Prioritize hypotheses",
    stem: "The nurse on a renal unit reviews morning lab results. Which result does the nurse act on first?",
    options: ["BUN of 62 mg/dL in a client with stage 4 chronic kidney disease", "Hemoglobin of 9.6 g/dL in a client who receives epoetin for CKD", "Phosphorus of 5.9 mg/dL in a client who takes calcium acetate", "Potassium of 6.5 mEq/L with peaked T waves after a missed dialysis"],
    answer: 3,
    rationale: "A potassium of 6.5 with peaked T waves can lead to a fatal dysrhythmia and needs action now. The high BUN, mild anemia on epoetin, and high phosphorus are expected in chronic kidney disease and are managed over time." },
  m3b15: { area: "RRP", type: "single", cj: "Recognize cues",
    stem: "Four clients have had procedures today. Which client does the nurse see first?",
    options: ["A client 2 hours after a radial cardiac catheterization with a warm hand and a strong pulse", "A client 3 hours after a liver biopsy whose HR rose from 82 to 118 and BP fell to 96/60", "A client 1 hour after a bronchoscopy whose gag reflex has not returned and who is NPO", "A client 2 hours after removal of 4 L by paracentesis with BP 116/72 and HR 84"],
    answer: 1,
    rationale: "The liver is very vascular, and rising HR with falling BP after biopsy suggests internal bleeding. The radial site is well perfused, an absent gag reflex soon after bronchoscopy is expected while the client stays NPO, and the paracentesis client is hemodynamically stable." },
  m3b16: { area: "RRP", type: "multi", cj: "Analyze cues",
    stem: "At 1130, a UAP reports finger-stick glucose results before lunch. Which clients need RN assessment right away? Select all that apply.",
    options: ["A client with type 1 diabetes whose glucose is 62 mg/dL who is sweaty and shaky", "A client receiving parenteral nutrition whose glucose is 182 mg/dL with no symptoms", "A client with type 2 diabetes whose glucose is 48 mg/dL and who is hard to wake up", "A client taking dexamethasone whose glucose is 214 mg/dL before the lunch insulin dose", "A client with type 1 diabetes whose glucose is 410 mg/dL with nausea and deep breathing", "A client with type 2 diabetes whose glucose is 128 mg/dL who is ready to eat lunch"],
    answer: [0, 2, 4],
    rationale: "Symptomatic hypoglycemia and hypoglycemia with a falling level of consciousness need treatment now. A glucose of 410 with nausea and deep, rapid breathing suggests DKA. The other readings are expected for those clients and are handled with scheduled or correction insulin." },
  m3b17: { area: "PPT", type: "multi", cj: "Take action",
    stem: "An RN on a medical unit is starting a unit of packed red blood cells for a client with a hemoglobin of 6.8 g/dL. A UAP and an LPN are also caring for the client. Which tasks does the RN keep? Select all that apply.",
    options: ["Checking the blood unit against the client's ID with a second licensed nurse", "Staying with the client and assessing for a reaction during the first 15 minutes", "Teaching the client which symptoms to report while the blood is running", "Emptying the urinary drainage bag and recording the output on the flow sheet", "Helping the client to the bedside commode before the transfusion is started"],
    answer: [0, 1, 2],
    rationale: "Verifying the unit, assessing for an early reaction, and teaching are RN responsibilities, and the first 15 minutes carry the highest risk of a severe reaction. Measuring output and helping a stable client to the commode are routine tasks the UAP can do." },
  m3b18: { area: "PPT", type: "single", cj: "Prioritize hypotheses",
    stem: "At 0900, the nurse has four medication tasks. Which one does the nurse do first?",
    options: ["Adjust the heparin infusion per protocol for an aPTT of 115 seconds", "Give oral potassium chloride to a client whose potassium is 3.4 mEq/L", "Give scheduled metoprolol to a client whose apical pulse is 74 per minute", "Give insulin glargine to a client whose morning glucose is 156 mg/dL"],
    answer: 0,
    rationale: "An aPTT of 115 seconds is well above the usual therapeutic range and puts the client at risk for bleeding, so the high-alert heparin infusion is adjusted first. Mild hypokalemia, a normal pulse before metoprolol, and a routine basal insulin dose are not urgent." },
  m3b19: { area: "PSY", type: "single", cj: "Prioritize hypotheses",
    stem: "The nurse on a hospital behavioral health unit receives report. Which client does the nurse see first?",
    options: ["A client with major depression who refused breakfast and stayed in bed past 0900", "A client with bipolar disorder who talks fast and interrupts others in group", "A client with anorexia nervosa who asks to use the bathroom after lunch", "A client with schizophrenia who is pacing, clenching fists, and yelling at a peer"],
    answer: 3,
    rationale: "Pacing, clenched fists, and yelling at a peer are signs of escalating aggression, and the nurse steps in early to keep everyone safe. The other clients need follow-up, including bathroom supervision after meals for the client with anorexia, but none poses an immediate threat." },
  m3b20: { area: "BCC", type: "single", cj: "Recognize cues",
    stem: "A UAP on a long-term care unit reports four findings. Which one does the RN follow up on first?",
    options: ["A client on bed rest who has not had a bowel movement in the past 2 days", "A client with a reddened heel that blanches when the nurse presses it", "A client on a tube feeding who coughs and has a wet voice after being laid flat", "A client with dementia who ate about one quarter of the breakfast tray"],
    answer: 2,
    rationale: "Coughing and a wet voice after lying flat during a tube feeding suggest aspiration, which threatens the airway. The RN stops the feeding, raises the head of the bed, and assesses. Two days without a stool, a blanchable heel, and a small breakfast need follow-up but are not urgent." },
  m3s1: { area: "PHYS", type: "single", cj: "Take action",
    stem: "A client admitted yesterday with an upper GI bleed has been stable overnight. At 1000 the UAP reports, \"His BP is 86/52 and his pulse is 124. I rechecked it twice and wrote it in the chart.\" What does the RN do?",
    options: ["Go to the client's room right away to assess him", "Ask the UAP to recheck the BP manually in 15 minutes", "Review the chart to compare with his earlier readings", "Ask the UAP to raise the head of the bed and report back"],
    answer: 0,
    rationale: "Low BP with a rising heart rate in a client with a GI bleed points to rebleeding and hypovolemia, so the RN assesses now and then notifies the provider. Another recheck or a chart review delays care for numbers that were already confirmed. Raising the head of the bed does not improve perfusion and hands the response to an emergency back to the UAP.",
    lens: { medic: "On the truck, you take the vitals and act on them yourself.", nurse: "On the unit, the UAP collects the numbers, but the RN must assess and act on any abnormal report." } },
  m3s2: { area: "PHYS", type: "single", cj: "Take action",
    stem: "Forty minutes into a unit of packed red blood cells, the UAP reports that the client is itching and has raised red welts on the chest. Vital signs are unchanged from baseline, and the client is breathing comfortably. What does the RN do first?",
    options: ["Give the PRN diphenhydramine and keep the transfusion running", "Slow the infusion rate and recheck the skin in 15 minutes", "Stop the transfusion and keep the IV open with normal saline", "Ask the UAP to take the vital signs again in 15 minutes"],
    answer: 2,
    rationale: "Any sign of a transfusion reaction, even mild hives, means the RN stops the transfusion first and keeps IV access with saline. The RN then assesses, notifies the provider and blood bank, and the provider decides on an antihistamine and whether to resume. Continuing or slowing the unit gives the client more of the antigen, and waiting on a recheck delays action." },
  m3s3: { area: "PHYS", type: "single", cj: "Generate solutions",
    stem: "A client with a traumatic brain injury has an ICP of 18 mm Hg that climbs to 24 mm Hg during care. The morning plan includes a bath, a linen change, repositioning, and suctioning. How does the RN plan this care?",
    options: ["Do every part of the care at once so the client can rest after", "Space the activities out with rest periods in between", "Suction on a set hourly schedule to keep the airway clear", "Have two staff do the bath and suctioning at the same time"],
    answer: 1,
    rationale: "Back-to-back stimulation causes stacked rises in ICP, so the RN spaces care and lets ICP return to baseline between activities. This is an exception to the usual habit of clustering care. Suctioning should be brief and done only when needed, and doing two stimulating tasks at once raises ICP further." },
  m3s4: { area: "PHYS", type: "single", cj: "Take action",
    stem: "Two days after a hip replacement, a UAP tells the RN that the client is suddenly short of breath and anxious, with an SpO2 of 88% on room air. What does the RN do?",
    options: ["Go now, raise the head of the bed, and apply oxygen", "Ask the UAP to recheck the SpO2 in 15 minutes", "Have the UAP walk the client to ease the anxiety", "Call the provider after finishing the med pass"],
    answer: 0,
    rationale: "Sudden shortness of breath and low oxygen after hip surgery could be a pulmonary embolism. The RN goes now, positions the client, gives oxygen, and calls for help. Waiting, walking the client, or finishing other work first delays care for a possible emergency.",
    lens: { medic: "You'd be moving before the sentence ended.", nurse: "Same urgency, but the cue reached you secondhand through the UAP. Go see it yourself." } },
  m3s5: { area: "SIPC", type: "single", cj: "Take action",
    stem: "Two nurses are checking a unit of packed red blood cells at the bedside. The client's name and blood type match the blood bank tag, but the medical record number on the wristband differs by one digit from the number on the tag. What does the RN do?",
    options: ["Hang the unit since the name and blood type both match", "Hold the unit and call the blood bank about the mismatch", "Correct the wristband number so that it matches the tag", "Ask the client to state her name and birth date, then hang it"],
    answer: 1,
    rationale: "Every identifier must match exactly before blood is hung, because most ABO reactions come from identification errors. The RN holds the unit and contacts the blood bank to resolve the mismatch. Changing the wristband to fit the tag hides a possible error, and a verbal name check does not fix a labeling discrepancy." },
  m3s6: { area: "SIPC", type: "single", cj: "Generate solutions",
    stem: "A client with a draining wound is on contact precautions for MRSA. The RN needs to give 0900 medications, assess the client, and change the wound dressing. Which plan uses time best and limits spread of the organism?",
    options: ["Enter for the medications, then come back later for the dressing", "Have the UAP bring in each supply as the RN asks for it", "Gather all supplies first, then do the three tasks in one visit", "Change the dressing first, then leave to get the medications"],
    answer: 2,
    rationale: "Gathering everything before entering lets the RN cluster care into one visit, which saves time and cuts down on gowning, entries, and contact with the environment. Extra trips in and out of the room or handing supplies across the doorway add chances to spread MRSA. Leaving partway through also wastes PPE and time." },
  m3s7: { area: "RRP", type: "single", cj: "Take action",
    stem: "A client is scheduled for surgery under general anesthesia at 1100 and has been NPO since midnight. At 0745 the UAP says, \"I gave him a breakfast tray by mistake, and he ate most of it.\" What does the RN do first?",
    options: ["Notify the surgeon and anesthesia provider about the meal", "Remove the tray and keep going with the preop checklist", "Fill out an incident report about the UAP's mistake", "Ask the UAP to watch the client for nausea or vomiting"],
    answer: 0,
    rationale: "A recent meal raises the risk of aspiration under anesthesia, so the surgical team must know now to decide whether to delay the case. Continuing the checklist hides a safety problem. The incident report and a talk with the UAP come after the client is protected." },
  m3s8: { area: "RRP", type: "single", cj: "Take action",
    stem: "A client is 6 hours after open abdominal surgery and has an indwelling urinary catheter. The UAP reports that the bag has collected 40 mL total over the last 2 hours. What does the RN do first?",
    options: ["Ask the UAP to offer the client extra fluids by mouth", "Have the UAP measure the output again in 2 more hours", "Raise the IV fluid rate to bring the urine output up", "Check the catheter tubing for kinks and assess the client"],
    answer: 3,
    rationale: "Output of 20 mL/hr is below the expected 0.5 mL/kg/hr and may mean hypovolemia or a blocked catheter. The RN first rules out a kink or clot, then assesses fluid status and notifies the provider. Oral fluids may not be allowed this soon after abdominal surgery, waiting delays care, and the IV rate needs a prescription to change." },
  m3s9: { area: "RRP", type: "single", cj: "Take action",
    stem: "Two hours after a cardiac catheterization through the right femoral artery, a client tells the UAP that his groin feels warm and wet. The UAP reports this to the RN. What does the RN do first?",
    options: ["Go to the client now and check the site for bleeding", "Tell the UAP to reinforce the dressing with more gauze", "Ask the UAP to take the client's blood pressure and pulse", "Call the provider to report possible bleeding at the site"],
    answer: 0,
    rationale: "A warm, wet groin after femoral access suggests arterial bleeding, so the RN checks the site and holds firm pressure above the puncture if it is bleeding. Calling the provider comes after the RN has assessed and controlled the bleeding. Adding gauze hides ongoing blood loss, and vital signs alone do not stop it." },
  m3s10: { area: "PPT", type: "single", cj: "Generate solutions",
    stem: "A client is on a continuous heparin infusion. Which task can the RN delegate to the UAP?",
    options: ["Adjusting the drip after the aPTT result", "Reporting any bleeding seen during morning care", "Checking the pump settings once each hour", "Teaching the client about bleeding precautions"],
    answer: 1,
    rationale: "A UAP can watch for and report what they see, like bleeding gums or blood in the urine, during routine care. Adjusting a high-alert infusion, checking the pump, and teaching all need the RN." },
  m3s11: { area: "PSY", type: "single", cj: "Take action",
    stem: "A client who attempted suicide yesterday is on 1:1 constant observation. The UAP assigned as the sitter tells the RN, \"She's asleep, so I'm going to run to the restroom. I'll be right back.\" What does the RN tell the UAP?",
    options: ["\"Go ahead, and leave the door open so we can see in.\"", "\"Stay with her until someone comes to relieve you.\"", "\"Check the room for sharp objects first, then go.\"", "\"Ask her roommate to call for help if she wakes up.\""],
    answer: 1,
    rationale: "Constant observation cannot be interrupted, even while the client sleeps, so the sitter stays until relief arrives. Clients at high risk may pretend to sleep and can harm themselves within minutes. An open door, a room check, or a roommate does not replace a trained observer." },
  m3s12: { area: "MOC", type: "single", cj: "Take action",
    stem: "A client is admitted to a med-surg unit with cellulitis of the leg. The LPN tells the RN, \"You're swamped. I'll do his admission assessment and start his care plan.\" How does the RN respond?",
    options: ["\"Thanks. I'll cosign your assessment when you finish.\"", "\"Go ahead, since his vital signs are stable right now.\"", "\"Let me ask the charge nurse if that's okay this time.\"", "\"I'll do his assessment, but you can get his vitals.\""],
    answer: 3,
    rationale: "The initial assessment and the plan of care belong to the RN, and the LPN can contribute by collecting data such as vital signs. Cosigning does not make an LPN assessment an RN assessment. The client's stability does not change scope, and a charge nurse cannot approve work outside scope." },
  m3s13: { area: "MOC", type: "single", cj: "Take action",
    stem: "At the start of night shift, the charge nurse gives an RN seven clients on a step-down unit, including two who returned from surgery within the past hour. The RN believes the assignment is unsafe. What does the RN do first?",
    options: ["Tell the charge nurse the specific concerns before taking report", "Refuse the assignment and leave the unit until it is changed", "Accept it now and file a complaint with the state board later", "Trade two clients with another RN without telling the charge nurse"],
    answer: 0,
    rationale: "The RN raises specific safety concerns with the charge nurse first and moves up the chain of command if they are not resolved. Leaving the unit puts clients at risk and can be abandonment once care is accepted. The state board is not the first step, and trading clients without the charge nurse breaks the accountable assignment process.",
    lens: { medic: "In EMS, you raise staffing concerns with a supervisor but you still run the call.", nurse: "On the unit, the RN voices concerns to the charge nurse first and goes up the chain; walking off after accepting report can be abandonment." } },
  m3s14: { area: "MOC", type: "single", cj: "Take action",
    stem: "A provider prescribes potassium chloride 20 mEq IV push for a client with a potassium level of 3.0 mEq/L. The RN calls to question the route, and the provider says, \"Just give it. It's fine.\" What does the RN do next?",
    options: ["Give the dose as prescribed and document the phone call", "Hold the dose and notify the charge nurse or supervisor", "Dilute the dose in a syringe and push it over 10 minutes", "Give half the dose by IV push and recheck the level"],
    answer: 1,
    rationale: "IV push potassium can cause fatal dysrhythmias, so the RN does not give it and follows the chain of command when the provider will not change the prescription. Documenting the call does not make an unsafe dose safe. Diluting or halving the dose changes a prescription on the nurse's own authority and is still an IV push.",
    lens: { medic: "In EMS, a questionable order goes back to online medical control.", nurse: "On the unit, the RN holds the dose and goes up the chain of command, starting with the charge nurse or supervisor." } },
  m3s15: { area: "MOC", type: "single", cj: "Evaluate outcomes",
    stem: "At 0800 the RN asked the UAP to turn an immobile client every 2 hours. At 1400 the RN finds the client lying on his back, as he was at 1000, with a red area over the sacrum that does not blanch. The UAP says, \"I got busy.\" What does the RN do first?",
    options: ["Report the UAP to the nurse manager for missing the turns", "Give the turning to a different UAP for the rest of the shift", "Turn the client off his sacrum and fully assess his skin", "Write in the chart that the UAP did not turn the client"],
    answer: 2,
    rationale: "Nonblanchable redness is a stage 1 pressure injury, so the RN relieves pressure and assesses the skin first. The RN stays accountable for delegated care and follows up with the UAP afterward. Reporting, reassigning, and documenting matter, but none of them helps the client right now, and the chart records the assessment, not blame." },
  m3s16: { area: "SIPC", type: "multi", cj: "Evaluate outcomes",
    stem: "The RN watches a UAP care for a client with an indwelling urinary catheter. Which UAP actions need the RN to step in? Select all that apply.",
    options: ["Hangs the drainage bag on the side rail that moves up and down", "Cleans the catheter from the meatus outward with soap and water", "Rests the drainage bag on the floor right beside the bed", "Secures the catheter tubing to the front of the client's thigh", "Holds the bag on the client's lap during a move to the chair", "Empties the bag into a container labeled for this client"],
    answer: [0, 2, 4],
    rationale: "The bag belongs on the bed frame below the bladder and off the floor, because a raised bag lets urine flow back and a bag on the floor picks up organisms. A bag on a side rail can rise above the bladder or pull on the catheter when the rail moves. Cleaning from the meatus outward, securing the tubing, and using a labeled container are correct." },
  m3s17: { area: "PPT", type: "multi", cj: "Take action",
    stem: "Ten minutes into a unit of packed red blood cells, a client reports chills and low back pain. Temperature has risen from 37.0°C (98.6°F) to 38.4°C (101.1°F), HR is 122, and BP is 92/58. Which actions does the RN take? Select all that apply.",
    options: ["Stop the transfusion and stay with the client", "Keep the IV open with normal saline and new tubing", "Notify the provider and the blood bank right away", "Slow the rate and recheck vital signs in 15 minutes", "Send the blood bag and tubing to the blood bank", "Give acetaminophen, then restart the unit more slowly"],
    answer: [0, 1, 2, 4],
    rationale: "Fever, back pain, tachycardia, and falling BP early in a transfusion suggest an acute hemolytic reaction. The RN stops the unit, keeps IV access with saline through new tubing, notifies the provider and blood bank, and returns the bag and tubing for testing. Slowing or restarting the unit gives more incompatible blood." },
  m3s18: { area: "HPM", type: "multi", cj: "Generate solutions",
    stem: "An RN in a pediatric clinic is working with a UAP during a 4-year-old's well-child visit. Which tasks can the RN delegate to the UAP? Select all that apply.",
    options: ["Measuring and recording the child's height and weight", "Taking the child's temperature, pulse, and respirations", "Deciding which vaccines are due from the child's record", "Teaching the parent about booster seat safety", "Evaluating the child's speech and motor milestones"],
    answer: [0, 1],
    rationale: "Measuring growth and taking vital signs on a well child are routine tasks with predictable results, so they can go to the UAP. Deciding which vaccines are due and judging developmental milestones require nursing assessment. Teaching the parent is also an RN responsibility." },
  m3s19: { area: "MOC", type: "multi", cj: "Generate solutions",
    stem: "The RN asks a UAP to take vital signs every 2 hours on a client 1 day after bowel surgery. The client has a dialysis fistula in the left arm. Which information does the RN include when delegating? Select all that apply.",
    options: ["The times each set of vital signs is due", "The readings to report to the RN right away", "The arm to use for blood pressure readings", "The steps for raising the IV rate if BP drops", "The way to decide whether to give pain medicine"],
    answer: [0, 1, 2],
    rationale: "Clear delegation includes when to do the task, the specific values to report and when, and any client-specific limits, such as keeping BP cuffs off the fistula arm. Changing an IV rate and deciding on pain medicine require nursing judgment and a license. The UAP reports pain to the RN instead." },
  m3s20: { area: "MOC", type: "multi", cj: "Evaluate outcomes",
    stem: "The RN reviews what a UAP did during the last hour. Which UAP actions were outside the UAP role and need follow-up? Select all that apply.",
    options: ["Turned a client's oxygen up from 2 L to 4 L", "Measured and recorded a client's intake and output", "Told a client his morning lab results were normal", "Gave a client the acetaminophen left at the bedside", "Helped a steady client walk to the bathroom and back", "Took a client's blood pressure and pulse after a nap"],
    answer: [0, 2, 3],
    rationale: "Changing an oxygen flow rate, interpreting lab results, and giving medication are outside the UAP role. The RN assesses each client involved and then talks with the UAP about the limits of the role. Measuring intake and output, helping a stable client walk, and taking vital signs are routine UAP tasks.",
    lens: { medic: "As a medic, you direct EMTs whose scope you know well.", nurse: "UAP duties vary by facility, so the RN checks each task against the UAP's role and follows up when one falls outside it." } }
});

/* ---------- Module 4: Safety, Ethics, and Legal ---------- */
Object.assign(ITEMS, {
  /* On scene: Walter Price at home */
  w1: { area: "SIPC", type: "single",
    stem: "The client's son blocks the doorway, smells of alcohol, and shouts that nobody called you. What do you do first?",
    options: ["Push past him so you can reach the client", "Argue with him about who made the 911 call", "Keep an exit clear and call for police", "Leave the scene and clear the call by radio"],
    answer: 2,
    rationale: "Your safety comes first: stay where you can leave, don't escalate, and get police on the way. Pushing past or arguing can turn violent. Leaving abandons a client who may need help.",
    lens: { medic: "Scene safety is the first thing you were ever taught.", nurse: "On the floor, the same threat means calling security, not handling it alone." } },
  w2: { area: "PSY", type: "single",
    stem: "Inside, which finding most suggests abuse rather than an accident?",
    options: ["A bruise on one shin where he bumped the coffee table", "Dry, flaky skin on both elbows and knees", "A small, healing cut on one finger", "Bruises on both upper arms, different colors"],
    answer: 3,
    rationale: "Bruises on both upper arms in different stages of healing suggest repeated grabbing over time. A single shin bruise, dry skin, and a small cut fit ordinary accidents and aging skin." },
  w3: { area: "MOC", type: "single",
    stem: "While the son is in the other room, Mr. Price whispers, \"He grabs me when he's mad. Don't tell him I said anything.\" What do you do?",
    options: ["Keep it to yourself, since he asked you to", "Report suspected elder abuse as required by law", "Ask the son to explain how the bruises happened", "Leave a note for his doctor's office to follow up"],
    answer: 1,
    rationale: "EMS providers and nurses are mandated reporters of suspected elder abuse under state law, even when the client asks you not to tell. You don't confront the suspected abuser, and a note to an office isn't a report." },
  w4: { area: "MOC", type: "single",
    stem: "Which entry belongs in your run report?",
    options: ["Arm bruises; client says, \"He grabs me.\"", "Son appeared to be physically abusing his father", "The home was filthy and the son was clearly drunk", "Client most likely fell several times this week"],
    answer: 0,
    rationale: "Document what you saw and the client's exact words. Conclusions, labels, and guesses don't belong in the record and can weaken the case for the people who investigate.",
    lens: { medic: "Your run report may end up in court.", nurse: "So does the nursing chart, every shift. Objective findings and quotes protect the client." } },

  /* Floor */
  e1: { area: "PSY", type: "multi",
    stem: "Which findings from your skin assessment support suspected abuse or neglect? Select all that apply.",

  e5: { area: "PPT", type: "single",

  e6: { area: "PSY", type: "multi",

  t4a: { area: "SIPC", type: "multi",

  t4b: { area: "PSY", type: "single",
    stem: "On day 5, Mr. Price, who has decision-making capacity, says he wants to go home to his son after all. What does the nurse do?",
