Object.assign(ITEMS, {
  m10b1: { area: "PPT", type: "single", cj: "Take action",
    stem: "At an urgent care clinic, a 4-year-old client who weighs 18 kg has a prescription for amoxicillin 45 mg/kg/day by mouth, divided every 12 hours, for an ear infection. The first dose will be given before the client leaves. The pharmacy supplies amoxicillin oral suspension 400 mg/5 mL. How many mL does the nurse give for this dose? Round to the nearest tenth.",
    options: ["1.0 mL", "3.4 mL", "5.1 mL", "10.1 mL"],
    answer: 2,
    rationale: "45 mg x 18 kg = 810 mg per day, divided by 2 = 405 mg per dose, and 405 mg x 5 mL / 400 mg = 5.06, rounded to 5.1 mL. 10.1 mL is the whole day's amount in one dose, and 3.4 mL divides the day's dose by 3 instead of 2. 1.0 mL leaves out the 5 mL in the concentration." },
  m10b2: { area: "PPT", type: "single", cj: "Take action",
    stem: "A 67-year-old client on a cardiac step-down unit converted from ventricular tachycardia after an amiodarone bolus. The provider prescribes amiodarone 1 mg/min IV for the next 6 hours. The premixed bag contains amiodarone 360 mg in 200 mL D5W. At what rate does the nurse set the pump? Round to the nearest tenth.",
    options: ["0.6 mL/hr", "33.3 mL/hr", "108 mL/hr", "333 mL/hr"],
    answer: 1,
    rationale: "The bag holds 360 mg / 200 mL = 1.8 mg/mL, and 1 mg/min x 60 = 60 mg/hr, so 60 / 1.8 = 33.3 mL/hr. 0.6 mL/hr is the per-minute volume never converted to hours. 108 mL/hr multiplies by the concentration instead of dividing, and 333 mL/hr is a decimal slip." },
  m10b3: { area: "PPT", type: "single", cj: "Take action",
    stem: "A client who weighs 84 kg has a heparin infusion running at 18 units/kg/hr. The bag contains heparin 25,000 units in 250 mL. The 6-hour aPTT is below the target range, and the weight-based protocol says: increase the infusion by 2 units/kg/hr, no bolus. What is the new pump rate? Round to the nearest tenth.",
    options: ["15.1 mL/hr", "16.8 mL/hr", "17.1 mL/hr", "168 mL/hr"],
    answer: 1,
    rationale: "The new dose is 20 units/kg/hr x 84 kg = 1,680 units/hr, and at 100 units/mL that is 16.8 mL/hr. 15.1 mL/hr is the current rate with no change made. 17.1 mL/hr adds 2 mL/hr instead of 2 units/kg/hr, and 168 mL/hr is a tenfold error that could cause major bleeding." },
  m10b4: { area: "PPT", type: "single", cj: "Analyze cues",
    stem: "At shift handoff, the nurse checks a heparin infusion at the bedside. The bag label reads heparin 25,000 units in 500 mL 0.9% sodium chloride, and the pump shows 28 mL/hr. How many units per hour is the client receiving?",
    options: ["14,000 units/hr", "2,800 units/hr", "1,400 units/hr", "700 units/hr"],
    answer: 2,
    rationale: "25,000 units / 500 mL = 50 units/mL, and 50 units/mL x 28 mL/hr = 1,400 units/hr. 2,800 units/hr assumes the more common 100 units/mL bag, which is why the nurse reads the actual label. 700 units/hr uses 25 units/mL, and 14,000 units/hr is a decimal error. The nurse then compares 1,400 units/hr with the current prescription." },
  m10b5: { area: "PPT", type: "single", cj: "Take action",
    stem: "A 70-kg client on a step-down unit has symptomatic bradycardia that did not respond to atropine. The provider prescribes dopamine at 5 mcg/kg/min IV. The premixed bag contains dopamine 400 mg in 250 mL D5W. At what rate does the nurse set the pump? Round to the nearest tenth.",
    options: ["13.1 mL/hr", "28.9 mL/hr", "131.3 mL/hr", "218.8 mL/hr"],
    answer: 0,
    rationale: "The concentration is 400,000 mcg / 250 mL = 1,600 mcg/mL. The dose is 5 x 70 x 60 = 21,000 mcg/hr, and 21,000 / 1,600 = 13.1 mL/hr. 28.9 mL/hr uses the weight in pounds, 131.3 mL/hr misplaces a decimal in the concentration, and 218.8 mL/hr divides mcg/min by mg/mL without converting units.",
    lens: { medic: "In the field you may have run dopamine off a drip chart or a quick mental rule.", nurse: "On the unit the pump's drug library does the math, but the nurse still checks the weight, concentration, and rate against the prescription." } },
  m10b6: { area: "PPT", type: "single", cj: "Analyze cues",
    stem: "A 6-year-old client who weighs 22 kg has a prescription for cephalexin 375 mg by mouth every 6 hours. The drug reference lists a safe range of 25 to 50 mg/kg/day in 4 divided doses. What is the maximum safe single dose for this child?",
    options: ["138 mg", "275 mg", "605 mg", "1,100 mg"],
    answer: 1,
    rationale: "The maximum is 50 mg x 22 kg = 1,100 mg/day, and 1,100 / 4 doses = 275 mg per dose. The prescribed 375 mg is above this, so the nurse holds it and contacts the provider. 1,100 mg is the daily total, 138 mg is the low end of the single-dose range, and 605 mg uses the weight in pounds." },
  m10b7: { area: "PPT", type: "single", cj: "Take action",
    stem: "An infusion pump is not available at a small rural hospital. A client has a prescription for piperacillin-tazobactam 3.375 g in 100 mL 0.9% sodium chloride IV over 30 minutes. The gravity tubing has a drop factor of 15 gtt/mL. How many drops per minute does the nurse set? Round to the nearest whole number.",
    options: ["3.3 gtt/min", "25 gtt/min", "33 gtt/min", "50 gtt/min"],
    answer: 3,
    rationale: "100 mL / 30 min x 15 gtt/mL = 50 gtt/min. 3.3 is the mL per minute with the drop factor left out. 25 gtt/min spreads the bag over 60 minutes instead of 30, and 33 gtt/min uses a drop factor of 10." },
  m10b8: { area: "PPT", type: "single", cj: "Take action",
    stem: "A client in the ICU with diabetic ketoacidosis weighs 92 kg. The protocol prescribes regular insulin IV starting at 0.1 units/kg/hr. The bag contains regular insulin 100 units in 100 mL 0.9% sodium chloride. At what rate does the nurse set the pump? Round to the nearest tenth.",
    options: ["0.9 mL/hr", "4.2 mL/hr", "9.2 mL/hr", "20.2 mL/hr"],
    answer: 2,
    rationale: "0.1 units x 92 kg = 9.2 units/hr, and at 1 unit/mL the rate is 9.2 mL/hr. 4.2 mL/hr divides a weight already in kilograms by 2.2, and 20.2 mL/hr multiplies it by 2.2. 0.9 mL/hr is a decimal error that would leave the ketoacidosis undertreated." },
  m10b9: { area: "PPT", type: "single", cj: "Take action",
    stem: "A 44-year-old client with bipolar disorder takes lithium carbonate 300 mg three times a day. She is admitted after 2 days of vomiting and diarrhea from a stomach virus. She now has a coarse hand tremor and slurred speech, and she is unsure of the date. A lithium level drawn at 0600 is pending, and the 0900 dose is due. What does the nurse do first?",
    options: ["Hold the 0900 dose and report the findings to the provider", "Give the dose with a full glass of water and push oral fluids", "Give the dose and check the lithium level result at noon", "Start a low-sodium diet to limit fluid shifts and swelling"],
    answer: 0,
    rationale: "Fluid and sodium loss make the kidneys hold on to lithium, and coarse tremor, slurred speech, and confusion point to toxicity. The nurse holds the dose and reports right away. Giving another dose adds to a level that is likely already high, and a low-sodium diet raises lithium levels further." },
  m10b10: { area: "PPT", type: "single", cj: "Generate solutions",
    stem: "A 79-year-old client who takes warfarin for atrial fibrillation fell at home and hit his head. In the emergency department he is drowsy, the CT shows an acute subdural hematoma, and the INR is 3.8. Which prescription does the nurse anticipate first?",
    options: ["Protamine sulfate IV given slowly over 10 minutes", "Idarucizumab IV given as two back-to-back doses", "Oral vitamin K now with a repeat INR tomorrow", "IV vitamin K with prothrombin complex concentrate"],
    answer: 3,
    rationale: "Life-threatening bleeding on warfarin calls for IV vitamin K plus a prothrombin complex concentrate, which replaces clotting factors within minutes. Protamine reverses heparin, and idarucizumab reverses dabigatran, not warfarin. Oral vitamin K works too slowly for a brain bleed.",
    lens: { medic: "On scene, a head strike in a client on a blood thinner is a reason to go to a trauma center even when the exam looks okay.", nurse: "In the ED the nurse gets the INR, names the exact anticoagulant, and is ready for the reversal agent that matches it." } },
  m10b11: { area: "PPT", type: "single", cj: "Analyze cues",
    stem: "A 58-year-old client takes amlodipine 10 mg daily for hypertension. At a follow-up visit his BP is 98/58, he has new ankle swelling, and he feels dizzy when he stands. He says he started a new diet 2 weeks ago. Which part of the diet is most likely linked to these findings?",
    options: ["A glass of grapefruit juice each morning", "Two bananas a day to raise his potassium", "A spinach salad with lunch and dinner", "Skim milk in place of whole milk at meals"],
    answer: 0,
    rationale: "Grapefruit blocks the enzyme that breaks down amlodipine, so drug levels rise and cause low BP, dizziness, and swelling. Bananas, spinach, and skim milk do not change amlodipine levels. Spinach matters for warfarin, not calcium channel blockers." },
  m10b12: { area: "PPT", type: "multi", cj: "Generate solutions",
    stem: "A 52-year-old client is starting phenelzine for depression that has not responded to other drugs. Which foods does the nurse teach the client to avoid? Select all that apply.",
    options: ["Aged cheddar cheese", "Fresh roasted chicken", "Draft beer from a tap", "Soy sauce with meals", "Dry-cured salami", "Plain cottage cheese"],
    answer: [0, 2, 3, 4],
    rationale: "Phenelzine is an MAOI, so tyramine from aged, fermented, or cured foods can cause a hypertensive crisis. Aged cheese, draft beer, soy sauce, and cured meats are high in tyramine. Freshly cooked meat and fresh cheeses such as cottage cheese are low in tyramine and safe." },
  m10b13: { area: "PPT", type: "multi", cj: "Recognize cues",
    stem: "A 34-year-old client takes sertraline 150 mg daily. Two days after starting tramadol for back pain, he comes to the emergency department because he feels restless and shaky. Which findings suggest serotonin syndrome? Select all that apply.",
    options: ["Temperature of 101.8°F (38.8°C)", "Clonus felt at both ankles", "Heavy sweating and diarrhea", "Heart rate of 52 and regular", "Pupils pinpoint and equal", "Weak reflexes in both legs"],
    answer: [0, 1, 2],
    rationale: "Tramadol adds serotonin effect to sertraline. Serotonin syndrome causes fever, clonus and brisk reflexes, sweating, diarrhea, and a fast heart rate. Bradycardia, pinpoint pupils, and weak reflexes point away from it; the pupils are usually dilated.",
    lens: { medic: "In the field this can look like a stimulant overdose or alcohol withdrawal.", nurse: "In the ED the nurse lines up the home and new medicines, and the drug pairing often explains the picture." } },
  m10b14: { area: "PPT", type: "multi", cj: "Take action",
    stem: "A client who had a stroke has a gastrostomy tube with a continuous feeding running and is NPO. The nurse is giving several oral medications through the tube. Which actions are appropriate? Select all that apply.",
    options: ["Flush the tube with 15 mL of water before the first med", "Crush the extended-release diltiazem and mix it with water", "Give each med on its own with a water flush between them", "Mix the crushed tablets together in one cup of water", "Use liquid forms of the meds when the pharmacy has them", "Pause the feeding while the meds are being given"],
    answer: [0, 2, 4, 5],
    rationale: "Pausing the feeding, flushing before, between, and after each drug, and using liquid forms when available keep the tube open and the doses accurate. Crushing an extended-release tablet releases the whole dose at once. Mixing drugs together can cause clumping and interactions and clogs the tube." },
  m10b15: { area: "SIPC", type: "multi", cj: "Take action",
    stem: "A nurse is starting an IV insulin infusion for a client after cardiac surgery. The unit requires an independent double check by a second RN for this high-alert drug. Which actions are part of a true independent double check? Select all that apply.",
    options: ["The second RN reads the prescription on her own", "The second RN does her own math for the dose and rate", "The second RN checks the pump against the bag at the bedside", "The first nurse reads the dose aloud for the second RN", "The second RN signs after the first nurse shows her the math"],
    answer: [0, 1, 2],
    rationale: "An independent double check means the second RN looks at the prescription, does the math, and checks the bag, pump, and client separately. When the first nurse reads aloud or shows her math, the second RN tends to agree with it, which defeats the check. That kind of check misses the same errors the first nurse made.",
    lens: { medic: "In the field you and your partner confirm a drug and dose out loud, and that is often the whole check.", nurse: "On the unit an independent double check means the second RN works it out alone before comparing answers." } },
  m10b16: { area: "SIPC", type: "single", cj: "Take action",
    stem: "A 70-year-old client is admitted from the emergency department with pneumonia. The admission medication list, pulled from a clinic record from last year, shows metoprolol tartrate 25 mg twice a day. The client's daughter brings the home pill bottles, which show metoprolol succinate ER 100 mg daily, filled last month. What does the nurse do?",
    options: ["Give the dose on the admission list, since it came from the clinic", "Report the difference to the provider so the list can be reconciled", "Give the client's own tablet from the bottle, since it is newer", "Send the bottles home with the daughter and document the change"],
    answer: 1,
    rationale: "Medication reconciliation means finding differences between lists and getting the provider to decide the correct drug, form, and dose. The old record is out of date, and the nurse cannot give home supply or switch products without a prescription. Documenting without reconciling leaves the wrong drug on the list.",
    lens: { medic: "In the field, grabbing the pill bottles is one of the most useful things you bring to the ED.", nurse: "On the unit those bottles start reconciliation, and the provider decides which version goes on the prescription list." } },
  m10b17: { area: "SIPC", type: "multi", cj: "Analyze cues",
    stem: "A 68-year-old client is going home after a heart failure admission. During discharge medication reconciliation, the nurse compares the home list with the discharge prescriptions. Which findings need clarification with the provider before discharge? Select all that apply.",
    options: ["Home metoprolol and new carvedilol are both listed", "Home lisinopril is stopped with no reason documented", "IV furosemide is changed to oral furosemide", "Home ibuprofen for knee pain is still listed", "Subcut heparin from the stay is not on the home list"],
    answer: [0, 1, 3],
    rationale: "Two beta-blockers on one list is a duplication, and a stopped home drug with no reason may be an error. NSAIDs such as ibuprofen cause fluid retention and worsen heart failure. Changing IV furosemide to oral and stopping hospital heparin for clot prevention are expected at discharge." },
  m10b18: { area: "RRP", type: "single", cj: "Take action",
    stem: "A client receives tobramycin 120 mg IV every 8 hours, each dose infused over 30 minutes. Under the facility's traditional dosing protocol, the provider orders a peak and a trough level with the third dose, due at 1400. When does the nurse arrange for the levels to be drawn?",
    options: ["Trough at 1300 and peak at 1430", "Peak at 1330 and trough at 1500", "Trough at 1330 and peak at 1500", "Trough at 1430 and peak at 2130"],
    answer: 2,
    rationale: "The trough is drawn within 30 minutes before the dose, and the peak about 30 minutes after a 30-minute infusion ends, so 1330 and 1500. A trough at 1300 is too early, and a peak at the end of the infusion reads falsely high. Levels drawn during or long after the dose do not show the true peak or trough." },
  m10b19: { area: "RRP", type: "single", cj: "Generate solutions",
    stem: "A 66-year-old client has taken warfarin 5 mg daily for 2 years with a stable INR of 2.4. At an urgent care visit she is prescribed trimethoprim-sulfamethoxazole for a urinary tract infection. Which action by the nurse is most important?",
    options: ["Tell her to hold warfarin until the antibiotic is done", "Tell her to eat extra leafy greens to offset the effect", "Tell her to take the two drugs at least 4 hours apart", "Arrange an INR check within 3 to 5 days of starting it"],
    answer: 3,
    rationale: "Trimethoprim-sulfamethoxazole raises the warfarin effect, so the INR can climb fast and needs an early recheck. Stopping warfarin raises clot and stroke risk. Eating more greens is an unreliable fix, and spacing the doses does not prevent the interaction." },
  m10b20: { area: "HPM", type: "single", cj: "Generate solutions",
    stem: "A 76-year-old client at an annual wellness visit sees three providers and fills prescriptions at two pharmacies. She also takes several over-the-counter products. Which plan does the nurse teach to best lower her risk of medication problems?",
    options: ["Carry one up-to-date list of every drug and supplement she uses", "List her prescription drugs, since the pharmacies track the rest", "Ask each provider to keep a separate list of what they prescribe", "Throw away the bottle labels once pills are in a weekly organizer"],
    answer: 0,
    rationale: "One current list that includes prescription, over-the-counter, and herbal products, shown at every visit, lets each provider catch duplicates and interactions. Pharmacies do not see over-the-counter purchases or each other's records. Separate provider lists keep the gaps in place, and bottle labels hold dose and refill details she still needs." },
  m10s1: { area: "PPT", type: "single", cj: "Take action",
    stem: "A client with pneumonia has a prescription for levofloxacin 750 mg IV in 150 mL to infuse over 90 minutes. The infusion pump is set in mL/hr. At what rate does the nurse set the pump?",
    options: ["150 mL/hr", "100 mL/hr", "225 mL/hr", "1.7 mL/hr"],
    answer: 1,
    rationale: "Ninety minutes is 1.5 hours, so 150 mL divided by 1.5 hours is 100 mL/hr. 150 mL/hr runs the bag over 1 hour, too fast for this dose. 225 mL/hr comes from multiplying by 1.5 instead of dividing, and 1.7 is the rate in mL per minute, not per hour." },
  m10s2: { area: "PPT", type: "single", cj: "Take action",
    stem: "At 0600 a client with hypothyroidism is due for levothyroxine 0.15 mg PO, 30 to 60 minutes before breakfast. The dispensing cabinet stocks levothyroxine 75 mcg tablets. How many tablets does the nurse give?",
    options: ["0.5 tablet", "0.2 tablet", "2 tablets", "20 tablets"],
    answer: 2,
    rationale: "0.15 mg equals 150 mcg, and 150 mcg divided by 75 mcg per tablet is 2 tablets. 0.5 tablet comes from dividing the tablet strength by the dose. 20 tablets comes from moving the decimal the wrong way during conversion, and 0.2 tablet comes from converting 0.15 mg to 15 mcg instead of 150 mcg." },
  m10s3: { area: "PPT", type: "single", cj: "Take action",
    stem: "A child who weighs 33 lb has a prescription for amoxicillin 50 mg/kg/day PO, divided every 12 hours, for strep pharyngitis. The suspension is 250 mg/5 mL. How many mL does the nurse give for each dose?",
    options: ["7.5 mL", "15 mL", "5 mL", "16.5 mL"],
    answer: 0,
    rationale: "33 lb is 15 kg, so the daily dose is 750 mg and each 12-hour dose is 375 mg. At 250 mg/5 mL, 375 mg is 7.5 mL. 15 mL is the full daily dose given at once, 5 mL divides the day into three doses, and 16.5 mL uses pounds instead of kilograms." },
  m10s4: { area: "PPT", type: "single", cj: "Take action",
    stem: "A 4-year-old who weighs 44 lb has a prescription for IV acetaminophen 15 mg/kg every 6 hours for post-op pain. The vial contains 10 mg/mL. How many mL does the nurse draw up for one dose?",
    options: ["66 mL", "3 mL", "7.5 mL", "30 mL"],
    answer: 3,
    rationale: "44 lb is 20 kg, and 15 mg/kg times 20 kg is 300 mg. At 10 mg/mL, 300 mg is 30 mL. 66 mL uses pounds instead of kilograms, 3 mL is a decimal error, and 7.5 mL divides the single dose by the four doses given each day." },
  m10s5: { area: "PPT", type: "single", cj: "Take action",
    stem: "An 81-year-old client with type 2 diabetes takes glipizide 10 mg every morning before breakfast. The client is NPO for an endoscopy scheduled at 1100. At 0700 the fingerstick glucose is 104 mg/dL. The 0730 glipizide dose is due. What does the nurse do?",
    options: ["Give the dose with a sip of water as scheduled", "Give half the dose and recheck glucose at 0900", "Hold the dose and contact the provider for direction", "Give the dose and recheck glucose every 4 hours"],
    answer: 2,
    rationale: "Glipizide makes the pancreas release insulin whether or not the client eats. In a fasting older adult it can cause severe, long-lasting hypoglycemia, so the nurse holds it and gets direction from the provider. Changing the dose to half is a new prescription the nurse cannot make, and checking glucose every 4 hours after the dose would find the low too late.",
    lens: { medic: "On the truck, a low glucose is treated with dextrose and the number comes back up.", nurse: "On the unit, the nurse prevents the low; a sulfonylurea given to a fasting older adult can drop glucose again and again for many hours." } },
  m10s6: { area: "PPT", type: "single", cj: "Generate solutions",
    stem: "A client takes apixaban 5 mg at 0800 and 2000 for atrial fibrillation. She calls the clinic at 1300 and says she forgot her morning dose. What does the nurse tell her?",
    options: ["Take the missed dose now, then take the 2000 dose as usual.", "Skip the missed dose and take two tablets at 2000 tonight.", "Take the missed dose now, then skip the 2000 dose tonight.", "Skip the missed dose and restart with tomorrow's 0800 dose."],
    answer: 0,
    rationale: "For twice-daily apixaban, a missed dose is taken as soon as it is remembered on the same day, and the regular schedule then continues. Doubling up raises bleeding risk. Skipping the evening dose or waiting until tomorrow leaves her without stroke protection for longer than needed." },
  m10s7: { area: "PPT", type: "multi", cj: "Evaluate outcomes",
    stem: "A 70-year-old client is going home on warfarin after a deep vein thrombosis. The provider has set a target INR range for him. Which statements show he understood the teaching? Select all that apply.",
    options: ["\"If I miss a dose, I'll take two the next day to catch up.\"", "\"I'll keep my green vegetables about the same from week to week.\"", "\"I'll use ibuprofen for my knee pain since it's sold over the counter.\"", "\"I'll check with my pharmacist before I start any herbal product.\"", "\"I'll get my INR blood test on the days the clinic gives me.\"", "\"Once my INR is in range, I can stop getting it checked.\""],
    answer: [1, 3, 4],
    rationale: "Steady vitamin K intake, regular INR checks, and checking new products for interactions keep warfarin in the target range. Doubling a missed dose can push the INR too high. NSAIDs such as ibuprofen raise bleeding risk, and INR monitoring continues for as long as he takes warfarin." },
  m10s8: { area: "PPT", type: "single", cj: "Take action",
    stem: "A 74-year-old client with hypertension and benign prostatic hyperplasia received his first dose of doxazosin 1 mg at 2100. At 0200 he turns on the call light and says he needs to urinate. What does the nurse do?",
    options: ["Tell him he can walk alone, since his gait was steady earlier", "Hand him a urinal and have him stand alone at the bedside", "Ask the UAP to check his blood pressure once he is back in bed", "Help him sit on the bed edge for a minute, then walk with him"],
    answer: 3,
    rationale: "Alpha blockers such as doxazosin can cause marked orthostatic hypotension and fainting after the first dose. Having him dangle before standing and walking with him lowers the risk of a fall. Walking or standing alone is unsafe tonight, and a blood pressure taken after he returns to bed does not protect him on the way." },
  m10s9: { area: "PPT", type: "single", cj: "Analyze cues",
    stem: "A 68-year-old client started amlodipine 10 mg daily 1 month ago. She reports that both ankles are swollen by evening and better in the morning. Her lungs are clear, her weight is unchanged, and she has no shortness of breath. What does the nurse tell her?",
    options: ["\"Stop the amlodipine today until the swelling goes away.\"", "\"This is a known effect of amlodipine. I'll tell your provider.\"", "\"This points to heart failure, so go to the emergency department.\"", "\"Cut back on salt, since sodium is what causes this swelling.\""],
    answer: 1,
    rationale: "Ankle edema is a common, dose-related effect of dihydropyridine calcium channel blockers and comes from blood vessel dilation, not fluid overload. Clear lungs, stable weight, and no dyspnea do not suggest heart failure. The provider may lower the dose or change the drug, but she should not stop it on her own, and salt restriction does not fix this type of edema." },
  m10s10: { area: "PPT", type: "single", cj: "Analyze cues",
    stem: "A 66-year-old client was admitted 2 days ago with a bowel obstruction and has been NPO. He does not drink alcohol. His home medications include clonidine 0.2 mg PO twice daily, which was not continued on admission. He now has a headache, tremor, and anxiety. BP is 204/112 and HR is 116. What does the nurse suspect?",
    options: ["Rebound hypertension from stopping clonidine abruptly", "Pain from the obstruction raising his blood pressure", "Low blood glucose from not eating for 2 days", "Fluid overload from IV fluids given since admission"],
    answer: 0,
    rationale: "Stopping clonidine suddenly causes a surge of sympathetic activity, with severe hypertension, tachycardia, headache, tremor, and anxiety within 1 to 3 days. The nurse reports this to the provider, who may restart clonidine by another route. Pain can raise BP but does not explain this full picture, and low glucose and fluid overload do not cause this degree of hypertension with tremor.",
    lens: { medic: "In the field, a BP of 204/112 is a number to treat or transport.", nurse: "On the unit, the nurse checks the home medication list first, because a held clonidine is a common and fixable cause." } },
  m10s11: { area: "RRP", type: "single", cj: "Recognize cues",
    stem: "An 82-year-old client started sertraline 3 weeks ago and also takes hydrochlorothiazide. She does not have diabetes. Her daughter says she has become confused and unsteady over the past few days. Which lab result does the nurse check first?",
    options: ["Serum potassium", "Blood glucose", "Serum calcium", "Serum sodium"],
    answer: 3,
    rationale: "SSRIs can cause SIADH and hyponatremia, and the risk is highest in older adults who also take a thiazide diuretic. New confusion and unsteadiness fit a falling sodium. Potassium and calcium changes from the thiazide are less likely to explain new confusion, and low glucose is unlikely in a client without diabetes." },
  m10s12: { area: "PPT", type: "single", cj: "Recognize cues",
    stem: "A 79-year-old client with delirium has a prescription for haloperidol 0.5 mg IV every 6 hours as needed for severe agitation. He is pulling at his IV. Before giving the dose, the nurse reviews the latest data. Which finding does the nurse report before giving it?",
    options: ["Heart rate of 92 beats/min", "QTc interval of 528 ms", "Blood pressure of 146/84", "Temperature of 37.4°C (99.3°F)"],
    answer: 1,
    rationale: "Haloperidol prolongs the QT interval, and a QTc over 500 ms raises the risk of torsades de pointes. The nurse holds the dose and reports it. The heart rate, blood pressure, and temperature are within expected limits for an agitated older adult.",
    lens: { medic: "Medics may give an antipsychotic for agitation based on behavior and a monitor strip.", nurse: "On the unit, the nurse checks the QTc, potassium, and magnesium before each dose and reports a long QTc." } },

    rationale: "Painless bright red bleeding suggests placenta previa, and a digital exam can tear the placenta and cause severe hemorrhage. Fetal monitoring, a type and screen, and an ultrasound to find the placenta are all appropriate first steps.",
    lens: { medic: "In the field you would not do an internal exam on a bleeding pregnant client anyway.", nurse: "On the unit, the RN holds any digital or speculum exam until ultrasound rules out previa, even if a provider writes the order." } },
  m11b13: { area: "RRP", type: "multi", cj: "Take action",
    stem: "Twenty minutes after an epidural is placed, a laboring client's BP is 84/48 mm Hg (baseline 122/76). She feels lightheaded, and the FHR has dropped to 105. Which actions does the nurse take? Select all that apply.",
    options: ["Lay the client flat on her back", "Turn the client onto her side", "Increase the IV fluid rate as prescribed", "Hold IV fluids to prevent overload", "Notify the anesthesia provider"],
    answer: [1, 2, 4],
    rationale: "Epidural sympathetic blockade causes vasodilation and hypotension that reduces placental blood flow. The nurse moves the client off her back to relieve vena cava compression, increases IV fluids as prescribed, and notifies the anesthesia provider, who may prescribe a vasopressor. Lying supine worsens compression, and fluids are needed, not held." },
  m11b14: { area: "RRP", type: "single", cj: "Take action",
    stem: "A client who gave birth vaginally 3 hours ago has a firm fundus 2 fingerbreadths above the umbilicus and shifted to the right. Lochia is moderate and red. She has not voided since the birth. What does the nurse do first?",
    options: ["Massage the fundus until it returns to midline", "Help the client to the bathroom to void", "Report a possible retained placenta to the provider", "Increase the rate of the oxytocin infusion"],
    answer: 1,
    rationale: "A high fundus pushed to one side in a client who has not voided points to a full bladder, which can block contraction and lead to bleeding. Emptying the bladder lets the uterus return to midline. The fundus is already firm, so massage and more oxytocin are not needed, and the findings do not suggest retained tissue." },
  m11b15: { area: "RRP", type: "single", cj: "Analyze cues",
    stem: "The provider performs an amniotomy on a client at 5 cm. Minutes later, the nurse sees abrupt, V-shaped drops in the FHR to 90 that vary in timing with contractions and recover quickly. Which cause does the nurse suspect?",
    options: ["Compression of the umbilical cord", "Compression of the fetal head", "Reduced blood flow through the placenta", "A normal fetal sleep-wake cycle"],
    answer: 0,
    rationale: "Abrupt, V-shaped decelerations that vary in timing are variable decelerations from cord compression, a known risk after rupture of membranes. Head compression causes early decelerations that mirror contractions, and placental insufficiency causes late decelerations. Sleep cycles reduce variability but do not cause sharp drops." },
  m11b16: { area: "PPT", type: "multi", cj: "Recognize cues",
    stem: "A client with preeclampsia with severe features is receiving IV magnesium sulfate at 2 g/hour. Which findings suggest magnesium toxicity? Select all that apply.",
    options: ["Respiratory rate of 9 breaths/min", "Patellar reflexes absent on both sides", "Serum magnesium level of 9.4 mg/dL", "Feeling warm and flushed in the face", "Slurred speech and marked drowsiness", "Patellar reflexes of 2+ on both sides"],
    answer: [0, 1, 2, 4],
    rationale: "Loss of deep tendon reflexes, respirations below 12, a level above the therapeutic range of about 4 to 7 mg/dL, and slurred speech with heavy sedation all point to toxicity. Warmth and flushing are expected side effects of the infusion, and 2+ reflexes are normal." },
  m11b17: { area: "PPT", type: "single", cj: "Generate solutions",
    stem: "A client receiving IV magnesium sulfate has a respiratory rate of 8 and no patellar reflexes. The nurse has stopped the infusion and called the rapid response team. Which medication does the nurse prepare?",
    options: ["Naloxone 0.4 mg IV push", "Hydralazine 5 mg IV push", "Terbutaline 0.25 mg subcut", "Calcium gluconate 1 g IV"],
    answer: 3,
    rationale: "Calcium gluconate reverses the respiratory and neuromuscular depression of magnesium toxicity. Naloxone reverses opioids, hydralazine lowers BP, and terbutaline relaxes the uterus; none of them treats magnesium excess.",
    lens: { medic: "In the field, magnesium is the drug you give for an eclamptic seizure, and calcium is the reversal you carry.", nurse: "On the unit, the RN checks reflexes, respirations, and urine output on a set schedule and keeps calcium gluconate at the bedside." } },
  m11b18: { area: "PPT", type: "single", cj: "Take action",
    stem: "A client is receiving oxytocin to augment labor. Over the past 30 minutes she has averaged 7 contractions every 10 minutes, each lasting 90 seconds. The FHR baseline is 150 with moderate variability and no decelerations. What does the nurse do first?",
    options: ["Increase the oxytocin by 2 milliunits/min", "Reduce or stop the oxytocin per protocol", "Prepare the client for an amniotomy now", "Keep the current rate and recheck in 1 hour"],
    answer: 1,
    rationale: "More than 5 contractions in 10 minutes averaged over 30 minutes is tachysystole, which shortens the rest time the fetus needs for oxygen. The nurse reduces or stops the oxytocin per protocol even while the FHR is still reassuring. Increasing the rate or waiting raises the risk of fetal distress, and an amniotomy does not slow contractions." },
  m11b19: { area: "SIPC", type: "single", cj: "Take action",
    stem: "A term newborn was just born to a client who is positive for hepatitis B surface antigen. The newborn is stable and skin-to-skin with the mother. Before giving the vitamin K and hepatitis B vaccine injections, what does the nurse do?",
    options: ["Delay both injections until the newborn is 24 hours old", "Place the newborn on airborne precautions in the nursery", "Wash maternal blood and fluids off the newborn's skin", "Keep the newborn away from the mother until discharge"],
    answer: 2,
    rationale: "Washing maternal blood and fluids off the skin before any injection lowers the chance of carrying the virus into the newborn's tissue. Hepatitis B vaccine and hepatitis B immune globulin should be given within 12 hours, not delayed. Hepatitis B spreads by blood and body fluids, not by air, and mother and newborn can stay together." },
  m11b20: { area: "PSY", type: "single", cj: "Recognize cues",
    stem: "On postpartum day 5, a client's partner calls. She hasn't slept in 2 days, says the baby \"isn't really hers,\" and talks about hearing a voice telling her what to do. What does the nurse advise?",
    options: ["Let her rest and call back tomorrow", "Take her to an emergency department now", "Give her some time alone with the baby", "Have her start a journal of her feelings"],
    answer: 1,
    rationale: "Not sleeping, odd beliefs about the baby, and hearing voices after birth suggest postpartum psychosis, an emergency with a risk of harm to the mother and baby. She needs an emergency evaluation now, and she shouldn't be left alone with the baby." },
  m11s1: { area: "HPM", type: "single", cj: "Evaluate outcomes",
    stem: "A breastfed newborn is 5 days old at a follow-up visit. His birth weight was 3,400 g (7 lb 8 oz). Which finding shows he is getting enough milk?",
    options: ["He weighs 3,020 g today and sleeps 5 hours between feeds.", "He has 2 wet diapers a day and dark green, sticky stools.", "He has 6 to 8 wet diapers a day and yellow, seedy stools.", "He nurses about 5 minutes on one side and then falls asleep."],
    answer: 2,
    rationale: "By day 5, 6 or more wet diapers a day and yellow, seedy stools show good milk intake. A weight of 3,020 g is an 11% loss, above the usual 7% to 10% limit, and 5-hour stretches mean too few feeds. Two wet diapers and meconium-like stools on day 5 suggest poor intake, and very short feeds that end in sleep often mean the baby is not transferring milk." },
  m11s2: { area: "HPM", type: "single", cj: "Take action",
    stem: "A client who is 1 day postpartum says breastfeeding hurts through the whole feeding. When the baby comes off, her nipple looks creased and flattened at the tip. What does the nurse do?",
    options: ["Break suction with a finger and relatch with the mouth wide open.", "Explain that pain through the whole feeding is normal in the first week.", "Suggest she limit feeds to 5 minutes per side until the soreness eases.", "Give her a nipple shield to use at every feed until she goes home."],
    answer: 0,
    rationale: "Pain that lasts the whole feeding and a creased nipple point to a shallow latch. The fix is to break suction safely and relatch with the baby's mouth wide and more areola in the mouth. Ongoing pain is not expected, limiting feeds lowers milk supply, and a shield does not correct the latch and is not a first step." },
  m11s3: { area: "HPM", type: "single", cj: "Generate solutions",
    stem: "On day 3 after birth, a breastfeeding client's breasts are hard, warm, and tender, and her baby has trouble latching. Her temperature is 37.4°C (99.3°F), and there are no red, wedge-shaped areas. Which advice does the nurse give?",
    options: ["Skip a feeding or two so the breasts can rest and soften.", "Bind the breasts snugly and avoid any nipple stimulation.", "Put ice on the breasts for 20 minutes just before each feed.", "Hand express a bit of milk to soften the areola, then latch."],
    answer: 3,
    rationale: "This is engorgement. Softening the areola with a little hand expression lets the baby latch, and frequent feeds (8 to 12 a day) relieve the fullness. Skipping feeds worsens engorgement and raises the risk of mastitis. Binding is for clients who are not breastfeeding, and cold before a feed can slow letdown; cold works best after feeds." },
  m11s4: { area: "HPM", type: "single", cj: "Evaluate outcomes",
    stem: "A parent who plans to formula feed is going home with a newborn and will use powdered formula. Which statement shows the parent understands safe preparation?",
    options: ["I'll toss any formula left in the bottle after a feeding.", "I'll add some extra water so a can lasts until payday.", "I'll warm each bottle in the microwave, then shake it well.", "I'll save a half-finished bottle in the fridge for later."],
    answer: 0,
    rationale: "Saliva and bacteria enter the bottle during a feeding, so leftover formula is thrown away. Extra water dilutes calories and can cause low sodium and seizures. Microwaves heat unevenly and can scald the mouth, and a partly used bottle should not be saved for another feed." },
  m11s5: { area: "HPM", type: "single", cj: "Generate solutions",
    stem: "A client who is exclusively breastfeeding is going home 2 days after birth. She asks about starting the birth control pill her sister takes, which has both estrogen and progestin. Which response by the nurse is best?",
    options: ["A progestin-only method is best for now; estrogen can lower supply.", "Breastfeeding prevents pregnancy as long as you nurse, so you can wait.", "That pill is a good choice, and you can start it the day you get home.", "Hormonal birth control has to wait until you are done breastfeeding."],
    answer: 0,
    rationale: "Combined estrogen methods can reduce milk supply and add clot risk in the first weeks after birth, so progestin-only pills, implants, or IUDs are preferred while she breastfeeds. Breastfeeding protects only when strict criteria are met (exclusive feeding, no periods, under 6 months). Progestin-only methods are safe during breastfeeding, so she does not need to wait." },
  m11s6: { area: "HPM", type: "single", cj: "Take action",
    stem: "A healthy term newborn's state screening blood sample was drawn at 18 hours of age, just before an early discharge. What does the nurse include in the discharge teaching?",
    options: ["One sample is enough as long as the baby is feeding well.", "The baby needs a repeat sample, usually in 1 to 2 weeks.", "The test will be repeated at the 2-month vaccine visit.", "A normal hearing screen means the blood test can be skipped."],
    answer: 1,
    rationale: "Screens drawn before 24 hours of age can miss conditions such as PKU, so a repeat sample is needed, usually within 1 to 2 weeks. Feeding well does not make an early sample reliable. Waiting 2 months could delay treatment, and the hearing screen tests something different." },
  m11s7: { area: "HPM", type: "multi", cj: "Generate solutions",
    stem: "A newborn had a circumcision with a Gomco clamp 2 hours ago. Which instructions does the nurse give the parents? Select all that apply.",
    options: ["Apply petroleum jelly to the tip of the penis at each diaper change.", "Gently scrub off the yellow film that forms over the healing site.", "Call if bleeding leaves a spot larger than a quarter on the diaper.", "Check for wet diapers, and call if he does not urinate.", "Clean the site with rubbing alcohol at each diaper change.", "Fasten the diaper loosely over the penis while it heals."],
    answer: [0, 2, 3, 5],
    rationale: "Petroleum jelly keeps the site from sticking to the diaper, and a loose diaper limits rubbing. Bleeding beyond a small spot and failure to urinate need a call to the provider. The yellow film is normal healing tissue and should not be removed, and alcohol irritates the wound." },
  m11s8: { area: "PHYS", type: "single", cj: "Analyze cues",
    stem: "A newborn born by vacuum-assisted birth is 20 hours old. The nurse finds a firm, raised swelling over the right parietal bone that stops at the suture lines. It was not there at birth. Which plan does the nurse follow?",
    options: ["Apply gentle pressure to the swelling to help it go down.", "Expect the swelling to be gone within 2 to 3 days.", "Explain that the swelling is fluid from pressure in labor.", "Watch for jaundice as blood in the swelling breaks down."],
    answer: 3,
    rationale: "A swelling that appears hours after birth and stops at the suture lines is a cephalohematoma, blood under the periosteum. As that blood breaks down, it raises bilirubin, so the nurse watches for jaundice. Caput is fluid that crosses suture lines and fades in a few days, while a cephalohematoma can take weeks. Pressing on the swelling is not done.",
    lens: { medic: "In the field, a lump on a newborn's head reads as trauma to report.", nurse: "On the unit, the RN sorts it by suture lines and timing, then tracks bilirubin for days." } },
  m11s9: { area: "PHYS", type: "multi", cj: "Recognize cues",
    stem: "The nurse does a head-to-toe assessment on a 1-day-old term newborn. Which findings need follow-up with the provider? Select all that apply.",
    options: ["Anterior fontanel that bulges while the baby is quiet", "Blue-gray patches over the lower back and buttocks", "Tiny white bumps scattered across the nose and chin", "Uneven thigh skin folds and limited abduction of the left hip", "Long, narrow head shape after a long vaginal birth", "Sunken anterior fontanel and dry mucous membranes"],
    answer: [0, 3, 5],
    rationale: "A fontanel that bulges at rest can mean raised intracranial pressure, and a sunken one with dry membranes suggests dehydration. Uneven thigh folds and limited abduction are signs of hip dysplasia. Mongolian spots, milia, and molding are normal findings that fade on their own." },
  m11s10: { area: "PHYS", type: "single", cj: "Generate solutions",
    stem: "A client is 1 day after a cesarean birth. She has gas pains, her abdomen is mildly distended, and her bowel sounds are hypoactive. Her incision is intact. Which action does the nurse encourage?",
    options: ["Drinking carbonated soda to help bring up the gas", "Walking in the hallway several times today", "Using a straw for fluids so she swallows less air", "Lying flat on her back until the gas has passed"],
    answer: 1,
    rationale: "Walking speeds the return of bowel motion and also lowers clot risk after surgery. Carbonated drinks and straws add air to the gut. Lying flat and still slows peristalsis and makes gas pain last longer." },
  m11s11: { area: "PHYS", type: "single", cj: "Take action",
    stem: "A client had a vaginal birth 4 hours ago, with a repaired third-degree perineal laceration. Which action does the nurse include in her perineal care?",
    options: ["Take her temperature rectally to watch for early infection.", "Teach her to put off bowel movements until the repair heals.", "Apply an ice pack to the repair site for the first 24 hours.", "Show her how to use a tampon to keep the lochia contained."],
    answer: 2,
    rationale: "Cold in the first 24 hours reduces swelling and pain at the repair. A third-degree tear reaches the anal sphincter, so rectal temperatures and other rectal items are avoided. Holding stool leads to hard stools that strain the repair; stool softeners are used instead. Tampons are avoided after birth because of infection risk." },
  m11s12: { area: "RRP", type: "single", cj: "Take action",
    stem: "A client who gave birth 2 days ago had normal BPs during pregnancy. She now reports a severe headache and seeing spots. Her BP is 164/110 mm Hg, and a recheck 15 minutes later is 162/108 mm Hg. What does the nurse do?",
    options: ["Give acetaminophen and recheck her BP in 1 hour.", "Ask about her epidural and treat a spinal headache.", "Notify the provider now for urgent BP treatment.", "Dim the lights and recheck her BP at the next round."],
    answer: 2,
    rationale: "Preeclampsia can first appear after birth. A severe-range BP that persists for 15 minutes, with headache and vision changes, needs treatment within about an hour to prevent stroke and seizures, so the provider is called now. Acetaminophen, assuming a spinal headache, or waiting for the next routine check would delay that care.",
    lens: { medic: "Medics often think delivery ends the risk of preeclampsia.", nurse: "The RN knows it can start up to 6 weeks after birth and treats severe BP within the hour." } },
  m11s13: { area: "RRP", type: "multi", cj: "Recognize cues",
    stem: "A client is on day 3 after a cesarean birth. Which findings suggest a postpartum infection? Select all that apply.",
    options: ["Temperature of 38.0°C (100.4°F) at 12 hours after birth", "Temperature of 38.5°C (101.3°F) on day 2 and again on day 3", "Lochia that has developed a foul, musty odor", "WBC count of 14,000/mm3 on the first postpartum day", "Uterus that is very tender to light touch", "Resting heart rate of 116 beats per minute"],
    answer: [1, 2, 4, 5],
    rationale: "A fever of 38°C or higher on 2 days after the first 24 hours, foul lochia, uterine tenderness, and tachycardia point to endometritis or another infection. A low fever in the first 24 hours is often from dehydration or the stress of birth. A WBC count up to about 20,000/mm3 is common in the early postpartum days and is not a reliable sign by itself." },
  m11s14: { area: "PPT", type: "single", cj: "Take action",
    stem: "A client who is Rh-negative gave birth 20 hours ago. Her newborn is Rh-positive, and her indirect Coombs test is negative. She received Rho(D) immune globulin at 28 weeks. What does the nurse do?",
    options: ["Hold the dose, since she already received it at 28 weeks.", "Give Rho(D) immune globulin IM to the newborn before discharge.", "Hold the dose, since the newborn's blood type is Rh-positive.", "Give Rho(D) immune globulin IM to her within 72 hours."],
    answer: 3,
    rationale: "An Rh-negative client who is not sensitized (negative Coombs) and has an Rh-positive baby gets Rho(D) immune globulin within 72 hours of birth. The 28-week dose does not cover the fetal blood that enters her circulation at delivery. An Rh-positive baby is the reason to give it, and the drug goes to the mother, not the newborn." },
  m11s15: { area: "PPT", type: "single", cj: "Evaluate outcomes",
    stem: "A breastfeeding client who is not immune to rubella receives the MMR vaccine before discharge. Which statement shows she needs more teaching?",
    options: ["I should avoid getting pregnant for 4 weeks after this shot.", "I need to stop breastfeeding for a few days after the shot.", "My joints may ache or I may get a mild rash in a week or two.", "This shot helps protect a future baby from rubella defects."],
    answer: 1,
    rationale: "The MMR vaccine is safe during breastfeeding, so she does not need to stop. Pregnancy is avoided for 4 weeks because it is a live vaccine. Mild rash and joint aches can occur, and the vaccine protects future pregnancies from congenital rubella." },
  m11s16: { area: "SIPC", type: "single", cj: "Recognize cues",
    stem: "Before discharge, the nurse checks how the parents placed their newborn in a rear-facing car seat. Which finding needs correction?",
    options: ["The seat is installed in the back seat, facing the rear.", "The harness straps come out at or below the shoulders.", "The chest clip is fastened at the level of the belly.", "The nurse can't pinch any slack in the shoulder strap."],
    answer: 2,
    rationale: "The chest clip belongs at armpit level; low on the belly it lets the infant slide out of the straps and can injure the abdomen in a crash. Rear-facing in the back seat, straps at or below the shoulders, and no pinchable slack are all correct.",
    lens: { medic: "Medics secure infants to the stretcher with a pediatric restraint for transport.", nurse: "The RN teaches parents to fit their own car seat, because it protects every ride home." } },
  m11s17: { area: "SIPC", type: "multi", cj: "Generate solutions",
    stem: "A parent is going home with a breastfed newborn. Which sleep instructions does the nurse give? Select all that apply.",
    options: ["Place the baby on the back for every sleep, naps included.", "Keep the crib in your room, not in your bed, for 6 months.", "Prop the baby on one side with a rolled blanket after feeds.", "Use a firm, flat mattress with just a fitted sheet.", "Add soft bumper pads so the head can't hit the rails.", "Let the baby sleep in an inclined rocker if spitting up."],
    answer: [0, 1, 3],
    rationale: "Back sleeping, room sharing without bed sharing, and a firm, flat, bare sleep surface lower the risk of sleep-related death. Side positioning with blankets, bumper pads, and inclined sleepers raise the risk of suffocation. Healthy babies on their backs do not choke on spit-up." },
  m11s18: { area: "PSY", type: "single", cj: "Take action",
    stem: "A client's baby was stillborn at 37 weeks. She is holding her daughter and says, \"I keep thinking I did something to cause this.\" Which response by the nurse is best?",
    options: ["You are young, and you can try for another baby soon.", "Many parents have that thought. What's on your mind?", "Everything happens for a reason, even if we can't see it.", "Let's wait for the autopsy before you worry about that."],
    answer: 1,
    rationale: "Naming the feeling as common and inviting her to talk is therapeutic and lets the nurse hear her guilt. Talk of another baby dismisses this loss, and clichés shut down feelings. Telling her to wait for the autopsy postpones her concern and sets it aside.",
    lens: { medic: "In the field, a medic may steer a grieving parent away from the baby.", nurse: "On the unit, the RN offers time to hold the baby, take photos, and keep mementos." } },
  m11s19: { area: "PSY", type: "single", cj: "Generate solutions",
    stem: "A new father on the postpartum unit says, \"I feel useless. She's doing everything.\" What is the nurse's best response?",
    options: ["\"Most dads feel that way at first.\"", "\"Would you like to do skin-to-skin with him?\"", "\"Your job is to support her, so that's fine.\"", "\"You'll be more useful once you're home.\""],
    answer: 1,
    rationale: "Inviting him into hands-on care, like skin-to-skin contact or diapering, builds his confidence and bonding. The other replies brush off his feelings or put his role off until later." },
  m11s20: { area: "BCC", type: "multi", cj: "Generate solutions",
    stem: "A 2-day-old infant whose mother took opioids during pregnancy has a high-pitched cry, tremors when disturbed, frequent sneezing, and poor feeding. Which comfort measures does the nurse use? Select all that apply.",
    options: ["Swaddle the infant snugly with the arms flexed.", "Keep the room quiet with the lights dimmed.", "Offer small, frequent feedings through the day.", "Move the crib under the bright lights at the nurses' station.", "Encourage rooming in and skin-to-skin holding by the parent.", "Unwrap and stimulate the infant often to check muscle tone."],
    answer: [0, 1, 2, 4],
    rationale: "Infants in withdrawal are calmed by snug swaddling, low light and noise, small frequent feeds, and a parent's closeness through rooming in and skin-to-skin care. Bright, busy settings and frequent handling increase irritability and tremors.",
    lens: { medic: "An opioid-exposed newborn may make a medic think of naloxone.", nurse: "On the unit, naloxone is avoided here because it can cause seizures; comfort care comes first." } }
});

Object.assign(ITEMS, {
  /* On scene: Liam Carter, febrile seizure */
  pd1: { area: "SIPC", type: "single",
    stem: "He's still shaking on the living room rug, about 2 minutes in. What do you do first?",
    options: ["Put a bite block between his teeth", "Turn him on his side and guard his head", "Hold his arms and legs to stop the jerking", "Put him in a cool bath to drop the fever"],
    answer: 1,
    rationale: "Side-lying keeps his airway clear and lets secretions drain, and guarding his head prevents injury. Nothing goes in his mouth, restraining him can hurt him, and a bath during a seizure risks drowning.",
    lens: { medic: "You time it, protect him, and get ready if it passes 5 minutes.", nurse: "On the unit, the same steps plus suction and oxygen at the bedside." } },
  pd2: { area: "PHYS", type: "single",
    stem: "The seizure stops at 3 minutes. Which finding fits a simple febrile seizure?",
    options: ["Sleepy and slow to wake for a while", "A stiff neck and a purple, spotty rash", "Weakness in his left arm and leg", "A second seizure within the hour"],
    answer: 0,
    rationale: "A simple febrile seizure is short, generalized, happens once in 24 hours, and is followed by a sleepy postictal period. A stiff neck with a non-blanching rash suggests meningitis, and one-sided weakness or a repeat seizure makes it complex and needs more workup." },
  pd3: { area: "PSY", type: "single",
    stem: "His mother is crying. \"Did I do this? Does he have epilepsy now?\" What is the best response?",
    options: ["\"Don't worry. He's fine now, so try to relax a bit.\"", "\"You should have given him Tylenol sooner today.\"", "\"They're common at his age; few lead to epilepsy.\"", "\"The doctors can tell you more once they run tests.\""],
    answer: 2,
    rationale: "Accurate, simple information eases her guilt and fear: febrile seizures are common between 6 months and 5 years and rarely lead to epilepsy. Brushing her off, blaming her, or deferring every answer leaves her frightened." },
  pd4: { area: "MOC", type: "single",
    stem: "Which detail matters most in your handoff at the ED?",
    options: ["He goes to day care three days a week", "His older sister had chickenpox in the spring", "The family just moved here from Ohio", "One 3-minute seizure, both sides, no repeat"],
    answer: 3,
    rationale: "How long the seizure lasted, whether it involved the whole body, and whether it came back decide if it was simple or complex and how much workup he needs. The other details don't change his care tonight." },

  /* Floor: pediatric unit */
  pu1: { area: "PHYS", type: "multi",
    stem: "On admission, which findings point to dehydration that needs treatment? Select all that apply.",
    options: ["Dry, sticky mouth and lips", "No wet diaper in 8 hours", "Clings to his mother when you walk in", "Capillary refill 3 seconds", "Blood pressure 94/58", "Heart rate 152 while calm"],
    answer: [0, 1, 3, 5],
    rationale: "Dry mucous membranes, no urine in 8 hours, slow capillary refill, and a fast heart rate at rest add up to moderate dehydration. Clinging to a parent is normal for his age, and children keep a normal BP until late in shock." },
  pu2: { area: "PHYS", type: "single",
    stem: "Which explanation best fits his labs?",
    options: ["Fluid loss with acidosis from diarrhea", "Metabolic alkalosis from losing stomach acid", "Kidney failure from a urinary infection", "High sodium from drinking too little water"],
    answer: 0,
    rationale: "Diarrhea carries bicarbonate out of the body, so a low bicarbonate with a raised BUN and normal creatinine fits fluid loss with metabolic acidosis. Vomiting alone would raise the bicarbonate, his sodium is normal, and his creatinine argues against kidney failure." },
  pu3: { area: "PPT", type: "single",
    stem: "He weighs 11 kg. The provider prescribes a 0.9% saline bolus of 20 mL/kg. How much fluid does the nurse give?",
    options: ["110 mL", "220 mL", "330 mL", "440 mL"],
    answer: 1,
    rationale: "20 mL/kg times 11 kg is 220 mL. The nurse checks the weight in kilograms, gives it over the prescribed time with a pump, and reassesses heart rate, capillary refill, and output afterward.",
    lens: { medic: "The 20 mL/kg bolus is the same math you do in the back of the truck.", nurse: "Then you track every wet diaper and every milliliter he drinks." } },
  pu4: { area: "BCC", type: "multi",
    stem: "After the bolus, which belong in his plan? Select all that apply.",

Object.assign(ITEMS, {
  m12b1: { area: "RRP", type: "single", cj: "Recognize cues",

    options: ["A 1-week-old with a heart rate of 145 and a respiratory rate of 48", "A 2-year-old with a heart rate of 108 and respiratory rate of 28", "A 7-year-old with a heart rate of 90 and respiratory rate of 22", "A 14-year-old with a heart rate of 124 and respiratory rate of 26"],

  m12b2: { area: "PHYS", type: "single", cj: "Recognize cues",

    lens: { medic: "In the field you size up an infant's work of breathing from the doorway in seconds.", nurse: "On the unit you repeat that look every hour, and new grunting or head bobbing means the infant is tiring and the provider needs to know now." } },
  m12b3: { area: "PHYS", type: "single", cj: "Take action",
    stem: "A 3-month-old client with bronchiolitis is due for a bottle feeding. The infant has thick nasal secretions, a respiratory rate of 52, and SpO2 of 94% on room air. What does the nurse do before the feeding?",
    options: ["Hold the feeding until the respiratory rate drops below 30", "Thicken the formula with rice cereal to slow the flow", "Lay the infant flat on the back to ease the breathing", "Suction the nose with saline drops and a bulb syringe"],
    answer: 3,
    rationale: "Young infants breathe mainly through the nose, so clearing the nares before feeding makes sucking and swallowing easier. A rate of 52 is safe for oral feeding, and waiting for a rate below 30 is not realistic for this age. Thickened feeds are not part of bronchiolitis care, and lying flat makes breathing harder; the head of the bed is raised." },
  m12b4: { area: "SIPC", type: "multi", cj: "Take action",
    stem: "A 7-month-old client is admitted with a positive RSV test. Which infection control measures does the nurse put in place? Select all that apply.",
    options: ["Wear a gown and gloves when entering the room", "Place the infant in a private room or with another RSV-positive infant", "Clean hands before and after contact, even when gloves are worn", "Wear a fitted N95 respirator for care in the room", "Move the infant to a negative-pressure airborne isolation room"],
    answer: [0, 1, 2],
    rationale: "RSV spreads mainly by direct contact with secretions and contaminated surfaces, so contact precautions, a private or cohorted room, and hand hygiene are the core measures. Many facilities also add a mask under droplet precautions. RSV is not airborne, so an N95 and a negative-pressure room are not needed." },
  m12b5: { area: "RRP", type: "single", cj: "Evaluate outcomes",
    stem: "An 18-month-old client with croup had stridor at rest and received racemic epinephrine by nebulizer and oral dexamethasone in the emergency department 40 minutes ago. The stridor at rest is gone and the child is playing. The parent asks to go home. What does the nurse tell the parent?",
    options: ["\"She can go now, since the stridor at rest has cleared.\"", "\"She needs a chest x-ray before she can be discharged.\"", "\"We'll watch her a few more hours in case the medicine wears off.\"", "\"She must stay overnight until the steroid starts to work.\""],
    answer: 2,
    rationale: "Racemic epinephrine works quickly but wears off in about 2 hours, and stridor can return, so the child is observed for several hours (often 2 to 4) after the dose. Discharging at 40 minutes misses that rebound window. A chest x-ray is not routine for croup, and a child who stays stable after observation does not need to stay overnight for the steroid.",
    lens: { medic: "On a croup call, nebulized epinephrine buys time and the child often looks better by arrival.", nurse: "In the ED and on the unit, that improvement is not the end point; the child is watched for a few hours after the dose before anyone goes home." } },
  m12b6: { area: "HPM", type: "single", cj: "Evaluate outcomes",
    stem: "A 3-year-old client with mild croup received oral dexamethasone and is going home. The child has a barking cough but no stridor at rest. Which statement by the parent shows the teaching was understood?",
    options: ["\"Sitting in a steamy bathroom is what will fix his cough.\"", "\"If he has noisy breathing at rest, I'll get help right away.\"", "\"I'll give him an over-the-counter cough syrup at bedtime.\"", "\"I'll keep him lying flat at night so his airway stays open.\""],
    answer: 1,
    rationale: "Stridor at rest means the airway is narrowing and the child needs to be seen right away. Steam and mist have not been shown to treat croup, and hot water carries a scald risk. Over-the-counter cough medicine is not recommended for young children, and an upright position is more comfortable than lying flat." },
  m12b7: { area: "HPM", type: "single", cj: "Evaluate outcomes",
    stem: "The nurse watches the parent of a 2-year-old client give albuterol with a metered-dose inhaler, spacer, and face mask. Which action needs correction?",
    options: ["The parent shakes the inhaler before attaching it to the spacer", "The parent seals the mask over the child's nose and mouth", "The parent sprays two puffs into the spacer at the same time", "The parent keeps the mask on for about six breaths after a puff"],
    answer: 2,
    rationale: "Each puff is given one at a time, with the child taking several breaths through the mask before the next puff. Two puffs at once lower the dose the child actually inhales. Shaking the inhaler, sealing the mask over the nose and mouth, and keeping it on for about six breaths are all correct." },
  m12b8: { area: "HPM", type: "multi", cj: "Evaluate outcomes",
    stem: "An 8-year-old client with persistent asthma is prescribed inhaled fluticasone twice daily and albuterol as needed. Which statements by the parent show correct understanding? Select all that apply.",
    options: ["\"She uses the fluticasone every day, even when she feels fine.\"", "\"If she needs albuterol more than twice a week, I'll call the clinic.\"", "\"When she starts to wheeze, I'll give her two puffs of fluticasone.\"", "\"Once she has a good month, I'll stop the fluticasone on my own.\"", "\"Albuterol keeps her lungs calm, so she takes it each morning.\""],
    answer: [0, 1],
    rationale: "Fluticasone is a controller that reduces airway inflammation over time, so it is taken daily even when the child is well. Needing albuterol more than twice a week suggests poor control and calls for review. Fluticasone does not relieve an acute attack, it should not be stopped without the provider, and albuterol is the rescue drug, not a daily controller." },
  m12b9: { area: "PHYS", type: "single", cj: "Take action",
    stem: "An 18-month-old client with unrepaired tetralogy of Fallot starts crying hard after a blood draw. The child becomes deeply blue around the lips, breathes fast and deep, and goes limp. What does the nurse do first?",
    options: ["Place the child in a knee-chest position", "Lay the child flat and raise both legs", "Offer a bottle of juice to calm the child", "Start chest compressions for poor perfusion"],
    answer: 0,
    rationale: "This is a hypercyanotic (tet) spell. Folding the knees to the chest raises systemic vascular resistance, which pushes more blood through the lungs and less across the defect. Lying flat with the legs raised does not have this effect, giving juice to a limp, blue child risks aspiration, and the child has a pulse, so compressions are not indicated. Oxygen and medications such as morphine follow per prescription.",
    lens: { medic: "A blue, limp child pulls a medic straight toward the airway and the BVM.", nurse: "With a known tet spell, the first move is knees to chest while you hold and calm the child, then oxygen and prescribed medications." } },
  m12b10: { area: "PPT", type: "single", cj: "Take action",
    stem: "A 4-month-old client with a large ventricular septal defect and heart failure is due for oral digoxin. The nurse counts an apical pulse of 84 for a full minute. The infant's usual rate is 130 to 140. What does the nurse do?",
    options: ["Give the dose, then recheck the pulse later", "Give half the dose and notify the provider", "Give the dose mixed into the next bottle", "Hold this dose and let the provider know"],
    answer: 3,
    rationale: "An infant's digoxin is usually held when the apical rate falls below about 90 to 110, and 84 is far below this infant's baseline. Bradycardia can be an early sign of digoxin toxicity, so the provider needs to know and may check a level and potassium. The nurse does not change the dose on their own, and mixing a drug into a bottle risks an incomplete dose." },
  m12b11: { area: "PHYS", type: "multi", cj: "Recognize cues",
    stem: "A 3-year-old client has had a fever of 39.5°C (103.1°F) for 6 days that does not respond to acetaminophen. Which other findings support Kawasaki disease? Select all that apply.",
    options: ["Redness of both eyes with no drainage", "Bright red tongue with red, cracked lips", "Red, swollen hands and feet", "One enlarged, firm lymph node in the neck", "Thick yellow drainage crusting both eyelids", "Small blisters inside the mouth and on the palms"],
    answer: [0, 1, 2, 3],
    rationale: "Kawasaki disease causes prolonged fever with bilateral eye redness without pus, a strawberry tongue with cracked lips, swelling and redness of the hands and feet, and often a single enlarged neck node. Thick yellow eye drainage points to bacterial conjunctivitis. Blisters in the mouth and on the palms suggest hand, foot, and mouth disease." },
  m12b12: { area: "PPT", type: "single", cj: "Generate solutions",
    stem: "A 4-year-old client with Kawasaki disease received IVIG and is going home on daily low-dose aspirin. Which instruction does the nurse include in the discharge teaching?",
    options: ["\"Give ibuprofen with the aspirin whenever she has a fever.\"", "\"Stop the aspirin once she has gone 2 days without a fever.\"", "\"Her MMR and chickenpox vaccines will wait about 11 months.\"", "\"Give her acetaminophen instead of aspirin if her stomach hurts.\""],
    answer: 2,
    rationale: "Antibodies in IVIG can keep live vaccines such as MMR and varicella from working, so these are usually delayed about 11 months. Low-dose aspirin continues for weeks to protect the coronary arteries, often until a follow-up echocardiogram. Ibuprofen can block aspirin's antiplatelet effect, and acetaminophen does not replace that effect." },
  m12b13: { area: "PHYS", type: "single", cj: "Analyze cues",
    stem: "A 5-week-old client has had forceful, nonbilious vomiting after almost every feeding for 4 days and acts hungry right afterward. Ultrasound confirms pyloric stenosis. Which set of lab results does the nurse expect?",
    options: ["Low chloride, low potassium, high pH, high bicarbonate", "High chloride, high potassium, low pH, low bicarbonate", "Low sodium, high potassium, low pH, normal bicarbonate", "High sodium, low potassium, low pH, normal bicarbonate"],

  m12b14: { area: "PHYS", type: "single", cj: "Take action",
    stem: "A 10-month-old client with suspected intussusception has had episodes of screaming with the knees drawn up and passed a stool with blood and mucus. While the nurse prepares the infant for an air enema, the infant passes a normal brown stool and settles down. What does the nurse do?",
