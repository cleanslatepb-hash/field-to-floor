<body>
<title>Field to Floor</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Public+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: one narrow app column (phone-first), a sticky top bar on ECG-paper grid, cards only for questions and chart panels. */
:root {
  --bg: #f2f4f6;
  --surface: #ffffff;
  --sunk: #e8ecef;
  --ink: #14202b;
  --muted: #56636f;
  --line: #d3dae0;
  --medic: #c2321e;
  --medic-tint: #fbe9e6;
  --nurse: #0d7680;
  --nurse-tint: #e1f2f3;
  --good: #2c7a38;
  --good-tint: #e6f3e7;
  --bad: #b3261e;
  --bad-tint: #fbe8e7;
  --warn: #a96300;
  --grid: rgba(194, 50, 30, 0.10);
  --ecg-bg: #fffafa;
  --ecg-grid: rgba(214, 60, 60, 0.20);
  --ecg-grid-major: rgba(214, 60, 60, 0.50);
  --ecg-trace: #15171a;
  --f-display: "Barlow Condensed", "Arial Narrow", "Helvetica Neue", Arial, sans-serif;
  --f-body: "Public Sans", -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e141a; --surface: #161f28; --sunk: #1d2832; --ink: #e5ecf2; --muted: #9aa8b4; --line: #2a3743;
    --medic: #ff7a63; --medic-tint: #3a1f1b; --nurse: #44c4cd; --nurse-tint: #13313a;
    --good: #66c675; --good-tint: #183020; --bad: #ff7b72; --bad-tint: #3a1d1c; --warn: #f0a845;
    --grid: rgba(255, 122, 99, 0.08); --ecg-bg: #191113; --ecg-grid: rgba(255, 110, 110, 0.13); --ecg-grid-major: rgba(255, 110, 110, 0.32); --ecg-trace: #eef4f6; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e141a; --surface: #161f28; --sunk: #1d2832; --ink: #e5ecf2; --muted: #9aa8b4; --line: #2a3743;
  --medic: #ff7a63; --medic-tint: #3a1f1b; --nurse: #44c4cd; --nurse-tint: #13313a;
  --good: #66c675; --good-tint: #183020; --bad: #ff7b72; --bad-tint: #3a1d1c; --warn: #f0a845;
  --grid: rgba(255, 122, 99, 0.08); --ecg-bg: #191113; --ecg-grid: rgba(255, 110, 110, 0.13); --ecg-grid-major: rgba(255, 110, 110, 0.32); --ecg-trace: #eef4f6; color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 16px; line-height: 1.5; }
.topbar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
  background-color: var(--surface);
  background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 8px 8px;
  border-bottom: 1px solid var(--line);
}
.wrap { max-width: 760px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.topbar .wrap { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-block: 10px; flex-wrap: wrap; }
.brand { font-family: var(--f-display); font-weight: 700; font-size: 26px; letter-spacing: 0.02em; text-transform: uppercase; line-height: 1; display: flex; align-items: center; gap: 8px; }
.brand svg { flex: none; }
.brand .to { color: var(--muted); font-weight: 600; }
.brand .field { color: var(--medic); }
.brand .floor { color: var(--nurse); }
.review-strip { background: var(--sunk); border-top: 1px solid var(--line); font-size: 12px; color: var(--muted); }
.review-strip .wrap { padding-block: 6px; }
nav { display: flex; gap: 4px; flex-wrap: wrap; }
nav button { font: 600 14px var(--f-body); color: var(--muted); background: transparent; border: 0; border-radius: 6px; padding: 8px 10px; cursor: pointer; }
nav button[aria-current="page"] { color: var(--ink); background: var(--sunk); }
nav button .count { font-family: var(--f-mono); font-size: 12px; color: var(--bad); margin-left: 4px; }
main.wrap { padding-block: 24px 64px; display: grid; gap: 20px; }
h1, h2, h3 { font-family: var(--f-display); font-weight: 700; line-height: 1.1; margin: 0; text-wrap: balance; }
h1 { font-size: 34px; letter-spacing: 0.01em; }
h2 { font-size: 26px; }
h3 { font-size: 20px; letter-spacing: 0.01em; }
p { margin: 0; }
.lead { color: var(--muted); max-width: 62ch; }
.eyebrow { font: 600 12px var(--f-body); letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.stack { display: grid; gap: 12px; min-width: 0; }
.row { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 20px; display: grid; gap: 14px; min-width: 0; }
.btn { font: 600 15px var(--f-body); border-radius: 8px; padding: 11px 18px; cursor: pointer; border: 1px solid var(--line); background: var(--surface); color: var(--ink); }
.btn.primary { background: var(--nurse); border-color: var(--nurse); color: var(--surface); }
.btn.primary:disabled { opacity: 0.4; cursor: not-allowed; }
.btn.quiet { background: transparent; border-color: transparent; color: var(--muted); padding-inline: 6px; }
.btn:focus-visible, nav button:focus-visible, .opt:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, .seg button:focus-visible { outline: 3px solid var(--nurse); outline-offset: 2px; }
.stem { font-size: 17px; font-weight: 500; max-width: 65ch; }
.hint { font-size: 13px; color: var(--muted); }
.opts { display: grid; gap: 8px; }
.opt { display: flex; gap: 12px; align-items: flex-start; text-align: left; width: 100%; font: 400 15px/1.45 var(--f-body); color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; cursor: pointer; }
.opt .key { font: 500 13px var(--f-mono); flex: none; width: 24px; height: 24px; border: 1px solid var(--line); display: grid; place-items: center; border-radius: 6px; color: var(--muted); }
.opt.multi .key { border-radius: 4px; }
.opt[aria-pressed="true"] { border-color: var(--nurse); background: var(--nurse-tint); }
.opt[aria-pressed="true"] .key { background: var(--nurse); border-color: var(--nurse); color: var(--surface); }
.opt.is-right { border-color: var(--good); background: var(--good-tint); }
.opt.is-wrong { border-color: var(--bad); background: var(--bad-tint); }
.opt:disabled { cursor: default; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.seg button { font: 600 14px var(--f-body); border: 0; background: var(--surface); color: var(--muted); padding: 8px 14px; cursor: pointer; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--surface); }
.feedback { border-radius: 8px; padding: 14px 16px; display: grid; gap: 8px; }
.feedback.right { background: var(--good-tint); }
.feedback.wrong { background: var(--bad-tint); }
.feedback .verdict { font-family: var(--f-display); font-size: 20px; font-weight: 700; }
.feedback.right .verdict { color: var(--good); }
.feedback.wrong .verdict { color: var(--bad); }
.lens { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.lens > div { border-radius: 8px; padding: 12px 14px; font-size: 14px; display: grid; gap: 4px; min-width: 0; }
.lens .m { background: var(--medic-tint); }
.lens .n { background: var(--nurse-tint); }
.lens .tag { font: 700 13px var(--f-display); letter-spacing: 0.08em; text-transform: uppercase; }
.lens .m .tag { color: var(--medic); }
.lens .n .tag { color: var(--nurse); }
@media (max-width: 560px) { .lens { grid-template-columns: 1fr; } }
.chart { background: var(--sunk); border-radius: 8px; padding: 14px 16px; display: grid; gap: 10px; }
.chart .time { font: 500 13px var(--f-mono); color: var(--muted); }
.vitals { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 8px; }
.vital { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; display: grid; gap: 2px; }
.vital .k { font-size: 12px; color: var(--muted); }
.vital .v { font: 500 15px var(--f-mono); font-variant-numeric: tabular-nums; }
.vital.flag { border-color: var(--warn); }
.vital.flag .v { color: var(--warn); }
.notes { margin: 0; padding-left: 18px; display: grid; gap: 4px; font-size: 15px; }
.sbar { display: grid; gap: 6px; font-size: 15px; }
.sbar div { display: grid; grid-template-columns: 22px 1fr; gap: 8px; }
.sbar b { font-family: var(--f-mono); color: var(--nurse); }
.steps { display: flex; gap: 4px; }
.steps span { flex: 1; height: 6px; border-radius: 3px; background: var(--line); }
.steps span.done { background: var(--nurse); }
.steps span.now { background: var(--medic); }
.cj { font: 600 13px var(--f-body); color: var(--nurse); }
.next-up { border-left: 4px solid var(--medic); }
.module-list { display: grid; gap: 8px; }
.mod { display: grid; grid-template-columns: 40px 1fr auto; gap: 12px; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; }
.mod .num { font: 700 22px var(--f-display); color: var(--muted); text-align: center; }
.mod .t { font-weight: 600; }
.mod .a { font-size: 13px; color: var(--muted); }
.mod .status { font-size: 13px; color: var(--muted); white-space: nowrap; }
.mod.active { border-color: var(--nurse); }
.mod.active .num { color: var(--nurse); }
.bars { display: grid; gap: 10px; }
.bar { display: grid; grid-template-columns: minmax(0, 1fr) 72px; gap: 4px 12px; align-items: center; font-size: 14px; }
.bar .track { grid-column: 1 / -1; height: 8px; background: var(--sunk); border-radius: 4px; overflow: hidden; }
.bar .fill { height: 100%; background: var(--nurse); border-radius: 4px; }
.bar .num { font-family: var(--f-mono); font-size: 13px; text-align: right; color: var(--muted); font-variant-numeric: tabular-nums; }
.table-wrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 14px; }
th, td { text-align: left; padding: 10px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-size: 12px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); font-weight: 600; }
td.mono { font-family: var(--f-mono); font-size: 13px; white-space: nowrap; }
.pill { display: inline-block; font: 600 12px var(--f-body); padding: 2px 8px; border-radius: 99px; background: var(--sunk); color: var(--muted); white-space: nowrap; }
.pill.bad { background: var(--bad-tint); color: var(--bad); }
.pill.warn { background: var(--sunk); color: var(--warn); }
.pill.good { background: var(--good-tint); color: var(--good); }
label { font-weight: 600; font-size: 14px; display: grid; gap: 6px; }
input, select, textarea { font: 400 15px var(--f-body); color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; width: 100%; }
textarea { min-height: 160px; resize: vertical; line-height: 1.5; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
@media (max-width: 560px) { .grid2 { grid-template-columns: 1fr; } }
.conf-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px 12px; align-items: center; font-size: 14px; }
.check { display: flex; gap: 10px; align-items: flex-start; font-weight: 400; font-size: 15px; }
.check input { width: 18px; height: 18px; margin-top: 3px; flex: none; }
.score { font: 700 56px var(--f-display); line-height: 1; }
.score small { font-size: 24px; color: var(--muted); }
.tester { border-style: dashed; }
.src { font-size: 13px; color: var(--muted); }
.src a { color: var(--nurse); }
.recall { display: grid; gap: 10px; padding-block: 4px 14px; border-bottom: 1px solid var(--line); }
.recall:last-of-type { border-bottom: 0; }
.recall textarea { min-height: 72px; }
.model { background: var(--nurse-tint); border-radius: 8px; padding: 12px 14px; font-size: 15px; }
.chartlog { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 10px 14px; }
.chartlog summary { cursor: pointer; font-weight: 600; font-size: 14px; }
.chartlog .entry { border-top: 1px solid var(--line); padding-top: 10px; margin-top: 10px; display: grid; gap: 4px; font-size: 14px; }
.chartlog .entry .time { font: 500 12px var(--f-mono); color: var(--muted); }
.exhibits { display: grid; gap: 12px; }
.exhibit { margin: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; min-width: 0; }
.ex-tab { font: 700 12px var(--f-body); letter-spacing: 0.06em; text-transform: uppercase; color: var(--nurse); background: var(--nurse-tint); padding: 6px 12px; border-bottom: 1px solid var(--line); }
.ex-scroll { overflow-x: auto; }
.exhibit figcaption { font-size: 13px; color: var(--muted); padding: 8px 12px; border-top: 1px solid var(--line); }
.ex-meta { font-family: var(--f-mono); font-size: 11px; margin-left: 6px; }
.ecg { display: block; max-width: none; }
.ecg-grid { display: grid; grid-template-columns: repeat(2, max-content); gap: 2px; background: var(--ecg-grid-major); width: max-content; }
table.ehr { font-size: 13px; min-width: 100%; }
table.ehr th, table.ehr td { padding: 6px 12px; white-space: nowrap; }
table.ehr td.ex-flag { color: var(--bad); font-weight: 600; }
.summary-line { font-size: 14px; color: var(--muted); }
.copy-out { font-family: var(--f-mono); font-size: 12px; min-height: 120px; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(20px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--surface); padding: 10px 16px; border-radius: 8px; font-weight: 600; font-size: 14px; }
@media (prefers-reduced-motion: no-preference) { .card { animation: rise 0.18s ease-out; } @keyframes rise { from { transform: translateY(4px); } to { transform: none; } } }
</style>

<header class="topbar">
  <div class="wrap">
    <div class="brand" aria-label="Field to Floor">
      <svg width="34" height="20" viewBox="0 0 34 20" aria-hidden="true"><path d="M0 12h8l3-8 4 14 3-10 2 4h14" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" style="color: var(--medic)"/></svg>
      <span><span class="field">Field</span> <span class="to">to</span> <span class="floor">Floor</span></span>
    </div>
    <nav id="nav" aria-label="Main"></nav>
  </div>
  <div class="review-strip"><div class="wrap">Prototype. Clinical review pending. Not for patient care decisions or exam-readiness assessment.</div></div>
</header>
<main class="wrap" id="app"></main>
<div class="toast" id="toast" hidden></div>

<script>
(() => {
"use strict";

/* ---------- NCLEX-RN 2026 test plan areas ---------- */
const AREAS = {
  MOC:  "Management of Care",
  SIPC: "Safety and Infection Prevention and Control",
  HPM:  "Health Promotion and Maintenance",
  PSY:  "Psychosocial Integrity",
  BCC:  "Basic Care and Comfort",
  PPT:  "Pharmacological and Parenteral Therapies",
  RRP:  "Reduction of Risk Potential",
  PHYS: "Physiological Adaptation"
};

/* ---------- Course library (only module 5A is built) ---------- */
const MODULES = [
  { n: "1", t: "From the rig to the floor", a: ["MOC", "BCC"], built: "rig" },
  { n: "2", t: "The nursing process and clinical judgment", a: ["MOC", "PHYS", "SIPC"], built: "np" },
  { n: "3", t: "Prioritization, delegation, and assignment", a: ["MOC", "SIPC", "RRP"], built: "as" },
  { n: "4", t: "Safety, ethics, and legal", a: ["SIPC", "MOC", "PSY"], built: "lg" },
  { n: "5A", t: "Cardiac: Chest Pain, Shift Two", a: ["PHYS", "RRP", "PPT"], built: "stemi" },
  { n: "5B", t: "Cardiac: Heart Failure, Day Two", a: ["PHYS", "PPT", "RRP"], built: "hf" },
  { n: "6", t: "Respiratory: Chest Tube, Day One", a: ["PHYS", "RRP", "PPT"], built: "rs" },
  { n: "7", t: "Neuro: After the Clot-Buster", a: ["PHYS", "RRP", "PPT"], built: "nr" },
  { n: "8", t: "Endocrine: The Insulin Drip", a: ["PHYS", "RRP", "PPT"], built: "en" },
  { n: "9", t: "GI: Varices and the Liver", a: ["PHYS", "RRP", "SIPC"], built: "gi" },
  { n: "10", t: "Pharmacology: When the Naloxone Wears Off", a: ["PPT", "SIPC"], built: "ph" },
  { n: "11", t: "Maternal: After the Back-Seat Birth", a: ["HPM", "PHYS", "RRP"], built: "ob" },
  { n: "12", t: "Pediatrics: After the Febrile Seizure", a: ["HPM", "PHYS", "RRP"], built: "pd" },
  { n: "13", t: "Mental Health: After the Bridge", a: ["PSY", "PPT", "SIPC"], built: "mh" },
  { n: "14", t: "NCLEX Strategy: Charge Nurse After the Fire", a: ["MOC", "SIPC", "RRP"], built: "ns" }
];

/* ---------- Items ---------- */
const ITEMS = {
  /* Baseline: ACS and post-PCI care */
  b1: { area: "PPT", type: "single",
    stem: "A client has an inferior STEMI. BP is 86/50, the lungs are clear, and a right-sided ECG shows ST elevation in V4R. Which prescription should the nurse question?",
    options: ["0.9% saline 500 mL bolus", "Aspirin 324 mg chewed", "Nitroglycerin 0.4 mg sublingual", "Oxygen to keep SpO2 at 90% or higher"],
    answer: 2,
    rationale: "Right ventricular infarction makes the heart depend on preload. Nitroglycerin drops preload and can crash the blood pressure. Fluids, aspirin, and oxygen for a low SpO2 all fit this client.",
    lens: { medic: "You'd hold nitro by protocol and never think twice.", nurse: "Same physiology, new job: you question an order that's already been written. A prescription is not automatically safe." } },
  b2: { area: "RRP", type: "single",
    stem: "Four hours after a PCI through the femoral artery, the client reports new lower back pain. HR is 118 and BP is 92/58, down from 128/76. The groin dressing is dry and the site is soft. What does the nurse suspect?",
    options: ["Muscle strain from lying flat", "Retroperitoneal bleeding", "Reperfusion dysrhythmia", "Contrast reaction"],
    answer: 1,
    rationale: "Back or flank pain, a rising heart rate, and a falling BP after femoral access is a retroperitoneal bleed until proven otherwise. The blood collects behind the abdomen, so the groin can look perfect." },
  b3: { area: "RRP", type: "single",
    stem: "A client had a PCI through the right radial artery. Which finding should the nurse report immediately?",
    options: ["A small bruise at the puncture site", "Soreness at the wrist when the hand moves", "Cool, pale, numb fingers on the right hand", "Compression band on the wrist, fingers warm and pink"],
    answer: 2,
    rationale: "Cool, pale, numb fingers mean blood flow to the hand is compromised, from a closed radial artery or a band that is too tight. That is a limb threat. The others are expected after radial access.",
    lens: { medic: "You check a pulse distal to an injury once, on scene.", nurse: "The access site is a wound you own for hours. Circulation, sensation, and movement of that hand get checked every round." } },
  b4: { area: "PPT", type: "single",
    stem: "A client with a new drug-eluting stent is taking aspirin and clopidogrel. Which statement shows they need more teaching?",
    options: ["\"I'll tell my dentist I take both of these before any dental work.\"", "\"If my gums bleed a little, I'll stop taking the clopidogrel.\"", "\"I'll switch to a soft toothbrush and use an electric razor to shave.\"", "\"I'll call my provider if my stool turns black or looks like tar.\""],
    answer: 1,
    rationale: "Stopping dual antiplatelet therapy early can clot the new stent, which can be fatal. Minor gum bleeding gets reported, but the client never stops the drug on their own." },
  b5: { area: "MOC", type: "single",
    stem: "Which task can the RN assign to the unlicensed assistive personnel (UAP)?",
    options: ["Checking the femoral puncture site for a new hematoma", "Taking vital signs on a stable client 6 hours after PCI", "Teaching a client to use sublingual nitroglycerin at home", "Evaluating whether chest pain improved after IV morphine"],
    answer: 1,
    rationale: "Routine vital signs on a stable client are data collection, which UAPs can do. Assessment, teaching, and evaluation stay with the RN." },
  b6: { area: "MOC", type: "single",
    stem: "The telemetry nurse gets report on four clients. Which one should the nurse see first?",
    options: ["A client 2 hours after PCI with new chest pressure and new ST elevation", "A client with heart failure asking for acetaminophen for a mild headache", "A client with potassium 3.4 mEq/L whose scheduled oral furosemide is due", "A client waiting for discharge teaching who is eager to get home today"],
    answer: 0,
    rationale: "New chest pressure and new ST elevation 2 hours after a stent is acute stent thrombosis until proven otherwise. That client is the only unstable one. Unstable before stable, new before expected.",
    lens: { medic: "On the truck you'd never pick the furosemide. One patient, the sick one.", nurse: "The exam lists four reasonable tasks. Find the one that kills if it waits 10 minutes." } },

Object.assign(ITEMS, {
  ms1: { area: "MOC", type: "single",
    stem: "A busy coworker hands you a syringe she drew up and asks you to give it to her patient in Rm 8. What do you do?",
    options: ["Give it, since she's an experienced nurse and you trust her", "Give it if the syringe label looks correct to you", "Decline to give it, and offer to help her another way", "Give it and have her co-sign the MAR entry afterward"],
    answer: 2,
    rationale: "Whoever gives a medication is responsible for the rights of medication administration, and you can't verify a med someone else drew up. Offer to help with something else so she can give it herself." },
  ms2: { area: "BCC", type: "single",
    stem: "A client 1 day after abdominal surgery is seen blowing hard into an incentive spirometer. The client says, \"I do this once before bed.\" What does the nurse reinforce?",
    options: ["\"Blow out into it hard to clear the mucus from your lungs.\"", "\"Breathe in slowly and deeply, hold it, 10 times an hour.\"", "\"Use it when you feel short of breath to open your airways.\"", "\"Take 10 quick, shallow breaths into it before each meal.\""],
    answer: 1,
    rationale: "An incentive spirometer is an inhale device. Slow, deep breaths with a brief hold, about 10 times an hour while awake, help prevent atelectasis and pneumonia after surgery. Blowing out, waiting for shortness of breath, or taking quick shallow breaths does not inflate the lungs." },
  ms3: { area: "SIPC", type: "single",
    stem: "An 82-year-old client with confusion keeps trying to climb out of bed and is at high risk for falls. The nurse is about to leave the room. What does the nurse do?",
    options: ["Raise both upper and lower side rails on each side", "Close the door and dim the lights so the client rests", "Remind the client to call for help before getting up", "Lower and lock the bed and put the call light in reach"],
    answer: 3,
    rationale: "A low, locked bed with the call light and personal items in reach is the basic fall step every time the nurse leaves. Four raised rails count as a restraint and raise injury risk if the client climbs over. A closed door blocks the view of the client, and a confused client cannot reliably remember a reminder." },
  ms4: { area: "MOC", type: "single",
    stem: "A client refuses his scheduled blood pressure pill. What does the nurse do?",
    options: ["Crush it into his applesauce without telling him it's there", "Tell him firmly that he has to take it because it's prescribed", "Ask why, respect his choice, notify the provider, document", "Skip it without charting so it doesn't look like a refusal"],
    answer: 2,
    rationale: "A competent adult can refuse any medication. Your job is to find out why, make sure he understands, report it, and chart it. Hiding meds in food without consent is never allowed.",
    lens: { medic: "You've run plenty of refusals: capacity, risks explained, sign here.", nurse: "Same rights, many more times a shift. A refused pill gets the same care as a refused transport." } },
  ms5: { area: "PSY", type: "single",
    stem: "Mrs. Grant's daughter says, angry, \"She was fine before surgery. What did you people do to her?\" What is the best response?",
    options: ["\"It's not our fault. This kind of thing just happens to older people after surgery.\"", "\"Please calm down. She's fine, and she'll be back to normal by tomorrow.\"", "\"You'll have to talk to the doctor about that when he rounds.\"", "\"This must be scary. Confusion after surgery is common. Here's how you can help.\""],
    answer: 3,
    rationale: "Acknowledge the feeling, give accurate information, and give her a role. Family presence is one of the best delirium treatments. Blaming, deflecting, and dismissing all shut her out.",
    src: "mpDelirium" },
  mt1: { area: "BCC", type: "multi",
    stem: "Which teaching helps Mrs. Grant's daughter support her while she's in the hospital? Select all that apply.",
    options: ["Bring her glasses and hearing aids, and make sure she has them on", "Keep the room dark and quiet through the day so she can sleep", "Visit during the day and talk about familiar people and events", "Bring her sleeping pill from home so she rests tonight", "Bring a few family photos and remind her of the date and where she is"],
    answer: [0, 2, 4],
    rationale: "Sensory aids, familiar faces and things, and gentle reorientation help clear delirium. A dark room during the day blurs day and night, and sedatives from home can make delirium worse and may interact with her hospital meds.",
    src: "mpDelirium" }
});

Object.assign(ITEMS, {
  /* Module 1 */
  mb9: { area: "SIPC", type: "single",
    stem: "A 45-year-old client arrives on the unit with 6 weeks of night sweats, weight loss, and a cough with blood-streaked sputum. Sputum tests are pending. Which room and PPE does the nurse request?",
    options: ["Private room with the door shut, plus gown and gloves", "Private room, plus a surgical mask within 6 feet", "Semi-private room, with standard precautions for now", "Negative-pressure room, plus a fit-tested N95"],
    answer: 3,
    rationale: "These findings suggest active tuberculosis, which spreads through tiny airborne particles. Airborne precautions start on suspicion, not after results, and need a negative-pressure room and a fit-tested N95. Contact gear, a surgical mask, or standard precautions do not stop airborne spread." },
  mb10: { area: "SIPC", type: "single",
    stem: "A new nurse is preparing to enter the room of a client on contact and droplet precautions. After hand hygiene, the new nurse puts on gloves first. What does the precepting nurse tell the new nurse?",
    options: ["Put the gown on first so the gloves cover its cuffs", "Gloves first is correct, and the gown goes on next", "Put the goggles on first so the eyes are covered", "Put the mask on first, then the gloves over the gown"],
    answer: 0,
    rationale: "The donning order is gown, mask or respirator, eye protection, then gloves last so they cover the gown cuffs. Starting with goggles, the mask, or gloves breaks that sequence. When removing PPE, gloves come off first because they are the dirtiest." },
  mb11: { area: "MOC", type: "single",
    stem: "Right before signing a surgical consent, the client says, \"I'm not really sure what they're going to do.\" What does the nurse do?",
    options: ["Stop and ask the surgeon to explain the procedure again", "Explain the surgery yourself so the case can start on time", "Have the client sign, since the surgeon already explained it", "Ask a family member to sign the consent for the client instead"],
    answer: 0,
    rationale: "Explaining the procedure, risks, and options is the provider's job. The nurse witnesses the signature and confirms the client understands. If they don't, the consent isn't informed: stop and get the surgeon back." },
  mb12: { area: "MOC", type: "single",
    stem: "A caller says she is the client's sister and asks how he's doing after surgery. What does the nurse do?",
    options: ["Give her a brief update, since she's immediate family", "Read her the latest vital signs from the flowsheet", "Tell her he's stable, but don't share any other details", "Confirm he has authorized her before sharing anything"],
    answer: 3,
    rationale: "Under HIPAA, being family isn't enough. Share only with people the client has authorized, using your facility's process. Even \"he's stable\" confirms he's a patient there." },
  mb13: { area: "BCC", type: "single",
    stem: "Eight hours after surgery, a client hasn't voided and the lower abdomen is firm above the pubic bone. What does the nurse do first?",
    options: ["Insert a straight catheter", "Encourage him to drink more fluids", "Do a bladder scan per protocol", "Wait until 12 hours have passed"],
    answer: 2,
    rationale: "Retention is common after surgery and anesthesia. A bladder scan confirms how much is there before deciding on a catheter, which needs an order or protocol. More fluid would only fill the bladder further." },
  mb14: { area: "BCC", type: "single",
    stem: "A client asks for his PRN pain medicine. What does the nurse do first?",
    options: ["Assess the pain: location, intensity, and quality", "Give the strongest dose that's prescribed for his pain", "Ask him to wait until the next scheduled time", "Give the medication and assess the pain afterward"],
    answer: 0,
    rationale: "Assess before you treat: a new or different pain may mean a complication, not just a need for more medicine. The assessment also sets the baseline you'll reassess against." },
  mb15: { area: "RRP", type: "single",
    stem: "On day 2 after hip surgery, a client has new pain, warmth, and swelling in one calf. What does the nurse do?",
    options: ["Massage the calf gently to ease the muscle cramp", "Walk the client in the hall to improve circulation", "Apply a heating pad to the calf for about 20 minutes", "Avoid rubbing it and report it to the provider now"],
    answer: 3,
    rationale: "One-sided calf pain, warmth, and swelling after surgery is a DVT until proven otherwise. Rubbing it could dislodge a clot toward the lungs. Report it now; the provider decides on testing and anticoagulation." },
  mb16: { area: "SIPC", type: "single",
    stem: "A client with an absolute neutrophil count of 300/mm³ after chemotherapy has a visitor arrive with a cough and a bouquet of fresh flowers. What does the nurse do?",
    options: ["Allow the visit if the flowers stay on the windowsill", "Give the visitor an N95 and allow a short visit", "Allow the visit if the visitor washes hands first", "Ask the visitor to return when well, without flowers"],
    answer: 3,
    rationale: "With so few neutrophils, ordinary germs can cause a life-threatening infection. Sick visitors should stay away, and fresh flowers carry soil and standing-water organisms. A mask or hand washing does not make a coughing visitor safe, and moving the flowers to the windowsill still keeps them in the room." },
  mb17: { area: "MOC", type: "single",
    stem: "The nurse calls the provider about a client 1 day after a colectomy. S: \"His BP dropped to 88/50 and his heart rate is 118.\" B: \"He takes apixaban for atrial fibrillation.\" A: \"His dressing is soaked with blood, and I think he is bleeding.\" What does the nurse say for the Recommendation?",
    options: ["\"He is 68 and was on apixaban until two days ago.\"", "\"His abdomen is firm and tender to light touch.\"", "\"Please see him now and order a STAT CBC.\"", "\"His last morphine dose was about two hours ago.\""],
    answer: 2,
    rationale: "The Recommendation is the nurse's request: what the nurse needs from the provider and when. Age and medication history belong in Background, and the abdominal finding belongs in Assessment. The morphine timing is also background, not a request.",
    lens: { medic: "Your radio report ends with your ETA.", nurse: "An SBAR ends with what you need from the provider, and when." } },
  mb18: { area: "PSY", type: "single",
    stem: "The night before surgery, a client says, \"I'm really scared about tomorrow.\" What is the nurse's best response?",
    options: ["\"Don't worry, your surgeon is the best.\"", "\"What worries you most about it?\"", "\"Everyone feels that way.\"", "\"Let me get you something to help you sleep.\""],
    answer: 1,
    rationale: "An open question lets the client name the actual fear, which you can then address. Reassurance, generalizing, and jumping to a sleeping pill all end the conversation." },
  mb19: { area: "HPM", type: "single",
    stem: "In October, a 70-year-old client with heart failure is being discharged. The client has not had a flu vaccine this season and says, \"I get hives from eggs.\" What does the nurse tell the client?",
    options: ["\"You can get the flu shot today, even with the allergy.\"", "\"You had one last year, so this season is covered.\"", "\"Your egg allergy means you should skip the flu shot.\"", "\"At 70, the vaccine is optional unless you work in care.\""],
    answer: 0,
    rationale: "The flu vaccine is recommended every year for everyone 6 months and older without a contraindication, and an egg allergy is no longer a reason to skip it. It is given yearly because the virus changes. Age and heart failure make this client more likely to have a severe case, not less likely to need the vaccine." },
  mb20: { area: "MOC", type: "multi",
    stem: "The RN is making assignments for the shift. Which tasks can the RN assign to the UAP? Select all that apply.",
    options: ["Giving a bed bath to a client with stable dementia", "Doing the admission assessment of a client from the ED", "Teaching a newly diagnosed client to give insulin", "Taking vital signs on a stable client 3 days post-op", "Deciding whether a client's pain eased after morphine", "Feeding lunch to a client with no swallowing problems"],
    answer: [0, 3, 5],
    rationale: "Routine care for stable clients, such as bathing, vital signs, and feeding, can be delegated to a UAP. Assessment, teaching, and evaluating a client's response need nursing judgment and stay with the RN." },

  /* 5A Chest Pain */
  b9: { area: "RRP", type: "single",
    stem: "A 61-year-old client in the emergency department has had 30 minutes of chest pressure. The first 12-lead ECG shows no ST elevation. Which lab result does the nurse report to the provider immediately?",
    options: ["Hemoglobin A1c of 6.1%", "Troponin I of 0.4 ng/mL", "Blood glucose of 146 mg/dL", "LDL cholesterol of 162 mg/dL"],
    answer: 1,
    rationale: "Troponin is the most specific marker of heart-muscle injury, and this value is well above the usual cutoff, so this client may be having an MI even without ST elevation. A normal-looking ECG does not rule out MI, which is why troponin is drawn and repeated. The A1c, glucose, and LDL are abnormal and need follow-up, but none of them changes the next hour of care." },
  b10: { area: "RRP", type: "single",
    stem: "A client returned 2 hours ago from a PCI done through the right femoral artery. He keeps bending his right leg and asks the nurse to raise the head of the bed high so he can eat. What does the nurse do?",
    options: ["Raise the head of the bed so he can eat more comfortably", "Place a pillow under the right knee to ease groin strain", "Remind him to keep the leg straight and keep the HOB low", "Let him turn onto his right side to press on the groin"],
    answer: 2,
    rationale: "Bending the hip and sitting up both put pressure on the femoral puncture and can cause bleeding or a hematoma. Keep the leg straight and the head of the bed low for the time the protocol sets. A pillow under the knee bends the hip, and lying on the site does not replace proper positioning and hides bleeding." },
  b11: { area: "PPT", type: "single",
    stem: "A client with suspected MI and no aspirin allergy says he swallowed one 81 mg enteric-coated aspirin at home an hour ago. The provider prescribes aspirin 324 mg. What does the nurse do?",
    options: ["Have him chew the prescribed dose of plain aspirin", "Hold the dose, since he took aspirin at home today", "Give the prescribed dose as an enteric-coated tablet", "Wait for the first troponin result before giving it"],
    answer: 0,
    rationale: "Chewed non-enteric-coated aspirin is absorbed fastest and blocks platelets quickly. One swallowed enteric-coated 81 mg tablet is slow and too small, so it does not count as the loading dose. Holding the dose or waiting for labs delays a drug that lowers the risk of death in MI." },
  b12: { area: "PHYS", type: "single",
    stem: "A 58-year-old client's 12-lead ECG shows ST elevation in leads II, III, and aVF. His BP is 88/56 and his heart rate is 52. Which additional finding does the nurse anticipate?",
    options: ["Crackles in both lungs and pink, frothy sputum", "Warm, flushed skin and bounding peripheral pulses", "A high fever and a new pericardial friction rub", "Clear lung sounds and distended jugular veins"],
    answer: 3,
    rationale: "II, III, and aVF show an inferior MI, usually from the right coronary artery, which also supplies the right ventricle. Right ventricular involvement causes low BP with distended neck veins and clear lungs. Crackles and frothy sputum point to left-sided failure, warm flushed skin does not fit low output, and pericarditis with fever comes days later.",
    lens: { medic: "You read these in your sleep.", nurse: "On the floor, the leads tell you which complications to watch for: inferior means bradycardia, AV block, and RV involvement." } },
  b13: { area: "PPT", type: "single",
    stem: "A 64-year-old client with chest pain lists tadalafil, last taken yesterday evening, among his home medicines. Which prescription does the nurse question?",
    options: ["Aspirin 324 mg chewed now", "Nitroglycerin 0.4 mg sublingual", "12-lead ECG within 10 minutes", "Troponin now and in 3 hours"],
    answer: 1,
    rationale: "Nitrates taken within 48 hours of tadalafil (24 hours for sildenafil) can cause severe, prolonged hypotension. The nurse holds the nitroglycerin and contacts the provider. Aspirin, a rapid ECG, and serial troponins are standard for chest pain and are safe with tadalafil." },
  b14: { area: "PPT", type: "multi",
    stem: "Mr. Hale calls 5 days after discharge. He takes aspirin and ticagrelor. Which things he describes does the nurse identify as possible bleeding? Select all that apply.",
    options: ["Feeling more tired than usual by late afternoon", "Bowel movements that look black and sticky", "Mild soreness where the wrist catheter went in", "Urine that has turned a pinkish color", "Vomited once, and it looked like coffee grounds"],
    answer: [1, 3, 4],
    rationale: "Black, sticky stool, pink urine, and coffee-ground vomit all point to bleeding inside the body, a known risk with two antiplatelet drugs. Some tiredness in the first week home and mild soreness at the radial site are expected after a stent." },
  b15: { area: "PHYS", type: "single",
    stem: "A client with an anterior STEMI arrives at a PCI-capable hospital at 0800, and the cath team is paged. At 0905 the team reports it needs another 45 minutes. What does the nurse do?",
    options: ["Notify the provider, since this will pass the 90-minute goal", "Document the delay, since the goal is within 6 hours", "Continue to monitor, since 180 minutes is the goal", "Reassure the client, since the goal is within 12 hours"],
    answer: 0,
    rationale: "The door-to-balloon goal at a PCI-capable hospital is 90 minutes or less, and this delay pushes the client past it. Every minute the artery stays closed, more heart muscle dies, so the delay needs escalating now. The 6-hour, 180-minute, and 12-hour times are not the door-to-balloon goal." },
  b16: { area: "HPM", type: "single",
    stem: "Which statement shows the client understands cardiac rehab?",
    options: ["\"It's meant for people who had open-heart surgery, not a stent.\"", "\"I can skip it since I feel fine now and my chest pain is gone.\"", "\"It's basically the same thing as working out at a regular gym.\"", "\"It's monitored exercise and teaching to cut my heart attack risk.\""],
    answer: 3,
    rationale: "Cardiac rehab is monitored exercise plus teaching about diet, meds, and risk factors. It's recommended after MI and stent placement and lowers the chance of dying from heart disease." },
  b17: { area: "PPT", type: "single",
    stem: "Mr. Hale, 2 days after his MI, has a heart rate of 88 and BP of 132/80. He asks why he needs metoprolol when his heart rate is normal. Which response by the nurse is best?",
    options: ["\"It dissolves any clot left in the artery around your stent.\"", "\"It raises your blood pressure so the heart gets more blood.\"", "\"It lowers your cholesterol so the stent stays open longer.\"", "\"It slows your heart so it needs less oxygen while it heals.\""],
    answer: 3,
    rationale: "Beta blockers slow the heart rate and lower blood pressure, so the injured heart needs less oxygen, and they lower the risk of dangerous rhythms. They do not dissolve clots, raise blood pressure, or lower cholesterol; those describe fibrinolytics, vasopressors, and statins." },
  b18: { area: "PHYS", type: "single",
    stem: "Which client is most likely to have a heart attack without classic crushing chest pain?",
    options: ["A 50-year-old man who runs marathons", "A 35-year-old man with no medical history", "A 72-year-old woman with type 2 diabetes", "A 45-year-old man with high cholesterol who smokes"],
    answer: 2,
    rationale: "Women, older adults, and people with diabetes often have atypical MI symptoms: fatigue, nausea, shortness of breath, or jaw or back pain without much chest pain." },
  b19: { area: "RRP", type: "single",
    stem: "A client is scheduled for a cardiac cath with IV contrast. Which item in his allergy history most needs the provider's attention before the procedure?",
    options: ["Hives and itching after eating shrimp", "A rash after taking amoxicillin as a child", "Hives during a CT scan with IV contrast", "Hand rash after wearing latex gloves"],
    answer: 2,
    rationale: "A prior reaction to contrast is the real risk factor for another one, and the provider may premedicate or change the plan. A shellfish allergy does not predict a contrast reaction, despite the old myth. The latex history should be noted for a latex-safe setup, and the penicillin rash does not affect contrast safety." },
  b20: { area: "MOC", type: "single",
    stem: "Which client on the telemetry unit is most appropriate to assign to the LPN?",
    options: ["A new admission with chest pain who needs an initial assessment", "A client who returned from the cath lab 30 minutes ago", "A client with new ST changes on the monitor this morning", "A client 2 days after PCI with stable vitals and oral meds due"],
    answer: 3,
    rationale: "LPNs care for stable clients with predictable needs. New admissions, fresh post-procedure clients, and unstable clients need RN assessment and judgment." },

  /* 5B Heart Failure */
  hb9: { area: "PHYS", type: "multi",
    stem: "The nurse assesses a 70-year-old client admitted with heart failure and notes the findings below. Which findings point to failure of the right ventricle? Select all that apply.",
    options: ["Wakes at night short of breath and must sit up", "Neck veins distended with the head of bed at 45 degrees", "Fine crackles heard in both lower lung fields", "3+ pitting edema of both ankles and feet", "A tender, enlarged liver and a growing abdomen"],
    answer: [1, 3, 4],
    rationale: "When the right ventricle fails, blood backs up into the body: distended neck veins, leg edema, an enlarged liver, and ascites. Waking short of breath at night and crackles come from the left ventricle backing fluid up into the lungs." },
  hb10: { area: "PPT", type: "single",
    stem: "While the nurse gives IV furosemide, the client says his ears are ringing. What is the most likely cause?",
    options: ["Ototoxicity from pushing the dose too fast", "A low potassium level from the diuretic effect", "An early allergic reaction to the medication", "A normal, expected response to rapid diuresis"],
    answer: 0,
    rationale: "Furosemide can damage hearing when pushed too fast or at high doses. Push it slowly per your drug reference and report ringing or hearing changes." },
  hb11: { area: "PPT", type: "single",
    stem: "A 78-year-old client with heart failure is due for digoxin 0.125 mg. The nurse counts an apical pulse of 56 and regular for 1 full minute. Potassium is 4.2 mEq/L and yesterday's digoxin level was 0.8 ng/mL. What does the nurse do?",
    options: ["Give the dose, then recheck the apical pulse in an hour", "Hold the dose and notify the provider of the pulse", "Give half the dose and recheck the potassium level", "Check a radial pulse and give the dose if it is over 60"],
    answer: 1,
    rationale: "The standard teaching is to hold digoxin for an adult apical pulse under 60 and notify the provider, even when the potassium and digoxin level are normal. Giving a full or partial dose ignores the low rate. A radial pulse can miss beats and does not replace the apical count. Always check facility parameters." },
  hb12: { area: "PPT", type: "single",
    stem: "Ernesto Delgado, 72, with heart failure and CKD stage 3, takes lisinopril and was recently started on spironolactone. At his follow-up visit he says he switched to a salt substitute to cut his sodium. Which lab result does the nurse check first?",
    options: ["Serum sodium", "Fasting glucose", "Serum calcium", "Serum potassium"],
    answer: 3,
    rationale: "Most salt substitutes are potassium chloride. Spironolactone and lisinopril both hold on to potassium, and CKD lowers how much the kidneys can clear, so he is at high risk for hyperkalemia. Sodium, glucose, and calcium are not directly affected by this combination. He also needs teaching to stop using the salt substitute." },
  hb13: { area: "BCC", type: "single",
    stem: "At 0200, Ernesto Delgado, 72, with heart failure, wakes up gasping while lying flat in bed. His respiratory rate is 30, SpO2 is 88% on room air, and the nurse hears crackles in both lungs. Which action does the nurse take first?",
    options: ["Page the provider to report the new findings", "Lay him flat and raise his legs on pillows", "Sit him up in high Fowler's with legs down", "Get an order for an arterial blood gas"],
    answer: 2,
    rationale: "Sitting upright with the legs down lets the lungs expand and pools blood in the legs, which lowers the volume returning to the overloaded heart. It takes seconds and helps right away, so it comes before calling the provider or drawing labs. Raising the legs sends more blood back to the heart and makes breathing worse." },
  hb14: { area: "BCC", type: "multi",
    stem: "Ernesto Delgado, 72, has heart failure and a 1.5 L daily fluid restriction. The nurse reviews what he ate and drank today. Which items count toward his fluid limit? Select all that apply.",
    options: ["Chicken broth at lunch", "Toast at breakfast", "Ice chips in the afternoon", "Gelatin with his dinner", "A banana at breakfast"],
    answer: [0, 2, 3],
    rationale: "Anything that is liquid at room temperature counts toward the limit: broth, ice chips once melted, and gelatin. Toast and a banana are solid foods and are not counted, even though fruit contains some water." },
  hb15: { area: "RRP", type: "single",
    stem: "A 74-year-old client comes to the emergency department short of breath with crackles in both lungs and swollen ankles. Temperature is 37.0 C. Labs show BNP 1,800 pg/mL, troponin within normal limits, and a normal WBC count. Which problem do these data best support?",
    options: ["Acute myocardial infarction", "Community-acquired pneumonia", "Low volume from dehydration", "Heart failure fluid overload"],
    answer: 3,
    rationale: "BNP is released when the ventricles are stretched by too much volume or pressure, and a level of 1,800 strongly supports heart failure. A normal troponin argues against an acute MI. A normal temperature and WBC make pneumonia less likely, and dehydration would not cause crackles, edema, or a high BNP." },
  hb16: { area: "PPT", type: "single",
    stem: "Ernesto Delgado, 72, has taken lisinopril for 3 weeks. He reports a dry, hacking cough and asks to stop the drug. His lungs are clear, SpO2 is 97%, and his weight is stable. What does the nurse tell him?",
    options: ["\"Stop taking it today, since the cough is a side effect.\"", "\"The cough means fluid is building up in your lungs.\"", "\"The cough is harmless and does not need to be reported.\"", "\"Keep taking it, and I'll let your provider know.\""],
    answer: 3,
    rationale: "A dry cough is a common ACE inhibitor side effect, and the provider may switch him to another drug, so he keeps taking it until then. Stopping it on his own removes a key heart failure medicine. Clear lungs and a stable weight argue against fluid, and the cough still needs reporting." },
  hb17: { area: "MOC", type: "single",
    stem: "Which heart failure client is most appropriate for the LPN?",
    options: ["A client with new crackles and SpO2 88%", "A newly admitted client who needs an admission assessment", "A client being discharged today who needs his first teaching on daily weights", "A stable client on day 3 who needs scheduled oral meds and a morning weight"],
    answer: 3,
    rationale: "Stable, predictable care fits the LPN. Worsening clients, admission assessments, and first-time teaching need the RN." },
  hb18: { area: "PHYS", type: "single",
    stem: "Ernesto Delgado, 72, receives IV furosemide twice daily. His cardiac monitor now shows flattened T waves, prominent U waves, and occasional PVCs. Which lab result does the nurse check first?",
    options: ["Serum chloride", "Serum potassium", "Serum calcium", "Serum glucose"],
    answer: 1,
    rationale: "Flattened T waves, U waves, and PVCs are classic signs of low potassium, and furosemide pulls potassium out in the urine. Chloride, calcium, and glucose do not produce this ECG pattern. High potassium causes peaked T waves and a widening QRS instead." },
  hb19: { area: "PPT", type: "single",
    stem: "Ernesto Delgado, 72, is due for carvedilol 12.5 mg at 0900. His heart rate is 52 and his blood pressure is 92/56. He says he feels lightheaded when he stands. What does the nurse do?",

Object.assign(ITEMS, {
  /* Module 1 */
  ms6: { area: "SIPC", type: "single",
    stem: "Two clients named Mr. Lee are in rooms 412 and 414. The nurse is bringing metoprolol to the client in room 412. What does the nurse do before giving it?",
    options: ["Have him state name and birth date and check the band", "Ask, \"Are you Mr. Lee?\" and give it when he says yes", "Confirm the room number on the door matches the MAR", "Check that the name on the whiteboard matches the MAR"],
    answer: 0,
    rationale: "Use two identifiers, such as name and date of birth, stated by the client and checked against the wristband and the MAR. A yes-or-no question invites the wrong client to agree. Room numbers and whiteboards are not identifiers, and with two clients named Lee they are an easy source of error." },
  ms7: { area: "MOC", type: "single",
    stem: "During a rapid response for an unresponsive client with a glucose of 38 mg/dL, the provider says, \"Give an amp of D50.\" What does the nurse do?",

    rationale: "Read back every verbal prescription and get confirmation before acting, which also clears up a vague dose like \"an amp.\" In an emergency the nurse acts on the confirmed verbal prescription, and the provider enters it afterward per policy. Giving it without a read-back or relying on a coworker's memory invites errors.",
    lens: { medic: "Online medical control: you already repeat orders back on the radio.", nurse: "Same closed loop, and it is documented as a verbal prescription." } },
  ms8: { area: "SIPC", type: "single",
    stem: "The nurse gives an IM injection to an agitated client who is swinging his arms. The sharps container is across the room. What does the nurse do with the used needle?",

    rationale: "Engage the needle's safety device right away and carry it straight to the sharps container. Two-handed recapping and bending needles cause needlesticks. A needle left on the table is a hazard to the client and staff." },
  ms9: { area: "BCC", type: "single",
    stem: "A client is receiving a continuous tube feeding at 60 mL/hr. After a bed bath, the nurse finds the client lying flat with the feeding still running. What does the nurse do?",

    answer: 3,
    rationale: "The head of the bed stays at 30 degrees or higher the whole time a feeding runs, to lower the risk of aspiration. A slow rate does not remove that risk, and continuous feeds have no mealtimes. Prone positioning does not protect the airway during a feeding." },
  ms10: { area: "BCC", type: "single",
    stem: "An unresponsive client who had a stroke has a weak gag reflex and needs mouth care. Suction is set up at the bedside. How does the nurse position the client?",
    options: ["Supine and flat, with the head kept in midline", "Side-lying, with the head turned slightly down", "Upright at 90 degrees, with the chin lifted", "Prone, with the face turned onto a pillow"],
    answer: 1,
    rationale: "Side-lying with the head turned slightly down lets fluid drain out of the mouth instead of into the airway. Flat and supine lets fluid pool in the throat. An unresponsive client cannot hold an upright position safely, and prone with the face on a pillow risks the airway." },
  ms11: { area: "SIPC", type: "single",
    stem: "Smoke and flames are coming from a curtain in a room where a client is in bed. Two visitors are standing at the far end of the hall. What does the nurse do first?",
    options: ["Pull the fire alarm at the end of the hall", "Move the client in bed away from the fire", "Close the doors to the rooms along the hall", "Use an extinguisher on the burning curtain"],
    answer: 1,
    rationale: "RACE stands for Rescue, Alarm, Confine, Extinguish. The client in the burning room is in immediate danger, so rescue comes first. The visitors at the far end are not in immediate danger, and the alarm, closing doors, and using the extinguisher come next." },
  ms12: { area: "MOC", type: "single",
    stem: "A client falls in the bathroom. Which entry belongs in the client's chart?",
    options: ["\"Client fell in the bathroom at 1420. Incident report filed, and the charge nurse was made aware.\"", "\"Found on bathroom floor at 1420; states 'I slipped.' No injury seen. Helped to bed; provider notified.\"", "\"Client fell at 1420 because the UAP did not answer the call light in time. Client helped to bed.\"", "\"Client fell at 1420 because he didn't wait for help after being told to. Client helped to bed.\""],
    answer: 1,
    rationale: "Chart the objective facts: what you found, what the client said, what you did, and who you notified. The incident report is a separate document and isn't mentioned in the chart, and blame doesn't belong there either. Even with a time, an entry that assigns blame or cites the incident report is wrong." },
  ms13: { area: "PSY", type: "single",
    stem: "A 78-year-old client who is hard of hearing nods during discharge teaching but cannot answer questions about it. The hearing aids are in the bedside drawer. What does the nurse do?",
    options: ["Speak louder and keep going, since the client is nodding", "Help put the hearing aids in, then face the client", "Teach the daughter instead and have her pass it along", "Stand behind the client and speak right into the ear"],
    answer: 1,
    rationale: "Get the hearing aids in, then face the client in a quiet room so the client can see lips and expressions. Nodding does not show understanding, and shouting distorts words. Teaching only the family leaves out the client, and speaking from behind hides the face." },
  ms14: { area: "HPM", type: "single",
    stem: "After the nurse teaches a client how to give insulin, the client says, \"I understand.\" What does the nurse do next?",
    options: ["Ask the client to show how to draw up and give a dose", "Ask, \"Do you have any questions about your insulin?\"", "Give a printed handout to review at home after discharge", "Ask the spouse whether the client seemed to understand"],
    answer: 0,
    rationale: "Teach-back, or a return demonstration for a skill, shows what the client actually learned. Asking about questions or understanding usually gets a polite yes. A handout does not confirm learning, and the spouse's opinion does not show what the client can do." },
  ms15: { area: "MOC", type: "single",
    stem: "An alert, competent client says he's leaving against medical advice. What does the nurse do?",
    options: ["Block the door until the provider can come and talk with him", "Tell him his insurance won't pay for the stay if he leaves AMA", "Explain risks, notify the provider, offer the AMA form, document", "Hide his clothes and shoes so he's less likely to walk out"],
    answer: 2,
    rationale: "A competent adult can leave. Make sure he hears the risks, notify the provider, offer the AMA form (he can refuse to sign), and document everything. Holding him would be false imprisonment.",
    lens: { medic: "Same as a field refusal: capacity, risks, signature.", nurse: "Same rights, plus the provider gets called and the chart has to show the conversation." } },
  ms16: { area: "BCC", type: "single",
    stem: "An 80-year-old client at risk for delirium has vital signs due at 0000 and 0400, repositioning every 2 hours, and a bath scheduled for 0430. Which change helps the client sleep most?",
    options: ["Leave a light on overhead so the client can see staff", "Ask the provider for a sleeping pill to give at bedtime", "Move the bath to daytime and turn during vital checks", "Wake the client every hour to check orientation"],
    answer: 2,
    rationale: "Clustering care and moving nonurgent tasks like a bath to the day gives longer stretches of sleep, which helps prevent delirium. Overhead lights and hourly waking disrupt sleep. Sleeping pills raise fall and confusion risk in older adults." },
  ms17: { area: "RRP", type: "single",
    stem: "On the first day after surgery, a client has a temperature of 37.9°C and diminished breath sounds at the bases. What does the nurse encourage?",
    options: ["Incentive spirometry, coughing, and deep breathing", "Strict bed rest until the low-grade fever breaks", "Extra blankets and a warm room for the chills", "Limiting oral fluids to help reduce lung secretions"],
    answer: 0,
    rationale: "A low-grade fever with diminished bases early after surgery often means atelectasis, from shallow breathing. Deep breaths, coughing, and getting up help open the airways. Keep reporting the trend." },
  ms18: { area: "SIPC", type: "single",
    stem: "The nurse finishes a dressing change on one client and then goes to care for a second client. Which action by the nurse needs correction?",
    options: ["Cleans hands after touching the first client's bed rail", "Takes off the gloves and goes straight to the next client", "Uses alcohol hand rub before touching the second client", "Puts on clean gloves after hand hygiene for the next task"],
    answer: 1,
    rationale: "Gloves do not replace hand hygiene. Hands must be cleaned after removing gloves, since gloves can have tiny holes and hands get contaminated during removal. Cleaning hands after touching the client's surroundings and before the next client, then putting on fresh gloves, are all correct." },
  ms19: { area: "MOC", type: "multi",
    stem: "An RN asks a UAP who started yesterday, and has not yet finished the unit's gait belt check-off, to walk a post-op client. An hour ago the client's BP dropped to 86/50 on standing. The RN says, \"Walk him to the end of the hall and back,\" then leaves the unit for a meeting without telling anyone. Which rights of delegation were violated? Select all that apply.",
    options: ["Right task", "Right circumstance", "Right person", "Right directions and communication", "Right supervision and evaluation", "Right location"],
    answer: [1, 2, 4],
    rationale: "Walking a stable client is a task a UAP can do, and the RN gave a clear instruction, so task and directions were met. The client's orthostatic drop makes the circumstance wrong, an untrained UAP is the wrong person, and leaving the unit with no handoff means no supervision. Right location is not one of the five rights." },
  ms20: { area: "MOC", type: "single",
    stem: "A client with a DNR order develops pneumonia. What does the DNR mean for her care?",
    options: ["Comfort care, with treatment of the pneumonia stopped", "No antibiotics or IV fluids, though monitoring still continues", "CPR is withheld if she arrests; other treatment continues", "The nurse stops routine vital signs and assessments"],
    answer: 2,
    rationale: "A DNR means no CPR if she arrests. It doesn't mean \"do not treat.\" She still gets antibiotics, fluids, monitoring, and good nursing care unless she has other directives." },

  /* 5A Chest Pain */
  s6: { area: "RRP", type: "single",
    stem: "Three hours after PCI, a client reports new crushing chest pain and the monitor shows new ST elevation. What does the nurse do first?",
    options: ["Give a PRN antacid and recheck the pain in 15 minutes", "Stay with the client, call rapid response, get a 12-lead", "Reassess the chest pain and vital signs in 30 minutes", "Plan to recheck the troponin with the morning labs"],
    answer: 1,
    rationale: "New chest pain and ST elevation after a stent means the stent may have clotted. It's an emergency: stay, call for help, get the 12-lead, and expect a trip back to the cath lab." },
  s7: { area: "PPT", type: "single",
    stem: "A client on a heparin infusion has an aPTT far above the target range, new black stools, and oozing from his IV sites. The nurse stops the infusion. Which prescription does the nurse anticipate?",
    options: ["Protamine sulfate, given IV slowly", "Phytonadione (vitamin K), given IV", "Naloxone (Narcan), given IV push", "Flumazenil (Romazicon), given IV"],
    answer: 0,
    rationale: "Protamine sulfate reverses heparin and is given slowly to avoid hypotension. Vitamin K reverses warfarin, naloxone reverses opioids, and flumazenil reverses benzodiazepines, so none of them treats heparin bleeding." },
  s8: { area: "PPT", type: "single",
    stem: "Twenty minutes after IV morphine for chest pain, a client is drowsy and hard to keep awake. RR is 9 and shallow, BP 88/50, and SpO2 89%. What does the nurse do first?",
    options: ["Recheck the vital signs again in 15 minutes", "Give a 500 mL normal saline bolus for the BP", "Stimulate him and get naloxone ready to give", "Document the findings as an expected effect"],
    answer: 2,
    rationale: "Slow, shallow breathing and low oxygen after morphine are opioid respiratory depression, and breathing comes first. Rousing the client and preparing naloxone treats the cause. Waiting 15 minutes is unsafe, a fluid bolus does not fix the breathing problem, and these findings are not an acceptable expected effect." },
  s9: { area: "PHYS", type: "single",
    stem: "A post-MI client becomes unresponsive. The monitor shows ventricular fibrillation and there's no pulse. What does the nurse do?",
    options: ["Give IV atropine, then reassess the rhythm and pulse", "Check a blood glucose level before doing anything else", "Call the provider and wait for orders at the bedside", "Call a code, start CPR, and shock as soon as possible"],
    answer: 3,
    rationale: "Pulseless VF needs high-quality CPR and early defibrillation. Every minute without a shock lowers the chance of survival.",
    lens: { medic: "Your home turf.", nurse: "Same algorithm. On the floor you're usually first on scene and start CPR until the code team arrives." } },
  s10: { area: "BCC", type: "single",
    stem: "The day before discharge, Mr. Hale fills out his own lunch menu. Which choice shows he applied his heart-healthy diet teaching?",
    options: ["Turkey club sandwich with bacon, chips, and diet soda", "Chicken noodle soup, saltine crackers, and a pickle", "A chef salad with ham, cheese, and ranch dressing", "Grilled salmon, brown rice, and steamed broccoli"],
    answer: 3,
    rationale: "Heart-healthy eating means less saturated fat and sodium and more fish, whole grains, and vegetables. Bacon and chips are high in fat and salt, and canned soup, crackers, and pickles are very high in sodium. A salad sounds healthy, but ham, cheese, and ranch add a lot of saturated fat and sodium." },
  s11: { area: "RRP", type: "single",
    stem: "At the 30-minute check after a right radial PCI, the client's right hand is cool and pale with a capillary refill of 4 seconds and numb fingertips. The site is not bleeding. What does the nurse do?",
    options: ["Document it as expected and recheck at the next set of vitals", "Report it now and follow the protocol for loosening the band", "Add more air to the compression band to stop any oozing", "Take a BP on that arm to check that perfusion is adequate"],
    answer: 1,
    rationale: "A cool, pale, numb hand with slow refill means poor blood flow, often from a compression band that is too tight or a blocked radial artery. The nurse reports it now and loosens the band per protocol while watching the site for bleeding. Waiting is unsafe, adding air worsens the problem, and a BP cuff should not go on the procedure arm." },
  s12: { area: "PPT", type: "single",
    stem: "A client on ticagrelor says he gets a little short of breath since starting it. What does the nurse do?",
    options: ["Tell him to stop taking it until he sees the cardiologist", "Tell him the breathing change isn't related to the drug", "Assess, report it, and tell him not to stop it himself", "Switch him to aspirin alone to stop the side effect"],
    answer: 2,
    rationale: "Shortness of breath is a known ticagrelor side effect, but it could also be something else, like heart failure. Assess and report. Stopping it without the cardiologist risks stent thrombosis." },
  s13: { area: "MOC", type: "single",
    stem: "After report, which client does the telemetry nurse see first?",
    options: ["A client who wants to talk about when to start cardiac rehab", "A client after femoral PCI with a soaked, bloody dressing", "A client asking for a sleeping pill so he can get some rest", "A client whose morning labs have not come back from the lab yet"],
    answer: 1,
    rationale: "Active bleeding from an arterial puncture is the emergency: hold pressure and get help. The others can wait." },
  s14: { area: "PSY", type: "single",
    stem: "Before discharge, Mr. Hale quietly asks when he can have sex again. What is the best response?",
    options: ["\"You'll have to ask your doctor about that at your follow-up appointment.\"", "\"Let's not worry about that right now; let's focus on your meds.\"", "\"Many people can resume sex as they recover. Let's review signs to stop.\"", "\"With your heart, it's best to avoid sex for at least a year.\""],
    answer: 2,
    rationale: "Answer openly and without embarrassment, give accurate general information, and review the warning signs to stop, like chest pain or shortness of breath. Many people can resume sex as they recover, and his cardiologist can confirm his specific timing. Deflecting leaves him guessing, and a blanket ban for a year is not accurate." },
  s15: { area: "BCC", type: "single",
    stem: "At a 1-week follow-up call, Mr. Hale says he had chest tightness walking up one flight of stairs. It went away after he stopped and rested for 3 minutes. What does the nurse advise?",
    options: ["Stop if it recurs and report it to his cardiologist today", "Keep going, since mild tightness is part of healing", "Stay in bed and stop walking until his visit next month", "Try the stairs again faster to build up his endurance"],
    answer: 0,
    rationale: "New chest pain with exertion after a stent can mean the artery is narrowing again, so he stops activity when it happens and the cardiologist needs to hear about it today. If pain lasts more than 5 minutes or does not ease with rest or nitroglycerin, he calls 911. Chest tightness is not a normal part of healing, bed rest weakens him and raises clot risk, and pushing harder adds strain." },
  s16: { area: "PPT", type: "single",
    stem: "A client says he wears his nitroglycerin patch 24 hours a day and is now having angina more often than before. Which teaching does the nurse provide?",
    options: ["Keep wearing it around the clock, but add a second patch", "Leave each patch on for several days to keep levels steady", "Cut the patch in half when the angina starts getting worse", "Remove it for the prescribed patch-free hours each day"],
    answer: 3,
    rationale: "Wearing a nitrate patch around the clock causes tolerance, so the drug stops working and angina gets worse. A daily patch-free period, often overnight, restores the effect. Adding a patch or leaving one on for days worsens tolerance, and cutting a patch changes the dose in an unreliable way." },
  s17: { area: "SIPC", type: "single",
    stem: "A client started on new blood pressure medicines feels dizzy when standing. What does the nurse teach?",
    options: ["Stand up quickly to get the dizzy feeling over with", "Stay in bed until the dizziness is completely gone for good", "Sit on the edge of the bed for a minute, then stand slowly", "Skip that day's medicine dose whenever you feel dizzy"],
    answer: 2,
    rationale: "Changing position slowly gives the blood pressure time to adjust and prevents falls. Report the dizziness so the provider can review the doses." },
  s18: { area: "RRP", type: "single",
    stem: "The day after a cardiac cath, a client's creatinine has risen from 1.0 to 1.6 mg/dL. Urine output was 20 mL an hour for the last 3 hours, his mucous membranes are dry, and his lungs are clear. Which prescription does the nurse anticipate?",
    options: ["Restrict fluids to 1 liter a day to rest the kidneys", "IV furosemide to flush the contrast from the kidneys", "IV fluids with close output and creatinine monitoring", "A repeat contrast study to look at the renal arteries"],
    answer: 2,
    rationale: "This looks like contrast-associated kidney injury in a dry client, and hydration helps the kidneys recover and clear the contrast. Output and creatinine show whether it is working. Restricting fluids or giving a diuretic dries the kidneys further, and more contrast adds to the injury." },
  s19: { area: "PHYS", type: "multi",
    stem: "A 66-year-old client is 6 hours after a large anterior MI. Which findings would the nurse recognize as signs of developing cardiogenic shock? Select all that apply.",
    options: ["BP 84/56, down from 118/72 on arrival", "Temperature of 37.6 C (99.7 F) this morning", "Cool, clammy skin on the arms and legs", "New confusion about where he is", "Strong, bounding radial pulses in both wrists", "Urine output of 20 mL in the last hour"],
    answer: [0, 2, 3, 5],
    rationale: "When the damaged heart cannot pump enough, every organ gets less blood: BP falls, skin turns cool and clammy, the brain gets confused, and urine output drops. A low-grade temperature is common after an MI and does not point to shock. Strong, bounding pulses mean good output, the opposite of shock." },
  s20: { area: "HPM", type: "single",
    stem: "Mr. Hale says he's ready to quit smoking. What does the nurse offer?",
    options: ["Tell him to just stop on his own, cold turkey, using willpower", "Suggest he cut down to half a pack a day for the next month", "Wait and bring it up at his follow-up visit with the cardiologist", "A quit date, 1-800-QUIT-NOW, and a talk about quit medicines"],
    answer: 3,
    rationale: "Quitting works best with a plan, support, and medicine when appropriate. The quitline is free, and the provider can decide which quit aids are safe after his MI." },

  /* 5B Heart Failure */
  hs6: { area: "PPT", type: "single",
    stem: "A 76-year-old client takes digoxin and furosemide. She reports nausea, poor appetite, and yellow halos around lights. Which lab result most likely explains her symptoms?",
    options: ["Sodium 140 mEq/L", "Glucose 110 mg/dL", "Hemoglobin 13.8 g/dL", "Potassium 3.0 mEq/L"],
    answer: 3,
    rationale: "Nausea, poor appetite, and visual halos are signs of digoxin toxicity. Low potassium makes the heart more sensitive to digoxin and increases the risk of toxicity, and furosemide lowers potassium. The sodium, glucose, and hemoglobin values are within normal limits." },
  hs7: { area: "BCC", type: "single",
    stem: "A 68-year-old client with heart failure says she cleans her whole house every morning and is exhausted and short of breath by noon. What does the nurse teach her?",
    options: ["\"Do the chores even earlier, before you get tired.\"", "\"Rest in bed and have your family take over the chores.\"", "\"Keep going through the fatigue to build up stamina.\"", "\"Spread the chores out and rest between each one.\""],
    answer: 3,
    rationale: "Energy conservation means pacing: alternate activity with rest, sit for tasks when possible, and spread hard jobs across the day. Starting earlier still packs all the work into one block. Bed rest leads to deconditioning, and pushing through fatigue strains the heart." },
  hs8: { area: "PHYS", type: "single",
    stem: "A heart failure client on the unit suddenly becomes very short of breath, with crackles and pink frothy sputum. What does the nurse do first?",
    options: ["Lay him flat and raise his legs on pillows", "Give a fluid bolus to support his pressure", "Sit him up, give oxygen, and call for help", "Walk him around the room to open his lungs"],
    answer: 2,
    rationale: "Acute pulmonary edema: sit him up with the legs down, give oxygen, and call a rapid response. Expect IV diuretics and possibly noninvasive ventilation.",
    lens: { medic: "CPAP and nitro on the truck. You know this patient.", nurse: "On the floor you start with what's in the room: position, oxygen, and the rapid response team." } },
  hs9: { area: "PPT", type: "single",
    stem: "A client is switching from lisinopril to sacubitril-valsartan. Which prescription does the nurse question?",
    options: ["Starting sacubitril-valsartan 36 hours after the last lisinopril dose", "Checking potassium and kidney function before the first dose", "Starting sacubitril-valsartan 2 hours after today's lisinopril", "Teaching the client to stand up slowly because of dizziness"],
    answer: 2,
    rationale: "Sacubitril-valsartan can't be started within 36 hours of an ACE inhibitor because together they raise the risk of angioedema. The 36-hour wait and the lab checks are correct." },
  hs10: { area: "HPM", type: "single",
    stem: "Ernesto Delgado, 72, with heart failure, comes to the clinic in October. His records show his pneumococcal, shingles, and COVID-19 vaccines are current, he had a Tdap 3 years ago, and his last flu shot was 11 months ago. Which vaccine does the nurse offer today?",
    options: ["Pneumococcal vaccine", "Influenza vaccine", "Tetanus booster", "Hepatitis A vaccine"],
    answer: 1,
    rationale: "A flu shot is recommended every year for people with heart failure, since an infection can tip them into decompensation, and October is the start of flu season. His pneumococcal vaccine is current, and a tetanus booster is due every 10 years. Hepatitis A is not routinely indicated for heart failure.",
    src: "mpHf" },
  hs11: { area: "MOC", type: "single",
    stem: "Which heart failure client does the nurse see first?",
    options: ["A client asking for help ordering a late lunch", "A client with new confusion and an SpO2 of 89%", "A client whose weight is the same as yesterday", "A client who is due for discharge teaching today"],
    answer: 1,
    rationale: "New confusion with low oxygen means the brain isn't getting enough oxygen, possibly from worsening failure. That client is unstable; the others are routine." },
  hs12: { area: "PPT", type: "single",
    stem: "A 64-year-old client with heart failure started dapagliflozin 2 weeks ago. She reports burning when she urinates and dizziness when she stands. Her standing blood pressure is 98/60. How does the nurse interpret these findings?",
    options: ["They are unrelated to the drug and can wait for her next visit", "They fit known effects of the drug and need to be reported", "They show the drug is not reaching her kidneys as intended", "They signal her heart failure is worsening from fluid gain"],
    answer: 1,
    rationale: "SGLT2 inhibitors make the kidneys spill sugar into the urine, which raises the risk of UTIs and genital infections, and the extra fluid loss can cause dizziness and low blood pressure. Both findings need reporting. They show the drug is acting on the kidneys, and fluid gain would not cause dizziness with a low standing pressure." },
  hs13: { area: "BCC", type: "single",
    stem: "Ernesto Delgado, 72, has 3+ pitting edema of both legs. He is sitting in a chair with his feet on the floor, and the nurse finds a new weeping area on his left shin. Which action does the nurse take?",
    options: ["Elevate his legs and put a dry dressing on it", "Massage the legs firmly to move the fluid along", "Apply a warm pack to the shin to dry the area", "Keep his feet down on the floor while he sits"],
    answer: 0,
    rationale: "Stretched, swollen skin breaks down easily. Elevating the legs reduces the swelling, and a dry dressing protects the weeping skin. Firm massage and heat can damage fragile skin, and keeping the feet down lets more fluid collect in the legs." },
  hs14: { area: "RRP", type: "single",
    stem: "A 75-year-old client with heart failure reports dizziness. Lying down, BP is 128/78 and pulse is 76. After 3 minutes standing, BP is 104/70 and pulse is 98. Which finding confirms orthostatic hypotension?",
    options: ["The heart rate of 98 beats per minute standing", "The 8-point drop in diastolic pressure on standing", "The 24-point drop in systolic pressure on standing", "The lying blood pressure reading of 128/78 mm Hg"],
    answer: 2,
    rationale: "Orthostatic hypotension is a drop of 20 or more in systolic or 10 or more in diastolic pressure within 1 to 3 minutes of standing. The 24-point systolic drop meets that definition. The diastolic drop of 8 does not, a rising pulse supports the finding but does not define it, and the lying reading alone cannot show a change." },
  hs15: { area: "PPT", type: "single",
    stem: "Ernesto Delgado, 72, takes furosemide and extended-release potassium chloride (K-Dur). He says he chews the tablet first thing in the morning before eating because he thought it would work faster, and it upsets his stomach. What does the nurse teach?",
    options: ["Swallow it whole with a meal and water", "Keep chewing it but take an antacid first", "Take it at bedtime on an empty stomach", "Skip it on days his stomach is upset"],
    answer: 0,
    rationale: "Potassium irritates the stomach, so it is taken with food and a full glass of water. Extended-release tablets are swallowed whole, never crushed or chewed. An antacid does not make chewing safe, an empty stomach adds to the irritation, and skipping doses risks low potassium while he is on furosemide." },
  hs16: { area: "SIPC", type: "single",

  hs17: { area: "HPM", type: "single",
    stem: "A 58-year-old client with alcohol-related cardiomyopathy and an EF of 25% asks if he can still have a couple of beers on weekends. What is the nurse's best response?",
