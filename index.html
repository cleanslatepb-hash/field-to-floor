Object.assign(ITEMS, {
  m4b1: { area: "SIPC", type: "single", cj: "Take action",
    stem: "On a postpartum unit, an overhead alert announces a suspected infant abduction. The nurse at the front desk sees a visitor carrying a large duffel bag walk quickly toward the stairwell door. What does the nurse do?",
    options: ["Follow the visitor down the stairwell and keep the person in sight", "Note the visitor's description and direction, then tell security", "Grab the duffel bag and hold the visitor at the desk until security comes", "Go room to room to count the infants before reporting the visitor"],
    answer: 1,
    rationale: "During an abduction alert, staff observe and report: a clear description and direction of travel help security and police stop the person. Chasing or grabbing a suspect can injure staff and the infant. Counting infants first delays the most useful information the nurse has right now." },
  m4b2: { area: "SIPC", type: "multi", cj: "Generate solutions",
    stem: "About 200 mL of IV chemotherapy leaks from a bag onto the floor next to a client's bed. Which actions does the nurse take? Select all that apply.",
    options: ["Put on a chemo-rated gown, two pairs of chemo gloves, and eye protection", "Get the hazardous drug spill kit and contain the spill with absorbent pads", "Move other people away from the area and post a warning sign", "Wipe up the fluid with paper towels and put them in the regular trash", "Mop the area with a bleach solution before absorbing the fluid", "Report the spill and complete the facility's hazardous event report"],
    answer: [0, 1, 2, 5],
    rationale: "Hazardous drug spills need full protective gear, the spill kit, a cleared and marked area, and an event report. Paper towels in the regular trash expose housekeeping and others to the drug. Mopping before absorbing spreads the drug over a wider area; the kit's absorbent goes on first, then the area is cleaned per policy.",
    lens: { medic: "On a hazmat scene you set up zones and wait for the hazmat team to handle the product.", nurse: "On the unit, trained staff contain and clean a hazardous drug spill with the spill kit and call for help per policy if it is too large." } },
  m4b3: { area: "SIPC", type: "single", cj: "Take action",
    stem: "A visitor in a client's room starts shouting, says he has a gun, and lifts his shirt to show a handgun in his waistband. The nurse is standing in the doorway. What does the nurse do first?",
    options: ["Step away, get to a safe place, and call security and 911", "Ask the visitor in a calm voice to hand the weapon over to the nurse", "Move between the visitor and the client to shield the client's body", "Stay in the room and talk with the visitor until he begins to calm"],
    answer: 0,
    rationale: "With a weapon shown, the first step is to get out of danger and alert security and law enforcement using the facility's weapon or active threat code. Asking for the gun, shielding the client, or staying to negotiate puts the nurse in harm's way without trained help. Trained officers handle the armed person.",
    lens: { medic: "In the field, an unsafe scene means you back out, stage, and wait for police before entering.", nurse: "In the hospital there is no staging area, so you leave the room, call the weapon code and 911, and let security and police respond." } },
  m4b4: { area: "SIPC", type: "single", cj: "Recognize cues",
    stem: "A client says she feels a small tingling shock each time she touches the metal frame of her electric hospital bed. The power cord looks intact. What does the nurse do?",
    options: ["Plug the bed into a different outlet on the same wall and recheck", "Tell the client to avoid touching the metal bed frame", "Unplug the bed, tag it out of service, and get another bed", "Cover the frame with a towel and report it at shift change"],
    answer: 2,
    rationale: "A shock from equipment means a possible ground fault, even when the cord looks fine. The nurse removes the bed from use, tags it, reports it to biomedical or maintenance, and moves the client to a safe bed. Changing outlets, warning the client, or covering the frame leaves a faulty device in use." },
  m4b5: { area: "SIPC", type: "multi", cj: "Evaluate outcomes",
    stem: "A client with a head injury has soft wrist restraints after pulling out a nasogastric tube. The nurse checks the client and the chart. Which findings need the nurse to take action? Select all that apply.",
    options: ["The restraints are tied to the movable side rails", "Two fingers fit under each of the wrist restraints", "The order reads \"wrist restraints PRN for agitation\"", "The UAP freed one wrist at a time for range of motion", "The ties use a quick-release knot on the bed frame", "The call light is clipped to the wall out of reach"],
    answer: [0, 2, 5],
    rationale: "Ties on a side rail can tighten or injure the client when the rail moves; they belong on the bed frame with a quick-release knot. A restraint order cannot be PRN, so the nurse contacts the provider for a proper time-limited order. The client must be able to call for help. Two-finger fit and releasing one limb at a time are correct care." },
  m4b6: { area: "SIPC", type: "single", cj: "Generate solutions",
    stem: "Two UAPs plan to boost a client who weighs 125 kg (276 lb) and cannot help up in bed by pulling on a draw sheet. What does the nurse tell them?",
    options: ["Bend at the waist and pull together on a count of three", "Have the client push with her heels while you pull up", "Get two more staff so four people can pull the draw sheet", "Use a friction-reducing sheet or ceiling lift per policy"],
    answer: 3,
    rationale: "Safe client handling programs call for devices, not manual lifting, when a client cannot help and is this heavy. Adding people to a manual pull still puts each worker at risk of back injury. Bending at the waist strains the back, and a client who cannot help is unable to push with the heels." },
  m4b7: { area: "MOC", type: "single", cj: "Analyze cues",
    stem: "A nurse assigned to a client forgets a scheduled dose of an oral antibiotic. The error is found 2 hours later, the dose is given, the provider is told, and the client has no ill effects. The client later says he will sue for malpractice. Which element of malpractice is missing?",
    options: ["Duty, since the provider is in charge of the drug plan", "Breach, since the client got the dose once the error was found", "Damages, since the client had no injury from the delay", "Foreseeability, since a late dose is not expected to harm"],
    answer: 2,
    rationale: "Malpractice requires duty, breach, causation, and damages. The nurse had a duty to the assigned client and breached it by missing the dose, but the client suffered no injury, so damages are absent. A late antibiotic dose can foreseeably cause harm, so foreseeability is present.",
    lens: { medic: "As a medic, a deviation from protocol is reviewed by your medical director and agency.", nurse: "As an RN, you are measured against what a reasonably prudent nurse would do, and you answer for it on your own license." } },
  m4b8: { area: "MOC", type: "single", cj: "Take action",
    stem: "The surgeon asks the nurse to witness a client's signature on a consent for a planned gallbladder removal. The client got IV hydromorphone 20 minutes ago, is drowsy, and keeps losing track of the conversation. What does the nurse do?",
    options: ["Tell the surgeon the client is not able to sign right now", "Witness the signature since the surgeon already explained it", "Ask the client's spouse at the bedside to sign the form instead", "Have the client sign and chart the time of the last opioid dose"],
    answer: 0,
    rationale: "Valid consent needs a client who can understand and weigh the information, and this client is impaired by an opioid. Because the surgery is planned, the signing waits until the client is alert. A spouse signs only when the client lacks capacity and is not expected to regain it in time, and charting the opioid time does not fix the problem.",
    lens: { medic: "In the field you treat on implied consent when a client cannot decide and the need is urgent.", nurse: "For planned surgery, implied consent does not apply, so you wait until the client can decide." } },
  m4b9: { area: "MOC", type: "single", cj: "Take action",
    stem: "A client with advanced dementia has an advance directive that refuses tube feeding and names her son as health care proxy. The son agrees with the directive. The client's daughter arrives and demands that a feeding tube be placed today. What does the nurse do?",
    options: ["Hold the comfort care plan until the son and daughter agree", "Ask the provider to place the tube since the daughter wants it", "Ask the ethics committee to pick which child's wishes to follow", "Explain that the son makes the decisions and offer a family meeting"],
    answer: 3,
    rationale: "The client's written wishes and her named proxy guide care when she cannot decide for herself. The nurse explains this kindly and offers a meeting with the team so the daughter is heard. Pausing care or placing the tube ignores the client's choice, and an ethics committee advises rather than choosing between relatives." },
  m4b10: { area: "MOC", type: "multi", cj: "Generate solutions",
    stem: "At 1830, the nurse realizes that a 1400 dressing change and wound assessment were never charted. Which actions are correct? Select all that apply.",
    options: ["Label the note clearly as a late entry in the record", "Record the current date and time on the note", "State in the note that care was given at 1400", "Fit the note between the 1330 and 1430 entries", "Ask the coworker who saw the wound to chart it", "Leave it for the next shift's wound assessment"],
    answer: [0, 1, 2],
    rationale: "A late entry is labeled as late, shows when it was written, and states when the care actually happened. Squeezing a note in between earlier entries makes the record look altered. Nurses chart only their own care, and skipping the entry leaves a gap in the legal record." },
  m4b11: { area: "MOC", type: "single", cj: "Recognize cues",
    stem: "A nurse notices that a coworker often wastes partial doses of hydromorphone with no witness, and her clients often say the pain medicine did not help. What does the nurse do?",
    options: ["Ask the coworker in private whether she is taking the drugs", "Report the pattern to the nurse manager per policy", "Watch the coworker for another week to collect more proof", "Tell the clients to ask a different nurse for pain medicine"],
    answer: 1,
    rationale: "Unwitnessed wastes and poor pain relief are signs of possible drug diversion, which puts clients at risk. The nurse reports the facts through the chain of command so the facility can investigate. A private confrontation, waiting for more proof, or steering clients away does not protect them and delays help for a possibly impaired coworker." },
  m4b12: { area: "PSY", type: "single", cj: "Take action",
    stem: "A 40-year-old client who is a Jehovah's Witness has a hemoglobin of 6.8 g/dL after a GI bleed. He is alert and oriented and declines a blood transfusion after the provider explains the risks. His wife begs the nurse to \"make him take it.\" What does the nurse do?",
    options: ["Tell the wife the transfusion can go ahead if she signs for it", "Support his choice and ask the provider about alternatives", "Wait to chart the refusal until he has talked with his family", "Ask the provider for a court order since his life is at risk"],
    answer: 1,
    rationale: "A competent adult has the right to refuse treatment, including life-saving blood, after being informed of the risks; this is respect for autonomy. The nurse makes sure the refusal is documented and asks about options such as iron, erythropoietin, or volume expanders. A spouse cannot consent for a capable adult, and a court order is not the response to a competent adult's informed refusal.",
    lens: { medic: "In the field, a competent adult can refuse transport after you explain the risks and document it.", nurse: "In the hospital the same rule holds: a capable adult's informed refusal of blood stands, even if family disagrees." } },
  m4b13: { area: "PSY", type: "single", cj: "Generate solutions",
    stem: "A client with metastatic pancreatic cancer asks the nurse, \"Am I dying? Nobody gives me a straight answer.\" Earlier, her son asked staff not to tell her how serious it is. What is the nurse's best response?",
    options: ["\"Your son asked us not to discuss that, so please talk with him.\"", "\"Let's not focus on that now. Your vital signs look good today.\"", "\"What have you noticed? I'll ask your provider to talk with you.\"", "\"Everyone here is working hard for you, so try to stay hopeful.\""],
    answer: 2,
    rationale: "The client has a right to truthful information about her own condition, which reflects veracity and autonomy, and a relative's request does not override that. The nurse explores what she knows and wants to know, then arranges for the provider to discuss the prognosis. Deflecting, sending her to her son, or offering false hope blocks honest communication." },
  m4b14: { area: "PSY", type: "single", cj: "Analyze cues",
    stem: "A client being treated for depression tells the nurse, \"When I get out, I'm going to make my old boss pay. I know where he lives and I have a gun at home.\" He asks the nurse to keep it between them. What does the nurse do?",
    options: ["Agree to keep it private to protect trust in the relationship", "Tell him it must be shared and report it to the provider now", "Chart the comment and raise it at the next weekly team meeting", "Call the old boss to warn him, then chart the call in the record"],
    answer: 1,
    rationale: "A specific threat against a named person, with access to a weapon, is a limit on confidentiality. The nurse tells the client it cannot be kept secret and reports it to the provider and team at once so they can assess risk and act per state law and policy. Waiting a week is unsafe, and warning the target is a team decision made under the facility's process." },
  m4b15: { area: "PSY", type: "multi", cj: "Generate solutions",
    stem: "In the emergency department, a client is pacing, clenching his fists, and shouting that he has waited too long. He has not hit anyone. Which actions does the nurse take? Select all that apply.",
    options: ["Speak in a calm, low voice using short sentences", "Stand at an angle with a clear path to the door", "Offer a choice, such as a quiet room or a seat nearby", "Warn him he will be restrained unless he sits now", "Take him into a closed exam room alone with the nurse", "Touch his arm gently to show that the nurse cares"],
    answer: [0, 1, 2],
    rationale: "Early de-escalation uses a calm voice, a safe stance with an exit, and choices that give the client some control. Threats of restraint tend to raise anger. Being alone behind a closed door removes the nurse's exit, and touch can be taken as a threat by an agitated person." },
  m4b16: { area: "PHYS", type: "single", cj: "Take action",
    stem: "Five minutes after starting an IV antibiotic, the nurse realizes it was meant for the client in the next bed. This client now reports itching and throat tightness and is wheezing. What does the nurse do first?",
    options: ["Call the provider to report the drug error", "Give IM epinephrine per the anaphylaxis protocol", "Start an event report while the details are fresh", "Stop the infusion and keep the IV access open"],
    answer: 3,
    rationale: "Stopping the infusion ends exposure to the drug and comes first. Epinephrine follows right away, along with a call for help and the provider. The event report is done after the client is stable." },
  m4b17: { area: "PHYS", type: "single", cj: "Prioritize hypotheses",
    stem: "On a winter home visit, a client and her husband both report headache, nausea, and dizziness that get better when they leave the house. A gas space heater is running in the closed living room. What does the nurse do first?",
    options: ["Get both clients outside right away and call 911 for help", "Check both clients' oxygen levels with a pulse oximeter", "Open a window and turn the space heater down low", "Teach them to install a carbon monoxide detector today"],
    answer: 0,
    rationale: "These findings point to carbon monoxide poisoning, so everyone, including the nurse, leaves the house and emergency services are called. A standard pulse oximeter reads falsely normal with carbon monoxide. Venting the room or teaching about detectors comes after everyone is safe." },
  m4b18: { area: "RRP", type: "single", cj: "Recognize cues",
    stem: "In the preprocedure area, the signed consent lists the left knee for arthroscopy. The surgical site mark is on the right knee, and the client says, \"It's my right knee.\" What does the nurse do?",
    options: ["Change the consent to read right knee and have the client initial", "Go ahead since the client and the site mark both say right knee", "Stop the process and notify the surgeon to resolve the mismatch", "Mark the left knee as well so it matches the signed consent form"],
    answer: 2,
    rationale: "Any mismatch between the consent, the site mark, and the client's report stops the process until the surgeon resolves it. The nurse cannot change a consent form, and going ahead with conflicting documents risks wrong-site surgery. Marking a second site adds confusion." },
  m4b19: { area: "PPT", type: "single", cj: "Take action",
    stem: "The nurse is about to start a heparin infusion. The prescription and the pump's drug library are set for 25,000 units in 500 mL, but the bag from pharmacy is labeled 25,000 units in 250 mL. What does the nurse do?",
    options: ["Wait to start it and ask the pharmacist about the bag", "Cut the pump rate in half so the hourly dose stays the same", "Start the bag as programmed and check the aPTT in 6 hours", "Have a second nurse confirm the rate, then hang the bag"],
    answer: 0,
    rationale: "Heparin is a high-alert drug, and this bag is twice as concentrated as the one the pump is set for, which would double the dose. The nurse holds it and gets the correct bag or a verified new prescription. Changing the rate by hand bypasses the drug library's safety limits, and a second check of the wrong bag does not fix the error." },
  m4b20: { area: "BCC", type: "multi", cj: "Generate solutions",
    stem: "A 79-year-old client who uses a walker after a hip fracture is going home to live alone. Which home changes does the nurse recommend? Select all that apply.",
    options: ["Remove throw rugs from walking paths", "Install grab bars by the toilet and shower", "Use night-lights from bedroom to bathroom", "Keep daily items on high shelves to stretch", "Wax the floors so the walker glides easily"],
    answer: [0, 1, 2],
    rationale: "Removing rugs, adding grab bars, and lighting the path at night lower fall risk for a client with a walker. Reaching for high shelves throws off balance, so daily items belong between waist and shoulder height. Waxed floors are slippery and raise the risk of a fall." },
  m4s1: { area: "SIPC", type: "single", cj: "Take action",
    stem: "While scanning medications for a 72-year-old client, the barcode scanner warns the nurse that the metoprolol tablet pulled from the dispensing cabinet is 50 mg. The prescription is metoprolol tartrate 25 mg PO. The tablet has not been given. What does the nurse do?",
    options: ["Override the alert, give the tablet, and then notify the provider", "Get the correct dose and skip a report, since no harm was done", "Get the correct 25 mg dose and file an event report on the near miss", "Get the correct dose and write a note about the near miss in the chart"],
    answer: 2,
    rationale: "An error caught before it reaches the client is a near miss, and near misses are reported through the facility's event reporting system so the cause, such as a stocking or pulling error, can be fixed. Skipping the report hides a system problem. Event reports are not mentioned in the client's chart, and overriding a correct barcode alert defeats the safety check." },
  m4s2: { area: "SIPC", type: "single", cj: "Take action",
    stem: "At 0830 the nurse realizes she gave a client 10 units of insulin glargine instead of the prescribed 10 units of insulin lispro with breakfast. What does the nurse do first?",
    options: ["Check his glucose and notify the provider", "Give the 10 units of lispro now as well", "Wait for the evening glucose before acting", "Ask the client not to mention it to anyone"],
    answer: 0,
    rationale: "The client comes first: check his glucose now and call the provider, who will decide on monitoring and any change to tonight's glargine. Adding the lispro on top could cause dangerous hypoglycemia. Waiting or hiding the error puts him at risk; an event report follows through the proper channel.",
    lens: { medic: "In the field, a medication error usually means telling your partner and calling medical control on the radio.", nurse: "On the unit, you assess the client first, then notify the provider, disclose per policy, and file an event report." } },
  m4s3: { area: "SIPC", type: "single", cj: "Generate solutions",
    stem: "An 81-year-old client admitted with pneumonia has urge incontinence and was found twice last night walking to the bathroom alone. She is alert and oriented and walks steadily with her walker. Which intervention best lowers her risk of falling?",
    options: ["Raise the upper and lower side rails while she sleeps", "Offer help with toileting every 2 hours and at bedtime", "Limit her fluids after the evening meal to cut night voiding", "Ask the provider for a sedative so she sleeps through the night"],
    answer: 1,
    rationale: "Her fall risk comes from urgency that sends her to the bathroom alone, so scheduled toileting meets the need before it becomes urgent. Raising the rails can be a restraint and leads to climbing over them. Limiting fluids risks dehydration and more confusion, and a sedative raises fall risk in an older adult." },
  m4s4: { area: "SIPC", type: "single", cj: "Take action",
    stem: "After giving a subcut injection to a client who has hepatitis C, the nurse is stuck by the used needle while engaging the safety device. The puncture is bleeding slightly. What does the nurse do first?",
    options: ["Squeeze the site hard and then soak the finger in bleach", "Finish the shift and then report the injury to employee health", "Ask the client for consent to test his blood before reporting", "Wash the site with soap and water, then report the exposure"],
    answer: 3,
    rationale: "Immediate washing with soap and water followed by prompt reporting starts post-exposure care, including baseline testing and, when indicated, time-sensitive prophylaxis for HIV. Squeezing and bleach can damage tissue and are not recommended. Waiting until the end of the shift delays care, and source testing is arranged through employee health per policy, not by the nurse first.",
    lens: { medic: "Many medics finish the call and deal with a needlestick once the unit is back in service.", nurse: "On the unit, you stop, wash the site, and report right away, because exposure follow-up is time sensitive." } },
  m4s5: { area: "MOC", type: "single", cj: "Generate solutions",
    stem: "A nurse gave IV hydralazine instead of IM hydroxyzine. The two vials have similar labels and are stored in side-by-side bins. The nurse reported the error right away, and the client was not harmed. Which response by the nurse manager reflects a just culture?",
    options: ["Write up the nurse and require a medication math test", "Review how the two drugs are stored and separate the bins", "Remind staff at the next meeting to read every label closely", "Move the nurse to a unit that gives fewer medications"],
    answer: 1,
    rationale: "Just culture looks for the system causes of human error and fixes them, while holding people accountable for reckless choices. Separating look-alike vials removes the trap for every nurse. Discipline, a math test, or a transfer punishes an honest error and discourages reporting, and a reminder at a meeting is a weak fix that leaves the hazard in place." },
  m4s6: { area: "MOC", type: "single", cj: "Take action",
    stem: "At 1830, the nurse realizes she never charted her 1400 assessment, which found new crackles that she reported to the provider at the time. What does the nurse do?",
    options: ["Enter the findings in the 1400 time slot of the record", "Leave it out, since the provider was told at the time", "Ask the next nurse to chart it with the 1900 assessment", "Chart it now as a late entry that notes the 1400 time"],
    answer: 3,
    rationale: "A late entry is made at the current date and time, clearly labeled as late, and refers to when the care happened. Placing it in the 1400 slot makes the record look as if it was written then, which is altering the record. Leaving it out loses key data, and another nurse cannot chart findings she did not observe." },
  m4s7: { area: "MOC", type: "single", cj: "Analyze cues",
    stem: "A 17-year-old client who was declared emancipated by a court last year needs an appendectomy. His mother arrives and says she wants to sign the surgical consent. Who signs the consent?",
    options: ["The client, because emancipation lets him give consent", "The mother, because the client is younger than 18", "The client and the mother, so that both agree in writing", "The surgeon, because appendicitis is a surgical emergency"],
    answer: 0,
    rationale: "A minor whom a court has declared emancipated has the legal right to consent to his own care, so the client signs. The mother no longer holds that authority, and her signature is not needed. The emergency exception applies only when no one with authority can give consent in time, and this client can." },
  m4s8: { area: "PSY", type: "single", cj: "Take action",
    stem: "A 29-year-old client in the emergency department has bruises on both upper arms in different stages of healing. Her husband answers every question for her and will not leave the room. What does the nurse do?",
    options: ["Ask her about abuse in front of him to watch how he reacts", "Ask the husband whether anyone has been hurting his wife", "Find a reason to speak with her alone, such as a urine test", "Hand her a domestic violence hotline card while he watches"],
    answer: 2,
    rationale: "Screening for intimate partner violence is done privately, because asking in front of a possible abuser is unsafe and the client is unlikely to answer honestly. A routine task such as collecting a urine sample gives a safe moment alone. Asking the husband or handing over a card in his view can put her at greater risk after discharge." },
  m4s9: { area: "PSY", type: "single", cj: "Take action",
    stem: "A 9-month-old who cannot yet crawl is brought to the emergency department with a spiral fracture of the femur. The father says the baby rolled off the couch. The provider says, \"Let's not jump to conclusions.\" What does the nurse do?",
    options: ["Wait for the skeletal survey before deciding about a report", "Report the suspected abuse to child protective services", "Ask the father to explain once more how the fall happened", "Let the provider decide whether a report needs to be made"],
    answer: 1,
    rationale: "A spiral femur fracture in a child who is not yet walking, with a story that does not fit the injury, is a red flag for abuse. Nurses are mandated reporters, and the duty is triggered by reasonable suspicion, not proof. The nurse cannot hand that duty to the provider or wait for more tests, and questioning the father is the investigators' role.",
    lens: { medic: "As a medic, you often pass your concerns to the ED staff and count on them to report.", nurse: "As an RN, you are a mandated reporter yourself, and telling a coworker does not meet your duty to report." } },
  m4s10: { area: "PHYS", type: "single", cj: "Take action",
    stem: "A client with delirium has been in soft wrist restraints for 2 hours. During a check, the nurse finds the right hand cool and pale, with a capillary refill of 4 seconds, and the client reports tingling. What does the nurse do first?",
    options: ["Release the right restraint and assess the hand", "Raise the right arm on a pillow and recheck in 1 hour", "Call the provider for an order to change the restraint", "Document the findings and recheck at the next check"],
    answer: 0,
    rationale: "A cool, pale hand with slow capillary refill and tingling means the restraint is cutting off circulation, so it is released right away and the hand is assessed. Elevating the arm and waiting allows more injury. The nurse does not need an order to loosen a restraint, and documenting comes after the hand is safe.",
    lens: { medic: "In the back of the rig, you restrain for a short transport and check what you can along the way.", nurse: "On the unit, restraints need a current order and scheduled checks, and you loosen them at the first sign of poor circulation." } },
  m4s11: { area: "PHYS", type: "single", cj: "Take action",
    stem: "A client's generalized tonic-clonic seizure ended 1 minute ago. He is unresponsive, breathing 14 times a minute with gurgling sounds, and saliva is pooling in his mouth. What does the nurse do next?",
    options: ["Place a bite block between his back teeth", "Begin neuro checks while he lies flat on his back", "Turn him onto his side and suction his mouth", "Apply soft wrist restraints until he is alert"],
    answer: 2,
    rationale: "Gurgling with pooled saliva in an unresponsive client threatens the airway, so the side-lying position and oral suction let secretions drain and prevent aspiration. Nothing is forced into the mouth after or during a seizure. Lying flat on the back lets secretions block the airway, and restraints are not used for a postictal client." },
  m4s12: { area: "RRP", type: "single", cj: "Take action",
    stem: "Before a client's first walk after hip surgery, the nurse checks vital signs. Lying, BP is 128/76 and HR is 82. After 1 minute sitting on the edge of the bed, BP is 102/60, HR is 104, and the client says, \"I feel lightheaded.\" What does the nurse do?",

    answer: 3,
    rationale: "A systolic drop of 26 mm Hg, a rise in heart rate, and lightheadedness show orthostatic hypotension, so standing now risks a fall. The nurse returns the client to bed, rechecks vital signs, and looks for causes such as fluid loss or opioids before trying again. Extra staff or a short walk does not remove the risk of fainting." },
  m4s13: { area: "RRP", type: "single", cj: "Take action",
    stem: "A client receiving oxygen at 3 L/min is being taken for an MRI. The transport cart carries a standard steel oxygen cylinder. What does the nurse do?",

    answer: 0,
    rationale: "A steel cylinder is pulled into the magnet with great force and can seriously injure or kill anyone in its path, even when the flow is off or the cylinder is strapped down. The nurse switches to the MRI suite's approved oxygen source before entering the restricted area. Stopping oxygen the client needs is not a safe option." },
  m4s14: { area: "PPT", type: "single", cj: "Take action",
    stem: "A client who has never taken opioids has a new prescription for hydromorphone 10 mg IV every 3 hours as needed for pain. The nurse calls the provider, who says, \"That's what I want. Give it.\" What does the nurse do next?",
    options: ["Give half of the dose and watch the client's breathing closely", "Give the dose, since the provider has now confirmed it", "Hold the dose and contact the charge nurse or supervisor", "Give the dose with naloxone ready at the client's bedside"],
    answer: 2,
    rationale: "A 10 mg IV dose of hydromorphone is far above a safe starting dose for an opioid-naive client and could cause fatal respiratory depression. The nurse is accountable for every dose given, so an unsafe prescription is held and the concern goes up the chain of command. Changing the dose on her own is practicing outside her scope, and having naloxone ready does not make an unsafe dose safe.",
    lens: { medic: "With online medical control, a physician's order on the radio usually ends the discussion.", nurse: "As an RN, you answer for every dose you give, so you hold an unsafe one and go up the chain of command." } },
  m4s15: { area: "HPM", type: "single", cj: "Evaluate outcomes",
    stem: "The nurse teaches a 15-year-old with newly diagnosed epilepsy about safety at home and school. Which statement shows the teaching worked?",
    options: ["\"I can still take baths if I lock the door for privacy.\"", "\"I'll take showers and swim with a buddy who knows.\"", "\"I can drive as soon as I get my learner's permit.\"", "\"I can skip a dose of my medicine when I feel fine.\""],
    answer: 1,
    rationale: "Showers lower the risk of drowning during a seizure, and swimming with someone who knows about the seizures means help is close. A locked bathroom keeps help out. Driving depends on a seizure-free period set by the state, and skipping doses can trigger seizures." },
  m4s16: { area: "SIPC", type: "multi", cj: "Take action",
    stem: "A client with a traumatic brain injury keeps pulling at his nasogastric tube. After less restrictive measures fail, he is placed in bilateral soft wrist restraints under a current provider order. Which actions by the nurse are correct? Select all that apply.",
    options: ["Tie the restraints to the bed frame with a quick-release knot", "Check that two fingers fit between each restraint and the wrist", "Assess skin, circulation, and movement of the hands per policy", "Offer fluids, toileting, and position changes at set intervals", "Secure the restraints to the side rails so they are easy to reach", "Keep using the restraints after the order expires if he still pulls"],
    answer: [0, 1, 2, 3],
    rationale: "Restraints are tied to the bed frame with a quick-release knot, fit loosely enough for two fingers, and require scheduled checks of circulation, skin, and basic needs. Tying them to a side rail can injure the client when the rail is lowered. Restraints need a current order, so an expired order must be renewed after the provider reevaluates the client." },
  m4s17: { area: "SIPC", type: "multi", cj: "Generate solutions",
    stem: "A client is admitted for a medication adjustment after having three seizures this week. Which actions are part of seizure precautions? Select all that apply.",
    options: ["Set up and test suction with a rigid tip", "Have oxygen and a mask ready at the bedside", "Tape a padded tongue blade to the headboard", "Keep soft wrist restraints at the bedside", "Keep the bed low with the wheels locked"],
    answer: [0, 1, 4],
    rationale: "Working suction and oxygen at the bedside let the nurse manage the airway after a seizure, and a low, locked bed reduces injury. Nothing is placed in the mouth during a seizure, so a tongue blade does not belong. Restraining a seizing client can cause fractures and other injuries." },
  m4s18: { area: "MOC", type: "multi", cj: "Evaluate outcomes",
    stem: "A preceptor reviews a new graduate nurse's charting habits. Which actions need correction? Select all that apply.",
    options: ["Charts the 2200 medications as given at 2000 to save time", "Draws a single line through an error and adds initials", "Uses correction fluid to cover a wrong blood pressure", "Notes in the chart that an event report was filed", "Records the client's own words in quotation marks"],
    answer: [0, 2, 3],
    rationale: "Charting care before it is done is falsification, and covering an entry with correction fluid looks like altering the record. Event reports are internal quality documents, so the chart describes the facts of the event without mentioning the report. A single line with initials is the correct way to fix a paper error, and quoting the client is good practice." },
  m4s19: { area: "MOC", type: "multi", cj: "Evaluate outcomes",
    stem: "The charge nurse on a medical unit observes staff during a busy shift. Which actions need follow-up because they breach client confidentiality? Select all that apply.",
    options: ["A nurse tells a caller who says he is the client's brother about a new cancer diagnosis", "A nurse asks the client which family members may receive updates on his condition", "A UAP posts a unit selfie online that shows a client's name on the hallway board", "A nurse closes the curtain and lowers her voice while taking the client's history", "A nurse logs out of the workstation before leaving the client's room for a break"],
    answer: [0, 2],
    rationale: "Sharing a diagnosis with an unverified caller who is not on the client's approved list is a breach, and a photo that shows any client identifier on social media is a breach even if it was posted by accident. Asking the client who may receive information, speaking privately, and logging out of the workstation all protect confidentiality." },
  m4s20: { area: "PSY", type: "multi", cj: "Take action",
    stem: "A client is admitted to a medical unit after an intentional overdose and says he still wants to die. A sitter is assigned. During the room safety check, which items does the nurse remove? Select all that apply.",
    options: ["Plastic liner in the trash can", "Laces in the client's sneakers", "Phone charger cord at the bedside", "Paper cup for drinking water", "Hospital gown with snap closures"],
    answer: [0, 1, 2],
    rationale: "Plastic bags can be used for suffocation, and shoelaces and cords can be used as ligatures, so all three are removed even with a sitter present. A paper cup and a gown with snaps carry little risk and are allowed. A room check is done on admission and repeated whenever items are brought in." }

    options: ["Use the fluticasone first, then wait 5 minutes before the albuterol.", "Use both inhalers back to back so the doses reach the lungs together.", "Use the albuterol first, then wait 5 minutes before the fluticasone.", "Use the fluticasone at 0800 and save the albuterol for bedtime."],
    answer: 2,
    rationale: "The bronchodilator opens the airways first so the inhaled steroid can reach deeper into the lungs. The client then rinses and spits after the steroid to lower the risk of thrush. Giving the steroid first or both at once sends less of it past narrowed airways, and the rescue drug is not held for bedtime." },
  m6b5: { area: "PPT", type: "single", cj: "Recognize cues",
    stem: "A 66-year-old client with type 2 diabetes is on day 3 of IV methylprednisolone for a COPD flare. Which finding does the nurse report to the provider?",
    options: ["Eats more at meals than at home", "Had trouble falling asleep last night", "Mild flushing of the face and neck", "Glucose of 286 mg/dL before lunch"],
    answer: 3,
    rationale: "Corticosteroids raise blood glucose, and a value this high in a client with diabetes needs a change in insulin coverage. A bigger appetite, poor sleep, and facial flushing are common, expected steroid effects that the nurse can address and document." },
  m6b6: { area: "PPT", type: "single", cj: "Evaluate outcomes",
    stem: "A 67-year-old client with COPD goes home on a 7-day course of prednisone. Which statement shows the teaching worked?",
    options: ["\"I'll stop the pills once my breathing feels better.\"", "\"I'll take each dose in the morning with food.\"", "\"I'll take two pills if I miss a day.\"", "\"I'll skip it on days my sugar runs high.\""],
    answer: 1,
    rationale: "Taking prednisone in the morning with food matches the body's natural cortisol rhythm and protects the stomach. The full course is finished as prescribed, doses aren't doubled, and high glucose is reported to the provider, not managed by skipping doses." },
  m6b7: { area: "PHYS", type: "single", cj: "Generate solutions",
    stem: "A 75-year-old client with COPD and chronic CO2 retention is on oxygen at 2 L/min by nasal cannula. The client breathes through the mouth, and SpO2 swings between 84% and 95%. The provider wants a steady FiO2 of 28%. Which device does the nurse anticipate?",
    options: ["Venturi mask set to 28%", "Nonrebreather at 10 L/min", "Simple face mask at 3 L/min", "Nasal cannula at 6 L/min"],
    answer: 0,
    rationale: "A Venturi mask mixes oxygen and room air through a set port, so it gives a precise FiO2 no matter how the client breathes. A nonrebreather gives far more oxygen than a CO2 retainer needs. A simple mask below 5 L/min lets the client rebreathe CO2, and a cannula's FiO2 still varies with mouth breathing.",
    lens: { medic: "In the field, a short-of-breath COPD client often gets a nonrebreather or CPAP for the ride in.", nurse: "On the unit, a retainer may be on oxygen for days, so the goal is a precise, low FiO2, and the Venturi mask delivers it." } },
  m6b8: { area: "PHYS", type: "multi", cj: "Take action",
    stem: "A 58-year-old client with pneumonia has an SpO2 of 85% on 6 L/min by nasal cannula, and the provider prescribes a nonrebreather mask. Which actions by the nurse are correct? Select all that apply.",
    options: ["Fill the reservoir bag before placing the mask on the face", "Set the flow so the bag does not collapse when the client inhales", "Set the flow at 4 L/min to keep the client from retaining CO2", "Remove the valve flaps so the client can breathe more easily", "Fit the mask snugly over the client's nose and mouth", "Loosen the mask so room air can mix in around the edges"],
    answer: [0, 1, 4],
    rationale: "A nonrebreather works when the bag is filled first, the flow (usually 10 to 15 L/min) keeps the bag from collapsing, and the mask seals well. A low flow lets the bag empty, so the client rebreathes CO2 and gets less oxygen. The one-way valves and a good seal are what keep room air and exhaled CO2 out." },
  m6b9: { area: "RRP", type: "single", cj: "Take action",
    stem: "A 45-year-old client is brought to the emergency department after being pulled from a house fire. The client has a headache, nausea, and confusion. SpO2 reads 99% on a nonrebreather mask. What does the nurse do next?",
    options: ["Switch to a nasal cannula at 2 L/min as SpO2 is normal", "Move the probe to an earlobe to confirm the reading", "Get an arterial sample for a carboxyhemoglobin level", "Recheck the SpO2 in 1 hour and document the trend"],
    answer: 2,
    rationale: "A standard pulse oximeter reads carboxyhemoglobin as oxyhemoglobin, so the SpO2 can look normal in carbon monoxide poisoning. Headache, nausea, and confusion after smoke exposure call for co-oximetry while 100% oxygen continues. Lowering the oxygen, moving the probe, or waiting does not reveal the true level.",
    lens: { medic: "Some rigs carry an SpCO probe, but most crews put a smoke victim on 100% oxygen no matter what the SpO2 shows.", nurse: "In the ED, keep the nonrebreather on and get a co-oximetry level, because the standard SpO2 cannot tell CO from oxygen." } },
  m6b10: { area: "RRP", type: "multi", cj: "Analyze cues",
    stem: "A 79-year-old client on a med-surg unit has an SpO2 reading of 84% with a flat, irregular waveform. The client is talking comfortably with an RR of 16 and pink lips. Which factors could make this reading unreliable? Select all that apply.",
    options: ["Cold hands with slow capillary refill", "Dark gel polish on the probe finger", "A steady tremor in the hand with the probe", "Head of the bed raised to 45 degrees", "Probe on the arm opposite the IV site"],
    answer: [0, 1, 2],
    rationale: "Poor perfusion from cold fingers, dark nail polish, and motion all disrupt the light signal and give a poor waveform and false readings. The nurse warms the hand or moves the probe and checks the client before acting on the number. Bed position and placing the probe away from the IV do not distort the reading." },
  m6b11: { area: "PHYS", type: "single", cj: "Analyze cues",
    stem: "A 49-year-old client admitted with sepsis 2 days ago now has an SpO2 of 86% on a nonrebreather, RR 34, and crackles in both lungs. A new chest x-ray shows infiltrates in both lungs, and there are no signs of heart failure. What does the nurse suspect?",
    options: ["Acute respiratory distress syndrome", "A COPD flare from the infection", "A panic attack from being ill", "A mucus plug blocking one main bronchus"],
    answer: 0,
    rationale: "Low oxygen that doesn't improve on high-flow oxygen, fast breathing, and new infiltrates in both lungs after sepsis, without heart failure, fits ARDS. A mucus plug affects one area, and COPD and anxiety don't explain new bilateral infiltrates. Expect a move to the ICU for ventilatory support." },
  m6b12: { area: "PHYS", type: "single", cj: "Take action",
    stem: "A 4-year-old arrives sitting forward and drooling, with a muffled voice and a temperature of 39.6°C. What does the nurse do?",
    options: ["Examine the throat with a tongue blade now", "Lay the child flat to listen to the lungs", "Keep the child upright; call airway help", "Send the child for a throat culture first"],
    answer: 2,
    rationale: "Drooling, a muffled voice, sitting forward, and high fever suggest epiglottitis, which can close the airway suddenly. Keep the child calm and upright and get airway experts. A tongue blade, lying flat, or a throat swab can trigger complete obstruction.",
    lens: { medic: "You know not to agitate a kid who's working to breathe.", nurse: "Same rule in the ED: no tongue blade, no lying flat, and keep a parent close." } },
  m6b13: { area: "RRP", type: "single", cj: "Take action",
    stem: "A 61-year-old client is back from a bronchoscopy. His throat was numbed with spray. He asks for a drink of water. What does the nurse do?",
    options: ["Give him small sips of water to start", "Check for a gag reflex first", "Give him ice chips but no liquids", "Let him drink since he's fully awake"],
    answer: 1,
    rationale: "The numbing spray blunts the gag reflex, so he could aspirate. Nothing goes by mouth, ice chips included, until his gag reflex returns. Being awake doesn't mean his throat is protected." },
  m6b14: { area: "RRP", type: "single", cj: "Take action",
    stem: "The nurse draws an arterial blood gas from the radial artery of a client on a heparin infusion. What does the nurse do next?",
    options: ["Cover the site with a bandage and leave", "Have the client bend the wrist to stop it", "Hold light pressure for about 30 seconds", "Hold firm pressure well past 5 minutes"],
    answer: 3,
    rationale: "Arterial sites need firm pressure for at least 5 minutes, and longer when the client is anticoagulated, to prevent a hematoma. A bandage alone, bending the wrist, or a short, light hold isn't enough on heparin." },
  m6b15: { area: "SIPC", type: "single", cj: "Generate solutions",
    stem: "A client with suspected measles (rubeola) is admitted to a negative-pressure room. Which staff member should be assigned to the client?",
    options: ["A nurse who is pregnant and unsure of her immunity", "A nurse with documented immunity to measles", "A UAP who had a bad cold last week and still coughs", "A newly hired nurse whose records aren't in yet"],
    answer: 1,
    rationale: "Measles is airborne and highly contagious, so care goes to staff with documented immunity. A pregnant nurse who may not be immune is at risk of serious complications, and unknown immunity isn't safe. A lingering cough isn't the issue here." },
  m6b16: { area: "SIPC", type: "single", cj: "Take action",
    stem: "A 2-month-old is admitted with suspected pertussis (whooping cough). Which precautions does the nurse start?",
    options: ["Airborne precautions and an N95", "Contact precautions and a gown", "Droplet precautions, surgical mask", "Standard precautions without a mask"],
    answer: 2,
    rationale: "Pertussis spreads by large droplets, so droplet precautions with a surgical mask are used in addition to standard precautions. An N95 and negative pressure are for airborne infections like TB and measles." },
  m6b17: { area: "PPT", type: "single", cj: "Evaluate outcomes",
    stem: "A 48-year-old client with a pulmonary embolism has been on a heparin infusion for 3 days. Warfarin was started yesterday, and today's INR is 1.4. The client asks, \"Now that I'm on the pill, can the IV come out?\" Which response is accurate?",
    options: ["\"The heparin continues until your INR is in the target range.\"", "\"The heparin stops today now that your INR has started to rise.\"", "\"The heparin stops once your aPTT is back to a normal level.\"", "\"The heparin breaks up the clot, and the pill keeps it away.\""],
    answer: 0,
    rationale: "Warfarin takes several days to work, so heparin overlaps with it until the INR is in the target range, usually 2 to 3, for about 24 hours. An early rise in INR does not mean the client is protected. A normal aPTT is not the stopping point, and heparin prevents clot growth rather than dissolving the clot." },
  m6b18: { area: "HPM", type: "single", cj: "Generate solutions",
    stem: "A 58-year-old client at a primary care clinic was just diagnosed with mild COPD and smokes a pack of cigarettes a day. The client asks, \"What will do the most to slow this down?\" Which response is best?",
    options: ["\"Using your albuterol on a set schedule every 4 hours.\"", "\"Starting oxygen at night to rest your lungs while you sleep.\"", "\"Quitting smoking, and I can connect you with help to do it.\"", "\"Taking an antibiotic each winter to prevent lung infections.\""],
    answer: 2,
    rationale: "Quitting smoking is the one step shown to slow the loss of lung function in COPD, and offering support makes success more likely. Scheduled rescue inhaler use does not change disease course. Oxygen is for clients with low oxygen levels, and routine winter antibiotics are not standard for mild COPD." },
  m6b19: { area: "BCC", type: "single", cj: "Evaluate outcomes",
    stem: "A 71-year-old client with COPD is short of breath after walking to the bathroom. The nurse taught pursed-lip breathing yesterday. Which observation shows the client is doing it correctly?",
    options: ["Inhales through the nose and exhales slowly through pursed lips", "Inhales through pursed lips and exhales quickly through the nose", "Inhales deeply and holds the breath for 10 seconds, then exhales", "Exhales hard through pursed lips to empty the lungs quickly"],
    answer: 0,
    rationale: "Pursed-lip breathing uses a normal breath in through the nose and a slow breath out through pursed lips, about twice as long as the inhale. The gentle back pressure keeps small airways open and lets trapped air escape. Fast or forced exhaling collapses those airways, and breath holding adds to air trapping." },
  m6b20: { area: "BCC", type: "single", cj: "Generate solutions",
    stem: "A 19-year-old client with cystic fibrosis has lost 3 kg (6.6 lb) over 2 months and has greasy, foul-smelling stools. Which plan does the nurse reinforce?",
    options: ["A low-fat diet to cut down on the greasy, smelly stools", "Enzymes with meals and snacks, plus high-calorie food", "Enzymes once at bedtime, plus a low-sodium diet", "Small low-protein meals spaced out to ease digestion"],
    answer: 1,
    rationale: "Fatty stools and weight loss show poor absorption from pancreatic failure. Pancreatic enzymes taken with every meal and snack, plus a high-calorie, high-fat, high-protein diet, help the client absorb nutrients and gain weight. Cutting fat or protein worsens weight loss, enzymes at bedtime miss the meals, and clients with CF lose extra salt in sweat." },
  m6s1: { area: "PHYS", type: "single", cj: "Take action",
    stem: "A client in a long-term care facility has had a tracheostomy for 2 months. During a coughing fit the tube comes out completely. The client is breathing through the stoma, and SpO2 is falling from 95% to 89%. What does the nurse do?",
    options: ["Insert the spare tube with its obturator in place", "Cover the stoma with gauze and apply a nonrebreather mask", "Call the provider and stay at the bedside with the client", "Rinse the old tube in sterile saline and reinsert it"],
    answer: 0,
    rationale: "A 2-month-old stoma has a mature tract, so the nurse reinserts the spare tube right away, guided by the obturator, then removes the obturator and confirms airflow. Covering the stoma is a backup only if a tube cannot be placed. Waiting for the provider delays the airway, and the old tube is contaminated when a clean spare is at hand.",
    lens: { medic: "In the field a dislodged trach often means bagging the stoma or the mouth and heading for the ED.", nurse: "On the unit the spare tube and obturator are kept at the bedside so the nurse can replace a mature trach in seconds." } },
  m6s2: { area: "PHYS", type: "single", cj: "Take action",
    stem: "A client 5 days after a tracheostomy has a cuffed tube with a disposable inner cannula. The client suddenly becomes restless, makes a high-pitched sound at the tube, and has an SpO2 of 84%. The suction catheter stops a few centimeters into the tube. What does the nurse do first?",
    options: ["Instill 5 mL of saline through the inner cannula", "Remove the inner cannula and look for a plug", "Deflate the cuff and ask the client to cough", "Raise the oxygen on the trach collar to 60%"],
    answer: 1,
    rationale: "A catheter that will not pass points to a blocked tube, and a mucus plug in the inner cannula is the most common cause. Removing the inner cannula clears it fastest. Saline does not clear a plug and can push it deeper. Cuff deflation comes later if the airway is still blocked, and more oxygen cannot get past an obstruction.",
    lens: { medic: "A paramedic's reflex for a gurgling airway is to suction harder and deeper.", nurse: "With a trach the nurse pulls the inner cannula first, because the plug is often inside it." } },
  m6s3: { area: "SIPC", type: "single", cj: "Take action",
    stem: "A client with a cuffed tracheostomy is starting to use a one-way speaking valve. The family places the valve on the tube while the nurse is in the room. The client becomes distressed, cannot exhale, and SpO2 begins to fall. The pilot balloon is full. What does the nurse do first?",
    options: ["Deflate the cuff while leaving the valve in place", "Suction the tube through the speaking valve", "Remove the speaking valve from the tube at once", "Coach the client to take slow, deep breaths"],
    answer: 2,
    rationale: "A one-way valve lets air in but not out through the tube, so with the cuff inflated the client has no path to exhale. Removing the valve restores exhalation instantly. Deflating the cuff with the valve on is slower and less certain. A catheter cannot be passed through the valve, and coaching does not fix trapped air." },
  m6s4: { area: "RRP", type: "multi", cj: "Take action",
    stem: "A hospitalized client with a tracheostomy has coarse rhonchi and an SpO2 of 90%. The nurse prepares to suction the tube. Which actions are correct? Select all that apply.",
    options: ["Give 100% oxygen for 30 to 60 seconds before the pass", "Apply suction while advancing the catheter into the tube", "Limit each pass to no more than 10 to 15 seconds", "Instill saline before each pass to loosen secretions", "Use a sterile catheter and a sterile glove for each pass", "Repeat passes back to back until the airway is clear"],
    answer: [0, 2, 4],
    rationale: "Preoxygenating, keeping each pass to 10 to 15 seconds, and using sterile technique in the hospital limit hypoxia and infection. Suction is applied only while withdrawing the catheter. Routine saline instillation is not recommended because it can drop oxygen levels and carry bacteria deeper, and the client needs rest and reoxygenation between passes." },
  m6s5: { area: "PHYS", type: "single", cj: "Analyze cues",
    stem: "A client on a ventilator in volume control is awake, coughing, and has coarse rhonchi over the trachea. The high-pressure alarm keeps sounding, and SpO2 is 92%. The tubing has no kinks. What does the nurse do?",
    options: ["Silence the alarm and recheck it in 15 minutes", "Ask the respiratory therapist to raise the limit", "Deflate the cuff a little to lower the pressure", "Suction the airway with the in-line catheter"],
    answer: 3,
    rationale: "Coughing and rhonchi point to secretions raising airway pressure, so suctioning treats the cause. Silencing the alarm ignores the problem. Raising the limit or deflating the cuff hides the alarm without clearing the airway, and an underinflated cuff raises aspiration risk." },
  m6s6: { area: "PHYS", type: "single", cj: "Take action",
    stem: "A sedated client on a ventilator triggers a low-pressure alarm. The nurse checks the circuit connections and finds no leak, but SpO2 is dropping to 85% and chest rise is poor. What does the nurse do next?",
    options: ["Remove the ventilator and bag with 100% oxygen", "Wait for the respiratory therapist to find the cause", "Raise the FiO2 on the ventilator to 100 percent", "Reset the alarm and recheck the client in 5 minutes"],
    answer: 0,
    rationale: "When an alarm cause is not found quickly and the client is getting worse, the nurse ventilates by hand with a resuscitation bag on 100% oxygen and calls for help. Waiting or resetting the alarm delays care. More FiO2 does not help when the machine is not delivering enough volume.",
    lens: { medic: "Bagging is second nature to a paramedic, but the ventilator itself may feel unfamiliar.", nurse: "The same rule holds on the unit: if the machine fails the client, take the client off the machine and bag." } },
  m6s7: { area: "SIPC", type: "multi", cj: "Generate solutions",
    stem: "A client has been intubated for 3 days after a stroke. Which actions does the nurse include to lower the risk of ventilator-associated pneumonia? Select all that apply.",
    options: ["Change the ventilator circuit every 24 hours", "Keep the head of the bed raised 30 to 45 degrees", "Brush the teeth and gums as part of oral care", "Lay the client flat between turns for comfort", "Join the daily sedation pause and readiness check", "Use subglottic suction if the tube has a port"],
    answer: [1, 2, 4, 5],
    rationale: "Raising the head of the bed, routine oral care with brushing, daily sedation pauses with readiness checks, and draining secretions above the cuff all lower pneumonia risk. Circuits are changed when soiled or broken, not on a schedule, because frequent changes add risk. Lying flat makes aspiration of secretions more likely." },
  m6s8: { area: "PHYS", type: "multi", cj: "Recognize cues",
    stem: "A client on a ventilator for 4 days with pneumonia is screened for a spontaneous breathing trial. Which findings suggest the client is ready? Select all that apply.",
    options: ["Norepinephrine rate raised 1 hour ago for low BP", "Opens eyes to voice and follows simple commands", "Respiratory rate of 36 with use of neck muscles", "FiO2 of 0.40 and PEEP of 5 with SpO2 of 95%", "Temperature of 39.4°C (103°F) since this morning", "Strong cough with small amounts of thin secretions"],
    answer: [1, 3, 5],
    rationale: "Readiness cues include alertness, low oxygen and PEEP needs, and a strong cough that can protect the airway. A rising vasopressor dose means the client is not stable. Fast breathing with accessory muscle use and a high fever show the body is still under too much stress to breathe alone." },
  m6s9: { area: "PPT", type: "single", cj: "Prioritize hypotheses",
    stem: "A client with COPD takes oral theophylline daily. Ciprofloxacin was started 3 days ago for bronchitis. The client now has nausea, vomiting, restlessness, and a heart rate of 128. What does the nurse do first?",
    options: ["Give the prescribed antiemetic and recheck in 1 hour", "Hold the theophylline and notify the provider", "Encourage clear fluids and offer some dry crackers", "Give the theophylline with food to ease the nausea"],
    answer: 1,
    rationale: "Ciprofloxacin raises theophylline levels, and nausea, vomiting, restlessness, and tachycardia are signs of toxicity that can progress to dysrhythmias and seizures. The nurse holds the drug and notifies the provider, who will likely check a level. Treating the nausea alone or giving the dose with food misses the toxicity." },
  m6s10: { area: "PPT", type: "single", cj: "Evaluate outcomes",
    stem: "The nurse watches a client with asthma use a fluticasone metered-dose inhaler with a spacer. Which action needs correction?",
    options: ["Shakes the inhaler before attaching it to the spacer", "Rinses the mouth with water and spits after the dose", "Breathes in slowly and holds the breath for 10 seconds", "Sprays two puffs into the spacer, then inhales once"],
    answer: 3,
    rationale: "Each puff goes into the spacer and is inhaled on its own breath, because two puffs at once lower the dose delivered. Shaking the canister, a slow breath with a 10-second hold, and rinsing and spitting after an inhaled steroid are all correct. Rinsing lowers the risk of oral thrush." },
  m6s11: { area: "PPT", type: "multi", cj: "Evaluate outcomes",
    stem: "A client with active pulmonary TB is starting rifampin, isoniazid, pyrazinamide, and ethambutol. Which statements show the teaching was understood? Select all that apply.",
    options: ["\"My tears may turn orange, so I'll wear glasses, not soft lenses.\"", "\"I can stop the pills once my cough is gone for 2 weeks.\"", "\"I will call if my urine gets dark or my eyes look yellow.\"", "\"A few beers on the weekend will not affect these pills.\"", "\"If my urine turns orange, I should stop the rifampin.\"", "\"I will keep taking these pills for at least 6 months.\""],
    answer: [0, 2, 5],
    rationale: "Rifampin turns body fluids orange and can stain soft lenses, which is harmless but worth planning for. Dark urine and yellow eyes can signal liver injury from isoniazid and the other drugs, and treatment lasts at least 6 months. Stopping early breeds resistant TB, alcohol adds to liver injury, and orange urine is no reason to stop." },
  m6s12: { area: "PSY", type: "single", cj: "Prioritize hypotheses",
    stem: "A 15-year-old with asthma started montelukast 6 weeks ago. The parent says the teen has had nightmares, is irritable, and recently said, \"Nobody would miss me.\" What does the nurse do first?",
    options: ["Explain that moody behavior is common at this age", "Tell the parent to stop the drug and call next week", "Suggest giving the dose in the morning instead", "Ask the teen directly about thoughts of self-harm"],
    answer: 3,
    rationale: "Montelukast can cause mood and behavior changes, including suicidal thinking, and the teen's comment needs a direct suicide risk assessment now. The provider is then notified about the drug. Calling it normal teen behavior dismisses a warning sign, waiting a week delays safety, and changing the dose time does not address the risk." },
  m6s13: { area: "HPM", type: "single", cj: "Generate solutions",
    stem: "A client with asthma has a personal best peak flow of 450 L/min and a green, yellow, and red zone action plan. This morning the reading is 290 L/min, and she has a mild cough. What does the nurse advise?",
    options: ["Take the quick-relief inhaler per plan and recheck", "Call 911 and go to the emergency department now", "Continue the usual daily routine without changes", "Double the controller dose for the rest of the week"],
    answer: 0,
    rationale: "A reading of 290 is about 64% of her best, which is the yellow zone of 50% to 79%. The plan calls for the quick-relief inhaler and a recheck, and a call to the provider if she does not return to green. Emergency care is for the red zone, below 50%. Ignoring the reading or doubling a controller on her own is unsafe." },
  m6s14: { area: "RRP", type: "single", cj: "Take action",
    stem: "A client admitted with suspected pneumonia has an order for a sputum culture. The first antibiotic dose is due in 1 hour. Which instruction does the nurse give?",
    options: ["Use mouthwash first, then spit saliva into the cup", "Rinse your mouth with water, then cough deeply into the cup", "We can collect it tomorrow morning after the antibiotic", "Clear your throat and spit into the cup, then close it"],
    answer: 1,
    rationale: "A good sample comes from a deep cough after a plain water rinse, collected before the first antibiotic dose. Mouthwash can kill the organisms the lab needs to grow. Saliva or throat clearings are not sputum, and collecting after the antibiotic can give a false negative culture." },
  m6s15: { area: "RRP", type: "single", cj: "Take action",
    stem: "A client with lung cancer and a large right pleural effusion is about to have a bedside thoracentesis. The client is alert and able to sit. How does the nurse position the client?",
    options: ["Lying flat on the back with the arms at the sides", "Prone with a pillow under the hips and arms raised", "Sitting on the bed edge, leaning forward over a table", "Lying on the right side with knees to the chest"],
    answer: 2,
    rationale: "Sitting upright and leaning forward over a padded table spreads the ribs and lets fluid settle at the base, where the needle goes in. Lying flat or prone does not open the space. Lying on the affected side, curled up, is the lumbar puncture position and blocks the site." },
  m6s16: { area: "RRP", type: "multi", cj: "Recognize cues",
    stem: "One hour after a thoracentesis that removed 1,200 mL of fluid, the nurse reassesses the client. Which findings need prompt follow-up? Select all that apply.",
    options: ["Small, dry dressing over the puncture site", "New sharp chest pain with shortness of breath", "Mild soreness at the site, rated 2 out of 10", "Heart rate up from 84 to 118 since the procedure", "Respiratory rate of 18 and SpO2 of 96%", "Constant coughing that brings up frothy sputum"],
    answer: [1, 3, 5],
    rationale: "Sudden pleuritic pain with dyspnea and a climbing heart rate suggest pneumothorax or bleeding. Constant coughing with frothy sputum after a large drainage suggests re-expansion pulmonary edema. A dry dressing, mild soreness, and normal breathing are expected findings." },
  m6s17: { area: "BCC", type: "single", cj: "Generate solutions",
    stem: "A client with obstructive sleep apnea started home CPAP 2 weeks ago. He says he pulls the mask off at night because his nose and mouth get very dry. What does the nurse suggest?",
    options: ["Wear the mask every other night to rest the nose", "Loosen the straps so some air escapes around the mask", "Use a decongestant nasal spray every night at bedtime", "Use the machine's heated humidifier and adjust it"],
    answer: 3,
    rationale: "Dryness is a common reason clients quit CPAP, and heated humidification usually fixes it. Skipping nights leaves the apnea untreated. A loose mask leaks air and makes dryness worse. Nightly decongestant spray causes rebound congestion." },
  m6s18: { area: "BCC", type: "single", cj: "Generate solutions",
    stem: "A 74-year-old client is on day 2 of treatment for pneumonia. Vital signs are stable, SpO2 is 94% on 2 L, and she walks with a walker at home. She says, \"I'd rather stay in bed until I'm better.\" Which plan does the nurse put in place?",
    options: ["Up in a chair for meals and walking in the hall with help", "Bed rest with turning every 2 hours until the cough clears", "Bathroom privileges with a bedside commode at night", "Range-of-motion exercises in bed three times a day"],
    answer: 0,
    rationale: "Early, assisted mobility in a stable client with pneumonia helps clear secretions, expands the lungs, and prevents deconditioning. Bed rest and range of motion in bed keep her lying down and raise the risk of clots, weakness, and pressure injury. Bathroom trips alone are too little activity." },
  m6s19: { area: "PHYS", type: "single", cj: "Take action",
    stem: "A client with obstructive sleep apnea is in the PACU after knee surgery and received IV opioids. While asleep he snores loudly, has pauses in breathing, and SpO2 drops to 86% on 2 L nasal cannula. He wakes easily to voice, and his RR is 14. His home CPAP is in the orders. What does the nurse do?",
    options: ["Give naloxone IV and recheck the respiratory rate", "Place him on his own CPAP at the home settings", "Raise the nasal cannula to 6 L and let him sleep", "Lay him flat on his back with one pillow under his head"],
    answer: 1,

  m7b1: { area: "PHYS", type: "single", cj: "Recognize cues",

  m7b2: { area: "PHYS", type: "multi", cj: "Generate solutions",
    stem: "A client with a closed head injury has an ICP of 19 mm Hg. Which actions does the nurse include in the plan to keep the ICP from rising? Select all that apply.",

  m7b3: { area: "PHYS", type: "single", cj: "Analyze cues",
    stem: "A client 6 hours after a traumatic brain injury opens his eyes only when the nurse presses on a nail bed. He moans without forming words. When pressure is applied, he bends his arms tightly toward his chest with his wrists flexed. What is his Glasgow Coma Scale score?",

    rationale: "Eyes opening to pressure scores 2, sounds without words score 2, and abnormal flexion (decorticate posturing) scores 3, for a total of 7. A common error is scoring the arm response as withdrawal, which scores 4 and gives 8. Abnormal flexion is a sign of serious injury above the brainstem, so this client needs close airway watch.",
    lens: { medic: "On scene you score GCS once or twice to guide triage and the destination.", nurse: "On the unit you score it the same way every hour and act on a drop of 2 points or more." } },
  m7b4: { area: "PHYS", type: "single", cj: "Analyze cues",
    stem: "A 24-year-old client was admitted 3 hours ago with a C6 spinal cord injury from a diving accident. Imaging shows no internal bleeding. His BP is 82/46 mm Hg and heart rate is 50, and his skin below the injury is warm, dry, and pink. Which condition do these findings best match?",

    lens: { medic: "In the field you treat low BP after trauma as bleeding until proven otherwise.", nurse: "On the unit, with bleeding ruled out, slow HR and warm skin point to neurogenic shock treated with fluids, vasopressors, and atropine as prescribed." } },
  m7b5: { area: "PHYS", type: "single", cj: "Take action",
    stem: "A client with a T4 spinal cord injury from 2 years ago is admitted for a pressure injury. He suddenly reports a pounding headache and blurred vision. His BP is 204/112 mm Hg (baseline 98/60), his heart rate is 54, and his face is flushed and sweaty. What does the nurse do first?",

    lens: { medic: "In the field a BP this high might make you reach for a drug first.", nurse: "Here the first move is sitting him up and finding the trigger, because BP often falls once the cause is removed." } },
  m7b6: { area: "PHYS", type: "multi", cj: "Recognize cues",

  m7b7: { area: "RRP", type: "single", cj: "Take action",

  m7b8: { area: "RRP", type: "multi", cj: "Recognize cues",

  m7b9: { area: "RRP", type: "single", cj: "Take action",
    stem: "A client on the neuro unit has been in a generalized tonic-clonic seizure for 6 minutes. He is on his side with oxygen applied, and a saline lock is in place. Which prescription does the nurse give first?",

  m7b10: { area: "RRP", type: "single", cj: "Take action",

  m7b12: { area: "PPT", type: "multi", cj: "Take action",

  m7b13: { area: "PPT", type: "single", cj: "Generate solutions",

  m7b14: { area: "PPT", type: "single", cj: "Take action",
    stem: "A 52-year-old client with a subarachnoid hemorrhage takes oral nimodipine every 4 hours. Before the 1200 dose, BP is 94/56, down from 128/76. What does the nurse do?",

  m7b15: { area: "SIPC", type: "single", cj: "Take action",

  m7b16: { area: "SIPC", type: "multi", cj: "Take action",

    lens: { medic: "In the field, spinal motion restriction lasts only until the ED clears or images the spine.", nurse: "On the unit the same collar may stay on for weeks, so skin checks and pad changes with manual stabilization are routine care." } },
  m7b17: { area: "SIPC", type: "single", cj: "Take action",
    stem: "A 74-year-old client with Parkinson's disease takes carbidopa-levodopa. At 0800 his BP was 132/78 mm Hg lying and 106/64 mm Hg standing, and he walks with a shuffle. He now asks to walk to the bathroom. What does the nurse do?",

  m7b18: { area: "BCC", type: "single", cj: "Generate solutions",

  m7b20: { area: "PSY", type: "single", cj: "Take action",
