  m12b15: { area: "PHYS", type: "multi", cj: "Generate solutions",
    stem: "A 7-year-old client with sickle cell disease is admitted with a vaso-occlusive crisis. He rates the pain in both legs as 9 out of 10. SpO2 is 93% on room air. Which actions does the nurse include in the plan of care? Select all that apply.",
    options: ["Give IV fluids at the prescribed rate and track intake and output", "Give pain medicine on a set schedule, not just when he asks", "Give oxygen as prescribed to keep SpO2 at the ordered target", "Place ice packs on both legs to reduce the swelling", "Limit fluids to prevent fluid overload in the lungs"],
    answer: [0, 1, 2],
    rationale: "Hydration lowers blood viscosity and helps reverse sickling, and severe crisis pain is managed with scheduled or PCA opioids rather than waiting for requests. An SpO2 of 93% calls for oxygen to the ordered target. Cold causes vasoconstriction and more sickling, and restricting fluids works against the main treatment." },
  m12b16: { area: "HPM", type: "multi", cj: "Evaluate outcomes",
    stem: "The nurse teaches the parent of a 3-year-old client with sickle cell disease how to prevent crises and spot emergencies at home. Which statements by the parent show understanding? Select all that apply.",
    options: ["\"I'll call right away if his temperature is 38.5°C (101.3°F) or higher.\"", "\"I'll dress him warmly in cold weather and skip cold swimming pools.\"", "\"I'll offer him water often, especially on hot days and when he's sick.\"", "\"I'll learn to feel for his spleen and call if it seems bigger.\"", "\"I'll stop his penicillin now that he has turned 3 and is doing well.\"", "\"I'll give him a cool bath to bring a fever down before I call.\""],
    answer: [0, 1, 2, 3],
    rationale: "Children with sickle cell disease have poor spleen function, so fever is an emergency that needs prompt evaluation for sepsis. Warmth and good hydration help prevent sickling, and parents learn to feel the spleen to catch splenic sequestration. Daily penicillin usually continues until at least age 5, and a cool bath both delays the call and adds cold exposure." },
  m12b17: { area: "PPT", type: "single", cj: "Take action",
    stem: "A 9-year-old client admitted with pneumonia weighs 25 kg. The provider prescribes IV fluid at the full maintenance rate: 100 mL/kg/day for the first 10 kg, 50 mL/kg/day for the next 10 kg, and 20 mL/kg/day for each kg above 20. At what rate in mL/hr does the nurse set the pump? Round to the nearest whole number.",
    options: ["63 mL/hr", "67 mL/hr", "73 mL/hr", "104 mL/hr"],
    answer: 1,
    rationale: "The first 10 kg need 1,000 mL, the next 10 kg need 500 mL, and the last 5 kg need 100 mL, for 1,600 mL/day. Divided by 24 hours, that is 66.7, or 67 mL/hr. 63 mL/hr leaves out the weight above 20 kg, 73 mL/hr uses 50 mL/kg for all weight above 10 kg, and 104 mL/hr uses 100 mL/kg for the whole body weight." },
  m12b18: { area: "SIPC", type: "single", cj: "Take action",
    stem: "An 8-month-old client is admitted with fever, irritability that gets worse when held, a high-pitched cry, and a bulging anterior fontanel. Bacterial meningitis is suspected and a lumbar puncture is planned. Which precautions does the nurse start?",
    options: ["Droplet precautions until 24 hours of effective antibiotics", "Standard precautions while awaiting the spinal fluid culture", "Airborne precautions in a negative-pressure room for 7 days", "Contact precautions until the fever has been gone for 48 hours"],
    answer: 0,
    rationale: "Common causes of bacterial meningitis, such as Neisseria meningitidis and Haemophilus influenzae type b, spread by respiratory droplets. Droplet precautions start on suspicion and continue until 24 hours of effective antibiotic therapy. Waiting for cultures exposes staff and other children, and airborne or contact precautions do not match the route of spread.",
    lens: { medic: "On scene you mask yourself and the child as soon as you suspect meningitis.", nurse: "On the unit the order is droplet precautions from the start, kept in place until the infant has had 24 hours of effective antibiotics." } },
  m12b19: { area: "RRP", type: "single", cj: "Prioritize hypotheses",
    stem: "A 7-year-old client with new type 1 diabetes is being treated for diabetic ketoacidosis with IV fluids and an insulin infusion. Six hours into treatment, she says her head hurts. Her heart rate has dropped from 128 to 70, and she is harder to wake. Glucose is 260 mg/dL. What does the nurse do first?",
    options: ["Increase the IV fluid rate to treat ongoing dehydration", "Notify the provider right away about possible cerebral edema", "Give 15 grams of oral glucose gel for possible low glucose", "Lower the head of the bed and recheck vital signs in 1 hour"],
    answer: 1,
    rationale: "Headache, a falling heart rate, and decreasing alertness during DKA treatment suggest cerebral edema, a leading cause of death in children with DKA. The provider must be told at once so treatment such as mannitol or hypertonic saline can start. More IV fluid can worsen brain swelling, the glucose of 260 mg/dL is not low, and lowering the head of the bed or waiting an hour delays care.",
    lens: { medic: "Medics are taught that a child in DKA is dry and needs fluid.", nurse: "On the unit, fluids in pediatric DKA are given carefully, and new headache, slowing heart rate, or drowsiness hours into treatment is treated as possible cerebral edema." } },
  m12b20: { area: "PSY", type: "single", cj: "Analyze cues",
    stem: "A 14-year-old client with type 1 diabetes is admitted for the second time this year with DKA. He admits he skips insulin doses when he is with friends. He says, \"I just want to be normal.\" Which response by the nurse is best?",
    options: ["\"Skipping insulin could kill you, so you have to stop doing that.\"", "\"What part of taking insulin feels hardest for you right now?\"", "\"Your parents will need to give you each dose until you're older.\"", "\"Lots of teens feel that way, and you'll get used to it in time.\""],
    answer: 1,
    rationale: "Teens put high value on fitting in with peers, and an open question helps the nurse learn what gets in the way so a realistic plan can be built with him. A scare statement tends to shut the conversation down. Taking away all control fights his developmental need for independence, and brushing off his feelings offers false reassurance." },
  m12s1: { area: "HPM", type: "single", cj: "Generate solutions",
    stem: "A 9-month-old is at the clinic for a well visit. When the nurse comes near, the infant cries, turns away, and clings to the mother. The infant was content before the nurse walked in. How does the nurse do the physical exam?",
    options: ["Have the mother lay the infant on the exam table and step back out of view.", "Examine the infant on the mother's lap, starting with the least upsetting parts.", "Hand the infant a toy and carry the infant to the treatment room without the mother.", "Wait to begin until the infant stops crying and reaches out to the nurse."],
    answer: 1,
    rationale: "Stranger anxiety is normal at this age, and the parent is the infant's source of security. Keeping the infant on the parent's lap and saving upsetting steps such as the ears and mouth for last gives the most complete exam. Separating the infant from the parent increases distress, and waiting for the infant to warm up to a stranger may not happen during the visit." },
  m12s2: { area: "HPM", type: "single", cj: "Take action",
    stem: "A 4-year-old needs a peripheral IV. While the nurse gathers supplies, the child asks, \"Will the needle let all my blood leak out?\" Which action best prepares the child for the procedure?",
    options: ["Explain each step of the IV start the evening before so the child can get ready.", "Tell the child the IV will be quick and painless if the child holds very still.", "Show the child a detailed picture of the veins and how blood moves through them.", "Let the child bandage a doll's arm just before the IV start and talk about it."],
    answer: 3,
    rationale: "Preschoolers think magically and may believe a hole in the skin will let their blood run out. Hands-on play with a doll right before the procedure, along with simple words and a bandage over the site, addresses that fear. Teaching too far ahead gives a preschooler time to build fantasies, promising no pain breaks trust, and detailed anatomy is beyond this age." },
  m12s3: { area: "HPM", type: "single", cj: "Generate solutions",
    stem: "An 8-year-old is in the hospital for 2 weeks of IV antibiotics for a bone infection. The child is irritable and says, \"I'm missing everything at school.\" Which activity best fits this child's developmental needs?",
    options: ["Arrange schoolwork and a model kit the child can finish and show to visitors.", "Offer a set of stacking cups and a soft musical toy to keep in the bed.", "Let the child watch cartoons in the room for as long as the child wants.", "Encourage the child to rest now and save the schoolwork until after discharge."],
    answer: 0,
    rationale: "School-age children are in the stage of industry versus inferiority and gain self-worth by finishing tasks and keeping up with peers. Schoolwork and a project the child can complete and show off meet that need. Stacking cups suit an infant, and passive TV or putting off schoolwork does not build a sense of accomplishment." },
  m12s4: { area: "HPM", type: "single", cj: "Take action",
    stem: "A 15-year-old comes to the clinic with the mother for a sports physical. The nurse needs to ask about sexual activity, alcohol, and drug use. Which approach is best?",
    options: ["Ask the questions while the mother is in the room so the history is complete.", "Have the teen fill out a written form and let the mother look it over before it is filed.", "Ask the mother to step out, then tell the teen what stays private and what does not.", "Promise the teen that whatever is said during the visit will be kept completely secret."],
    answer: 2,
    rationale: "Teens give more honest answers when interviewed alone, so the nurse gives them private time. The nurse also explains the limits of confidentiality, such as a risk of harm to self or others or abuse, which must be reported. A parent present or reviewing the form discourages honest answers, and a promise of total secrecy cannot be kept." },
  m12s5: { area: "HPM", type: "multi", cj: "Analyze cues",
    stem: "A 12-month-old is at the clinic to receive the MMR, varicella, and other scheduled vaccines. Which findings does the nurse report to the provider before giving the vaccines? Select all that apply.",
    options: ["Hives and throat swelling within an hour of the last vaccine dose", "A runny nose and a temperature of 37.6°C (99.7°F) today", "Taking amoxicillin this week for an ear infection", "Getting chemotherapy for leukemia at a children's hospital", "The child's mother is 5 months pregnant", "A temperature of 39.4°C (103°F) and lethargy today"],
    answer: [0, 3, 5],
    rationale: "A severe allergic reaction to a prior dose is a contraindication to that vaccine. Live vaccines such as MMR and varicella are not given to a child whose immune system is suppressed by chemotherapy, and a moderate or severe illness with high fever is a reason to delay. A mild cold, an antibiotic, and a pregnant household member are not reasons to hold these vaccines." },
  m12s6: { area: "HPM", type: "single", cj: "Generate solutions",
    stem: "A 10-year-old has a BMI at the 97th percentile for age. The father says, \"He's just big boned, and he'll grow out of it.\" Which plan does the nurse discuss with the family?",
    options: ["Put the child on a strict 1,000-calorie diet until his weight is in the normal range.", "Have the child weigh himself every morning at home so progress can be tracked.", "Warn the child that he will get diabetes if his weight keeps going up.", "Set family goals such as fewer sugary drinks and an hour of active play each day."],
    answer: 3,
    rationale: "Obesity counseling in children works best when the whole family makes small, lasting changes in drinks, food, screen time, and activity. Strict calorie limits can harm growth, daily weighing can feed shame and unhealthy habits, and fear-based warnings do not change behavior and hurt self-esteem." },
  m12s7: { area: "PHYS", type: "multi", cj: "Take action",
    stem: "A 3-month-old returns to the pediatric unit after a cleft lip repair. Which actions does the nurse include in the plan of care? Select all that apply.",
    options: ["Keep soft elbow restraints on and release one arm at a time to check skin", "Position the infant on the back or side rather than on the stomach", "Gently clean the suture line after feedings as prescribed", "Offer a pacifier when the infant cries to help with comfort", "Place the infant face down so mouth secretions can drain"],
    answer: [0, 1, 2],
    rationale: "Elbow restraints keep the infant's hands away from the lip, and releasing one arm at a time allows skin checks and movement while protecting the repair. Back or side positioning keeps the suture line from rubbing on the bed, and gentle cleaning prevents crusting and infection. Pacifiers and lying face down both put pressure on the fresh repair." },
  m12s8: { area: "PHYS", type: "multi", cj: "Generate solutions",
    stem: "A 6-week-old with hip dysplasia is fitted with a Pavlik harness. Which instructions does the nurse give the parents? Select all that apply.",
    options: ["Loosen the straps at home when the baby seems uncomfortable", "Keep the harness on day and night unless the provider allows removal", "Put an undershirt under the chest strap and knee socks under the foot pieces", "Rub lotion and powder on the skin under the straps each day", "Check the skin under the straps 2 to 3 times a day for redness", "Put the diaper on over the harness straps"],
    answer: [1, 2, 4],
    rationale: "The harness holds the hips flexed and apart so the joint can form normally, so it stays on as prescribed and only the provider changes the straps. Cotton layers and frequent skin checks prevent breakdown. Lotions and powders cake and irritate the skin, and the diaper goes under the straps so the harness stays clean and in place." },
  m12s9: { area: "PHYS", type: "single", cj: "Evaluate outcomes",
    stem: "A 3-year-old with cystic fibrosis takes pancrelipase capsules. The nurse asks the mother how she gives them. Which statement shows correct understanding?",
    options: ["\"I crush the beads and stir them into his milk at bedtime.\"", "\"I give one capsule each morning so it keeps working through the day.\"", "\"I sprinkle the beads on applesauce as he starts meals and snacks.\"", "\"I skip the dose when he just eats a small snack like crackers.\""],
    answer: 2,
    rationale: "Pancreatic enzymes must be in the gut with food, so they are given at the start of every meal and snack. For young children the capsule can be opened and the beads sprinkled on a soft acidic food such as applesauce. Crushing or mixing the beads into milk destroys the coating, and a once-daily or skipped dose leaves food undigested." },
  m12s10: { area: "PHYS", type: "single", cj: "Take action",
    stem: "A 3-year-old is admitted with a firm mass on one side of the abdomen, and Wilms tumor is suspected. The child's older brother wants to feel \"the bump.\" What does the nurse do?",
    options: ["Let him feel it gently with the parent watching", "Post a sign at the bed: do not palpate the abdomen", "Palpate it each shift to track any change in size", "Have the child lie prone to ease abdominal pressure"],
    answer: 1,
    rationale: "Pressing on a suspected Wilms tumor can rupture the capsule and spread cancer cells, so the abdomen is not palpated after diagnosis and a sign alerts everyone. Gentle handling, careful bathing, and no routine checks of the mass protect the child until surgery.",
    lens: { medic: "In the field, an abdominal mass gets a gentle exam and a ride.", nurse: "On the unit, the mass gets a sign over the bed and nobody's hands." } },
  m12s11: { area: "PHYS", type: "single", cj: "Prioritize hypotheses",
    stem: "A 7-year-old had a long-arm cast applied 4 hours ago for a forearm fracture. The child cries that the pain is getting worse even after ibuprofen and screams when the nurse gently straightens the fingers. The fingers are puffy and cool. What does the nurse do?",
    options: ["Notify the provider now about possible compartment syndrome.", "Raise the arm on two pillows and recheck it in 1 hour.", "Give a PRN dose of oral opioid and recheck pain in 30 minutes.", "Place an ice pack on the cast over the fracture site."],
    answer: 0,
    rationale: "Pain out of proportion to the injury, pain with passive stretch, and cool, swollen fingers point to compartment syndrome. This is an emergency that needs the provider right away, often to split the cast. Raising the arm high, giving more pain medicine, or icing delays care while muscle and nerve damage progress.",
    lens: { medic: "You splint, elevate, and treat pain during a short transport.", nurse: "Hours after casting, rising pain with passive stretch is your cue to call the provider, not to give another dose." } },
  m12s12: { area: "PSY", type: "single", cj: "Generate solutions",
    stem: "A 2-year-old was admitted yesterday. Each time the father leaves, the child screams, shakes the crib rails, and cries for him. The father asks whether he should slip out while the child naps. What is the nurse's best response?",
    options: ["\"Leaving while he naps will spare him a hard goodbye.\"", "\"Staying away a few days will help him settle in with us.\"", "\"Tell him you're leaving and that you'll be back after lunch.\"", "\"His crying is a sign that he isn't bonding very well with you.\""],
    answer: 2,
    rationale: "Crying and calling for the parent is the protest phase of separation anxiety, which is expected in toddlers. Telling the child honestly and tying the return to a familiar event like lunch builds trust. Sneaking out or staying away increases fear and distrust, and the crying actually shows a strong bond." },
  m12s13: { area: "PSY", type: "single", cj: "Take action",
    stem: "A 16-year-old in the emergency department for an ankle sprain completes a routine suicide screening. She answers yes to thinking about killing herself in the past week and says she has been saving pills. What does the nurse do first?",
    options: ["Ask the client whether she wants her parent to be told about her answers.", "Keep the client in sight and remove items that could be used for harm.", "Give the client a list of crisis hotline numbers to use once home.", "Finish the ankle care and set up a mental health follow-up visit."],
    answer: 1,
    rationale: "A positive screen with a plan and means is high risk, so the first step is keeping the client safe with constant observation and a safe room, then getting a full evaluation. Safety concerns are an exception to teen confidentiality, so the parent will be told. Hotline numbers and a later clinic visit are not enough for this level of risk." },
  m12s14: { area: "PSY", type: "single", cj: "Take action",
    stem: "A 5-year-old is on a ventilator in the PICU after a near-drowning. The mother sits at the bedside and asks the nurse, \"Is she going to die?\" The child's outcome is still uncertain. What is the nurse's best response?",
    options: ["\"She is very sick right now. What have the doctors told you so far?\"", "\"The team here is excellent, so try your best to stay positive and hopeful.\"", "\"You need to ask the doctor, because I can't talk about that.\"", "\"Children are strong, and most of them recover from this.\""],
    answer: 0,
    rationale: "An honest statement followed by an open question lets the nurse learn what the mother understands and what she needs. It keeps her talking and supports her without false hope. Telling her to stay positive or that most children recover gives false reassurance, and refusing to talk shuts her out.",
    lens: { medic: "On scene, a parent is often kept back so the crew can work.", nurse: "In the PICU, the parent is part of the care team, and honest, regular updates are part of your job." } },
  m12s15: { area: "BCC", type: "single", cj: "Recognize cues",
    stem: "A 2-year-old is 6 hours after surgery. The child is crying and restless, and the nurse needs to decide whether to give a PRN pain medicine. How does the nurse assess the child's pain?",
    options: ["Ask the child to point to the face on the FACES scale that shows the hurt.", "Ask the child to give the pain a number from 0 to 10.", "Use the child's heart rate as the main sign of how much pain there is.", "Score the child's face, legs, activity, cry, and ability to be comforted."],
    answer: 3,
    rationale: "The FLACC scale scores face, legs, activity, cry, and consolability, and it fits children too young to rate their own pain. FACES is usually used from about age 3, and a 0 to 10 number scale needs an older child who understands numbers. Heart rate changes with crying, fever, and fear, so it is not a reliable pain measure by itself.",
    lens: { medic: "You often judge a child's pain by crying and vital signs.", nurse: "On the unit, you document a score from a tool that fits the child's age, then recheck with the same tool." } },
  m12s16: { area: "BCC", type: "single", cj: "Evaluate outcomes",
    stem: "A 13-year-old with scoliosis is fitted with a back brace to be worn 20 hours a day. Which statement shows the teaching worked?",
    options: ["\"I'll put lotion on my skin under the brace every day so it won't rub.\"", "\"I'll wear it just at night so my friends at school won't see it.\"", "\"I'll wear a thin cotton T-shirt under the brace with no wrinkles.\"", "\"I can stop wearing it once my back stops hurting me.\""],
    answer: 2,
    rationale: "A snug, seamless cotton layer under the brace protects the skin and absorbs sweat. Lotion softens skin and makes breakdown more likely, night-only wear will not slow the curve, and scoliosis is usually painless, so pain is not the guide. Wearing the brace for the prescribed hours is what makes it work." },
  m12s17: { area: "SIPC", type: "single", cj: "Take action",
    stem: "A mother calls the clinic. She found her 2-year-old sitting on the floor with the grandmother's open bottle of blood pressure pills, and a few pills seem to be missing. The child is awake and playing. What does the nurse tell her to do first?",
    options: ["\"Call Poison Control right now and have the bottle with you.\"", "\"Give her a dose of syrup of ipecac so she throws them up.\"", "\"Watch her at home and call back if she gets sleepy later today.\"", "\"Give her a glass of milk to help dilute the pills.\""],
    answer: 0,
    rationale: "Poison Control (1-800-222-1222 in the US) gives specific advice based on the drug, dose, and child's weight, and the bottle label is key. Some blood pressure drugs can cause serious effects in a toddler from just one or two pills, even if the child looks fine now. Ipecac is no longer recommended, home watching can delay treatment, and milk does not neutralize most drugs. If the child becomes drowsy or has trouble breathing, the mother calls 911.",
    lens: { medic: "You get the call after the child is already sick.", nurse: "On the phone, your first job is getting the parent to Poison Control with the bottle, and teaching her when to call 911." } },
  m12s18: { area: "SIPC", type: "multi", cj: "Generate solutions",
    stem: "A 2-year-old who lives in a house built in 1940 has a high blood lead level. Which actions does the nurse teach the parents to lower the child's exposure? Select all that apply.",
    options: ["Wet-mop floors and wipe windowsills often", "Wash the child's hands and toys often, and before meals", "Serve foods high in iron and calcium", "Sand peeling paint smooth before repainting it", "Use hot tap water for cooking and drinking", "Sweep up paint chips with a dry broom"],
    answer: [0, 1, 2],
    rationale: "Wet cleaning traps lead dust, and handwashing cuts down on the hand-to-mouth route that toddlers use. A diet rich in iron and calcium lowers how much lead the body absorbs. Sanding and dry sweeping spread lead dust into the air, and hot tap water pulls more lead from old pipes, so cold water is used for cooking and drinking." },
  m12s19: { area: "PPT", type: "multi", cj: "Generate solutions",
    stem: "An 18-month-old with iron-deficiency anemia is starting liquid ferrous sulfate. Which instructions does the nurse give the parent? Select all that apply.",
    options: ["Give the iron with a small amount of orange juice", "Mix the dose into the child's bottle of milk", "Place the dose toward the back of the mouth, then brush the teeth", "Expect the child's stools to turn dark green or black", "Offer the child about 4 cups of cow's milk each day", "Stop the iron once the child's color looks healthier"],
    answer: [0, 2, 3],
    rationale: "Vitamin C helps the body absorb iron, so juice is a good partner. Liquid iron stains teeth, so it is placed toward the back of the mouth with a dropper or syringe and the teeth are brushed afterward. Dark stools are expected. Milk blocks iron absorption, too much cow's milk is a common cause of this anemia, and the full course is needed to rebuild iron stores." },
  m12s20: { area: "RRP", type: "single", cj: "Recognize cues",
    stem: "A 4-year-old who weighs 20 kg is 6 hours after an appendectomy and is receiving maintenance IV fluid. Which finding does the nurse report to the provider?",
    options: ["Pain rated as the second face on the FACES scale", "Urine output of 12 mL/hr for the past 2 hours", "Heart rate of 104 beats/min while awake", "Temperature of 37.7°C (99.9°F)"],
    answer: 1,
    rationale: "A child should make at least 1 mL/kg/hr of urine, which is 20 mL/hr for this child. Output of 12 mL/hr for 2 hours suggests the child is not getting enough fluid or the kidneys are not perfused well. Mild pain, a heart rate of 104, and a low-grade temperature are expected for a 4-year-old after surgery." }
});

  /* On scene: Daniel Reyes, crisis on a bridge */
  mh1: { area: "PSY", type: "single",
    stem: "He's sitting on the outside of the railing. Police have closed the bridge. What is your best opening?",
    options: ["\"Come down right now so we can help you.\"", "\"I'm Sam, with the ambulance. Can we talk?\"", "\"Think about how your family would feel.\"", "\"Why would you want to do something like this?\""],
    answer: 1,
    rationale: "A calm introduction and an invitation to talk start building rapport, the first step in crisis work. Commands, guilt, and \"why\" questions put him on the defensive.",
    lens: { medic: "You've talked people down before. Slow voice, your name, no pressure.", nurse: "On the unit, the same skills keep him talking to you instead of shutting down." } },
  mh2: { area: "PSY", type: "single",
    stem: "He says, \"I just want it all to stop.\" What do you ask next?",
    options: ["\"You're not really going to jump, are you?\"", "\"What would your kids say if they saw you?\"", "\"Things will look better in the morning, right?\"", "\"Are you thinking about killing yourself?\""],
    answer: 3,
    rationale: "Asking directly about suicide doesn't plant the idea. It tells him you can handle the answer and gets you the information you need. Leading questions, guilt, and false reassurance shut the conversation down." },
  mh3: { area: "SIPC", type: "single",
    stem: "After 40 minutes he climbs back over and agrees to go. He smells of alcohol. Which action keeps him safe on the way in?",
    options: ["Let him ride up front with his brother", "Keep him in reach; take his belt and knife", "Leave him alone in back so he feels trusted", "Let him refuse care now that he seems calmer"],
    answer: 1,
    rationale: "A client who was about to jump stays within reach, and anything he could use to hurt himself is removed. He can't safely be left alone, and intoxication plus a suicide attempt means he can't simply refuse care." },
  mh4: { area: "MOC", type: "single",
    stem: "Which detail matters most in your handoff?",
    options: ["Planned to jump; a fifth a day, last drink 1500", "His truck is still parked at the end of the bridge", "He works nights driving a delivery route", "His brother is following the ambulance in"],
    answer: 0,
    rationale: "His plan tells the team how serious the risk is, and his drinking pattern and last drink tell them when withdrawal can start. The other details don't change his care." },

  /* Floor: medical unit, on a hold with a sitter */
  mu1: { area: "PHYS", type: "multi",
    stem: "Thirty hours after his last drink, which findings show his withdrawal is getting worse? Select all that apply.",
    options: ["Tremor in both hands with arms out", "Heart rate 122 and BP 164/98", "Sweating through his gown", "Says he sees bugs on the wall", "Asks for a phone charger", "Temperature 37.4°C"],
    answer: [0, 1, 2, 3],
    rationale: "Tremor, a rising heart rate and BP, heavy sweating, and visual hallucinations are signs of moderate to severe withdrawal. A request for his charger and a normal temperature aren't signs of withdrawal." },
  mu2: { area: "PHYS", type: "single",
    stem: "Which explanation best fits his findings?",
    options: ["A new psychotic disorder starting up", "Anxiety about being held against his will", "Alcohol withdrawal heading toward DTs", "Low blood sugar from not eating for days"],
    answer: 2,
    rationale: "Hallucinations with tremor, sweating, and a rising heart rate and BP 30 hours after his last drink fit worsening alcohol withdrawal, with delirium tremens possible on days 2 to 4. His glucose is normal, and anxiety or a new psychosis wouldn't explain the vital signs." },
  mu3: { area: "PPT", type: "single",
    stem: "His CIWA-Ar score is 22. He has prescriptions for lorazepam per the CIWA protocol, thiamine 100 mg IV, and IV fluid with dextrose. Which plan is safest?",
    options: ["Lorazepam now; thiamine before dextrose", "Dextrose now; thiamine with his breakfast", "Thiamine now; lorazepam if he gets violent", "Lorazepam now; skip thiamine as he's alert"],
    answer: 0,
    rationale: "A score of 22 calls for lorazepam now to prevent seizures and DTs. Thiamine goes in before the dextrose, because glucose without thiamine can set off Wernicke encephalopathy in a client who drinks heavily.",
    lens: { medic: "In the field you'd treat the seizure. Here you're trying to keep the seizure from happening.", nurse: "The CIWA score drives every dose, so you score him before and after each one." } },
  mu4: { area: "SIPC", type: "multi",
    stem: "Which belong in his plan for the next 48 hours? Select all that apply.",
    options: ["Seizure precautions with suction at the bedside", "A quiet, well-lit room to cut down on misreading shadows", "Rescore the CIWA per protocol after each dose", "Restraints at the first sign of a tremor", "Turn the lights off so he sleeps it off", "Stop the sitter once he's sedated"],
    answer: [0, 1, 2],
    rationale: "Seizure precautions, a calm, well-lit room, and scoring after every dose keep him safe through withdrawal. Restraints at the first tremor aren't needed, a dark room makes hallucinations worse, and he is still at risk of suicide, so the sitter stays." },
  mu5: { area: "PSY", type: "single",
    stem: "On day 4 he's suddenly calm and cheerful after days of hopelessness, and he asks when the sitter can go. Which explanation does the nurse consider first?",
    options: ["The lorazepam has finally taken full effect", "His mood lifted once he was sober", "He has made a plan and feels relief", "He has gotten comfortable with the staff"],
    answer: 2,
    rationale: "A sudden lift in mood in a depressed client can mean he has decided to act and feels relief at the decision. The nurse keeps the sitter, asks him directly about suicidal thoughts, and reports the change before considering any other explanation." },
  mu6: { area: "PSY", type: "multi",
    stem: "On day 6, which findings show his plan is working? Select all that apply.",
    options: ["CIWA under 8 for 24 hours with no lorazepam", "Promises he won't hurt himself", "Oriented, with no hallucinations", "Plans to switch to beer instead of vodka", "Has a written safety plan with names and numbers"],

  t13a: { area: "HPM", type: "multi",
    stem: "Which belong in his safety plan before discharge? Select all that apply.",
    options: ["Ask his brother to hold his guns for now", "Keep the plan to himself so it stays private", "Call or text 988 if the urge comes back", "Write down his own warning signs", "Have a drink to take the edge off if he feels low"],
    answer: [0, 2, 3],
    rationale: "Removing lethal means, knowing the crisis line, and naming his own warning signs are the core of a safety plan. Sharing it with people he trusts helps, and alcohol makes suicidal thinking more dangerous." },
  t13b: { area: "PPT", type: "single",
    stem: "He is starting disulfiram. Which statement shows he understands the teaching?",
    options: ["\"I can still have one beer in the morning.\"", "\"I'll take it on days I feel like drinking.\"", "\"I'll check cough syrup and mouthwash labels.\"", "\"It will stop my cravings within a day or two.\""],
    answer: 2,

    options: ["\"I'll drink 8 to 12 glasses of fluid a day, and more when I sweat.\"", "\"I'm going to cut way back on salt to help my blood pressure.\"", "\"I'll have my blood drawn in the morning before my first dose.\"", "\"If I start vomiting or have diarrhea, I'll call my provider.\""],
    answer: 1,
    rationale: "The kidneys hold on to lithium when sodium is low, so a sharp cut in salt can push the level into the toxic range. He needs a steady, normal salt intake. Generous fluids, trough levels drawn before the morning dose, and calling about vomiting or diarrhea are all correct." },
  m13b6: { area: "PPT", type: "multi", cj: "Recognize cues",
    stem: "A 24-year-old client started haloperidol 5 days ago for acute psychosis. This morning the nurse assesses him. Which findings suggest neuroleptic malignant syndrome? Select all that apply.",
    options: ["Temperature of 104.2°F (40.1°C) this morning", "Arms that are stiff and resist passive movement", "Blood pressure swinging between 168/98 and 102/60", "New confusion along with heavy, drenching sweats", "Dry mouth and mild constipation since admission", "Reports feeling restless and unable to sit still"],
    answer: [0, 1, 2, 3],
    rationale: "Neuroleptic malignant syndrome causes high fever, severe muscle rigidity, unstable blood pressure, sweating, and a change in mental status. It can be fatal, so the nurse holds the antipsychotic and notifies the provider. Dry mouth and constipation are common anticholinergic effects, and inner restlessness is akathisia.",
    lens: { medic: "In the field a hot, rigid, confused client makes you think of sepsis, heat stroke, or stimulants.", nurse: "On a psych unit with a recent antipsychotic, you think NMS, hold the drug, and call the provider." } },
  m13b7: { area: "PPT", type: "single", cj: "Take action",
    stem: "A 36-year-old client with schizophrenia has taken clozapine for 4 months. At a clinic visit he reports a sore throat and has a temperature of 101.1°F (38.4°C). What does the nurse do first?",
    options: ["Teach him to gargle with warm salt water and rest at home", "Give acetaminophen and recheck his temperature in an hour", "Remind him that a mild sore throat is common with clozapine", "Hold the clozapine and ask the provider for an ANC today"],
    answer: 3,
    rationale: "Fever and sore throat in a client taking clozapine can signal agranulocytosis, a life-threatening drop in neutrophils. The nurse holds the drug and gets an absolute neutrophil count right away. Home care, fever control alone, or reassurance would delay finding a dangerous infection risk." },
  m13b8: { area: "PPT", type: "single", cj: "Take action",
    stem: "A 19-year-old client received haloperidol 5 mg IM in the emergency department 12 hours ago. Now on the unit, his neck is twisted to one side, his eyes are fixed upward, and he is frightened. What does the nurse do?",
    options: ["Give the prescribed PRN benztropine IM and stay with him", "Apply a soft cervical collar and reposition his head gently", "Reassure him this reaction is psychological and will pass", "Give the next scheduled haloperidol dose to calm him down"],
    answer: 0,
    rationale: "This is an acute dystonic reaction, an early extrapyramidal effect of a high-potency antipsychotic. An IM anticholinergic such as benztropine works quickly, and the nurse stays to watch his airway and calm him. A collar does not treat the spasm, calling it psychological is wrong, and more haloperidol would make it worse." },
  m13b9: { area: "PSY", type: "single", cj: "Generate solutions",
    stem: "A 45-year-old client on a medical unit is scheduled for a kidney biopsy tomorrow. Tonight she is pacing, wringing her hands, and cannot follow the nurse's explanation of the procedure. She asks the same question several times. Which action by the nurse is best?",
    options: ["Teach her progressive muscle relaxation using a printed handout", "Explain the full biopsy procedure again in more detail", "Stay with her and use short, simple sentences in a calm voice", "Ask her to explore which past events make her feel this way"],
    answer: 2,
    rationale: "Pacing, a narrowed focus, and the inability to take in information point to severe anxiety. The nurse stays with her and uses brief, calm, simple communication to lower the anxiety first. She cannot learn a new skill, absorb more detail, or explore causes until her anxiety drops to a moderate or mild level." },
  m13b10: { area: "PSY", type: "single", cj: "Take action",
    stem: "A 29-year-old client with a known panic disorder is on a medical unit for cellulitis. She suddenly grips the bed rail and says, \"I can't breathe, I'm going to die.\" Heart rate is 118, RR 30, BP 138/84, and SpO2 99% on room air. Her lungs are clear. What does the nurse do?",
    options: ["Have her breathe into a paper bag until her breathing slows", "Ask her what she was thinking about just before this began", "Leave the room so she can calm down with fewer distractions", "Stay with her and coach slow breaths in a calm, firm voice"],
    answer: 3,
    rationale: "With stable oxygenation, clear lungs, and a known panic history, this fits a panic attack. The nurse stays, speaks calmly, and coaches slow breathing until it passes. Paper bag rebreathing is unsafe and outdated, exploring thoughts can wait until the attack ends, and leaving her alone increases fear.",
    lens: { medic: "In the field a client who can't breathe with a racing heart gets a monitor and a ride, because you can't rule much out.", nurse: "On the unit, with stable vital signs, clear lungs, and a known panic history, you stay, coach breathing, and reassess." } },
  m13b11: { area: "PSY", type: "single", cj: "Generate solutions",
    stem: "A 38-year-old client in an acute manic episode has lost 3 kg in 5 days on the unit. He will not sit for meals and paces the hall while talking rapidly. Which plan best meets his nutrition needs?",
    options: ["Require him to sit at the table until he finishes each meal", "Offer high-calorie sandwiches and drinks he can carry", "Serve his meals in the dining room with the rest of the group", "Wait until his mood stabilizes and then offer a full diet tray"],
    answer: 1,
    rationale: "A client in acute mania burns many calories and cannot sit long enough to eat. High-calorie finger foods and fluids he can eat on the move meet his needs. Forcing him to sit leads to power struggles, a busy dining room overstimulates him, and waiting lets the weight loss continue." },
  m13b12: { area: "PSY", type: "single", cj: "Take action",
    stem: "A 26-year-old client with borderline personality disorder tells the day nurse, \"You're the only one here who gets me. The night nurse is cruel and won't let me have my phone after 10.\" Which response by the nurse is best?",
    options: ["\"I'll talk to the night nurse and see if she can bend that rule.\"", "\"That doesn't sound like her. What did you do to upset her?\"", "\"That rule is the same on every shift. Let's talk about it.\"", "\"Thank you. I do try harder than the other staff to listen.\""],
    answer: 2,
    rationale: "Praising one nurse while attacking another is splitting. The nurse keeps the limit consistent across shifts and stays open to talking, which takes away the payoff of dividing staff. Bending the rule or accepting the praise rewards splitting, and blaming the client is judgmental." },
  m13b13: { area: "PSY", type: "multi", cj: "Generate solutions",
    stem: "A 44-year-old firefighter-paramedic is admitted to an inpatient unit with PTSD after a fatal call involving children. He has nightmares, startles at loud noises, and sits facing the door. Which actions by the nurse are appropriate? Select all that apply.",
    options: ["Knock and say his name before entering his room", "Let him choose a seat where he can see the door", "Ask about suicidal thoughts and alcohol or drug use", "Have him describe the call in full detail on day 1", "Wake him by shaking his shoulder during a nightmare", "Tell him first responders learn to let these calls go"],
    answer: [0, 1, 2],
    rationale: "Trauma-informed care builds safety and control: announce yourself, and let him keep the door in view. First responders with PTSD have high rates of suicide and substance use, so the nurse screens for both. Pushing him to retell the call early, touching him to wake him, and minimizing the trauma can all retraumatize him.",
    lens: { medic: "Field culture often says to shake off a bad call and get back on the truck.", nurse: "On the unit you treat PTSD as a real injury, build safety first, and screen directly for suicide and substance use." } },
  m13b14: { area: "PSY", type: "multi", cj: "Analyze cues",
    stem: "The nurse reviews a nursing student's responses to a client with depression on an inpatient unit. Which responses are blocks to therapeutic communication? Select all that apply.",
    options: ["\"Don't worry. You'll feel like yourself again in no time.\"", "\"Why did you stop taking your medicine last month?\"", "\"You should call your sister and patch things up today.\"", "\"You seem quiet this morning. I'll sit with you a while.\"", "\"You said nothing matters lately. Tell me more about that.\""],
    answer: [0, 1, 2],
    rationale: "False reassurance, \"why\" questions, and giving advice all shut down the client's own thinking. Making an observation and offering self show acceptance. Restating the client's words and asking for more invites the client to share, and here it also opens the way to a suicide risk assessment." },
  m13b15: { area: "PSY", type: "single", cj: "Generate solutions",
    stem: "A 50-year-old client comes to a walk-in crisis clinic. Her house flooded yesterday and she has nowhere to sleep tonight. She is crying and says, \"I can't think. I don't know what to do.\" She denies thoughts of harming herself or others. Which action by the nurse is best?",
    options: ["Help her name her most urgent need and find shelter for tonight", "Refer her to weekly talk therapy to explore her coping history", "Encourage her to talk about other losses she has had in her life", "Tell her she is strong and will get through this like before"],
    answer: 0,
    rationale: "Crisis intervention is short, focused, and directive, aimed at the immediate problem and a return to her usual level of function. Helping her name the urgent need and arrange shelter does that. Long-term therapy and exploring past losses do not solve tonight's problem, and telling her she is strong is false reassurance." },
  m13b16: { area: "MOC", type: "single", cj: "Analyze cues",
    stem: "The nurse in a psychiatric emergency service is reviewing four clients. Which client meets the general criteria for an emergency involuntary psychiatric hold?",
    options: ["A client with schizophrenia who refuses his antipsychotic but eats, bathes, and keeps appointments", "A client with depression who wants to leave against medical advice and denies suicidal thoughts", "A client with psychosis found outside in freezing weather who cannot say how he will get food or shelter", "A client with bipolar disorder who has run up large credit card debts and argues with her family"],
    answer: 2,
    rationale: "Emergency holds generally require a mental illness plus danger to self, danger to others, or grave disability, meaning the client cannot meet basic needs for food, shelter, or safety. The client outside in freezing weather who cannot plan for food or shelter meets that standard. Refusing medication, leaving against advice without suicidal thoughts, and poor financial choices do not on their own.",
    lens: { medic: "In the field, police or a qualified clinician usually starts the hold and you transport.", nurse: "On the unit you check the paperwork, explain the client's rights, and track the time limit, which varies by state." } },
  m13b17: { area: "PSY", type: "single", cj: "Recognize cues",
    stem: "A 16-year-old started fluoxetine 3 weeks ago for depression. At a follow-up visit the parent says, \"He has more energy now, but he seems agitated and isn't sleeping.\" The teen looks away and says, \"Things are fine.\" What does the nurse do first?",
    options: ["Ask the teen privately if he is having thoughts of suicide", "Tell the parent the extra energy shows the drug is working well", "Suggest the parent give the dose at bedtime to help with sleep", "Plan to recheck his mood at the next routine visit in 3 months"],
    answer: 0,
    rationale: "Young people starting an SSRI carry a higher risk of suicidal thinking in the first weeks, especially when energy returns before mood lifts. New agitation and insomnia are warning signs, so the nurse asks him about suicide directly and in private. Calling it a good sign or waiting 3 months misses the risk, and fluoxetine is activating, so a bedtime dose can worsen insomnia." },
  m13b18: { area: "SIPC", type: "multi", cj: "Take action",
    stem: "A 31-year-old client with mania struck a staff member and kept throwing chairs after verbal de-escalation and a PRN medication were tried. He is placed in seclusion. Which actions by the nurse are correct? Select all that apply.",
    options: ["Get a provider order within the time frame set by policy", "Observe him continuously by direct or video monitoring", "Offer fluids, food, and toileting at regular intervals", "Tell him he will stay in seclusion until the shift ends", "Leave him his belt and shoelaces to protect his dignity", "Release him as soon as he meets the behavior criteria"],
    answer: [0, 1, 2, 5],
    rationale: "Seclusion is a last resort that needs a provider order within the time set by policy and law, continuous monitoring, and care for basic needs. It ends as soon as the client meets the release criteria. Setting it by the clock makes it punishment, and a belt or shoelaces could be used to harm himself." },
  m13b19: { area: "SIPC", type: "single", cj: "Generate solutions",
    stem: "A 47-year-old client in a manic episode is being admitted. She is talking loudly, has not slept in 2 days, and keeps rearranging the furniture in the dayroom. Which room assignment is best?",
    options: ["A shared room with a quiet client who can model calm behavior", "A room next to the dayroom so she can burn off extra energy", "A private room at the far end of the hall where it is quiet", "A private room near the nurses' station, away from groups"],
    answer: 3,
    rationale: "A client in acute mania needs low stimulation and close observation for safety. A private room near the nurses' station away from busy areas gives both. A roommate adds stimulation and risk of conflict, a room near the dayroom overstimulates her, and a distant room makes it hard to watch her." },
  m13b20: { area: "PHYS", type: "single", cj: "Recognize cues",
    stem: "A 19-year-old client with anorexia nervosa and a BMI of 14.5 began nutritional rehabilitation 3 days ago. She now has new ankle swelling, feels weak, and her heart rhythm is irregular. Which laboratory result does the nurse report first?",
    options: ["Hemoglobin 10.8 g/dL", "Phosphorus 1.4 mg/dL", "Serum albumin 3.1 g/dL", "Urea nitrogen 6 mg/dL"],
    answer: 1,
    rationale: "New edema, weakness, and dysrhythmia in the first days of refeeding point to refeeding syndrome, in which phosphorus shifts into cells as feeding restarts. Severe hypophosphatemia can cause heart failure, dysrhythmia, and respiratory weakness, so the nurse reports it first. The mild anemia, low albumin, and low urea nitrogen reflect chronic starvation and are not immediate threats." },
  m13s1: { area: "PPT", type: "single", cj: "Take action",
    stem: "A client admitted with a leg abscess uses fentanyl daily and last used 6 hours ago. A sublingual buprenorphine prescription is to start when withdrawal is present. The client is anxious and yawning, with HR 84, normal-size pupils, and a low withdrawal score. The client asks for the first dose now. What does the nurse do?",
    options: ["Hold the dose and reassess until clear withdrawal signs appear.", "Give the dose now so withdrawal does not have a chance to start.", "Give naloxone first to clear the fentanyl, then give the dose.", "Give half the dose now and the other half in a few hours."],
    answer: 0,
    rationale: "Buprenorphine binds opioid receptors more tightly than full agonists and pushes them off. Given before the client is in clear, moderate withdrawal, it can set off sudden, severe precipitated withdrawal, and fentanyl stored in fat often means a longer wait. Naloxone would cause withdrawal, and splitting the dose is not in the prescription.",
    lens: { medic: "In the field, naloxone reverses an overdose and withdrawal is an expected side effect.", nurse: "On the unit, timing the first buprenorphine dose matters: too early and you cause the withdrawal you meant to treat." } },
  m13s2: { area: "BCC", type: "multi", cj: "Generate solutions",
    stem: "A client on a medical unit is in opioid withdrawal. He has chills, a runny nose, muscle aches, and loose stools, and he says he cannot get comfortable. Which comfort measures does the nurse include? Select all that apply.",
    options: ["Limit fluids to cut down on the number of loose stools.", "Offer water and electrolyte drinks often through the day.", "Hold meals until the loose stools have fully stopped.", "Provide extra blankets and a warm shower when he is chilled.", "Keep the room quiet with the lights dimmed.", "Leave the TV on loud to distract him from the aches."],
    answer: [1, 3, 4],
    rationale: "Opioid withdrawal is miserable but rarely life-threatening in adults; the main physical risk is fluid loss from diarrhea, sweating, and vomiting, so fluids are pushed, not limited. Warmth eases chills and aches, and a calm, dim room helps restlessness. Small, light meals are offered rather than held, and loud noise adds to agitation." },
  m13s3: { area: "PHYS", type: "single", cj: "Prioritize hypotheses",
    stem: "A client is brought to the emergency department after using methamphetamine. He is pacing, talking fast, and sweating heavily. HR is 142 and temperature is 40.2°C (104.4°F). He picks at the skin on his arms and says people are watching him. Which finding does the nurse act on first?",
    options: ["Rapid, pressured, nonstop speech", "Picking at the skin on his arms", "Temperature of 40.2°C (104.4°F)", "Belief that people are watching him"],
    answer: 2,
    rationale: "Severe hyperthermia from stimulant toxicity can quickly lead to seizures, rhabdomyolysis, kidney injury, and cardiac arrest, so active cooling and prescribed sedation come first. Fast speech, skin picking, and paranoia are expected stimulant effects that are managed once he is physically stable.",
    lens: { medic: "In the field, the hot, agitated stimulant user is a sudden-arrest risk, and you sedate and cool fast.", nurse: "In the ED the same priority holds: the temperature is the finding that kills, ahead of the paranoia." } },
  m13s4: { area: "HPM", type: "single", cj: "Evaluate outcomes",
    stem: "A 24-year-old client is in the emergency department for the third time this year with days of vomiting. He uses cannabis daily and says long hot showers are the one thing that helps. The work-up points to cannabinoid hyperemesis syndrome. Which statement shows he understood the teaching?",
    options: ["\"Hot showers will cure this if I take them as soon as it starts.\"", "\"Switching to edibles instead of smoking will stop the vomiting.\"", "\"Stopping cannabis for good is what keeps this from coming back.\"", "\"Using a smaller amount each day will be enough to keep it from coming back.\""],
    answer: 2,
    rationale: "Cannabinoid hyperemesis is caused by long-term heavy cannabis use, and stopping use is the lasting treatment. Hot showers give short relief but do not treat the cause. The route of use does not matter, and cutting back is usually not enough to prevent repeat episodes." },
  m13s5: { area: "SIPC", type: "single", cj: "Generate solutions",
    stem: "An 86-year-old client with Alzheimer's disease is on a medical unit for pneumonia. Each day around 1700 she becomes restless, calls out, and tries to leave her room. Which plan does the nurse put in place?",
    options: ["Schedule her bath and therapy visits for the early evening hours.", "Turn on room lights before dusk and keep the evening calm.", "Explain firmly each time that she is not able to go home yet.", "Keep the TV on a news channel to hold her attention at night."],
    answer: 1,
    rationale: "Sundowning worsens as light fades and shadows appear, so good lighting before dusk and a quiet, predictable evening lower agitation and the risk she will wander or fall. Busy care should be scheduled earlier in the day. Arguing raises distress, and loud or upsetting TV adds stimulation." },
  m13s6: { area: "PSY", type: "single", cj: "Take action",
    stem: "A client with obsessive-compulsive disorder is admitted for cracked, bleeding hands. On his first morning on the unit, he spends about 40 minutes washing his hands in a set pattern and is almost late for an 0800 x-ray. What does the nurse do?",
    options: ["Stop the ritual and walk him to transport so he is not late.", "Tell him his hands are already clean and the washing is not needed.", "Plan with him to wake earlier so the ritual ends before tests.", "Remove the soap from his room to break the washing pattern."],
    answer: 2,
    rationale: "Early in care the ritual controls severe anxiety, so blocking it raises anxiety and does not help. The nurse builds time for it into the schedule, then later works with the client to limit the time gradually as other coping skills are learned. Logic does not stop compulsions, and removing the soap is a forced block." },
  m13s7: { area: "PSY", type: "single", cj: "Generate solutions",
    stem: "A client with somatic symptom disorder has had a full work-up with normal results. She uses the call light often to describe new aches and says, \"No one believes how much I hurt.\" Which approach does the nurse use?",
    options: ["Tell her the tests prove there is nothing physically wrong.", "Acknowledge her distress and set regular times to talk.", "Answer each call by going over each of her symptoms in detail.", "Go to her room when a vital sign falls outside the normal range."],
    answer: 1,
    rationale: "The symptoms and distress are real to the client. Scheduled contact that does not depend on new complaints meets her need for attention and shifts the focus to feelings and coping, while new physical findings are still assessed. Telling her nothing is wrong breaks trust, long symptom reviews reinforce the focus, and avoiding her increases anxiety." },
  m13s8: { area: "PSY", type: "single", cj: "Take action",
    stem: "A client who was assaulted is in the emergency department. While the nurse explains a procedure, the client stops talking, stares ahead, and does not answer to her name. Her muscles are relaxed, there is no jerking, she has no seizure history, and her vital signs are stable. What does the nurse do first?",
    options: ["Speak calmly, say her name, where she is, and that she is safe.", "Rub her sternum firmly to check her level of response.", "Leave her alone until the episode passes on its own.", "Ask her why she stopped talking in the middle of care."],
    answer: 0,
    rationale: "These findings point to a dissociative episode, a common response to trauma reminders. Grounding with a calm voice, her name, the place, and safety helps her return to the present. A painful stimulus can feel like another assault, leaving her alone ignores her safety, and why questions sound like blame.",
    lens: { medic: "In the field, a blank, unresponsive stare often gets a pain stimulus to grade the response.", nurse: "With a stable trauma survivor who is dissociating, a pain stimulus can retraumatize; ground her with voice and orientation first." } },
  m13s9: { area: "PSY", type: "multi", cj: "Generate solutions",
    stem: "A 15-year-old with autism spectrum disorder is admitted for an appendectomy. His mother says loud noise and changes in routine upset him, and he flaps his hands when he is stressed. Which actions does the nurse include in his plan? Select all that apply.",
    options: ["Ask his mother about his usual routine and comfort items.", "Hold his hands still when he starts to flap them.", "Assign a private room away from the nurses' station if possible.", "Rotate different nurses so he gets used to new faces.", "Use a picture or written schedule of the day's care.", "Leave the door open and the hall lights on at night."],
    answer: [0, 2, 4],
    rationale: "Clients with autism cope better with less sensory input, a predictable routine, familiar items, and visual schedules, and the parent is the expert on what works. Hand flapping is a self-calming behavior and should not be stopped unless it is unsafe. Changing caregivers and adding hallway light and noise increase distress." },
  m13s10: { area: "PPT", type: "single", cj: "Evaluate outcomes",
    stem: "The nurse teaches the parent of a 9-year-old who is starting extended-release methylphenidate for ADHD. Which statement by the parent shows the teaching was understood?",
    options: ["\"I'll crush it into his juice if he has trouble swallowing.\"", "\"I'll give it at bedtime so he is calm for school.\"", "\"I'll double the next dose if he misses a morning one.\"", "\"I'll give it in the morning, after he eats breakfast.\""],
    answer: 3,
    rationale: "Stimulants are given early in the day to prevent insomnia, and giving them with or after breakfast helps limit the appetite loss they cause. Crushing an extended-release form releases the whole dose at once. Bedtime dosing keeps the child awake, and doses are not doubled." },
  m13s11: { area: "PSY", type: "multi", cj: "Take action",
    stem: "A client is scheduled for electroconvulsive therapy (ECT) at 0800 tomorrow. Which actions does the nurse take to prepare the client? Select all that apply.",
    options: ["Tell her to expect a full day of bed rest afterward.", "Confirm that the informed consent form is signed.", "Keep her NPO after midnight or as the order states.", "Give the scheduled 0600 lorazepam dose as usual.", "Tell her she will be awake and feel the electrical current.", "Remove dentures, glasses, and hairpins before treatment."],
    answer: [1, 2, 5],
    rationale: "ECT is done under brief general anesthesia with a muscle relaxant, so the client is NPO, signs consent, and has dentures, glasses, and hair items removed. Benzodiazepines raise the seizure threshold, so the nurse checks with the provider about holding them rather than giving them as usual. The client is asleep for the treatment and is usually up within hours, not on bed rest." },
  m13s12: { area: "SIPC", type: "single", cj: "Take action",
    stem: "Thirty minutes after electroconvulsive therapy, a client is back on the unit. She is drowsy and confused about where she is, and she starts to get out of bed to find the bathroom. Her vital signs are stable. What does the nurse do?",
    options: ["Tell her the confusion means the treatment did not work.", "Apply a vest restraint until the confusion has cleared.", "Ask her to wait in bed until the next scheduled check.", "Walk with her to the bathroom and reorient her to the room."],
    answer: 3,
    rationale: "Short-term confusion and memory loss are expected after ECT and usually clear within hours. The nurse stays with her, helps her walk to prevent a fall, and reorients her. Confusion is not a sign of failed treatment, restraints are not needed for a cooperative client, and leaving her to wait sets up a fall." },
  m13s13: { area: "PPT", type: "single", cj: "Take action",
    stem: "A 66-year-old client has taken alprazolam 1 mg three times a day for 8 years. During an admission for a knee replacement she says, \"I want off this pill. I'm just going to stop it tonight.\" What does the nurse tell her?",
    options: ["\"Stopping suddenly is fine, since alprazolam is a short-acting drug.\"", "\"Stopping suddenly can cause seizures, so a slow taper is needed.\"", "\"Cut the dose in half tonight and stop it fully in 2 days.\"", "\"A glass of wine at night can help your sleep while you stop.\""],
    answer: 1,
    rationale: "After long-term daily use, stopping a benzodiazepine abruptly can cause severe anxiety, insomnia, and seizures. The provider plans a slow taper, often over weeks to months. Short-acting drugs like alprazolam actually cause faster, harsher withdrawal, and alcohol adds risk." },
  m13s14: { area: "PSY", type: "single", cj: "Take action",
    stem: "During group therapy on an inpatient unit, one client keeps talking over other members and answering questions for them. What does the nurse leading the group do?",
    options: ["End the session early so the conflict does not grow.", "Ask the client to leave the group for the rest of the day.", "Let the group continue so members can solve it themselves.", "Thank the client and invite quieter members to speak."],
    answer: 3,
    rationale: "The leader keeps the group safe and balanced by acknowledging the client's input and then redirecting to give others a turn. Ending the session or removing the client is too harsh for this behavior. Letting one member take over leaves the quieter members without a voice." },
  m13s15: { area: "PSY", type: "multi", cj: "Generate solutions",
    stem: "A client who has a history of sexual abuse needs a pelvic exam in the emergency department. Which actions by the nurse reflect trauma-informed care? Select all that apply.",
    options: ["Ask her to describe the abuse in detail for the chart.", "Explain each step before doing it and ask before touching.", "Agree on a stop signal she can use at any point.", "Work quickly without talking so the exam ends sooner.", "Offer a support person or chaperone of her choosing.", "Tell her the exam will not hurt or upset her."],
    answer: [1, 2, 4],
    rationale: "Trauma-informed care gives the client control, choice, and safety: explaining before touching, a stop signal, and a support person she chooses. Asking for details of the abuse is not needed for the exam and can retraumatize. Silent, rushed care removes her control, and promising it will not hurt is false reassurance.",
    lens: { medic: "In the field you often work fast and hands-on, with little time for talk.", nurse: "With a trauma survivor, asking before touching and giving her control is part of the care, not a delay." } },
  m13s16: { area: "PSY", type: "multi", cj: "Recognize cues",
    stem: "The nurse works with a paramedic who responded to a fatal call involving a child 3 weeks ago. Which changes in the coworker are warning signs that need follow-up? Select all that apply.",
    options: ["Says he has been drinking alone most nights so he can sleep.", "Talked about the call at the team debrief and with his wife.", "Snaps at partners and has called out sick several times.", "Had trouble sleeping for a few nights right after the call.", "Has stopped going to his kids' games and to his usual gym.", "Jokes that everyone would be better off without him around."],
    answer: [0, 2, 4, 5],
    rationale: "Drinking to sleep, irritability with missed shifts, pulling away from family and usual activities, and talk of being a burden weeks after a call are warning signs of a stress injury, depression, or suicide risk. The nurse asks directly about suicide and connects him with peer support or the employee assistance program. Talking about the call and a few rough nights right after it are normal, healthy responses.",
    lens: { medic: "In EMS culture, dark jokes and drinking after a bad call are often brushed off as normal.", nurse: "Weeks later, these are warning signs; ask him directly about suicide and link him to peer support." } },
  m13s17: { area: "PSY", type: "single", cj: "Analyze cues",
    stem: "A 78-year-old widower is admitted for a hip fracture. His daughter says that over the last 2 months he has lost weight, stopped going to church, and often says, \"I can't remember anything anymore.\" When he tries, he does well on a short memory test. Which problem does the nurse suspect?",
    options: ["Early-stage dementia", "Late-life depression", "Normal changes of aging", "Postinjury delirium"],
    answer: 1,
